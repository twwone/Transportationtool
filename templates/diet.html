<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>熱量追蹤</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overscroll-behavior:none;overflow-x:hidden}

@keyframes pageIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes ringGrow{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,113,227,.32)}50%{box-shadow:0 0 0 14px rgba(0,113,227,0)}}
@keyframes shimmer{0%{background-position:-600px 0}100%{background-position:600px 0}}
@keyframes fadeSlideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes cheatBounce{0%{transform:scale(.92);opacity:0}60%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}

:root{
  --bg:#fbfbfd;
  --surface:#ffffff;
  --glass:#ffffff;
  --glass-border:rgba(0,0,0,.08);
  --divider:rgba(0,0,0,.09);
  --text:#1d1d1f;
  --sub:#86868b;
  --accent:#0071e3;
  --green:#16a34a;
  --blue:#0284c7;
  --orange:#d97706;
  --input-bg:rgba(0,0,0,.04);
  --track-bg:rgba(0,0,0,.06);
  --chip-bg:rgba(0,0,0,.05);
  --radius-l:20px;
  --radius-m:14px;
  --radius-s:12px;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  padding:
    max(16px, env(safe-area-inset-top)) 0
    max(48px, env(safe-area-inset-bottom) + 20px);
  display:flex;flex-direction:column;align-items:center;
}

/* ── Header ── */
.header{
  width:100%;max-width:480px;
  padding:0 20px 16px;
  display:flex;align-items:center;gap:12px;
  position:relative;z-index:1;
  animation:pageIn .5s cubic-bezier(.22,1,.36,1) both;
}
.back-btn{
  width:38px;height:38px;border-radius:50%;
  background:var(--glass);border:1px solid var(--glass-border);
  display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:transform .2s,background .2s;flex-shrink:0;
}
.back-btn:active{transform:scale(.88)}
.header-info{flex:1}
.header-title{font-size:1.6rem;font-weight:700;letter-spacing:-0.03em}
.header-sub{font-size:.75rem;color:var(--sub);margin-top:2px}
.header-budget{
  text-align:right;font-size:.72rem;color:var(--sub);
  line-height:1.5;
}
.budget-num{font-size:1rem;font-weight:700;color:var(--green);display:block}

/* ── Main container ── */
.container{
  width:100%;max-width:480px;
  padding:0 16px;
  display:flex;flex-direction:column;gap:16px;
  position:relative;z-index:1;
}

/* ── Glass card ── */
.glass-card{
  background:var(--glass);
  border:1px solid var(--glass-border);
  border-radius:var(--radius-l);
  overflow:hidden;
  box-shadow:0 1px 3px rgba(0,0,0,.05);
}

/* ── Camera Section ── */
.camera-section{
  display:flex;flex-direction:column;align-items:center;
  padding:28px 24px 24px;
  gap:20px;
}
.camera-btns{display:flex;gap:20px;align-items:center}
.camera-btn{
  width:96px;height:96px;border-radius:50%;
  background:linear-gradient(135deg,#2997ff,#0071e3);
  display:flex;align-items:center;justify-content:center;
  font-size:2.4rem;cursor:pointer;color:#fff;
  border:none;
  box-shadow:0 0 0 0 rgba(0,113,227,.32);
  animation:pulse 2.4s ease-in-out infinite;
  transition:transform .2s cubic-bezier(.22,1,.36,1);
  -webkit-tap-highlight-color:transparent;
}
.camera-btn:active{transform:scale(.88)}
.gallery-btn{
  width:72px;height:72px;border-radius:50%;
  background:var(--glass);
  border:1.5px solid var(--glass-border);
  color:var(--sub);
  display:flex;align-items:center;justify-content:center;
  font-size:1.9rem;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:transform .2s cubic-bezier(.22,1,.36,1),background .2s;
}
.gallery-btn:active{transform:scale(.88)}
.camera-hints{display:flex;gap:28px}
.camera-hint-item{display:flex;flex-direction:column;align-items:center;gap:3px}
.camera-hint-lbl{font-size:.7rem;font-weight:600;color:var(--sub);letter-spacing:.02em}
#fileInput,#galleryInput{display:none}

/* ── Preview ── */
.preview-section{display:none;flex-direction:column;align-items:center;gap:16px;padding:20px 20px 8px}
.preview-img{
  width:180px;height:180px;object-fit:cover;
  border-radius:var(--radius-m);
  border:2px solid var(--glass-border);
}
.analyze-btn{
  width:100%;padding:14px;border-radius:var(--radius-s);
  background:linear-gradient(135deg,#2997ff,#0071e3);
  color:#fff;font-size:1rem;font-weight:700;
  border:none;cursor:pointer;
  font-family:inherit;letter-spacing:.03em;
  transition:transform .2s,opacity .2s;
  -webkit-tap-highlight-color:transparent;
}
.analyze-btn:active{transform:scale(.96)}
.analyze-btn:disabled{opacity:.55;pointer-events:none}

/* ── Loading spinner ── */
.loading{
  display:none;flex-direction:column;align-items:center;gap:12px;
  padding:24px;
}
.spinner{
  width:36px;height:36px;
  border:3px solid var(--glass-border);
  border-top-color:var(--green);
  border-radius:50%;
  animation:spin 1s linear infinite;
}
.loading-text{font-size:.85rem;color:var(--sub)}

/* ── Results Panel ── */
.result-panel{
  display:none;
  animation:fadeSlideUp .55s cubic-bezier(.22,1,.36,1) both;
}
.result-hero{
  padding:22px 24px 16px;
  display:flex;align-items:center;gap:16px;
}
.result-food{flex:1}
.result-food-name{font-size:1.25rem;font-weight:800;letter-spacing:-.3px}
.result-comment{
  font-size:.8rem;color:var(--sub);margin-top:8px;line-height:1.5;
  font-style:italic;
  background:var(--bg);border:1px solid var(--divider);
  border-radius:var(--radius-s,10px);padding:8px 12px;
}
.result-comment:empty{display:none;border:none;padding:0}
.result-cal{text-align:right;flex-shrink:0}
.result-cal-num{
  font-size:2.4rem;font-weight:900;
  color:var(--text);
  letter-spacing:-.03em;line-height:1;
}
.result-cal-unit{font-size:.7rem;color:var(--sub);font-weight:600;letter-spacing:.05em;text-transform:uppercase}

/* ── Activity Rings ── */
.rings-section{
  display:flex;flex-direction:column;align-items:center;
  padding:8px 24px 20px;gap:16px;
}
.rings-wrap{position:relative;width:260px;height:260px}
.rings-wrap svg{position:absolute;inset:0}
.rings-center{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;
}
.rings-center-label{font-size:.65rem;color:var(--sub);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.rings-center-total{font-size:1.6rem;font-weight:900;letter-spacing:-.5px}
.macro-legend{
  display:flex;gap:20px;
}
.legend-item{display:flex;align-items:center;gap:6px;font-size:.8rem}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.legend-val{font-weight:700;color:var(--text)}
.legend-lbl{color:var(--sub)}

/* ── Hint input (pre-analysis) ── */
.hint-input{
  width:100%;
  background:var(--input-bg);
  border:1px solid var(--glass-border);
  border-radius:var(--radius-s);
  color:var(--text);font-size:.88rem;font-family:inherit;
  padding:10px 14px;outline:none;
  transition:border-color .2s;
}
.hint-input:focus{border-color:rgba(22,163,74,.5)}
.hint-input::placeholder{color:var(--sub);opacity:.7}

/* ── Edit section (post-analysis) ── */
.edit-section{padding:0 20px 4px;display:flex;flex-direction:column;gap:6px}
.edit-label{font-size:.72rem;color:var(--sub);font-weight:600;letter-spacing:.02em}
.edit-row{display:flex;gap:8px}
.edit-input{
  flex:1;min-width:0;
  background:var(--input-bg);
  border:1px solid var(--glass-border);
  border-radius:var(--radius-s);
  color:var(--text);font-size:.9rem;font-family:inherit;
  padding:10px 12px;outline:none;
  transition:border-color .2s;
}
.edit-input:focus{border-color:rgba(22,163,74,.5)}
.edit-cal{flex:0 0 88px;text-align:center;font-weight:700}

/* ── Save button ── */
.save-section{padding:8px 20px 20px}
.save-btn{
  width:100%;padding:14px;border-radius:var(--radius-s);
  background:rgba(0,113,227,.12);
  border:1px solid rgba(0,113,227,.32);
  color:var(--accent);font-size:1rem;font-weight:700;
  cursor:pointer;font-family:inherit;
  transition:transform .2s,background .2s;
  -webkit-tap-highlight-color:transparent;
}
.save-btn:active{transform:scale(.96)}
.save-btn.saved{background:linear-gradient(135deg,#2997ff,#0071e3);color:#fff;border-color:transparent}

/* ── Daily Bank ── */
.bank-section{animation:fadeSlideUp .55s cubic-bezier(.22,1,.36,1) .1s both}
.bank-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px 10px;
}
.bank-title{font-size:1rem;font-weight:800}
.bank-clear{
  font-size:.72rem;color:#ff453a;background:none;border:none;
  padding:4px 8px;border-radius:8px;cursor:pointer;font-weight:600;
  font-family:inherit;-webkit-tap-highlight-color:transparent;
}
.bank-today-bar{
  margin:0 16px 12px;
  background:var(--track-bg);
  border-radius:10px;height:8px;overflow:hidden;
}
.bank-today-fill{
  height:100%;border-radius:10px;
  background:linear-gradient(90deg,#4ade80,#16a34a);
  transition:width 1s cubic-bezier(.22,1,.36,1);
  width:0%;
}
.bank-records{display:flex;flex-direction:column;gap:0;padding:0 16px 16px}
.record-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 4px;
  border-bottom:1px solid var(--divider);
}
.record-item:last-child{border-bottom:none}
.record-icon{
  flex-shrink:0;
  width:38px;height:38px;border-radius:11px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.05rem;color:#fff;
  background:linear-gradient(135deg,#2997ff,#0071e3);
  box-shadow:0 1px 2px rgba(0,0,0,.14),0 4px 10px rgba(0,0,0,.10);
}
.record-info{flex:1;min-width:0}
.record-name{font-size:.9rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.record-macros{font-size:.7rem;color:var(--sub);margin-top:2px}
.record-cal{font-size:1rem;font-weight:800;color:var(--text);flex-shrink:0}
.bank-total{
  margin:0 16px 12px;
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 14px;
  background:var(--chip-bg);
  border-radius:var(--radius-s);
}
.bank-total-lbl{font-size:.82rem;color:var(--sub)}
.bank-total-val{font-size:1rem;font-weight:800}
.bank-empty{
  text-align:center;padding:24px;
  font-size:.85rem;color:var(--sub);
}

/* ── Cheat Meal Card ── */
.cheat-card{
  margin:0 16px 16px;
  background:linear-gradient(135deg,rgba(217,119,6,.14),rgba(190,60,50,.10));
  border:1px solid rgba(217,119,6,.32);
  border-radius:var(--radius-m);
  padding:16px 18px;
  animation:cheatBounce .5s cubic-bezier(.22,1,.36,1) both;
}
.cheat-header{font-size:1rem;font-weight:800;margin-bottom:8px}
.cheat-body{font-size:.82rem;color:var(--sub);line-height:1.6;margin-bottom:12px}
.cheat-days{display:flex;gap:10px}
.cheat-day{
  flex:1;background:rgba(0,0,0,.08);border-radius:10px;
  padding:8px 10px;text-align:center;
}
.cheat-day-lbl{font-size:.68rem;color:var(--sub)}
.cheat-day-val{font-size:.88rem;font-weight:700;color:var(--orange)}

/* ── Shimmer skeleton ── */
.skeleton{
  background:linear-gradient(90deg,rgba(0,0,0,.04) 25%,rgba(0,0,0,.09) 50%,rgba(0,0,0,.04) 75%);
  background-size:600px 100%;
  animation:shimmer 1.5s infinite;
  border-radius:8px;height:14px;
}

/* ── Settings button ── */
.settings-btn{
  width:38px;height:38px;border-radius:50%;
  background:var(--glass);border:1px solid var(--glass-border);
  display:flex;align-items:center;justify-content:center;
  font-size:1.15rem;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:transform .2s,background .2s;flex-shrink:0;
}
.settings-btn:active{transform:scale(.88)}

/* ── Tab Bar ── */
.tab-bar{
  width:100%;max-width:480px;
  display:flex;gap:6px;padding:0 16px 8px;
  position:relative;z-index:1;
}
.tab-btn{
  flex:1;padding:9px;border-radius:var(--radius-s);
  background:none;border:1px solid transparent;
  color:var(--sub);font-size:.88rem;font-weight:600;
  cursor:pointer;font-family:inherit;
  transition:background .2s,color .2s,border-color .2s;
  -webkit-tap-highlight-color:transparent;
}
.tab-btn.active{
  background:rgba(22,163,74,.12);
  border-color:rgba(22,163,74,.3);
  color:var(--green);
}

/* ── Settings Modal ── */
.modal-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.65);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  z-index:100;align-items:flex-end;justify-content:center;
  padding:0 0 max(20px,env(safe-area-inset-bottom));
}
.modal-overlay.open{display:flex;animation:fadeSlideUp .35s cubic-bezier(.22,1,.36,1) both}
.modal-card{
  width:100%;max-width:480px;
  background:var(--surface);
  border:1px solid var(--glass-border);
  border-radius:var(--radius-l) var(--radius-l) var(--radius-m) var(--radius-m);
  padding:24px 20px max(24px,env(safe-area-inset-bottom));
}
.modal-title{font-size:1.1rem;font-weight:800;margin-bottom:20px}
.form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.form-label{font-size:.8rem;color:var(--sub);font-weight:600;letter-spacing:.02em}
.form-input{
  background:var(--input-bg);
  border:1px solid var(--glass-border);
  border-radius:var(--radius-s);
  color:var(--text);font-size:.95rem;font-family:inherit;
  padding:12px 14px;outline:none;
  transition:border-color .2s;width:100%;
}
.form-input:focus{border-color:rgba(22,163,74,.5)}
.form-hint{font-size:.72rem;color:var(--sub);margin-top:3px;line-height:1.5}
.modal-actions{display:flex;gap:8px;margin-top:8px}
.modal-btn{
  flex:1;padding:13px;border-radius:var(--radius-s);
  font-size:.95rem;font-weight:700;font-family:inherit;
  cursor:pointer;transition:transform .15s,opacity .2s;
  -webkit-tap-highlight-color:transparent;border:none;
}
.modal-btn:active{transform:scale(.96)}
.modal-btn.cancel{background:var(--chip-bg);color:var(--sub)}
.modal-btn.confirm{background:linear-gradient(135deg,#2997ff,#0071e3);color:#fff}

/* ── History Section ── */
.history-container{
  display:none;flex-direction:column;gap:12px;
  width:100%;max-width:480px;padding:0 16px;
  position:relative;z-index:1;
}
.history-container.shown{display:flex}
.history-empty{text-align:center;padding:48px 20px;font-size:.9rem;color:var(--sub)}
.history-day-card{
  background:var(--glass);
  border:1px solid var(--glass-border);
  border-radius:var(--radius-m);overflow:hidden;
  box-shadow:0 1px 3px rgba(0,0,0,.05);
}
.history-day-header{
  display:flex;align-items:center;padding:14px 16px;
  cursor:pointer;-webkit-tap-highlight-color:transparent;gap:12px;
}
.history-day-date{font-size:.88rem;font-weight:700;flex:1}
.history-day-badge{
  font-size:.75rem;font-weight:700;padding:3px 10px;
  border-radius:20px;white-space:nowrap;
}
.history-day-badge.ok{background:rgba(22,163,74,.14);color:var(--green)}
.history-day-badge.over{background:rgba(217,119,6,.14);color:var(--orange)}
.history-day-chevron{font-size:.7rem;color:var(--sub);transition:transform .25s;margin-left:4px}
.history-day-card.expanded .history-day-chevron{transform:rotate(180deg)}
.history-day-bar{margin:0 16px 10px;background:var(--track-bg);border-radius:6px;height:5px;overflow:hidden}
.history-day-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,#4ade80,#16a34a);width:0%;transition:width .6s cubic-bezier(.22,1,.36,1)}
.history-records{display:none;padding:0 12px 12px;flex-direction:column;gap:0}
.history-day-card.expanded .history-records{display:flex}

/* ── Stats Container ── */
.stats-container{
  display:none;flex-direction:column;gap:12px;
  width:100%;max-width:480px;padding:0 16px;
  position:relative;z-index:1;
}
.stats-container.shown{display:flex}

.stats-period-toggle{display:flex;gap:6px}
.period-btn{
  flex:1;padding:9px;border-radius:var(--radius-s);
  background:none;border:1px solid transparent;
  color:var(--sub);font-size:.88rem;font-weight:600;
  cursor:pointer;font-family:inherit;
  transition:background .2s,color .2s,border-color .2s;
  -webkit-tap-highlight-color:transparent;
}
.period-btn.active{
  background:rgba(2,132,199,.12);
  border-color:rgba(2,132,199,.3);
  color:var(--blue);
}

.stats-chart-card{padding:16px 14px 10px}
.stats-chart-wrap{width:100%;overflow:visible}

.stats-summary{display:flex;gap:10px;margin-top:2px}
.stat-card{
  flex:1;
  background:var(--glass);
  border:1px solid var(--glass-border);
  border-radius:var(--radius-m);
  padding:14px 10px;text-align:center;
  box-shadow:0 1px 3px rgba(0,0,0,.05);
}
.stat-val{font-size:1.3rem;font-weight:900;letter-spacing:-.03em;line-height:1.1}
.stat-lbl{font-size:.68rem;color:var(--sub);margin-top:4px;font-weight:600;letter-spacing:.02em}

/* ── Dark mode ── */
@media(prefers-color-scheme:dark){
  :root{
    --bg:#000;
    --surface:#1c1c1e;
    --glass:#1c1c1e;
    --glass-border:rgba(255,255,255,.09);
    --divider:rgba(255,255,255,.12);
    --text:#f5f5f7;
    --sub:#86868b;
    --accent:#2997ff;
    --green:#34d399;
    --blue:#38bdf8;
    --orange:#fb923c;
    --input-bg:rgba(255,255,255,.08);
    --track-bg:rgba(255,255,255,.06);
    --chip-bg:rgba(255,255,255,.1);
  }
  .cheat-day{background:rgba(0,0,0,.22)}
}

/* ── Admin View Bar ── */
.admin-view-bar{
  width:100%;max-width:480px;
  padding:8px 20px 0;
  position:relative;z-index:2;
  display:none;
}
.admin-view-inner{
  background:rgba(255,193,7,.13);
  border:1px solid rgba(255,193,7,.35);
  border-radius:14px;
  padding:8px 12px;
  display:flex;align-items:center;gap:8px;
}
.admin-view-label{
  font-size:.72rem;font-weight:700;
  color:#b8860b;white-space:nowrap;flex-shrink:0;
}
.admin-user-chips{
  display:flex;gap:6px;overflow-x:auto;
  scrollbar-width:none;flex:1;
}
.admin-user-chips::-webkit-scrollbar{display:none}
.admin-uChip{
  flex-shrink:0;padding:4px 12px;
  border-radius:100px;font-size:.78rem;font-weight:600;
  border:1.5px solid rgba(255,193,7,.4);
  background:transparent;color:#b8860b;
  cursor:pointer;font-family:inherit;
  transition:background .15s,color .15s;
  -webkit-tap-highlight-color:transparent;
}
.admin-uChip.active{
  background:rgba(255,193,7,.25);color:#7a5c00;
  border-color:rgba(255,193,7,.7);
}
.admin-view-indicator{
  width:100%;max-width:480px;
  padding:4px 20px 0;
  position:relative;z-index:2;
  display:none;
}
.admin-view-indicator span{
  font-size:.72rem;color:rgba(255,193,7,.85);font-weight:600;
}
@media (prefers-color-scheme:dark){
  .admin-view-inner{background:rgba(255,193,7,.09);border-color:rgba(255,193,7,.25)}
  .admin-view-label,.admin-uChip{color:rgba(255,193,7,.85)}
  .admin-uChip.active{background:rgba(255,193,7,.18);color:rgba(255,193,7,.95);border-color:rgba(255,193,7,.5)}
  .admin-view-indicator span{color:rgba(255,193,7,.7)}
}
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <button class="back-btn" onclick="history.back()">←</button>
  <div class="header-info">
    <div class="header-title">熱量追蹤</div>
    <div class="header-sub" id="dateLabel"></div>
  </div>
  <div class="header-budget">
    <span class="budget-num" id="budgetNum">—</span>
    剩餘大卡
  </div>
  <button class="settings-btn" onclick="openSettings()"><i class="bi bi-gear-fill"></i></button>
</div>

<!-- Admin View Bar（管理員切換用戶） -->
<div class="admin-view-bar" id="adminViewBar">
  <div class="admin-view-inner">
    <span class="admin-view-label"><i class="bi bi-shield-shaded"></i> 查看：</span>
    <div class="admin-user-chips" id="adminUserChips"></div>
  </div>
</div>
<div class="admin-view-indicator" id="adminViewIndicator">
  <span id="adminViewIndicatorText"></span>
</div>

<!-- Tab Bar -->
<div class="tab-bar">
  <button class="tab-btn active" id="tabToday" onclick="switchTab('today')">今日</button>
  <button class="tab-btn" id="tabHistory" onclick="switchTab('history')">歷史紀錄</button>
  <button class="tab-btn" id="tabStats" onclick="switchTab('stats')">統計</button>
</div>

<div class="container" id="mainContainer">

  <!-- Camera + Upload Card -->
  <div class="glass-card">
    <!-- Camera entry -->
    <div class="camera-section" id="cameraSection">
      <div class="camera-btns">
        <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
          <button class="camera-btn" onclick="document.getElementById('fileInput').click()"><i class="bi bi-camera-fill"></i></button>
          <span class="camera-hint-lbl">拍照</span>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
          <button class="gallery-btn" onclick="document.getElementById('galleryInput').click()"><i class="bi bi-images"></i></button>
          <span class="camera-hint-lbl">相簿</span>
        </div>
      </div>
    </div>

    <!-- Hidden file inputs -->
    <input type="file" id="fileInput" accept="image/*" capture="environment">
    <input type="file" id="galleryInput" accept="image/*">

    <!-- Preview -->
    <div class="preview-section" id="previewSection">
      <img class="preview-img" id="previewImg" src="" alt="food preview">
      <input class="hint-input" id="foodHint" type="text" maxlength="60"
             placeholder="選填：校正提示，如「地瓜（長得像杏鮑菇）」「大份」">
      <div style="width:100%;padding:0 4px;display:flex;gap:8px">
        <button class="analyze-btn" style="flex:1" id="analyzeBtn" onclick="doAnalyze()"><i class="bi bi-search"></i> AI 辨識熱量</button>
        <button class="analyze-btn" style="width:48px;background:var(--chip-bg);color:var(--sub)" onclick="resetCapture()">✕</button>
      </div>
    </div>

    <!-- Loading -->
    <div class="loading" id="loadingSection">
      <div class="spinner"></div>
      <div class="loading-text">Gemini 正在辨識食物中…</div>
    </div>
  </div>

  <!-- Error Card -->
  <div class="glass-card" id="errorCard" style="display:none;padding:20px 20px 16px">
    <div id="errorIcon" style="font-size:2rem;margin-bottom:8px"><i class="bi bi-exclamation-triangle-fill"></i></div>
    <div id="errorMsg" style="font-size:.9rem;line-height:1.6;color:var(--text);margin-bottom:14px"></div>
    <div style="display:flex;gap:8px">
      <button onclick="resetCapture()" style="flex:1;padding:11px;border-radius:var(--radius-s);background:var(--chip-bg);border:none;color:var(--sub);font-size:.88rem;font-weight:600;cursor:pointer;font-family:inherit">重試</button>
      <button id="errorActionBtn" style="flex:1;padding:11px;border-radius:var(--radius-s);background:rgba(2,132,199,.12);border:1px solid rgba(2,132,199,.3);color:var(--blue);font-size:.88rem;font-weight:600;cursor:pointer;font-family:inherit;display:none" onclick="openSettings()">前往設定</button>
    </div>
  </div>

  <!-- Results Panel -->
  <div class="glass-card result-panel" id="resultPanel">
    <!-- Hero: food name + calories -->
    <div class="result-hero">
      <div class="result-food">
        <div class="result-food-name" id="resultFoodName"></div>
        <div class="result-comment" id="resultComment"></div>
      </div>
      <div class="result-cal">
        <div class="result-cal-num" id="resultCalNum">0</div>
        <div class="result-cal-unit">大卡</div>
      </div>
    </div>

    <!-- Activity Rings -->
    <div class="rings-section">
      <div class="rings-wrap">
        <svg viewBox="0 0 260 260" width="260" height="260" style="animation:ringGrow .6s cubic-bezier(.22,1,.36,1) both">
          <defs>
            <linearGradient id="gCarbs" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#38bdf8"/>
              <stop offset="100%" stop-color="#818cf8"/>
            </linearGradient>
            <linearGradient id="gProtein" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#34d399"/>
              <stop offset="100%" stop-color="#10b981"/>
            </linearGradient>
            <linearGradient id="gFat" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#fb923c"/>
              <stop offset="100%" stop-color="#ea580c"/>
            </linearGradient>
          </defs>
          <!-- Track rings -->
          <circle cx="130" cy="130" r="108" fill="none" stroke="rgba(128,128,128,0.16)" stroke-width="20"/>
          <circle cx="130" cy="130" r="80"  fill="none" stroke="rgba(128,128,128,0.16)" stroke-width="20"/>
          <circle cx="130" cy="130" r="52"  fill="none" stroke="rgba(128,128,128,0.16)" stroke-width="20"/>
          <!-- Active rings -->
          <circle id="ring-carbs"
            cx="130" cy="130" r="108" fill="none"
            stroke="url(#gCarbs)" stroke-width="20"
            stroke-linecap="round"
            transform="rotate(-90 130 130)"
            stroke-dasharray="678.58" stroke-dashoffset="678.58"/>
          <circle id="ring-protein"
            cx="130" cy="130" r="80" fill="none"
            stroke="url(#gProtein)" stroke-width="20"
            stroke-linecap="round"
            transform="rotate(-90 130 130)"
            stroke-dasharray="502.65" stroke-dashoffset="502.65"/>
          <circle id="ring-fat"
            cx="130" cy="130" r="52" fill="none"
            stroke="url(#gFat)" stroke-width="20"
            stroke-linecap="round"
            transform="rotate(-90 130 130)"
            stroke-dasharray="326.73" stroke-dashoffset="326.73"/>
        </svg>
        <div class="rings-center">
          <span class="rings-center-label">三大營養素</span>
          <span class="rings-center-total" id="ringsTotalG">—</span>
        </div>
      </div>
      <!-- Legend -->
      <div class="macro-legend">
        <div class="legend-item">
          <div class="legend-dot" style="background:#38bdf8"></div>
          <span class="legend-val" id="lgCarbs">—</span>
          <span class="legend-lbl">碳水</span>
        </div>
        <div class="legend-item">
          <div class="legend-dot" style="background:#34d399"></div>
          <span class="legend-val" id="lgProtein">—</span>
          <span class="legend-lbl">蛋白</span>
        </div>
        <div class="legend-item">
          <div class="legend-dot" style="background:#fb923c"></div>
          <span class="legend-val" id="lgFat">—</span>
          <span class="legend-lbl">脂肪</span>
        </div>
      </div>
    </div>

    <!-- Edit section -->
    <div class="edit-section">
      <div class="edit-label"><i class="bi bi-pencil-fill"></i> 辨識有誤？可直接修改</div>
      <div class="edit-row">
        <input class="edit-input" id="editFoodName" type="text" maxlength="100" placeholder="食物名稱">
        <input class="edit-input edit-cal" id="editCalories" type="number" min="0" max="99999" placeholder="大卡">
      </div>
    </div>

    <!-- Save button -->
    <div class="save-section">
      <button class="save-btn" id="saveBtn" onclick="saveRecord()">＋ 記錄到今日</button>
    </div>
  </div>

  <!-- Daily Bank -->
  <div class="glass-card bank-section" id="bankSection">
    <div class="bank-header">
      <span class="bank-title">今日飲食紀錄</span>
      <button class="bank-clear" onclick="clearToday()">清除今天</button>
    </div>
    <div class="bank-today-bar"><div class="bank-today-fill" id="todayFill"></div></div>
    <div id="bankBody"></div>
  </div>

</div><!-- /container -->

<!-- History Container -->
<div class="history-container" id="historyContainer"></div>

<!-- Stats Container -->
<div class="stats-container" id="statsContainer"></div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settingsModal" onclick="handleOverlayClick(event)">
  <div class="modal-card">
    <div class="modal-title"><i class="bi bi-gear-fill"></i> 設定</div>
    <div class="form-group">
      <label class="form-label">每日目標熱量（大卡）</label>
      <input class="form-input" type="number" id="setLimit" min="800" max="9999" placeholder="2500">
    </div>
    <div class="form-group">
      <label class="form-label">同步代碼</label>
      <div style="display:flex;gap:8px">
        <input class="form-input" type="text" id="setSyncId" placeholder="自動產生" style="flex:1;font-family:monospace;font-size:.82rem">
        <button onclick="copySyncId()" style="padding:0 14px;border-radius:var(--radius-s);background:rgba(2,132,199,.12);border:1px solid rgba(2,132,199,.3);color:var(--blue);font-size:.82rem;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit" id="copyBtn">複製</button>
      </div>
      <div class="form-hint">其他裝置輸入相同代碼即可同步資料。<br>⚠ 更改代碼後會切換到該代碼的資料。</div>
    </div>
    <div class="form-group">
      <label class="form-label">Gemini API 金鑰</label>
      <input class="form-input" type="password" id="setGeminiKey" placeholder="AIza…">
      <div class="form-hint">前往 <strong>aistudio.google.com</strong> → Get API key → Create API key（免費，不需信用卡）。</div>
    </div>
    <div class="modal-actions">
      <button class="modal-btn cancel" onclick="closeSettings()">取消</button>
      <button class="modal-btn confirm" onclick="applySettings()">儲存</button>
    </div>
  </div>
</div>

<script>
// ── State ──
let _currentResult = null;
let _compressedBlob = null;

// ── Settings ──
function getSettings() {
  try { return JSON.parse(localStorage.getItem('dietSettings') || '{}'); }
  catch { return {}; }
}
function saveSettings(s) { localStorage.setItem('dietSettings', JSON.stringify(s)); }
function getDailyLimit() { return parseInt(getSettings().dailyLimit) || 2500; }
function getGeminiKey() { return getSettings().geminiKey || ''; }

// ── Sync ID ──
function getSyncId() {
  // 優先使用登入帳號的 dietSyncId，確保跨裝置同步
  try {
    const sess = JSON.parse(localStorage.getItem('userSession') || 'null');
    if (sess?.dietSyncId) {
      localStorage.setItem('dietSyncId', sess.dietSyncId);
      return sess.dietSyncId;
    }
  } catch {}
  // 未登入：使用裝置本地 UUID
  let id = localStorage.getItem('dietSyncId');
  if (!id) {
    if (typeof crypto !== 'undefined' && crypto.randomUUID) {
      id = crypto.randomUUID();
    } else {
      id = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
        const r = Math.random() * 16 | 0;
        return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
      });
    }
    localStorage.setItem('dietSyncId', id);
  }
  return id;
}
function setSyncId(id) { localStorage.setItem('dietSyncId', id); }

function copySyncId() {
  const id = document.getElementById('setSyncId').value || getSyncId();
  navigator.clipboard.writeText(id).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = '已複製！';
    setTimeout(() => { btn.textContent = '複製'; }, 1800);
  });
}

function openSettings(highlightKey) {
  const s = getSettings();
  document.getElementById('setLimit').value = s.dailyLimit || 2500;
  document.getElementById('setGeminiKey').value = s.geminiKey || '';
  document.getElementById('setSyncId').value = getSyncId();
  document.getElementById('settingsModal').classList.add('open');
  if (highlightKey || !s.geminiKey) {
    setTimeout(() => document.getElementById('setGeminiKey').focus(), 350);
  }
}
function closeSettings() {
  document.getElementById('settingsModal').classList.remove('open');
}
function handleOverlayClick(e) {
  if (e.target === e.currentTarget) closeSettings();
}
function applySettings() {
  const limit   = parseInt(document.getElementById('setLimit').value) || 2500;
  const key     = document.getElementById('setGeminiKey').value.trim();
  const newSync = document.getElementById('setSyncId').value.trim();
  saveSettings({ dailyLimit: limit, geminiKey: key });
  if (newSync && newSync !== getSyncId()) {
    setSyncId(newSync);
    _bankCache = {};
  }
  closeSettings();
  renderBank();
}

// ── Tabs ──
function switchTab(tab) {
  const isToday   = tab === 'today';
  const isHistory = tab === 'history';
  const isStats   = tab === 'stats';
  document.getElementById('tabToday').classList.toggle('active', isToday);
  document.getElementById('tabHistory').classList.toggle('active', isHistory);
  document.getElementById('tabStats').classList.toggle('active', isStats);
  document.getElementById('mainContainer').style.display = isToday ? 'flex' : 'none';
  document.getElementById('historyContainer').classList.toggle('shown', isHistory);
  document.getElementById('statsContainer').classList.toggle('shown', isStats);
  if (isHistory) renderHistory(true);
  if (isStats)   renderStats(true);
}

// ── History ──
async function renderHistory(refetch) {
  const hc = document.getElementById('historyContainer');
  hc.innerHTML = '<div class="history-empty"><div class="spinner" style="margin:0 auto 8px;width:28px;height:28px"></div></div>';
  if (refetch) await fetchBank();

  const bank  = _bankCache;
  const today = todayKey();
  const days  = Object.keys(bank)
    .filter(k => k !== today && bank[k].records && bank[k].records.length > 0)
    .sort((a, b) => b.localeCompare(a))
    .slice(0, 30);

  if (days.length === 0) {
    hc.innerHTML = '<div class="history-empty">尚無歷史紀錄<br>每日記錄後會顯示在這裡</div>';
    return;
  }

  const limit = getDailyLimit();
  hc.innerHTML = days.map(key => {
    const day = bank[key];
    const totalCal = day.records.reduce((s, r) => s + r.calories, 0);
    const debt = day.debt || 0;
    const effective = totalCal + debt;
    const pct = Math.min(100, (effective / limit) * 100);
    const over = effective > limit;
    const debtNote = debt > 0 ? ` +${debt}分期` : '';

    const recordsHtml = [...day.records].reverse().map(r => {
      const m = r.macros || {};
      return `
        <div class="record-item">
          <span class="record-icon"><i class="bi bi-egg-fried"></i></span>
          <div class="record-info">
            <div class="record-name">${r.food_name}</div>
            <div class="record-macros">碳 ${m.carbs||0}g　蛋 ${m.protein||0}g　脂 ${m.fat||0}g</div>
          </div>
          <span class="record-cal">${r.calories}</span>
        </div>`;
    }).join('');

    return `
      <div class="history-day-card" id="hday-${key}">
        <div class="history-day-header" onclick="toggleHistoryDay('${key}')">
          <span class="history-day-date">${formatDate(key)}</span>
          <span class="history-day-badge ${over ? 'over' : 'ok'}">${effective} kcal${debtNote}</span>
          <span class="history-day-chevron">▼</span>
        </div>
        <div class="history-day-bar"><div class="history-day-fill" style="width:${pct}%"></div></div>
        <div class="history-records bank-records">${recordsHtml}</div>
      </div>`;
  }).join('');
}

function toggleHistoryDay(key) {
  document.getElementById('hday-' + key).classList.toggle('expanded');
}

// ── Date helpers ──
function todayKey() {
  return new Date().toISOString().slice(0, 10);
}
function formatDate(key) {
  const [y, m, d] = key.split('-');
  const days = ['日','一','二','三','四','五','六'];
  const dt = new Date(+y, +m - 1, +d);
  return `${+m}/${+d}（週${days[dt.getDay()]}）`;
}

// ── Server bank ──
let _bankCache = {};
let _adminViewSyncId = null;   // 管理員切換查看的目標 sync_id
let _adminViewName   = null;   // 目標用戶名稱

function _activeSyncId() { return _adminViewSyncId || getSyncId(); }

async function fetchBank() {
  try {
    const resp = await fetch(`/api/diet/bank/${encodeURIComponent(_activeSyncId())}`);
    if (resp.ok) _bankCache = await resp.json();
  } catch (_) { /* keep cache on network error */ }
}

// ── Admin: 初始化用戶切換器 ──
async function _initAdminView() {
  const pin = localStorage.getItem('admin_pin');
  if (!pin) return;
  try {
    const r = await fetch('/api/admin/users', {
      headers: { 'Authorization': `Bearer ${pin}` },
      signal: AbortSignal.timeout(6000)
    });
    const data = await r.json();
    if (!data.ok) return;
    const rows = (data.rows || []).filter(row => row.config?.dietSyncId);
    if (!rows.length) return;

    const ownId = getSyncId();
    const allUsers = [
      { label: '我的', syncId: ownId, own: true },
      ...rows.map(row => ({
        label:  row.config.name || '匿名',
        syncId: row.config.dietSyncId,
        own:    row.config.dietSyncId === ownId
      }))
    ];
    // 去重（若自己也在 Supabase 清單）
    const seen = new Set();
    const dedupedUsers = allUsers.filter(u => {
      if (seen.has(u.syncId)) return false;
      seen.add(u.syncId);
      return true;
    });

    window._adminUserList = dedupedUsers;
    const bar    = document.getElementById('adminViewBar');
    const chips  = document.getElementById('adminUserChips');
    bar.style.display = '';
    chips.innerHTML = dedupedUsers.map((u, i) =>
      `<button class="admin-uChip${i === 0 ? ' active' : ''}"
         onclick="_selectAdminUser(${i})">${u.label.replace(/</g,'&lt;')}</button>`
    ).join('');
  } catch (_) {}
}

function _selectAdminUser(idx) {
  const list = window._adminUserList || [];
  const u = list[idx];
  if (!u) return;
  document.querySelectorAll('.admin-uChip').forEach((c, i) =>
    c.classList.toggle('active', i === idx)
  );
  _adminViewSyncId = u.own ? null : u.syncId;
  _adminViewName   = u.own ? null : u.label;
  _bankCache = {};
  // 更新指示文字
  const ind = document.getElementById('adminViewIndicator');
  const txt = document.getElementById('adminViewIndicatorText');
  if (_adminViewName) {
    txt.textContent = `目前查看：${_adminViewName} 的資料（唯讀）`;
    ind.style.display = '';
  } else {
    ind.style.display = 'none';
  }
  // 相機區唯讀
  const camBtn = document.querySelector('.camera-btn');
  const galBtn = document.querySelector('.gallery-btn');
  if (camBtn) camBtn.style.opacity = _adminViewSyncId ? '0.35' : '';
  if (galBtn) galBtn.style.opacity = _adminViewSyncId ? '0.35' : '';
  if (camBtn) camBtn.style.pointerEvents = _adminViewSyncId ? 'none' : '';
  if (galBtn) galBtn.style.pointerEvents = _adminViewSyncId ? 'none' : '';
  renderBank();
}

function getDayData(bank, key) {
  if (!bank[key]) bank[key] = { records: [], debt: 0 };
  return bank[key];
}

// ── Image compression via Canvas ──
async function compressToBlob(file, maxBytes = 2 * 1024 * 1024) {
  return new Promise(resolve => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const MAX_DIM = 1600;
      let { naturalWidth: w, naturalHeight: h } = img;
      if (w > MAX_DIM || h > MAX_DIM) {
        const r = Math.min(MAX_DIM / w, MAX_DIM / h);
        w = Math.round(w * r);
        h = Math.round(h * r);
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);

      let quality = 0.88;
      const tryQ = () => {
        canvas.toBlob(blob => {
          if (blob.size <= maxBytes || quality <= 0.45) {
            resolve(blob);
          } else {
            quality -= 0.12;
            tryQ();
          }
        }, 'image/jpeg', quality);
      };
      tryQ();
    };
    img.src = url;
  });
}

// ── File input handler ──
async function handleFileSelected(file) {
  if (!file) return;
  _currentResult = null;
  const blob = await compressToBlob(file);
  _compressedBlob = blob;
  const url = URL.createObjectURL(blob);
  document.getElementById('previewImg').src = url;
  document.getElementById('cameraSection').style.display = 'none';
  document.getElementById('previewSection').style.display = 'flex';
  document.getElementById('loadingSection').style.display = 'none';
  document.getElementById('resultPanel').style.display = 'none';
}
document.getElementById('fileInput').addEventListener('change', e => handleFileSelected(e.target.files[0]));
document.getElementById('galleryInput').addEventListener('change', e => handleFileSelected(e.target.files[0]));

function resetCapture() {
  document.getElementById('fileInput').value = '';
  document.getElementById('galleryInput').value = '';
  document.getElementById('foodHint').value = '';
  _compressedBlob = null;
  _currentResult = null;
  document.getElementById('cameraSection').style.display = 'flex';
  document.getElementById('previewSection').style.display = 'none';
  document.getElementById('loadingSection').style.display = 'none';
  document.getElementById('resultPanel').style.display = 'none';
  document.getElementById('errorCard').style.display = 'none';
}

// ── Error display ──
function showError(errCode, status, detail) {
  document.getElementById('previewSection').style.display = 'none';
  const card = document.getElementById('errorCard');
  const msg  = document.getElementById('errorMsg');
  const icon = document.getElementById('errorIcon');
  const btn  = document.getElementById('errorActionBtn');
  const detailHtml = detail ? `<br><small style="opacity:.6;word-break:break-all">${detail}</small>` : '';

  if (errCode === 'quota_exceeded' || status === 429) {
    icon.innerHTML = '<i class="bi bi-key-fill"></i>';
    msg.innerHTML = '<strong>伺服器 API 配額已用盡</strong><br>需要您自己的免費金鑰才能繼續使用。<br><small style="opacity:.7">→ 前往 <strong>aistudio.google.com</strong>，點 Get API key → Create，貼入下方設定。</small>' + detailHtml;
    btn.style.display = 'block';
    // Auto-open settings so user can immediately enter their own key
    setTimeout(() => openSettings(), 600);
  } else if (errCode === 'user_quota_exceeded') {
    icon.innerHTML = '<i class="bi bi-key-fill"></i>';
    msg.innerHTML = '<strong>您的 API 金鑰配額已用盡</strong><br>請到 <a href="https://aistudio.google.com/apikey" target="_blank" style="color:inherit">aistudio.google.com</a> 建立新專案並取得新金鑰，再到設定更新。' + detailHtml;
    btn.style.display = 'block';
  } else if (errCode === 'network' || status === 0) {
    icon.innerHTML = '<i class="bi bi-broadcast-pin"></i>';
    msg.innerHTML = '<strong>網路連線問題</strong><br>請確認網路後再試一次。';
    btn.style.display = 'none';
  } else {
    icon.innerHTML = '<i class="bi bi-exclamation-triangle-fill"></i>';
    msg.innerHTML = `<strong>辨識失敗</strong><br>${errCode}` + detailHtml;
    btn.style.display = 'none';
  }
  card.style.display = 'block';
}

// ── Analyze food ──
async function doAnalyze() {
  if (!_compressedBlob) return;
  document.getElementById('previewSection').style.display = 'none';
  document.getElementById('loadingSection').style.display = 'flex';
  document.getElementById('analyzeBtn').disabled = true;

  try {
    const fd = new FormData();
    fd.append('image', _compressedBlob, 'food.jpg');
    const geminiKey = getGeminiKey();
    if (geminiKey) fd.append('ai_key', geminiKey);
    const hint = document.getElementById('foodHint').value.trim();
    if (hint) fd.append('food_hint', hint);
    const resp = await fetch('/api/analyze-food', { method: 'POST', body: fd });
    const data = await resp.json();

    if (data.error) {
      showError(data.error, resp.status, data.detail || '');
    } else {
      _currentResult = data;
      renderResult(data);
    }
  } catch (err) {
    showError('network', 0);
  } finally {
    document.getElementById('loadingSection').style.display = 'none';
    document.getElementById('analyzeBtn').disabled = false;
  }
}

// ── Render AI result ──
function renderResult(data) {
  document.getElementById('resultFoodName').textContent = data.food_name;
  document.getElementById('resultComment').textContent = data.comment;
  document.getElementById('resultCalNum').textContent = data.calories;
  // Pre-fill editable fields (方案 B)
  document.getElementById('editFoodName').value = data.food_name;
  document.getElementById('editCalories').value = data.calories;

  const m = data.macros;
  const totalG = m.carbs + m.protein + m.fat;
  document.getElementById('ringsTotalG').textContent = totalG + 'g';
  document.getElementById('lgCarbs').textContent   = m.carbs + 'g';
  document.getElementById('lgProtein').textContent = m.protein + 'g';
  document.getElementById('lgFat').textContent     = m.fat + 'g';

  // Reset rings first
  ['ring-carbs','ring-protein','ring-fat'].forEach(id => {
    const el = document.getElementById(id);
    el.style.transition = 'none';
  });
  document.getElementById('ring-carbs').style.strokeDashoffset   = '678.58';
  document.getElementById('ring-protein').style.strokeDashoffset = '502.65';
  document.getElementById('ring-fat').style.strokeDashoffset     = '326.73';

  // Animate after tick
  const REFS = { carbs: 100, protein: 35, fat: 30 };
  const Cs   = { carbs: 678.58, protein: 502.65, fat: 326.73 };
  const keys  = ['carbs', 'protein', 'fat'];
  const ringIds = ['ring-carbs', 'ring-protein', 'ring-fat'];

  requestAnimationFrame(() => {
    keys.forEach((key, i) => {
      setTimeout(() => {
        const ratio  = Math.min(1, (m[key] || 0) / REFS[key]);
        const el     = document.getElementById(ringIds[i]);
        el.style.transition = `stroke-dashoffset ${1.1 + i * 0.2}s cubic-bezier(.22,1,.36,1)`;
        el.style.strokeDashoffset = Cs[key] * (1 - ratio);
      }, 250 + i * 120);
    });
  });

  // Show save btn
  const saveBtn = document.getElementById('saveBtn');
  saveBtn.textContent = '＋ 記錄到今日';
  saveBtn.classList.remove('saved');
  saveBtn.disabled = false;

  document.getElementById('resultPanel').style.display = 'block';
}

// ── Save record to bank ──
async function saveRecord() {
  if (!_currentResult) return;
  const saveBtn = document.getElementById('saveBtn');
  saveBtn.disabled = true;
  saveBtn.textContent = '同步中…';

  const editedName = document.getElementById('editFoodName').value.trim() || _currentResult.food_name;
  const editedCal  = Math.max(0, parseInt(document.getElementById('editCalories').value) || 0) || _currentResult.calories;

  try {
    const resp = await fetch('/api/diet/record', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        sync_id:     getSyncId(),
        date:        todayKey(),
        food_name:   editedName,
        calories:    editedCal,
        macros:      _currentResult.macros,
        ts:          Date.now(),
        daily_limit: getDailyLimit(),
      }),
    });
    if (resp.ok) {
      saveBtn.textContent = '已記錄！';
      saveBtn.classList.add('saved');
      renderBank();
    } else {
      saveBtn.textContent = '儲存失敗，重試';
      saveBtn.disabled = false;
    }
  } catch (_) {
    saveBtn.textContent = '網路錯誤，重試';
    saveBtn.disabled = false;
  }
}

// ── Clear today ──
async function clearToday() {
  if (!confirm('確定清除今日所有紀錄？')) return;
  await fetch(`/api/diet/day/${encodeURIComponent(getSyncId())}/${todayKey()}`, { method: 'DELETE' });
  renderBank();
}

// ── Render daily bank ──
async function renderBank() {
  document.getElementById('bankBody').innerHTML =
    '<div class="bank-empty"><div class="spinner" style="margin:0 auto 8px;width:26px;height:26px;border-width:2px"></div></div>';
  await fetchBank();
  const bank  = _bankCache;
  const today = todayKey();
  const day   = getDayData(bank, today);

  const totalCal  = day.records.reduce((s, r) => s + r.calories, 0);
  const debt      = day.debt || 0;
  const effective = totalCal + debt;
  const remaining = Math.max(0, getDailyLimit() - effective);

  // Header budget
  document.getElementById('budgetNum').textContent = remaining;

  // Progress bar (capped at 100%)
  const pct = Math.min(100, (effective / getDailyLimit()) * 100);
  document.getElementById('todayFill').style.width = pct + '%';

  let html = '';

  // Cheat meal card
  if (day._cheat_spread) {
    const { overflow, perDay } = day._cheat_spread;
    const d1 = new Date(Date.now() + 86400000).toISOString().slice(0, 10);
    const d2 = new Date(Date.now() + 2 * 86400000).toISOString().slice(0, 10);
    html += `
      <div class="cheat-card">
        <div class="cheat-header"><i class="bi bi-lightning-charge-fill"></i> 熱量分期啟動</div>
        <div class="cheat-body">
          今日超標 <strong>${overflow}</strong> 大卡<br>
          已自動平攤至接下來 2 天，每天吸收 <strong>${perDay}</strong> 大卡
        </div>
        <div class="cheat-days">
          <div class="cheat-day">
            <div class="cheat-day-lbl">${formatDate(d1)}</div>
            <div class="cheat-day-val">−${perDay} kcal</div>
          </div>
          <div class="cheat-day">
            <div class="cheat-day-lbl">${formatDate(d2)}</div>
            <div class="cheat-day-val">−${perDay} kcal</div>
          </div>
        </div>
      </div>`;
  }

  // Total
  if (day.records.length > 0) {
    const totalColor = effective > getDailyLimit() ? 'var(--orange)' : 'var(--green)';
    const debtNote   = debt > 0 ? ` <span style="color:var(--orange);font-size:.7rem">（含 ${debt} 前日分期）</span>` : '';
    html += `
      <div class="bank-total">
        <span class="bank-total-lbl">今日累計${debtNote}</span>
        <span class="bank-total-val" style="color:${totalColor}">${effective} kcal</span>
      </div>`;
  }

  // Records list
  if (day.records.length === 0) {
    html += `<div class="bank-empty">今日尚無紀錄，拍張食物開始追蹤吧！</div>`;
  } else {
    html += '<div class="bank-records">';
    [...day.records].reverse().forEach(r => {
      const m = r.macros || {};
      html += `
        <div class="record-item">
          <span class="record-icon"><i class="bi bi-egg-fried"></i></span>
          <div class="record-info">
            <div class="record-name">${r.food_name}</div>
            <div class="record-macros">碳 ${m.carbs||0}g　蛋 ${m.protein||0}g　脂 ${m.fat||0}g</div>
          </div>
          <span class="record-cal">${r.calories}</span>
        </div>`;
    });
    html += '</div>';
  }

  document.getElementById('bankBody').innerHTML = html;
}

// ── Stats ──
let _statsPeriod = 'week';

function switchStatsPeriod(p) {
  _statsPeriod = p;
  document.getElementById('statsWeekBtn').classList.toggle('active', p === 'week');
  document.getElementById('statsMonthBtn').classList.toggle('active', p === 'month');
  renderStats(false);
}

async function renderStats(refetch) {
  const sc = document.getElementById('statsContainer');
  sc.innerHTML = '<div class="history-empty"><div class="spinner" style="margin:0 auto 8px;width:28px;height:28px"></div></div>';
  if (refetch) await fetchBank();

  const bank  = _bankCache;
  const limit = getDailyLimit();
  const today = new Date();
  const todayStr = todayKey();
  const dayNames = ['日','一','二','三','四','五','六'];

  let days = [], labels = [];
  if (_statsPeriod === 'week') {
    for (let i = 6; i >= 0; i--) {
      const d = new Date(today);
      d.setDate(d.getDate() - i);
      const key = d.toISOString().slice(0, 10);
      days.push(key);
      labels.push(i === 0 ? '今天' : `${d.getMonth()+1}/${d.getDate()}`);
    }
  } else {
    const yr = today.getFullYear(), mo = today.getMonth();
    const dim = new Date(yr, mo + 1, 0).getDate();
    for (let d = 1; d <= dim; d++) {
      const dt  = new Date(yr, mo, d);
      const key = dt.toISOString().slice(0, 10);
      days.push(key);
      labels.push(d === 1 || d % 5 === 0 || d === dim ? String(d) : '');
    }
  }

  const cals = days.map(key => {
    const day = bank[key];
    if (!day || !day.records || day.records.length === 0) return 0;
    return day.records.reduce((s, r) => s + r.calories, 0) + (day.debt || 0);
  });

  const activePast = cals.filter((c, i) => c > 0 && days[i] <= todayStr);
  const avgCal      = activePast.length
    ? Math.round(activePast.reduce((s, c) => s + c, 0) / activePast.length)
    : 0;
  const daysOnTrack = cals.filter((c, i) => c > 0 && c <= limit && days[i] <= todayStr).length;
  const activeDays  = activePast.length;
  const totalCal    = cals.reduce((s, c) => s + c, 0);

  // SVG bar chart
  const W = 320, H = 155, ml = 36, mr = 6, mt = 14, mb = 28;
  const cw = W - ml - mr, ch = H - mt - mb;
  const n  = days.length;

  const maxVal = Math.max(limit * 1.25, ...cals, 300);
  const cap    = Math.ceil(maxVal / 500) * 500;
  const toY    = v => ch - (v / cap) * ch;

  const barGap = cw / n;
  const barW   = Math.max(4, barGap * 0.62);

  // Y-axis ticks
  const ticks   = [0, Math.round(cap * 0.5), cap];
  const yAxisSvg = ticks.map(v => {
    const y = mt + toY(v);
    const lbl = v >= 1000 ? (v / 1000).toFixed(1) + 'k' : v;
    return `<text x="${ml-4}" y="${(y+3.5).toFixed(1)}" text-anchor="end" fill="var(--sub)" font-size="9">${lbl}</text>
            <line x1="${ml}" y1="${y.toFixed(1)}" x2="${W-mr}" y2="${y.toFixed(1)}" stroke="var(--divider)" stroke-width="1"/>`;
  }).join('');

  const limitY = mt + toY(limit);
  const barsSvg = days.map((key, i) => {
    const v    = cals[i];
    const x    = ml + i * barGap + (barGap - barW) / 2;
    const bh   = v > 0 ? Math.max(3, (v / cap) * ch) : 0;
    const y    = mt + ch - bh;
    const isF  = key > todayStr;
    const col  = isF  ? 'var(--track-bg)'
               : v === 0 ? 'var(--divider)'
               : v <= limit ? 'var(--green)' : 'var(--orange)';
    const isToday_ = key === todayStr;
    const lbl  = labels[i];
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(0,bh).toFixed(1)}" rx="2.5" fill="${col}" opacity="${isF ? 1 : 0.88}"/>
            ${lbl ? `<text x="${(x+barW/2).toFixed(1)}" y="${(H-mb+13).toFixed(1)}" text-anchor="middle" fill="${isToday_ ? 'var(--text)' : 'var(--sub)'}" font-size="8.5" font-weight="${isToday_ ? 700 : 400}">${lbl}</text>` : ''}`;
  }).join('');

  const chartHtml = `
    <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;overflow:visible">
      ${yAxisSvg}
      <line x1="${ml}" y1="${limitY.toFixed(1)}" x2="${W-mr}" y2="${limitY.toFixed(1)}"
            stroke="var(--orange)" stroke-width="1.5" stroke-dasharray="4,3" opacity=".6"/>
      <text x="${W-mr}" y="${(limitY-4).toFixed(1)}" text-anchor="end" fill="var(--orange)" opacity=".75" font-size="8.5">目標</text>
      ${barsSvg}
    </svg>`;

  const mo = today.getMonth() + 1, yr = today.getFullYear();
  const periodLabel = _statsPeriod === 'week' ? '本週' : `${yr}年${mo}月`;

  sc.innerHTML = `
    <div class="stats-period-toggle">
      <button class="period-btn ${_statsPeriod==='week'?'active':''}" id="statsWeekBtn" onclick="switchStatsPeriod('week')">本週</button>
      <button class="period-btn ${_statsPeriod==='month'?'active':''}" id="statsMonthBtn" onclick="switchStatsPeriod('month')">本月</button>
    </div>
    <div class="glass-card stats-chart-card">
      <div class="stats-chart-wrap">${chartHtml}</div>
    </div>
    <div class="stats-summary">
      <div class="stat-card">
        <div class="stat-val">${avgCal || '—'}</div>
        <div class="stat-lbl">平均大卡</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" style="color:var(--green)">${daysOnTrack}<span style="font-size:.65em;font-weight:500;color:var(--sub)"> / ${activeDays}</span></div>
        <div class="stat-lbl">達標天數</div>
      </div>
      <div class="stat-card">
        <div class="stat-val">${totalCal > 999 ? (totalCal/1000).toFixed(1)+'k' : totalCal || '—'}</div>
        <div class="stat-lbl">期間累計</div>
      </div>
    </div>`;
}
