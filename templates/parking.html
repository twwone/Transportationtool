<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>停車場車位 — 交通助理</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f4c3a">
<script src="/static/config.js"></script>

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overscroll-behavior: none; }

:root {
  --accent:      #0d9488;
  --accent-lt:   #14b8a6;
  --accent-pale: rgba(13,148,136,0.12);
  --bg:          #f0faf8;
  --surface:     #ffffff;
  --border:      rgba(0,0,0,0.07);
  --text:        #0f172a;
  --sub:         #64748b;
  --r-l:         22px;
  --r-m:         14px;
}

@keyframes fadeUp  { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
@keyframes spin    { to { transform:rotate(360deg); } }
@keyframes pulse   { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  min-height: 100%;
}

/* ── Top Bar ── */
.topbar {
  flex-shrink: 0;
  background: linear-gradient(160deg, #0f4c3a 0%, #0d9488 58%, #0891b2 100%);
  padding:
    max(14px, env(safe-area-inset-top) + 8px)
    16px
    18px;
}
.topbar-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}
.back-btn {
  width: 36px; height: 36px;
  background: rgba(255,255,255,0.18);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.22);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 1rem;
  text-decoration: none; flex-shrink: 0;
  transition: transform 0.18s;
  -webkit-tap-highlight-color: transparent;
}
.back-btn:active { transform: scale(0.88); }
.topbar-title { font-size: 1.35rem; font-weight: 800; color: #fff; letter-spacing: -0.3px; }
.topbar-sub   { font-size: 0.72rem; color: rgba(255,255,255,0.65); margin-top: 2px; }
.topbar-icon  { font-size: 1.9rem; margin-left: auto; }

/* ── 搜尋欄 ── */
.search-row {
  display: flex;
  gap: 8px;
  align-items: center;
}
.search-input {
  flex: 1;
  padding: 9px 14px;
  border-radius: 100px;
  border: none; outline: none;
  background: rgba(255,255,255,0.22);
  backdrop-filter: blur(8px);
  color: #fff;
  font-size: 0.88rem;
  font-family: inherit;
  placeholder-color: rgba(255,255,255,0.6);
}
.search-input::placeholder { color: rgba(255,255,255,0.55); }
.search-input:focus { background: rgba(255,255,255,0.3); }
.icon-btn {
  width: 38px; height: 38px;
  background: rgba(255,255,255,0.18);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.22);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 1.05rem;
  cursor: pointer; flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.18s, background 0.18s;
  font-family: inherit;
}
.icon-btn:active { transform: scale(0.88); background: rgba(255,255,255,0.3); }

/* ── Map ── */
#map {
  flex-shrink: 0;
  width: 100%;
  height: 360px;
  z-index: 1;
}

/* ── Status bar ── */
.status-bar {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  min-height: 42px;
}
.status-text {
  font-size: 0.78rem;
  color: var(--sub);
  display: flex; align-items: center; gap: 6px;
}
.spinner {
  width: 14px; height: 14px;
  border: 2px solid rgba(13,148,136,0.2);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.75s linear infinite;
  flex-shrink: 0;
}
.live-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: #4ade80;
  animation: pulse 1.6s ease-in-out infinite;
  flex-shrink: 0;
}
.refresh-btn {
  font-size: 0.75rem; font-weight: 600; color: var(--accent);
  background: var(--accent-pale); border: none;
  border-radius: 100px; padding: 4px 12px;
  cursor: pointer; font-family: inherit;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.15s;
}
.refresh-btn:active { transform: scale(0.93); }

/* ── Lot Cards ── */
.lots {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 12px 14px max(20px, env(safe-area-inset-bottom) + 12px);
  display: flex; flex-direction: column; gap: 10px;
}
.lot-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-l);
  padding: 16px 16px 14px;
  box-shadow: 0 1px 6px rgba(0,0,0,0.04);
  cursor: pointer;
  transition: transform 0.2s cubic-bezier(0.22,1,0.36,1), box-shadow 0.2s;
  -webkit-tap-highlight-color: transparent;
  animation: fadeUp 0.4s cubic-bezier(0.22,1,0.36,1) both;
}
.lot-card:active { transform: scale(0.975); box-shadow: none; }
.lot-card.highlight {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(13,148,136,0.25);
}
.lot-top {
  display: flex; align-items: flex-start; gap: 11px;
  margin-bottom: 10px;
}
.lot-icon {
  width: 40px; height: 40px;
  background: var(--accent-pale);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.2rem; flex-shrink: 0;
}
.lot-info { flex: 1; min-width: 0; }
.lot-name {
  font-size: 0.9rem; font-weight: 700; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.lot-dist { font-size: 0.7rem; color: var(--sub); margin-top: 2px; }
.lot-right { text-align: right; flex-shrink: 0; }
.lot-avail {
  font-size: 1.55rem; font-weight: 800; line-height: 1; letter-spacing: -1px;
}
.lot-avail.green  { color: #059669; }
.lot-avail.yellow { color: #d97706; }
.lot-avail.red    { color: #dc2626; }
.lot-avail.gray   { color: var(--sub); font-size: 0.95rem; margin-top: 6px; }
.lot-label { font-size: 0.66rem; color: var(--sub); margin-top: 2px; }
.bar-track {
  height: 5px; border-radius: 100px;
  background: rgba(100,116,139,0.1); overflow: hidden;
}
.bar-fill {
  height: 100%; border-radius: 100px;
  transition: width 0.6s cubic-bezier(0.22,1,0.36,1);
}
.bar-fill.green  { background: linear-gradient(90deg,#34d399,#059669); }
.bar-fill.yellow { background: linear-gradient(90deg,#fbbf24,#d97706); }
.bar-fill.red    { background: linear-gradient(90deg,#f87171,#dc2626); }
.bar-fill.gray   { background: rgba(100,116,139,0.2); }

/* ── Empty / Error ── */
.empty {
  padding: 48px 28px; text-align: center; color: var(--sub);
}
.empty-icon  { font-size: 2.6rem; margin-bottom: 10px; }
.empty-title { font-weight: 700; color: var(--text); margin-bottom: 6px; font-size: 0.95rem; }
.empty-desc  { font-size: 0.82rem; line-height: 1.5; }

/* ── Dark Mode ── */
@media (prefers-color-scheme: dark) {
  :root {
    --bg:          #061412;
    --surface:     #1c1c1e;
    --border:      rgba(255,255,255,0.07);
    --text:        #f2f2f7;
    --sub:         #8e8e93;
    --accent-pale: rgba(20,184,166,0.14);
  }
  .topbar { background: linear-gradient(160deg,#042f23 0%,#065f46 55%,#0e4b5e 100%); }
  .status-bar { background: #1c1c1e; border-bottom-color: rgba(255,255,255,0.07); }
  .lot-card { box-shadow: none; }
}

/* Leaflet popup 樣式微調 */
.leaflet-popup-content-wrapper {
  border-radius: 14px !important;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif !important;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15) !important;
}
.leaflet-popup-content { margin: 12px 14px !important; font-size: 0.85rem !important; }
.popup-name  { font-weight: 700; color: #0f172a; margin-bottom: 5px; font-size: 0.9rem; }
.popup-avail { color: #059669; font-weight: 700; }
.popup-na    { color: #64748b; }
.popup-dist  { color: #64748b; font-size: 0.75rem; margin-top: 3px; }
</style>
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
  <div class="topbar-row">
    <a href="/" class="back-btn">←</a>
    <div>
      <div class="topbar-title">停車場車位</div>
      <div class="topbar-sub">TDX · Leaflet · OSM</div>
    </div>
    <div class="topbar-icon">🅿️</div>
  </div>
  <!-- 搜尋欄 -->
  <div class="search-row">
    <input id="searchInput" class="search-input" type="text"
           placeholder="輸入地址或地標搜尋…"
           onkeydown="if(event.key==='Enter')doSearch()">
    <button class="icon-btn" onclick="doSearch()" title="搜尋">🔍</button>
    <button class="icon-btn" onclick="doGps()" title="GPS 定位">📍</button>
  </div>
</div>

<!-- Leaflet Map -->
<div id="map"></div>

<!-- Status Bar -->
<div class="status-bar">
  <div class="status-text" id="statusText">
    <div class="spinner" id="spinner"></div>
    取得定位中…
  </div>
  <button class="refresh-btn" id="refreshBtn" style="display:none" onclick="reload()">↻ 重新整理</button>
</div>

<!-- Lot Cards -->
<div class="lots" id="lotsContainer"></div>

<script>
/* ── 地圖初始化 ── */
const map = L.map('map', { zoomControl: true, attributionControl: true })
  .setView([25.0330, 121.5654], 12);   // 預設台北中心

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  maxZoom: 19,
}).addTo(map);

const markerLayer = L.layerGroup().addTo(map);

/* ── Marker 顏色邏輯 ── */
function markerColor(available, total) {
  if (available === null || available === undefined) return '#6b7280';  // 灰：無資料
  if (!total || total === 0) return '#6b7280';
  const ratio = available / total;
  if (ratio > 0.5)  return '#059669';  // 綠
  if (ratio > 0.1)  return '#d97706';  // 黃
  return '#dc2626';                    // 紅
}

function colorClass(available, total) {
  if (available === null || available === undefined) return 'gray';
  if (!total || total === 0) return 'gray';
  const ratio = available / total;
  if (ratio > 0.5) return 'green';
  if (ratio > 0.1) return 'yellow';
  return 'red';
}

/* ── 狀態顯示 ── */
function setStatus(html, showSpinner = false) {
  document.getElementById('spinner').style.display = showSpinner ? '' : 'none';
  document.getElementById('statusText').innerHTML =
    (showSpinner ? '<div class="spinner"></div>' : '') + html;
  document.getElementById('refreshBtn').style.display = 'none';
}

function setReady(label, count) {
  const dot = '<div class="live-dot"></div>';
  document.getElementById('statusText').innerHTML =
    `${dot} ${label}・找到 <b>${count}</b> 處停車場`;
  document.getElementById('refreshBtn').style.display = '';
}

/* ── 渲染 Markers + Cards ── */
let _lastLots = [];
let _lastLabel = '';
let _lastFetch = null;

function renderLots(lots, label) {
  _lastLots  = lots;
  _lastLabel = label;
  _lastFetch = { lots, label };

  // 清除舊 Markers
  markerLayer.clearLayers();

  const container = document.getElementById('lotsContainer');

  if (!lots || lots.length === 0) {
    container.innerHTML = `
      <div class="empty">
        <div class="empty-icon">🔍</div>
        <div class="empty-title">查無停車場</div>
        <div class="empty-desc">此範圍內尚無 TDX 收錄的路外停車場<br>可嘗試換個地點或擴大搜尋半徑</div>
      </div>`;
    setReady(label, 0);
    return;
  }

  // 建立 Markers
  lots.forEach((lot, i) => {
    const color = markerColor(lot.available, lot.total);
    const marker = L.circleMarker([lot.lat, lot.lon], {
      radius: 10,
      fillColor: color,
      color: '#fff',
      weight: 2,
      opacity: 1,
      fillOpacity: 0.9,
    });

    // Popup 內容
    const hasAvail = lot.available !== null && lot.available !== undefined;
    const hasTotal = lot.total && lot.total > 0;
    const availHtml = hasAvail
      ? `<div class="popup-avail">${lot.available} 格空位${hasTotal ? ' / 共 ' + lot.total + ' 格' : ''}</div>`
      : `<div class="popup-na">無即時車位資料</div>`;
    const distText  = lot.distance < 1000 ? `${lot.distance} m` : `${(lot.distance/1000).toFixed(1)} km`;

    marker.bindPopup(`
      <div class="popup-name">${lot.name}</div>
      ${availHtml}
      <div class="popup-dist">距離 ${distText}</div>
    `);

    // 點 Marker → 高亮對應卡片
    marker.on('click', () => {
      document.querySelectorAll('.lot-card').forEach(c => c.classList.remove('highlight'));
      const card = document.getElementById(`card-${i}`);
      if (card) {
        card.classList.add('highlight');
        card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    });

    marker.addTo(markerLayer);
    lot._marker = marker;
  });

  // 渲染卡片
  container.innerHTML = lots.map((lot, i) => {
    const cls      = colorClass(lot.available, lot.total);
    const hasAvail = lot.available !== null && lot.available !== undefined;
    const hasTotal = lot.total && lot.total > 0;
    const barW     = (hasAvail && hasTotal)
      ? Math.max(2, Math.round((lot.available / lot.total) * 100)) : 100;
    const distText = lot.distance < 1000 ? `${lot.distance} m` : `${(lot.distance/1000).toFixed(1)} km`;
    const availNum = hasAvail ? lot.available : '—';
    const label2   = hasAvail ? `剩餘空位${hasTotal ? ' / ' + lot.total + ' 格' : ''}` : '無即時資料';

    return `<div class="lot-card" id="card-${i}" style="animation-delay:${i*50}ms"
      onclick="focusLot(${i})">
      <div class="lot-top">
        <div class="lot-icon">🅿️</div>
        <div class="lot-info">
          <div class="lot-name">${lot.name}</div>
          <div class="lot-dist">距離 ${distText}</div>
        </div>
        <div class="lot-right">
          <div class="lot-avail ${cls}">${availNum}</div>
          <div class="lot-label">${label2}</div>
        </div>
      </div>
      <div class="bar-track">
        <div class="bar-fill ${cls}" style="width:${barW}%"></div>
      </div>
    </div>`;
  }).join('');

  setReady(label, lots.length);

  // 地圖自動縮放包含所有 Marker
  if (lots.length > 0) {
    const bounds = L.latLngBounds(lots.map(l => [l.lat, l.lon]));
    map.fitBounds(bounds, { padding: [40, 40], maxZoom: 16 });
  }
}

/* 點卡片 → 飛到 Marker 並開 Popup */
function focusLot(i) {
  const lot = _lastLots[i];
  if (!lot) return;
  map.flyTo([lot.lat, lot.lon], 17, { duration: 0.8 });
  if (lot._marker) setTimeout(() => lot._marker.openPopup(), 850);
  document.querySelectorAll('.lot-card').forEach(c => c.classList.remove('highlight'));
  document.getElementById(`card-${i}`)?.classList.add('highlight');
}

/* ── API 請求 ── */
async function fetchParking(url, label) {
  setStatus('載入中…', true);
  try {
    const r    = await fetch(url, { signal: AbortSignal.timeout(20000) });
    const data = await r.json();
    if (!r.ok || data.error) {
      setStatus(`⚠️ ${data.error || '資料取得失敗'}`);
      return;
    }
    renderLots(data.lots, label);
    console.log('[Parking]', data);
  } catch (e) {
    setStatus('❌ 網路連線失敗，請稍後再試');
  }
}

/* ── Mode A：GPS 定位 ── */
function doGps() {
  if (!navigator.geolocation) {
    setStatus('⚠️ 此瀏覽器不支援 GPS 定位');
    return;
  }
  setStatus('取得定位中…', true);
  navigator.geolocation.getCurrentPosition(
    pos => {
      const { latitude: lat, longitude: lon } = pos.coords;
      map.flyTo([lat, lon], 15, { duration: 0.8 });
      fetchParking(`/api/parking?lat=${lat}&lon=${lon}&radius=1000`, 'GPS 定位');
    },
    err => {
      const msgs = { 1:'請允許位置存取後重試', 2:'定位失敗，請稍後再試', 3:'定位逾時' };
      setStatus(`⚠️ ${msgs[err.code] || '定位失敗'}`);
    },
    { timeout: 12000, maximumAge: 30000 }
  );
}

/* ── Mode B：Nominatim 地址搜尋 ── */
async function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) return;
  setStatus('搜尋地址中…', true);
  try {
    const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1&accept-language=zh-TW`;
    const r   = await fetch(url, {
      headers: { 'Accept-Language': 'zh-TW,zh;q=0.9' },
      signal: AbortSignal.timeout(10000),
    });
    const results = await r.json();
    if (!results || results.length === 0) {
      setStatus('⚠️ 找不到此地址，請換個關鍵字');
      return;
    }
    const lat = parseFloat(results[0].lat);   // Nominatim 回傳字串，須轉 float
    const lon = parseFloat(results[0].lon);
    const displayName = results[0].display_name || q;

    map.flyTo([lat, lon], 15, { duration: 0.8 });
    fetchParking(`/api/parking?lat=${lat}&lon=${lon}&radius=1000`, displayName.split(',')[0]);
  } catch (e) {
    setStatus('❌ 地址搜尋失敗，請稍後再試');
  }
}

/* ── 重新整理 ── */
function reload() {
  if (!_lastFetch) { doGps(); return; }
  document.getElementById('lotsContainer').innerHTML = '';
  markerLayer.clearLayers();
  // 重新觸發上次的查詢方式
  const input = document.getElementById('searchInput').value.trim();
  if (input) doSearch();
  else       doGps();
}

/* ── 初始載入：嘗試 GPS，失敗則顯示提示 ── */
doGps();
</script>
</body>
</html>
