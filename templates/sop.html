<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>廣播 SOP</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#fff5f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a0808" media="(prefers-color-scheme: dark)">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overscroll-behavior: none; }

:root {
  --bg:      #fff5f5;
  --surface: #ffffff;
  --border:  rgba(220,0,0,0.09);
  --text:    #1a0808;
  --sub:     #9c6b6b;
  --accent:  #d91430;
  --acc2:    rgba(217,20,48,0.08);
  --blank:   #d91430;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:      #1a0808;
    --surface: #240e0e;
    --border:  rgba(255,80,80,0.11);
    --text:    #f5e0e0;
    --sub:     #8a5a5a;
    --accent:  #ff4455;
    --acc2:    rgba(255,68,85,0.11);
    --blank:   #ff6677;
  }
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  height: 100dvh;
  overflow: hidden;
}

/* ── Header ── */
.header {
  padding: max(20px, env(safe-area-inset-top) + 8px) 20px 0;
  flex-shrink: 0;
}
.back-btn {
  background: none; border: none;
  font-size: 0.78rem; font-family: inherit;
  color: var(--sub); cursor: pointer; padding: 0;
  letter-spacing: 0.06em;
  -webkit-tap-highlight-color: transparent;
}
.back-btn:active { color: var(--accent); }
.header-title {
  font-size: 1.8rem; font-weight: 700;
  color: var(--text); margin-top: 8px; letter-spacing: -0.5px;
}
.header-sub {
  font-size: 0.72rem; color: var(--sub);
  margin-top: 3px; letter-spacing: 0.02em;
}
.header-rule { height: 1px; background: var(--border); margin-top: 14px; }

/* ── Tabs ── */
.tabs {
  display: flex; padding: 0 20px;
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.tab {
  flex: 1; padding: 13px 0 11px;
  border: none; background: none; font-family: inherit;
  font-size: 0.82rem; font-weight: 500; letter-spacing: 0.04em;
  color: var(--sub); cursor: pointer; position: relative;
  text-align: center; -webkit-tap-highlight-color: transparent;
  transition: color 0.18s;
}
.tab.active { color: var(--accent); }
.tab.active::after {
  content: ''; position: absolute;
  bottom: -1px; left: 20%; width: 60%;
  height: 2px; background: var(--accent); border-radius: 2px;
}

/* ── Content ── */
.content {
  flex: 1; overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 16px 20px max(80px, env(safe-area-inset-bottom) + 20px);
}
.pane { display: none; }
.pane.active { display: block; }

/* ── Tab 0: 依航班 ── */
.airline-btns {
  display: grid; grid-template-columns: repeat(4,1fr);
  gap: 8px; margin-bottom: 18px;
}
.airline-btn {
  padding: 13px 4px; border: 2px solid var(--border);
  border-radius: 14px; background: var(--surface);
  font-family: inherit; font-size: 1.05rem; font-weight: 700;
  color: var(--sub); cursor: pointer; text-align: center;
  transition: all 0.15s; -webkit-tap-highlight-color: transparent;
}
.airline-btn.active {
  border-color: var(--accent); color: var(--accent); background: var(--acc2);
}
.airline-btn:active { transform: scale(0.94); }

.seq-list { display: flex; flex-direction: column; gap: 7px; }
.seq-item {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 14px;
  background: var(--surface); border-radius: 14px;
  border: 1px solid var(--border);
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: background 0.12s; position: relative; overflow: hidden;
}
.seq-item::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px; background: var(--accent); opacity: 0; transition: opacity 0.15s;
}
.seq-item:active { background: var(--acc2); }
.seq-item:active::before { opacity: 1; }
.seq-num {
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--acc2); color: var(--accent);
  font-size: 0.75rem; font-weight: 700;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.seq-info { flex: 1; min-width: 0; }
.seq-title { font-size: 0.92rem; font-weight: 600; color: var(--text); }
.seq-badge {
  display: inline-block; font-size: 0.63rem; font-weight: 600;
  padding: 1px 6px; border-radius: 6px;
  background: var(--acc2); color: var(--accent);
  margin-left: 6px; letter-spacing: 0.02em; vertical-align: middle;
}
.seq-arrow { color: var(--sub); font-size: 0.8rem; flex-shrink: 0; }

/* ── Tab 1: 依類別 ── */
.cat-section { margin-bottom: 22px; }
.cat-header {
  font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em;
  color: var(--sub); text-transform: uppercase;
  margin-bottom: 7px; padding: 0 2px;
}
.cat-list {
  border-radius: 16px; overflow: hidden;
  border: 1px solid var(--border);
  background: var(--border);
  display: flex; flex-direction: column; gap: 1px;
}
.cat-item {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; background: var(--surface);
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: background 0.12s;
}
.cat-item:active { background: var(--acc2); }
.cat-label { flex: 1; font-size: 0.92rem; font-weight: 500; color: var(--text); }
.cat-arrow { color: var(--sub); font-size: 0.8rem; }

/* ── Panel ── */
.backdrop {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.42);
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s; z-index: 100;
}
.backdrop.open { opacity: 1; pointer-events: auto; }

.panel {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--surface);
  border-radius: 24px 24px 0 0;
  max-height: 90dvh;
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.32,0.72,0,1);
  z-index: 101; display: flex; flex-direction: column;
}
.panel.open { transform: translateY(0); }

.panel-handle {
  width: 36px; height: 4px; background: var(--border);
  border-radius: 2px; margin: 12px auto 0; flex-shrink: 0;
}
.panel-head {
  padding: 10px 20px 14px;
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.panel-title { font-size: 1.1rem; font-weight: 700; color: var(--text); }
.panel-note { font-size: 0.72rem; color: var(--accent); margin-top: 3px; font-weight: 600; }

.panel-body {
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 16px 20px max(24px, env(safe-area-inset-bottom) + 16px);
  flex: 1;
}
.script-lang {
  font-size: 0.67rem; font-weight: 700; letter-spacing: 0.12em;
  color: var(--sub); text-transform: uppercase; margin-bottom: 8px;
}
.script-text {
  font-size: 1rem; line-height: 1.8; color: var(--text);
  white-space: pre-wrap; margin-bottom: 20px;
}
.blank { color: var(--blank); font-weight: 700; border-bottom: 1.5px solid var(--blank); }
.divider { height: 1px; background: var(--border); margin: 4px 0 20px; }
</style>
</head>
<body>

<div class="header">
  <button class="back-btn" onclick="history.back()">← 返回</button>
  <div class="header-title">廣播 SOP</div>

  <div class="header-rule"></div>

<div class="tabs">
  <button class="tab active" onclick="switchTab(0,this)">依航班</button>
  <button class="tab" onclick="switchTab(1,this)">依類別</button>
</div>

<div class="content">

      <button class="airline-btn" onclick="selectAirline('Z2',this)">Z2</button>
    </div>
    <div class="seq-list" id="seq-list"></div>
  </div>
  <div class="pane" id="pane-cat"></div>
</div>

<div class="backdrop" id="backdrop" onclick="closePanel()"></div>
<div class="panel" id="panel">
  <div class="panel-handle"></div>
  <div class="panel-head">
    <div class="panel-title" id="p-title"></div>
    <div class="panel-note" id="p-note"></div>
  </div>
  <div class="panel-body" id="p-body"></div>

function switchTab(i, btn) {
  document.querySelectorAll('.tab').forEach((t,j) => t.classList.toggle('active', j===i));
  document.querySelectorAll('.pane').forEach((p,j) => p.classList.toggle('active', j===i));
}

function selectAirline(code, btn) {
  document.querySelectorAll('.airline-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderSeq(code);
}

function renderSeq(code) {
  const list = document.getElementById('seq-list');
  list.innerHTML = SEQ[code].map((item, i) => {
    const badge = item.note ? `<span class="seq-badge">${item.note}</span>` : '';
    const enFirst = !!(item.note && item.note.includes('先英'));
    return `<div class="seq-item" onclick='openPanel(${JSON.stringify(item.id)},${JSON.stringify(item.note||'')},${enFirst})'>
      <div class="seq-num">${i+1}</div>
      <div class="seq-info"><div class="seq-title">${item.label}${badge}</div></div>
      <div class="seq-arrow">›</div>
    </div>`;
  }).join('');
}

function renderCats() {
  document.getElementById('pane-cat').innerHTML = CATS.map(cat => `
    <div class="cat-section">
      <div class="cat-header">${cat.icon} &nbsp;${cat.label}</div>
      <div class="cat-list">${cat.ids.map(id => `
        <div class="cat-item" onclick='openPanel(${JSON.stringify(id)},"",false)'>
          <div class="cat-label">${S[id].title}</div>
          <div class="cat-arrow">›</div>
        </div>`).join('')}
      </div>
    </div>`).join('');
}

function fmt(text) {
  return text.replace(/_{2,}/g, m => `<span class="blank">${m}</span>`);
}

function openPanel(id, note, enFirst) {
  const s = S[id];
  document.getElementById('p-title').textContent = s.title;
  const noteEl = document.getElementById('p-note');
  noteEl.textContent = note || '';
  noteEl.style.display = note ? '' : 'none';

  const zh = `<div class="script-lang">中文</div><div class="script-text">${fmt(s.zh)}</div>`;
  const en = `<div class="script-lang">English</div><div class="script-text">${fmt(s.en)}</div>`;
  document.getElementById('p-body').innerHTML = enFirst
    ? en + '<div class="divider"></div>' + zh
    : zh + '<div class="divider"></div>' + en;

  document.getElementById('backdrop').classList.add('open');
  document.getElementById('panel').classList.add('open');
  document.getElementById('p-body').scrollTop = 0;
}

function closePanel() {
  document.getElementById('backdrop').classList.remove('open');
  document.getElementById('panel').classList.remove('open');
}
