<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>航空資訊看板</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<link rel="apple-touch-icon" href="/static/icon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"></script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="交通助理">
<meta name="theme-color" content="#f0f4ff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { overscroll-behavior: none; }

/* ── 關鍵影格 ── */
@keyframes pageIn {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(16px) scale(0.98); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.4; }
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f0f4ff;
  color: #1c1c1e;
  min-height: 100vh;
  padding-bottom: 48px;
  animation: pageIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
}

/* ── Topbar ── */
.topbar {
  background: rgba(240,244,255,0.88);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: none;
  box-shadow: 0 1px 0 rgba(0,0,0,0.06);
  padding: 10px 16px 0;
  padding-top: max(10px, env(safe-area-inset-top) + 6px);
  position: sticky; top: 0; z-index: 100;
}
.topbar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.back-btn {
  color: #1a56db; font-size: 0.85rem; text-decoration: none;
  transition: color 0.15s, transform 0.18s cubic-bezier(0.22,1,0.36,1), opacity 0.15s;
  display: inline-block;
}
.back-btn:active { transform: scale(0.86); opacity: 0.6; }
.topbar-title { font-size: 1rem; font-weight: 700; flex: 1; }
.topbar-title .bi { color: #1a56db; }
.refresh-btn {
  background: rgba(26,86,219,0.08); border: none; color: #1a56db;
  font-size: 0.82rem; font-weight: 600; cursor: pointer; padding: 7px 13px;
  border-radius: 20px;
  transition: background 0.15s, transform 0.18s cubic-bezier(0.22,1,0.36,1);
  -webkit-tap-highlight-color: transparent;
  white-space: nowrap;
}
.refresh-btn:hover  { background: rgba(26,86,219,0.14); }
.refresh-btn:active { transform: scale(0.9); }
.spin { animation: spin 0.7s linear infinite; display: inline-block; }

/* ── Tabs ── */
.tabs {
  display: flex;
  position: relative;  /* 讓 tab-indicator 可以絕對定位 */
}
.tab {
  flex: 1; padding: 9px 0; text-align: center;
  font-size: 0.9rem; font-weight: 600; color: #8e8e93;
  cursor: pointer;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  transition: color 0.2s;
  user-select: none;
}
.tab:active { opacity: 0.65; }
.tab.active { color: #1a56db; border-bottom-color: transparent; }

/* 滑動指示線（取代各 tab 的 border） */
.tab-indicator {
  position: absolute;
  bottom: -1px;
  height: 2.5px;
  background: #1a56db;
  border-radius: 2px 2px 0 0;
  transition:
    left  0.34s cubic-bezier(0.22, 1, 0.36, 1),
    width 0.34s cubic-bezier(0.22, 1, 0.36, 1);
  will-change: left, width;
  pointer-events: none;
}

/* ── Meta bar ── */
.meta-bar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 6px 16px; font-size: 0.7rem; color: #aeaeb2;
}

/* ── Search ── */
.search-wrap { padding: 10px 12px 0; }
.topbar-search { padding: 0 12px 10px; display: none; }
.topbar-search.show { display: block; }
.search-input {
  width: 100%; padding: 12px 14px;
  border: 1.5px solid #e5e5ea; border-radius: 12px;
  font-size: 0.95rem; color: #1c1c1e; background: #fff;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.25s cubic-bezier(0.22,1,0.36,1), transform 0.25s cubic-bezier(0.22,1,0.36,1);
}
.search-input:focus {
  border-color: #1a56db;
  box-shadow: 0 0 0 3.5px rgba(26,86,219,0.13);
  transform: scale(1.006);
}
.search-hint {
  text-align: center; padding: 44px 20px 0;
  color: #aeaeb2; font-size: 0.82rem; line-height: 1.8;
}
.search-hint .hint-icon { font-size: 2.2rem; display: block; margin-bottom: 10px; }
.search-count { padding: 6px 12px 2px; font-size: 0.7rem; color: #aeaeb2; }

/* ── List ── */
.list { padding: 8px 12px 0; }

/* 面板過場 will-change 由 JS 動態控制，不在 CSS 靜態宣告 */

/* ── 卡片入場動畫 ── */
.card-anim {
  animation: cardIn 0.42s cubic-bezier(0.22, 1, 0.36, 1) both;
}

/* ════════════════════════════════════════
   FLIGHT CARD
   ════════════════════════════════════════ */
.card {
  background: #fff;
  border: 1.5px solid #e5e5ea;
  border-radius: 22px;
  padding: 16px 16px 16px;
  margin-bottom: 10px;
  box-shadow: 0 1px 6px rgba(0,0,0,0.05);
  transition:
    border-color 0.2s,
    background   0.2s,
    transform    0.25s cubic-bezier(0.22, 1, 0.36, 1),
    box-shadow   0.25s cubic-bezier(0.22, 1, 0.36, 1);
}
@media (hover: hover) {
  .card:not(.card-done):hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 22px rgba(0,0,0,0.09);
  }
}
.card:active { transform: scale(0.988) !important; transition-duration: 0.08s !important; }

/* 延誤 */
.card-delayed { border-color: #fed7aa; background: #fffbf5; }
/* 已完成（起飛/落地） */
.card-done    { opacity: 0.55; }
/* 轉降 */
.card-diverted { border-color: #c026d3; background: #fdf4ff; }

/* ── 1. Meta row ── */
.card-meta {
  display: flex; align-items: center; gap: 6px;
  flex-wrap: wrap; margin-bottom: 10px;
}
.badge-airline {
  background: #eff6ff; color: #1a56db;
  font-size: 0.7rem; font-weight: 700; letter-spacing: 0.4px;
  padding: 3px 9px; border-radius: 6px;
}
.badge-dir-arr { background: #d1fae5; color: #065f46; font-size: 0.68rem; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
.badge-dir-dep { background: #dbeafe; color: #1e40af; font-size: 0.68rem; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
.badge-status {
  font-size: 0.7rem; font-weight: 700;
  padding: 3px 9px; border-radius: 20px;
}
.st-ontime   { background: #d1fae5; color: #065f46; }
.st-delay    { background: #ffedd5; color: #9a3412; }
.st-landed   { background: #dbeafe; color: #1e40af; }
.st-depart   { background: #dbeafe; color: #1e40af; }
.st-board    { background: #ede9fe; color: #5b21b6; }
.st-cancel   { background: #fee2e2; color: #991b1b; }
.st-diverted { background: #fae8ff; color: #86198f; border: 1px solid #e879f9; }
.st-unknown  { background: #f3f4f6; color: #6b7280; }
.badge-terminal {
  margin-left: auto;
  font-size: 0.7rem; color: #636366;
  background: #f0f4ff; padding: 3px 8px; border-radius: 6px;
}
.badge-actype {
  font-size: 0.68rem; font-weight: 600; color: #636366;
  background: #f0f4ff; padding: 3px 8px; border-radius: 6px;
}
.badge-actype-changed {
  background: #fff7ed; color: #c2410c;
  border: 1px solid #f97316;
}

/* ── 2. Hero row ── */
.card-hero {
  display: flex; align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 11px;
  gap: 8px;
}
.hero-left { display: flex; flex-direction: column; }
.hero-airline-row { display: flex; align-items: center; gap: 10px; }
.airline-logo-wrap { display: flex; flex-direction: column; gap: 3px; flex-shrink: 0; }
.airline-logo {
  width: 38px; height: 38px;
  border-radius: 9px;
  object-fit: contain;
  background: #f0f4ff;
  border: 1px solid rgba(0,0,0,0.06);
  display: block;
}
.airline-logo.logo-sm { width: 28px; height: 28px; border-radius: 7px; }
.hero-airline-cn {
  font-size: 0.75rem; font-weight: 600; color: #636366;
  margin-bottom: 2px; letter-spacing: 0.2px;
}
.hero-flt {
  font-size: 2.2rem; font-weight: 800;
  letter-spacing: -1.5px; line-height: 1;
  color: #1c1c1e;
}
.hero-ap { text-align: right; }
.hero-iata {
  font-size: 2rem; font-weight: 800;
  letter-spacing: -0.5px; line-height: 1;
  color: #1c1c1e;
}
.hero-city {
  font-size: 0.78rem; font-weight: 600; color: #636366;
  margin-top: 4px; text-align: right;
}

/* ── 3. Time row ── */
.card-time {
  display: flex; align-items: baseline; gap: 8px;
  margin-bottom: 12px; flex-wrap: wrap;
}
.time-lbl {
  font-size: 0.6rem; font-weight: 700; color: #aeaeb2;
  text-transform: uppercase; letter-spacing: 0.5px;
  align-self: center;
}
.time-sch { font-size: 1.25rem; font-weight: 800; color: #1c1c1e; }
.time-sch.through { text-decoration: line-through; color: #c7c7cc; }
.time-arrow { font-size: 0.85rem; color: #aeaeb2; }
.time-est  { font-size: 1.25rem; font-weight: 800; color: #c2410c; }
.delay-chip {
  font-size: 0.68rem; font-weight: 700;
  color: #9a3412; background: #ffedd5;
  padding: 2px 6px; border-radius: 5px;
  align-self: center;
}
.time-act { font-size: 1.25rem; font-weight: 800; color: #15803d; }
.time-act-lbl { font-size: 0.62rem; color: #aeaeb2; align-self: center; }

/* ── 4. Resource grid ── */
.res-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 8px; margin-bottom: 0;
}
.res-block {
  background: #f7f7f9; border: 1.5px solid #ebebed;
  border-radius: 16px; padding: 12px 14px;
  transition: border-color 0.2s, background 0.2s;
}
.res-block.res-highlighted { background: #eff6ff; border-color: #bfdbfe; }
.res-icon-lbl { font-size: 0.82rem; font-weight: 600; color: #636366; margin-bottom: 6px; }
.res-val {
  font-size: 1.8rem; font-weight: 800;
  color: #1c1c1e; letter-spacing: -0.5px; line-height: 1;
}
.res-val.res-val-sm { font-size: 1.1rem; letter-spacing: 0; }
.res-val.tba { font-size: 0.82rem; font-weight: 400; color: #c7c7cc; font-style: italic; line-height: 1.5; }
.res-block.res-gate-changed { background: #fff7ed; border-color: #f97316; }
.res-changed { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.res-prev    { font-size: 1.1rem; font-weight: 700; color: #9ca3af; text-decoration: line-through; }
.res-chg-arrow { font-size: 0.9rem; font-weight: 700; color: #f97316; }
.res-new     { font-size: 1.5rem; font-weight: 800; color: #c2410c; letter-spacing: -0.5px; line-height: 1; }
.card-updated { font-size: 0.6rem; color: #c7c7cc; text-align: right; margin-top: 8px; }

/* ── TAT Section ── */
.tat-wrap { margin-top: 12px; padding-top: 12px; border-top: 1px solid #f2f2f7; }
.tat-headline { margin-bottom: 9px; }
.tat-next { font-size: 0.82rem; font-weight: 600; color: #1c1c1e; }
.tat-next.phase-urgent { color: #b91c1c; }
.tat-next.phase-soon   { color: #92400e; }
.tat-next.phase-ok     { color: #065f46; }
.ms-list { display: flex; flex-direction: column; gap: 5px; }
.ms-row {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 8px; border-radius: 8px;
  transition: background 0.2s;
}
.ms-row.ms-done   { opacity: 0.38; }
.ms-row.ms-now    { background: #eff6ff; border: 1px solid #bfdbfe; }
.ms-row.ms-next   { background: #fffbeb; border: 1px solid #fde68a; }
.ms-row.ms-urgent { background: #fef2f2; border: 1px solid #fecaca; }
.ms-row.ms-future { opacity: 0.5; }
.ms-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.ms-done   .ms-dot { background: #9ca3af; }
.ms-now    .ms-dot { background: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.2); }
.ms-next   .ms-dot { background: #f59e0b; }
.ms-urgent .ms-dot { background: #ef4444; box-shadow: 0 0 0 3px rgba(239,68,68,0.2); animation: pulse 1.2s ease-in-out infinite; }
.ms-future .ms-dot { background: #d1d5db; }
.ms-time      { font-size: 0.78rem; font-weight: 700; color: #374151; min-width: 38px; }
.ms-label     { font-size: 0.78rem; color: #374151; flex: 1; }
.ms-countdown { font-size: 0.7rem; font-weight: 600; color: #6b7280; white-space: nowrap; }
.ms-now    .ms-countdown { color: #1d4ed8; }
.ms-next   .ms-countdown { color: #92400e; }
.ms-urgent .ms-countdown { color: #b91c1c; }

/* ── Empty / Error / Loading ── */
.empty { text-align: center; padding: 60px 20px; color: #aeaeb2; font-size: 0.9rem; }
.empty-icon { font-size: 2.8rem; display: block; margin-bottom: 14px; }
.error-banner {
  background: #fef3c7; border: 1px solid #fcd34d;
  border-radius: 12px; padding: 12px 16px;
  font-size: 0.82rem; color: #78350f; margin: 12px;
}
.loading { text-align: center; padding: 40px 20px; color: #aeaeb2; font-size: 0.85rem; }

/* ── 全航班時間軸分隔線 ── */
.now-divider {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 0; margin: 4px 0 8px;
}
.now-line {
  flex: 1; height: 1.5px;
  background: linear-gradient(90deg, transparent, #1a56db 40%, transparent);
}
.now-label {
  font-size: 0.72rem; font-weight: 700; color: #1a56db;
  background: #eff6ff; padding: 4px 10px; border-radius: 20px;
  border: 1px solid #bfdbfe; white-space: nowrap;
}

/* ── 航空公司選擇器 ── */
.picker-sheet { position: fixed; inset: 0; z-index: 200; }
.picker-overlay {
  position: absolute; inset: 0; background: rgba(0,0,0,0.35);
  opacity: 0; transition: opacity 0.3s;
}
.picker-open .picker-overlay { opacity: 1; }
.picker-body {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: #fff; border-radius: 20px 20px 0 0;
  max-height: 72vh; display: flex; flex-direction: column;
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.22,1,0.36,1);
  padding-bottom: max(16px, env(safe-area-inset-bottom));
}
.picker-open .picker-body { transform: translateY(0); }
.picker-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px 12px; border-bottom: 1px solid #e5e5ea;
  font-size: 1rem; font-weight: 700; flex-shrink: 0;
}
.picker-done-btn {
  background: #eff6ff; border: none; color: #1a56db;
  font-size: 0.85rem; font-weight: 700; padding: 6px 16px;
  border-radius: 20px; cursor: pointer;
}
.picker-list { overflow-y: auto; padding: 8px 12px 8px; }
.picker-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border-radius: 12px; margin-bottom: 6px;
  border: 1.5px solid #e5e5ea; background: #fff; cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.picker-item input { display: none; }
.picker-logo {
  width: 32px; height: 32px; border-radius: 7px;
  object-fit: contain; background: #f0f4ff;
  border: 1px solid rgba(0,0,0,0.06); flex-shrink: 0;
}
.picker-code {
  font-size: 0.78rem; font-weight: 700; color: #1a56db;
  background: #eff6ff; padding: 3px 8px; border-radius: 6px;
  min-width: 36px; text-align: center; flex-shrink: 0;
}
.picker-name { flex: 1; font-size: 0.88rem; color: #1c1c1e; }
.picker-check { font-size: 1rem; color: #c7c7cc; flex-shrink: 0; transition: color 0.15s; }
.picker-checked { border-color: #bfdbfe; background: #eff6ff; }
.picker-checked .picker-check { color: #1a56db; }

@media (prefers-color-scheme: dark) {
  body { background: #000; color: #f2f2f7; }
  .topbar { background: rgba(0,0,0,0.75); box-shadow: 0 1px 0 rgba(255,255,255,0.06); border-bottom: none; }
  .topbar-title { color: #f2f2f7; }
  .back-btn { color: #60a5fa; }
  .refresh-btn { color: #60a5fa; }
  .refresh-btn:hover { background: rgba(96,165,250,0.1); }
  .tab-bar { background: #1c1c1e; border-bottom-color: #2c2c2e; }
  .tab { color: #636366; border-bottom-color: #2c2c2e; }
  .tab.active { color: #60a5fa; }
  .tab-active-bar { background: #60a5fa; }
  .flight-card { background: #1c1c1e; border-color: #2c2c2e; }
  .flight-card:hover { border-color: #3a3a3c; }
  .card-delayed  { background: rgba(251,146,60,0.08);  border-color: rgba(251,146,60,0.35); }
  .card-diverted { background: rgba(192,38,211,0.08); border-color: rgba(192,38,211,0.35); }
  .airline-logo { background: #2c2c2e; border-color: rgba(255,255,255,0.08); }
  .picker-logo  { background: #2c2c2e; border-color: rgba(255,255,255,0.08); }
  .flight-airline { color: #8e8e93; }
  .flight-num  { color: #f2f2f7; }
  .airport-badge { background: rgba(26,86,219,0.2); color: #60a5fa; }
  .delay-badge   { background: rgba(194,65,12,0.15); color: #fb923c; }
  .badge-dir-arr { background: rgba(5,150,105,0.2);  color: #4ade80; }
  .badge-dir-dep { background: rgba(30,64,175,0.2);  color: #93c5fd; }
  .st-ontime   { background: rgba(5,150,105,0.2);  color: #4ade80; }
  .st-delay    { background: rgba(154,52,18,0.2);  color: #fb923c; }
  .st-landed   { background: rgba(30,64,175,0.2);  color: #93c5fd; }
  .st-depart   { background: rgba(30,64,175,0.2);  color: #93c5fd; }
  .st-board    { background: rgba(91,33,182,0.2);  color: #c4b5fd; }
  .st-cancel   { background: rgba(153,27,27,0.2);  color: #f87171; }
  .st-diverted { background: rgba(134,25,143,0.2); color: #e879f9; border-color: rgba(232,121,249,0.3); }
  .st-unknown  { background: rgba(107,114,128,0.15); color: #9ca3af; }
  .time-sch { color: #8e8e93; }
  .time-sch.through { color: #48484a; }
  .time-est { color: #fb923c; }
  .empty-state { color: #48484a; }
  .section-label { color: #636366; }
  .airline-row { background: #1c1c1e; border-color: #2c2c2e; }
  .picker-id   { background: rgba(26,86,219,0.15); color: #60a5fa; }
  .picker-name { color: #f2f2f7; }
  .picker-check { color: #3a3a3c; }
  .picker-checked { background: rgba(26,86,219,0.15); border-color: rgba(26,86,219,0.4); }
  .picker-checked .picker-check { color: #60a5fa; }
  .sheet-overlay.open { background: rgba(0,0,0,0.55); }
  .picker-sheet { background: #1c1c1e; }
  .sh-done { color: #60a5fa; }
  .flt-sheet { background: #1c1c1e; }
  .flt-sheet-header { background: #1c1c1e; border-bottom-color: #2c2c2e; }
  .flt-sheet-title { color: #f2f2f7; }
  .flt-close-btn { background: #2c2c2e; color: #8e8e93; }
  .flt-info-title { color: #636366; }
  .flt-info-label { color: #636366; }
  .flt-info-val   { color: #f2f2f7; }
  .flt-map-placeholder { background: #1c1c1e; color: #636366; }
  .flt-live-badge { background: rgba(22,163,74,0.18); }
}

/* ── Flight Detail Bottom Sheet ── */
.flt-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.4);
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s ease;

<script>
/* ── 動態元資料對照（由 /api/tias/flights 的 airline_map / airport_map 填入） ── */
/* airline_map: { "AK": {zh:"亞洲航空", en:"AirAsia"}, ... }                       */
/* airport_map: { "KUL": {zh:"吉隆坡", en:"Kuala Lumpur", ap_zh:"..."}, ... }       */

/* 動畫結束後移除 body transform，否則 position:fixed 會定位錯誤 */
document.body.addEventListener('animationend', function() {
  this.style.animation = 'none';
  this.style.opacity   = '1';
}, { once: true });

/* ── 機場中文靜態對照（TDX 沒資料時兜底） ── */
const AP_ZH = {
  'TPE':'桃園','TSA':'松山','KHH':'高雄','TNN':'台南','RMQ':'台中','TTT':'台東','HUN':'花蓮',
  'HKG':'香港','MFM':'澳門',
  'NRT':'東京成田','HND':'東京羽田','KIX':'大阪關西','ITM':'大阪伊丹',
  'NGO':'名古屋','FUK':'福岡','CTS':'札幌','OKA':'沖繩','SDJ':'仙台','HIJ':'廣島',
  'ICN':'首爾仁川','GMP':'首爾金浦','PUS':'釜山',
  'PEK':'北京首都','PKX':'北京大興','PVG':'上海浦東','SHA':'上海虹橋',
  'CAN':'廣州','SZX':'深圳','XMN':'廈門','CTU':'成都','CSX':'長沙',
  'KUL':'吉隆坡','SZB':'吉隆坡莎阿南','PEN':'檳城','LGK':'蘭卡威',
  'JHB':'新山','KCH':'古晉','BKI':'亞庇','MYY':'美里','SDK':'仙德坎',
  'IPH':'怡保','AOR':'亞羅士打','TGG':'瓜拉丁加奴','KBR':'哥打峇魯',
  'BKK':'曼谷素萬那普','DMK':'曼谷廊曼','HKT':'普吉','CNX':'清邁',
  'HKT':'普吉','CEI':'清萊','USM':'蘇梅島','URT':'蘇叻他尼',
  'SIN':'新加坡',
  'MNL':'馬尼拉','CEB':'宿霧','CRK':'克拉克','DVO':'達沃','ILO':'依洛伊洛',
  'CGK':'雅加達','DPS':'峇里島','SUB':'泗水','JOG':'日惹','BPN':'巴厘巴板',
  'MDC':'萬鴉老','UPG':'望加錫','SRG':'三寶瓏','PLM':'巨港',
  'HAN':'河內','SGN':'胡志明市','DAD':'峴港','CXR':'芽莊','PQC':'富國島',
  'PNH':'金邊','REP':'暹粒',
  'RGN':'仰光',
  'SYD':'雪梨','MEL':'墨爾本','BNE':'布里斯本','PER':'柏斯',
  'DXB':'杜拜','DOH':'多哈','AUH':'阿布達比',
  'LHR':'倫敦希斯羅','CDG':'巴黎','FRA':'法蘭克福','AMS':'阿姆斯特丹',
  'LAX':'洛杉磯','SFO':'舊金山','JFK':'紐約','ORD':'芝加哥',
  'YVR':'溫哥華','YYZ':'多倫多',
};

/* ── 狀態對照 ── */
const ST_MAP = [
  [/(準時|On.?Time|正常)/i,          'ontime',   '準點'],
  [/(延誤|Delay)/i,                   'delay',    '誤點'],
  [/(落地|Arrived?|抵達|已到)/i,       'landed',   '已抵達'],
  [/(起飛|Depart|出發|已出發)/i,       'depart',   '已出發'],
  [/(登機|Board)/i,                   'board',    '登機中'],
  [/(取消|Cancel)/i,                  'cancel',   '取消'],
  [/(轉降|Divert)/i,                  'diverted', '備降'],
];

/* ── 出港 TAT 里程碑 ── */
const MILESTONES = [
  { key:'open',  label:'報到開始', offset:-180 },
  { key:'close', label:'報到截止', offset:-45  },
  { key:'board', label:'登機開始', offset:-40  },
  { key:'gate',  label:'關閉艙門', offset:-15  },
  { key:'std',   label:'起飛',     offset:0    },
];

/* ── Tab 順序（用於判斷滑動方向） ── */
const TAB_ORDER  = { arr: 0, dep: 1, all: 2 };
const TAB_PANELS = { arr: 'listArr', dep: 'listDep', all: 'panelAll' };

let _arrData = [], _depData = [], _allArr = [], _allDep = [];
let _fltDataMap = {};   // fltKey → flight object, for detail sheet lookup
let _leafletMap = null; // active Leaflet map instance
let _tab = 'arr';
let _searchTimer  = null;
let _prevGates    = {};
let _gateChanges  = {};
let _prevAcTypes  = {};
let _acTypeChanges = {};
let _initialLoad  = true;   // 只有第一次載入才做錯排動畫
let _airlineMap   = {};     // {code → {zh, en}}  由 API 填入
let _airportMap   = {};     // {iata → {zh, en, ap_zh}}  由 API 填入

/* ── 監控航空公司偏好（localStorage 持久化） ── */
const _DEFAULT_CODES = ['AK','FD','QZ','Z2','XT','D7','XJ'];
let _watchCodes = new Set(
  JSON.parse(localStorage.getItem('tias_watch_codes') || 'null') || _DEFAULT_CODES
);

function _saveWatchCodes() {
  localStorage.setItem('tias_watch_codes', JSON.stringify([..._watchCodes]));
}

/* ── Codeshare 合併 ─────────────────────────────────────────────────
   條件：相同 [表訂時間 | 登機門 | 對向機場]，且登機門不為空。
   回傳新陣列；合併後的主物件多一個 _codeshares: [{AirlineID, FlightNumber}]。 */
function mergeCodeshares(flights, dir) {
  const groups = new Map();
  const order  = [];
  flights.forEach(f => {
    const sch  = (dir === 'arr' ? f.ScheduleArrivalTime    : f.ScheduleDepartureTime) || '';
    const gate = (f.Gate || (dir === 'arr' ? f.ArrivalGate : f.DepartureGate) || '').trim();
    const ap   = (dir === 'arr' ? f.DepartureAirportID     : f.ArrivalAirportID    || '').trim();
    if (!gate) { order.push([null, f]); return; }          // 無登機門 → 不合併
    const key = `${sch}|${gate}|${ap}`;
    if (!groups.has(key)) { groups.set(key, []); order.push([key, null]); }
    groups.get(key).push(f);
  });
  const result = [];
  const seen   = new Set();
  order.forEach(([key, lone]) => {
    if (lone) { result.push(lone); return; }
    if (seen.has(key)) return;
    seen.add(key);
    const group = groups.get(key);
    if (group.length === 1) { result.push(group[0]); return; }
    const base = { ...group[0] };
    base._codeshares = group.map(g => ({ AirlineID: g.AirlineID, FlightNumber: g.FlightNumber }));
    result.push(base);
  });
  return result;
}

function applyWatchFilter() {
  const watched = f => f._codeshares
    ? f._codeshares.some(c => _watchCodes.has(c.AirlineID))
    : _watchCodes.has(f.AirlineID);
  _arrData = _allArr.filter(watched);
  _depData = _allDep.filter(watched);
}

function _buildListWithNow(flights, dir, emptyIcon, emptyMsg) {
  if (!flights.length)
    return `<div class="empty"><span class="empty-icon">${emptyIcon}</span>${emptyMsg}</div>`;

  const now    = new Date();
  const nowStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  const nowDivHtml = `<div class="now-divider" id="nowDivider-${dir}">
    <span class="now-line"></span>
    <span class="now-label">▶ 現在 ${nowStr}</span>
    <span class="now-line"></span>
  </div>`;

  /* 依表訂時間排序 */
  const sorted = [...flights].sort((a, b) => {
    const ta = (dir === 'arr' ? a.ScheduleArrivalTime : a.ScheduleDepartureTime) || '';
    const tb = (dir === 'arr' ? b.ScheduleArrivalTime : b.ScheduleDepartureTime) || '';
    return ta.localeCompare(tb);
  });

  let html = '';
  let inserted = false;
  for (const f of sorted) {
    const iso = (dir === 'arr' ? f.ScheduleArrivalTime : f.ScheduleDepartureTime) || '';
    if (!inserted && iso && new Date(iso) > now) {
      html += nowDivHtml;
      inserted = true;
    }
    html += renderCard(f, dir);
  }
  if (!inserted) html += nowDivHtml;
  return html;
}

function renderWatchTabs() {
  const arrEl = document.getElementById('listArr');
  arrEl.innerHTML = _buildListWithNow(_arrData, 'arr', '<i class="bi bi-arrow-bar-down"></i>', '目前監控的航空公司無抵達班機');
  if (_arrData.length && _initialLoad) staggerCards(arrEl);

  const depEl = document.getElementById('listDep');
  depEl.innerHTML = _buildListWithNow(_depData, 'dep', '<i class="bi bi-arrow-bar-up"></i>', '目前監控的航空公司無出發班機');
  if (_depData.length && _initialLoad) staggerCards(depEl);

  /* 只在初次載入時自動捲動到「現在」分隔線，避免 30 秒輪詢把使用者強制捲回 */
  if (_initialLoad) {
    setTimeout(() => {
      const divId = _tab === 'dep' ? 'nowDivider-dep' : 'nowDivider-arr';
      const el = document.getElementById(divId);
      if (!el) return;
      try {
        const top = el.getBoundingClientRect().top + window.pageYOffset - 60;
        window.scrollTo({ top: Math.max(0, top) });
      } catch (_) { el.scrollIntoView(); }
    }, 200);
  }
}

/* ── 選擇器 ── */
function openAirlinePicker() {
  const sheet = document.getElementById('airlinePicker');
  sheet.style.display = '';
  renderPickerList();
  requestAnimationFrame(() => sheet.classList.add('picker-open'));
}

function closeAirlinePicker() {
  const sheet = document.getElementById('airlinePicker');
  sheet.classList.remove('picker-open');
  setTimeout(() => { sheet.style.display = 'none'; }, 320);
  _saveWatchCodes();
  applyWatchFilter();
  renderWatchTabs();
  renderAirlineHint();
  if (_tab === 'all') runSearch();
}

function renderPickerList() {
  const listEl = document.getElementById('pickerList');
  const allCodes = new Map();
  [..._allArr, ..._allDep].forEach(f => {
    if (f.AirlineID && !allCodes.has(f.AirlineID)) {
      const m = _airlineMap[f.AirlineID] || {};
      allCodes.set(f.AirlineID, m.zh || m.en || f.AirlineID);
    }
  });

  if (!allCodes.size) {
    listEl.innerHTML = '<div style="padding:24px;color:#aeaeb2;text-align:center">請先載入航班資料</div>';
    return;
  }

  const sorted = [...allCodes.entries()].sort((a, b) => a[0].localeCompare(b[0]));
  listEl.innerHTML = sorted.map(([code, name]) => `
    <label class="picker-item${_watchCodes.has(code) ? ' picker-checked' : ''}">
      <input type="checkbox" ${_watchCodes.has(code) ? 'checked' : ''}
        onchange="toggleWatchCode('${code}',this.checked,this.closest('label'))">
      <img class="picker-logo"
        src="https://www.gstatic.com/flights/airline_logos/70px/${code}.png"
        alt="${code}" loading="lazy"
        onerror="this.style.display='none'">
      <span class="picker-code">${code}</span>
      <span class="picker-name">${name}</span>
      <span class="picker-check"><i class="bi bi-check-lg"></i></span>
    </label>
  `).join('');
}

function toggleWatchCode(code, checked, el) {
  if (checked) _watchCodes.add(code); else _watchCodes.delete(code);
  el.classList.toggle('picker-checked', checked);
}

/* ── 工具 ── */
function fmtHHMM(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return '—';
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function delayMin(schIso, estIso) {
  if (!schIso || !estIso) return 0;
  return Math.round((new Date(estIso) - new Date(schIso)) / 60000);
}

function parseStatus(remark) {
  if (!remark) return { cls:'unknown', label:'—' };
  const txt = typeof remark === 'object'
    ? (remark.Zh_tw || remark.En || '')
    : String(remark);
  for (const [re, cls, label] of ST_MAP) {
    if (re.test(txt)) return { cls, label: txt.length <= 8 ? txt : label };
  }
  return { cls:'unknown', label: txt.slice(0,6) || '—' };
}

/* ── 時間欄位 ── */
function buildTimeHtml(label, schIso, estIso, actIso) {
  const dm = delayMin(schIso, estIso);
  const isDelayed = !actIso && estIso && dm >= 5;
  const isEarly   = !actIso && estIso && dm <= -3;

  let subHtml = '';
  if (actIso) {
    subHtml = `<span class="time-act-lbl">實際</span><span class="time-act">${fmtHHMM(actIso)}</span>`;
  } else if (isDelayed) {
    subHtml = `<span class="time-arrow">→</span><span class="time-est">${fmtHHMM(estIso)}</span><span class="delay-chip">+${dm}m</span>`;
  } else if (isEarly) {
    subHtml = `<span class="time-arrow">→</span><span class="time-est" style="color:#15803d">${fmtHHMM(estIso)}</span><span class="delay-chip" style="color:#065f46;background:#d1fae5">${dm}m</span>`;
  }

  return `<div class="card-time">
    <span class="time-lbl">${label}</span>
    <span class="time-sch ${isDelayed ? 'through' : ''}">${fmtHHMM(schIso)}</span>
    ${subHtml}
  </div>`;
}

/* ── 資源大格 ── */
function buildResBlock(icon, label, value, highlight, prevValue) {
  const hasVal     = !!(value && value.trim());
  const hasChanged = prevValue && hasVal && prevValue !== value;
  const blockCls   = hasChanged
    ? 'res-block res-gate-changed'
    : (highlight && hasVal ? 'res-block res-highlighted' : 'res-block');

  let valHtml;
  if (hasChanged) {
    valHtml = `<div class="res-changed">
      <span class="res-prev">${prevValue}</span>
      <span class="res-chg-arrow">→</span>
      <span class="res-new">${value}</span>
    </div>`;
  } else {
    const valCls = hasVal ? (value.length > 5 ? 'res-val res-val-sm' : 'res-val') : 'res-val tba';
    valHtml = `<div class="${valCls}">${hasVal ? value : '待定'}</div>`;
  }

  return `<div class="${blockCls}">
    <div class="res-icon-lbl">${label}</div>
    ${valHtml}
  </div>`;
}

/* ── TAT 里程碑 ── */
function buildTAT(stdIso, etdIso) {
  const ref = etdIso || stdIso;
  if (!ref) return '';
  const std = new Date(ref);
  const now = new Date();
  const nowMins = (now - std) / 60000;
  const ms = MILESTONES.map(m => ({
    ...m, time: new Date(std.getTime() + m.offset * 60000),
    isPast: m.offset <= nowMins,
  }));
  const nextMs = ms.find(m => m.offset > nowMins);

  let headTxt = '', headCls = '';
  if (!nextMs) {
    headTxt = `已出發 ${Math.round(nowMins)} 分鐘前`;
  } else {
    const remain = Math.round(nextMs.offset - nowMins);
    if (remain <= 5)       { headTxt = `${nextMs.label} 即將到達！剩 ${remain} 分`; headCls = 'phase-urgent'; }
    else if (remain <= 20) { headTxt = `距${nextMs.label} ${remain} 分鐘`; headCls = 'phase-soon'; }
    else if (remain < 60)  { headTxt = `距${nextMs.label} ${remain} 分鐘`; headCls = 'phase-ok'; }
    else {
      const h = Math.floor(remain / 60), m = remain % 60;
      headTxt = `距${nextMs.label} ${h}h${m ? ' ' + m + 'm' : ''}`;
      headCls = 'phase-ok';
    }
  }

  const rows = ms.map(m => {
    const remain = Math.round(m.offset - nowMins);
    let rowCls = 'ms-future', countdown = '';
    if (m.isPast) rowCls = 'ms-done';
    else if (m === nextMs) {
      rowCls = remain <= 5 ? 'ms-urgent' : remain <= 20 ? 'ms-next' : 'ms-now';
      countdown = remain <= 0 ? '時間到' : remain < 60 ? `${remain}m` : `${Math.floor(remain/60)}h${remain % 60 || ''}`;
    }
    return `<div class="ms-row ${rowCls}">
      <div class="ms-dot"></div>
      <div class="ms-time">${fmtHHMM(m.time.toISOString())}</div>
      <div class="ms-label">${m.label}</div>
      ${countdown ? `<div class="ms-countdown">${countdown}</div>` : ''}
    </div>`;
  }).join('');

  return `<div class="tat-wrap">
    <div class="tat-headline"><div class="tat-next ${headCls}">${headTxt}</div></div>
    <div class="ms-list">${rows}</div>
  </div>`;
}

/* ── 航班卡片 ── */
function renderCard(f, mode, showDirBadge) {
  const isArr = mode === 'arr';

  const shares    = f._codeshares || null;
  const airline   = shares ? shares.map(c => c.AirlineID).join('/') : (f.AirlineID || '??');
  const fltNum    = shares ? shares.map(c => c.FlightNumber).join(' / ') : (f.FlightNumber || '—');
  const counterAp = isArr ? (f.DepartureAirportID || '') : (f.ArrivalAirportID || '');
  const cityName  = (_airportMap[counterAp] || {}).zh || AP_ZH[counterAp] || counterAp || '—';

  const sch = isArr ? f.ScheduleArrivalTime    : f.ScheduleDepartureTime;
  const est = isArr ? (f.EstimatedArrivalTime  || f.EstimateArrivalTime)
                    : (f.EstimatedDepartureTime || f.EstimateDepartureTime);
  const act = isArr ? f.ActualArrivalTime       : f.ActualDepartureTime;

  const gate    = f.Gate || (isArr ? f.ArrivalGate    : f.DepartureGate) || '';
  const baggage = f.BaggageClaim  || f.BaggageClaimBelt || '';
  const counter = f.CheckCounter  || f.CheckInCounter  || f.CheckInArea  || '';
  const terminal = f.Terminal     || f.ArrivalTerminal || f.DepartureTerminal || '';
  const acType  = f.AcType || '';
  const status  = parseStatus(
    (isArr ? f.ArrivalRemark : f.DepartureRemark) || f.Remark || f.FlightStatus || ''
  );

  const dm = delayMin(sch, est);
  const isDelayed  = !act && est && dm >= 5;
  const isDone     = !!act;
  const isDiverted = status.cls === 'diverted';

  const cardCls = [
    'card',
    isDiverted              ? 'card-diverted' : '',
    !isDiverted && isDelayed ? 'card-delayed'  : '',
    isDone                  ? 'card-done'      : '',
  ].filter(Boolean).join(' ');

  const airlineCN = shares
    ? shares.map(c => (_airlineMap[c.AirlineID] || {}).zh || '').filter(Boolean).join(' / ')
    : ((_airlineMap[f.AirlineID] || {}).zh || '');
  const airlineBadges = shares
    ? shares.map(c => `<span class="badge-airline">${c.AirlineID}</span>`).join('')
    : `<span class="badge-airline">${f.AirlineID || '??'}</span>`;

  /* ── 航空公司 Logo ── */
  const logoCodes = shares ? shares.map(c => c.AirlineID).filter(Boolean) : [f.AirlineID].filter(Boolean);
  const isMulti   = logoCodes.length > 1;
  const logoImgs  = logoCodes.map(code =>
    `<img class="airline-logo${isMulti ? ' logo-sm' : ''}"
      src="https://www.gstatic.com/flights/airline_logos/70px/${code}.png"
      alt="${code}" loading="lazy"
      onerror="this.style.display='none'">`
  ).join('');
  const logoHtml = logoImgs ? `<div class="airline-logo-wrap">${logoImgs}</div>` : '';
  const dirBadge  = showDirBadge
    ? (isArr ? '<span class="badge-dir-arr">抵達</span>' : '<span class="badge-dir-dep">出發</span>')
    : '';

  const _fltKey   = shares ? shares[0].FlightNumber : fltNum;
  const _detailKey = (_fltKey + '_' + mode).replace(/[\s/]/g, '');
  _fltDataMap[_detailKey] = f;
  const prevGate  = _gateChanges[_fltKey]  ? _gateChanges[_fltKey].from  : undefined;
  const acTypeChg = _acTypeChanges[_fltKey];
  const acTypeBadge = acTypeChg
    ? `<span class="badge-actype badge-actype-changed">${acTypeChg.from} → ${acTypeChg.to}</span>`
    : (acType ? `<span class="badge-actype">${acType}</span>` : '');

  const resGrid = isArr
    ? `<div class="res-grid">
        ${buildResBlock('', '登機門', gate, true, prevGate)}
        ${buildResBlock('', '行李轉盤', baggage, true)}
       </div>`
    : `<div class="res-grid">
        ${buildResBlock('', '登機門', gate, true, prevGate)}
        ${buildResBlock('', '報到櫃檯', counter, true)}
       </div>`;

  const timeHtml  = buildTimeHtml(isArr ? 'STA' : 'STD', sch, est, act);
  const tatHtml   = !isArr ? buildTAT(sch, est) : '';
  const updatedAt = f.UpdateTime ? fmtHHMM(f.UpdateTime) : '';

  return `<div class="${cardCls}" data-fltkey="${_detailKey}">
    <div class="card-meta">
      ${airlineBadges}
      ${dirBadge}
      <span class="badge-status st-${status.cls}">${status.label}</span>
      ${acTypeBadge}
      ${terminal ? `<span class="badge-terminal">T${terminal}</span>` : ''}
    </div>
    <div class="card-hero">
      <div class="hero-left">
        <div class="hero-airline-row">
          ${logoHtml}
          <div>
            ${airlineCN ? `<div class="hero-airline-cn">${airlineCN}</div>` : ''}
            <div class="hero-flt">${fltNum}</div>
          </div>
        </div>
      </div>
      <div class="hero-ap">
        <div class="hero-iata">${counterAp || '—'}</div>
        <div class="hero-city">${cityName}</div>
      </div>
    </div>
    ${timeHtml}
    ${resGrid}
    ${tatHtml}
    ${updatedAt ? `<div class="card-updated">資料更新 ${updatedAt}</div>` : ''}
  </div>`;
}

/* ── 航班詳細資訊：開啟 / 關閉 ── */
let _sheetScrollY = 0;

function _lockBodyScroll() {
  _sheetScrollY = window.scrollY;
  document.body.style.position  = 'fixed';
  document.body.style.top       = `-${_sheetScrollY}px`;
  document.body.style.width     = '100%';
  document.body.style.overflow  = 'hidden';
}
function _unlockBodyScroll() {
  document.body.style.position  = '';
  document.body.style.top       = '';
  document.body.style.width     = '';
  document.body.style.overflow  = '';
  window.scrollTo(0, _sheetScrollY);
}

function closeFlightSheet() {
  document.getElementById('fltOverlay').classList.remove('open');
  document.getElementById('fltSheet').classList.remove('open');
  _unlockBodyScroll();
  if (_leafletMap) { _leafletMap.remove(); _leafletMap = null; }
}

async function openFlightDetail(key) {
  const f = _fltDataMap[key];
  if (!f) return;

  const mode   = key.slice(-3) === 'arr' ? 'arr' : 'dep';
  const isArr  = mode === 'arr';
  const shares = f._codeshares || null;
  const fltNum = shares ? shares.map(c => c.FlightNumber).join(' / ') : (f.FlightNumber || '—');
  /* 組合完整 IATA 呼號，如 AK + 1510 → AK1510 */
  const _primaryAirline = shares ? (shares[0].AirlineID || '') : (f.AirlineID || '');
  const _primaryFltNum  = shares ? (shares[0].FlightNumber || '') : (f.FlightNumber || '');
  const primaryNum = (_primaryAirline + _primaryFltNum).replace(/\s/g, '');
  const airline    = shares
    ? shares.map(c => (_airlineMap[c.AirlineID] || {}).zh || c.AirlineID).filter(Boolean).join(' / ')
    : ((_airlineMap[f.AirlineID] || {}).zh || f.AirlineID || '');
  const counterAp = isArr ? (f.DepartureAirportID || '') : (f.ArrivalAirportID || '');
  const cityName  = (_airportMap[counterAp] || {}).zh || AP_ZH[counterAp] || counterAp || '—';
  const gate      = f.Gate || (isArr ? f.ArrivalGate : f.DepartureGate) || '—';
  const baggage   = f.BaggageClaim  || f.BaggageClaimBelt || '—';
  const counter   = f.CheckCounter  || f.CheckInCounter    || '—';
  const acType    = f.AcType    || '—';
  const terminal  = f.Terminal  || '—';
  const sch = isArr ? f.ScheduleArrivalTime    : f.ScheduleDepartureTime;
  const est = isArr ? (f.EstimatedArrivalTime  || f.EstimateArrivalTime)
                    : (f.EstimatedDepartureTime || f.EstimateDepartureTime);
  const act = isArr ? f.ActualArrivalTime       : f.ActualDepartureTime;

  /* 標題 */
  document.getElementById('fltSheetTitle').textContent = `${fltNum}  ${isArr ? '抵達' : '出發'}`;

  /* 重設狀態 */
  if (_leafletMap) { _leafletMap.remove(); _leafletMap = null; }
  const phEl  = document.getElementById('fltMapPh');
  const mapEl = document.getElementById('fltMap');
  phEl.innerHTML  = '<div class="spin" style="font-size:1.5rem;color:#60a5fa">↻</div><div>正在定位飛機…</div>';
  phEl.style.display  = '';
  mapEl.style.display = 'none';
  document.getElementById('fltLiveSec').style.display = 'none';

  /* 靜態班機資訊 */
  const schLabel = isArr ? '預計抵達' : '預計出發';
  const actLabel = isArr ? '實際抵達' : '實際出發';
  document.getElementById('fltStaticSec').innerHTML = `
    <div class="flt-info-title">班機資訊</div>
    <div class="flt-info-grid">
      <div class="flt-info-cell"><div class="flt-info-label">航空公司</div><div class="flt-info-val">${airline || '—'}</div></div>
      <div class="flt-info-cell"><div class="flt-info-label">${isArr ? '出發地' : '目的地'}</div><div class="flt-info-val">${counterAp} ${cityName}</div></div>
      <div class="flt-info-cell"><div class="flt-info-label">${schLabel}</div><div class="flt-info-val">${sch ? fmtHHMM(sch) : '—'}</div></div>
      <div class="flt-info-cell"><div class="flt-info-label">${isArr ? '行李轉盤' : '報到櫃檯'}</div><div class="flt-info-val">${isArr ? baggage : counter}</div></div>
      <div class="flt-info-cell"><div class="flt-info-label">登機門</div><div class="flt-info-val">${gate}</div></div>
      <div class="flt-info-cell"><div class="flt-info-label">機型</div><div class="flt-info-val">${acType}</div></div>
      ${terminal !== '—' ? `<div class="flt-info-cell"><div class="flt-info-label">航廈</div><div class="flt-info-val">T${terminal}</div></div>` : ''}
      ${act ? `<div class="flt-info-cell"><div class="flt-info-label">${actLabel}</div><div class="flt-info-val">${fmtHHMM(act)}</div></div>` : ''}
      ${est && !act ? `<div class="flt-info-cell"><div class="flt-info-label">${schLabel}(更新)</div><div class="flt-info-val">${fmtHHMM(est)}</div></div>` : ''}
    </div>`;

  /* 開啟 sheet */
  document.getElementById('fltOverlay').classList.add('open');
  document.getElementById('fltSheet').classList.add('open');
  _lockBodyScroll();

  /* 已有實際落地/起飛時間 → 不查即時（飛機已停） */
  if (act) {
    phEl.innerHTML = `<i class="bi bi-check-circle-fill" style="font-size:2rem;color:#22c55e"></i><div>${isArr ? '已落地' : '已起飛'}</div>`;
    return;
  }

  /* 取得即時位置 */
  try {
    const res  = await fetch(`/api/flight/live?cs=${encodeURIComponent(primaryNum)}`);
    const live = await res.json();

    if (live.found && live.lat != null && live.lon != null) {
      phEl.style.display  = 'none';
      mapEl.style.display = '';

      requestAnimationFrame(() => {
        _leafletMap = L.map('fltMap', { zoomControl: true, attributionControl: false })
          .setView([live.lat, live.lon], 7);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
          maxZoom: 18, subdomains: 'abcd',
        }).addTo(_leafletMap);

        const heading = live.heading || 0;
        const planeIcon = L.divIcon({
          html: `<div style="transform:rotate(${heading}deg);font-size:30px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))">✈</div>`,
          className: '', iconSize: [34, 34], iconAnchor: [17, 17],
        });
        L.marker([live.lat, live.lon], { icon: planeIcon }).addTo(_leafletMap)
          .bindPopup(`<b>${fltNum}</b>${live.altitude_ft ? '<br>' + live.altitude_ft.toLocaleString() + ' ft' : ''}`).openPopup();
      });

      const speed  = live.ground_speed   != null ? Math.round(live.ground_speed) + ' kt'     : '—';
      const alt    = live.altitude_ft    != null ? live.altitude_ft.toLocaleString() + ' ft'  : '—';
      const hdg    = live.heading        != null ? live.heading + '°'                         : '—';
      const vs     = live.vertical_speed != null
                       ? (live.vertical_speed > 0 ? '+' : '') + Math.round(live.vertical_speed) + ' ft/min'
                       : '—';
      const state  = live.on_ground ? '地面' : '飛行中';
      const reg    = live.registration || live.aircraft_code || live.icao24 || '—';

      document.getElementById('fltLiveGrid').innerHTML = `
        <div class="flt-info-cell"><div class="flt-info-label">狀態</div><div class="flt-info-val">${state}</div></div>
        <div class="flt-info-cell"><div class="flt-info-label">速度</div><div class="flt-info-val">${speed}</div></div>
        <div class="flt-info-cell"><div class="flt-info-label">高度</div><div class="flt-info-val">${alt}</div></div>
        <div class="flt-info-cell"><div class="flt-info-label">航向</div><div class="flt-info-val">${hdg}</div></div>
        <div class="flt-info-cell"><div class="flt-info-label">垂直速率</div><div class="flt-info-val">${vs}</div></div>
        <div class="flt-info-cell"><div class="flt-info-label">機號/呼號</div><div class="flt-info-val">${reg}</div></div>`;
      document.getElementById('fltLiveSec').style.display = '';

    } else {
      phEl.innerHTML = '<i class="bi bi-geo-alt-fill" style="font-size:2rem;color:#c7c7cc"></i><div>目前無即時位置資料</div>';
    }
  } catch (_) {
    phEl.innerHTML = '<i class="bi bi-wifi-off" style="font-size:2rem;color:#c7c7cc"></i><div>無法取得即時資料</div>';
  }
}

/* ── Tab 指示器滑動到目標位置 ── */
function updateTabIndicator(tab) {
  const el  = document.getElementById('tab-' + tab);
  const ind = document.getElementById('tabIndicator');
  if (el && ind) {
    ind.style.left  = el.offsetLeft + 'px';
    ind.style.width = el.offsetWidth + 'px';
  }
}

/* ── Tab 切換（含方向感滑動過場） ── */
function switchTab(tab) {
  if (tab === _tab) return;

  const goRight  = TAB_ORDER[tab] > TAB_ORDER[_tab];
  const outX     = goRight ? '-22px' : '22px';
  const inX      = goRight ?  '22px' : '-22px';

  const outPanel = document.getElementById(TAB_PANELS[_tab]);
  const inPanel  = document.getElementById(TAB_PANELS[tab]);

  /* 立即更新 tab label + 指示線 */
  ['arr','dep','all'].forEach(t =>
    document.getElementById('tab-' + t).classList.toggle('active', t === tab)
  );
  updateTabIndicator(tab);

  /* 舊面板淡出 + 位移（動畫前短暫開啟 will-change） */
  outPanel.style.willChange = 'opacity, transform';
  inPanel.style.willChange  = 'opacity, transform';
  outPanel.style.transition = 'opacity 0.16s ease-in, transform 0.16s ease-in';
  outPanel.style.opacity    = '0';
  outPanel.style.transform  = `translateX(${outX})`;

  setTimeout(() => {
    outPanel.style.display    = 'none';
    outPanel.style.willChange = '';
    outPanel.style.transition = '';
    outPanel.style.opacity    = '';
    outPanel.style.transform  = '';

    /* 離開「全部航班」時立刻清空 DOM，釋放 iOS Safari GPU 記憶體 */
    if (_tab === 'all') {
      document.getElementById('allResults').innerHTML  = '';
      document.getElementById('searchCount').textContent = '';
    }

    /* 新面板從對側滑入 */
    inPanel.style.opacity   = '0';
    inPanel.style.transform = `translateX(${inX})`;
    inPanel.style.display   = '';

    requestAnimationFrame(() => requestAnimationFrame(() => {
      inPanel.style.transition = 'opacity 0.3s cubic-bezier(0.22,1,0.36,1), transform 0.3s cubic-bezier(0.22,1,0.36,1)';
      inPanel.style.opacity    = '1';
      inPanel.style.transform  = 'translateX(0)';
      setTimeout(() => {
        inPanel.style.transition = '';
        inPanel.style.opacity    = '';
        inPanel.style.transform  = '';
        inPanel.style.willChange = '';
      }, 320);
    }));

    _tab = tab;
    document.getElementById('topbarSearch').classList.toggle('show', tab === 'all');
    const hint = document.getElementById('airlineHint');
    if (tab === 'all') {
      hint.textContent = '桃園機場 即時航班';
      setTimeout(runSearch, 320);
    } else {
      renderAirlineHint();
      /* 切換到入港/出港後捲到「現在」分隔線 */
      setTimeout(() => {
        const el = document.getElementById(`nowDivider-${tab}`);
        if (!el) return;
        try {
          const top = el.getBoundingClientRect().top + window.pageYOffset - 60;
          window.scrollTo({ top: Math.max(0, top) });
        } catch (_) { el.scrollIntoView(); }
      }, 400);
    }
  }, 170);
}

function renderAirlineHint() {
  const hint = document.getElementById('airlineHint');
  if (_tab !== 'all') {
    hint.textContent = _watchCodes.size
      ? [..._watchCodes].map(code => {
          const m = _airlineMap[code];
          return m?.zh ? `${m.zh} (${code})` : code;
        }).join(' · ')
      : '未選擇監控航空公司';
  }
}

/* ── 全航班搜尋 ── */
function onSearchInput() {
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(runSearch, 250);
}

function runSearch() {
  const q       = (document.getElementById('searchInput').value || '').trim().toUpperCase();
  const hintEl  = document.getElementById('searchHint');
  const countEl = document.getElementById('searchCount');
  const resEl   = document.getElementById('allResults');

  /* 無關鍵字時顯示全部航班按時間排序 */
  if (!q) {
    renderAllByTime();
    return;
  }

  hintEl.style.display = 'none';

  const allSorted = [
    ..._allArr.map(f => ({ ...f, _dir: 'arr' })),
    ..._allDep.map(f => ({ ...f, _dir: 'dep' })),
  ].sort((a, b) => {
    const ta = (a._dir === 'arr' ? a.ScheduleArrivalTime : a.ScheduleDepartureTime) || '';
    const tb = (b._dir === 'arr' ? b.ScheduleArrivalTime : b.ScheduleDepartureTime) || '';
    return ta.localeCompare(tb);
  });

  const results = allSorted.filter(f => {
    const ap      = (f.DepartureAirportID || f.ArrivalAirportID || '').toUpperCase();
    const gate    = (f.Gate || '').toUpperCase();
    const counter = (f.CheckCounter || f.CheckInCounter || f.CheckInArea || '').toUpperCase();
    const baggage = (f.BaggageClaim || '').toUpperCase();
    const apZh    = (_airportMap[ap] || {}).zh || '';
    /* codeshare：任一班號或航司匹配即算命中 */
    const flightMatches = (f._codeshares || [{ AirlineID: f.AirlineID, FlightNumber: f.FlightNumber }])
      .some(c => {
        const flt     = (c.FlightNumber || '').toUpperCase();
        const fullFlt = ((c.AirlineID || '') + (c.FlightNumber || '')).toUpperCase();
        const al      = (c.AirlineID || '').toUpperCase();
        const alZh    = (_airlineMap[c.AirlineID] || {}).zh || '';
        return fullFlt.includes(q) || flt.includes(q) || al.startsWith(q) || alZh.includes(q);
      });
    return flightMatches
        || ap.startsWith(q) || apZh.includes(q)
        || gate.includes(q) || counter.includes(q) || baggage.includes(q);
  });

  countEl.textContent = results.length ? `共 ${results.length} 班次` : '';
  resEl.innerHTML = results.length
    ? results.map(f => renderCard(f, f._dir, true)).join('')
    : `<div class="empty"><span class="empty-icon"><i class="bi bi-search"></i></span>查無「${q}」相關航班</div>`;
}

/* ── 全航班時間軸視圖 ── */
function renderAllByTime() {
  const hintEl  = document.getElementById('searchHint');
  const countEl = document.getElementById('searchCount');
  const resEl   = document.getElementById('allResults');

  hintEl.style.display = 'none';

  if (!_allArr.length && !_allDep.length) {
    resEl.innerHTML     = '<div class="empty"><span class="empty-icon"><i class="bi bi-airplane"></i></span>暫無航班資料</div>';
    countEl.textContent = '';
    return;
  }

  const now    = new Date();
  const nowStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  const total  = _allArr.length + _allDep.length;

  const allSorted = [
    ..._allArr.map(f => ({ ...f, _dir: 'arr' })),
    ..._allDep.map(f => ({ ...f, _dir: 'dep' })),
  ].sort((a, b) => {
    const ta = (a._dir === 'arr' ? a.ScheduleArrivalTime : a.ScheduleDepartureTime) || '';
    const tb = (b._dir === 'arr' ? b.ScheduleArrivalTime : b.ScheduleDepartureTime) || '';
    return ta.localeCompare(tb);
  });

  /* iOS Safari 記憶體限制：限制同時渲染的卡片數，只顯示 -3h ～ +12h 時間窗口
     搜尋功能仍搜全部（_allArr/_allDep），不受此過濾影響 */
  const winStart = now.getTime() - 3  * 3600 * 1000;
  const winEnd   = now.getTime() + 12 * 3600 * 1000;
  const windowed = allSorted.filter(f => {
    const iso = (f._dir === 'arr' ? f.ScheduleArrivalTime : f.ScheduleDepartureTime) || '';
    if (!iso) return false;
    const ms = new Date(iso).getTime();
    return ms >= winStart && ms <= winEnd;
  });

  countEl.textContent = `${windowed.length} 班次（前後 12h）`;

  const nowDividerHtml = `<div class="now-divider" id="nowDivider">
    <span class="now-line"></span>
    <span class="now-label">▶ 現在 ${nowStr}</span>
    <span class="now-line"></span>
  </div>`;

  let html = '';
  let nowInserted = false;

  for (const f of windowed) {
    const schIso = (f._dir === 'arr' ? f.ScheduleArrivalTime : f.ScheduleDepartureTime) || '';
    if (!nowInserted && schIso && new Date(schIso) > now) {
      html += nowDividerHtml;
      nowInserted = true;
    }
    html += renderCard(f, f._dir, true);
  }

  if (!nowInserted) html += nowDividerHtml;

  resEl.innerHTML = html;

  /* 自動捲動到「現在」分隔線（iOS Safari PWA 用 scrollTo 避免崩潰） */
  setTimeout(() => {
    const el = document.getElementById('nowDivider');
    if (!el) return;
    try {
      const top = el.getBoundingClientRect().top + window.pageYOffset - 60;
      window.scrollTo({ top: Math.max(0, top) });
    } catch (_) {
      el.scrollIntoView();
    }
  }, 200);
}

/* ── 主載入 ── */
async function load() {
  const btn = document.getElementById('refreshBtn');
  btn.innerHTML = '<span class="spin">↻</span>';
  btn.disabled  = true;

  try {
    const _ac  = new AbortController();
    const _tid = setTimeout(() => _ac.abort(), 20000);
    let res;
    try {
      res = await fetch('/api/tias/flights', { signal: _ac.signal });
    } finally {
      clearTimeout(_tid);
    }

    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      if (!data.configured) {
        document.getElementById('errWrap').innerHTML =
          `<div class="error-banner"><i class="bi bi-exclamation-triangle-fill"></i> TDX API 未設定，請確認環境變數 TDX_CLIENT_ID / TDX_CLIENT_SECRET。</div>`;
        document.getElementById('listArr').innerHTML = '';
        document.getElementById('listDep').innerHTML = '';
      } else {
        document.getElementById('errWrap').innerHTML =
          `<div class="error-banner"><i class="bi bi-exclamation-triangle-fill"></i> 航班資料暫時無法取得，自動重試中…</div>`;
        setTimeout(() => load(), 5000);
      }
      return;
    }

    const data = await res.json();

    document.getElementById('errWrap').innerHTML = '';
    document.getElementById('updateLabel').textContent = `更新 ${data.updated_at}`;

    window._airlines = data.airlines  || [];

    /* 更新元資料對照表（只在有資料時覆蓋，避免舊資料被空值清除） */
    if (data.airline_map && Object.keys(data.airline_map).length)
      _airlineMap = data.airline_map;
    if (data.airport_map && Object.keys(data.airport_map).length)
      _airportMap = data.airport_map;

    renderAirlineHint();

    _allArr  = mergeCodeshares(data.all_arrivals   || [], 'arr');
    _allDep  = mergeCodeshares(data.all_departures || [], 'dep');
    applyWatchFilter();

    /* 登機門變更追蹤 */
    const newGates = {};
    [..._allArr, ..._allDep].forEach(f => {
      const g = f.Gate || f.ArrivalGate || f.DepartureGate || '';
      const nums = f._codeshares ? f._codeshares.map(c => c.FlightNumber) : [f.FlightNumber];
      nums.forEach(n => { if (n && g) newGates[n] = g; });
    });
    if (Object.keys(_prevGates).length) {
      _gateChanges = {};
      Object.keys(newGates).forEach(flt => {
        const prev = _prevGates[flt];
        if (prev && prev !== newGates[flt])
          _gateChanges[flt] = { from: prev, to: newGates[flt] };
      });
    }
    _prevGates = newGates;

    /* 機型變更追蹤 */
    const newAcTypes = {};
    [..._allArr, ..._allDep].forEach(f => {
      const nums = f._codeshares ? f._codeshares.map(c => c.FlightNumber) : [f.FlightNumber];
      nums.forEach(n => { if (n && f.AcType) newAcTypes[n] = f.AcType; });
    });
    if (Object.keys(_prevAcTypes).length) {
      _acTypeChanges = {};
      Object.keys(newAcTypes).forEach(flt => {
        const prev = _prevAcTypes[flt];
        if (prev && prev !== newAcTypes[flt])
          _acTypeChanges[flt] = { from: prev, to: newAcTypes[flt] };
      });
    }
    _prevAcTypes = newAcTypes;

    renderWatchTabs();
    _initialLoad = false;

    if (_tab === 'all') runSearch();

  } catch (e) {
    document.getElementById('errWrap').innerHTML =
      `<div class="error-banner"><i class="bi bi-exclamation-triangle-fill"></i> 連線失敗，請稍後再試。</div>`;
  } finally {
    btn.innerHTML = '↻ 重新整理';
    btn.disabled  = false;
  }
}

/* ── 自動輪詢管理：頁面隱藏時暫停，避免背景佔用流量與電池 ── */
let _loadTimer = null;

function _startAutoLoad() {
  clearInterval(_loadTimer);
  _loadTimer = setInterval(load, 30000);
}
function _stopAutoLoad() {
  clearInterval(_loadTimer);
  _loadTimer = null;
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    _stopAutoLoad();
  } else {
    load();
    _startAutoLoad();
  }
});

load();
_startAutoLoad();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');

/* 等 layout 完成後定位指示線 */
requestAnimationFrame(() => updateTabIndicator('arr'));

/* ── bfcache 恢復：重播 body 入場動畫 + 重排卡片動畫 ── */
window.addEventListener('pageshow', e => {
  if (!e.persisted) return;

  /* 清除任何殘留的 inline opacity / transform / transition */
  document.body.style.opacity    = '';
  document.body.style.transform  = '';
  document.body.style.transition = '';

  /* 重播 body 入場動畫 */
  document.body.style.animationName = 'none';
  void document.body.offsetWidth;
  document.body.style.animationName = '';

  /* bfcache 恢復：重啟自動輪詢並立即更新一次 */
  load();
  _startAutoLoad();

  /* 重播現有卡片錯排 */
  const arrEl = document.getElementById('listArr');
  const depEl = document.getElementById('listDep');
  const allCards = [
    ...arrEl.querySelectorAll('.card'),
    ...depEl.querySelectorAll('.card'),
  ];
  allCards.forEach(c => { c.classList.remove('card-anim'); c.style.animationDelay = ''; });
  void arrEl.offsetWidth; /* 單次 reflow */
  arrEl.querySelectorAll('.card').forEach((c, i) => {
    c.style.animationDelay = Math.min(i * 42, 360) + 'ms';
    c.classList.add('card-anim');
  });
  depEl.querySelectorAll('.card').forEach((c, i) => {
    c.style.animationDelay = Math.min(i * 42, 360) + 'ms';
    c.classList.add('card-anim');
  });

  /* 指示線重新定位 */
  requestAnimationFrame(() => updateTabIndicator(_tab));
});
/* ── 防縮放（iOS 雙保險） ── */
document.addEventListener("touchmove", function(e) {
  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });
let _lastTap = 0;
document.addEventListener("touchend", function(e) {
  const now = Date.now();
  if (now - _lastTap < 300) e.preventDefault();
  _lastTap = now;
}, { passive: false });
</script>
