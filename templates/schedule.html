<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>週班表 – 交通助理</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --green:  #059669;
  --green2: #10b981;
  --gl:     #d1fae5;
  --teal:   #0d9488;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f2f2f7;
  color: #1c1c1e;
  min-height: 100vh;
}

/* ── Top bar ── */
.topbar {
  background: #fff;
  border-bottom: 1px solid #e5e5ea;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.back-link {
  font-size: 0.9rem;
  color: var(--green);
  text-decoration: none;
  font-weight: 600;
}
.topbar-title {
  font-weight: 700;
  font-size: 1rem;
}
.toggle-wrap {
  display: flex;
  background: #f2f2f7;
  border-radius: 8px;
  padding: 2px;
  gap: 2px;
}
.toggle-btn {
  font-size: 0.72rem;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  background: transparent;
  color: #8e8e93;
  transition: all 0.15s;
}
.toggle-btn.active {
  background: #fff;
  color: var(--green);
  box-shadow: 0 1px 4px rgba(0,0,0,0.1);
}

/* ── Main layout ── */
.main {
  padding: 12px 16px 80px;
  max-width: 540px;
  margin: 0 auto;
}
.summary {
  font-size: 0.78rem;
  color: #8e8e93;
  text-align: center;
  margin-bottom: 14px;
}

/* ── Day card ── */
.day-card {
  background: #fff;
  border-radius: 18px;
  border: 1.5px solid #e5e5ea;
  padding: 16px;
  margin-bottom: 12px;
}
.day-card.today    { border-color: var(--green); }
.day-card.peak-high { border-color: #ef4444; }
.day-card.peak-mid  { border-color: #f59e0b; }

.day-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.day-info {
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.day-name {
  font-size: 1.05rem;
  font-weight: 700;
}
.day-date {
  font-size: 0.78rem;
  color: #8e8e93;
}
.badges { display: flex; gap: 4px; }

.badge {
  display: inline-block;
  font-size: 0.68rem;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 20px;
}
.badge-today { background: var(--gl); color: #065f46; }
.badge-high  { background: #fee2e2; color: #b91c1c; }
.badge-mid   { background: #fef3c7; color: #92400e; }

/* ── Flight counts row ── */
.counts-row {
  display: flex;
  align-items: flex-end;
  gap: 0;
  margin-bottom: 14px;
}
.count-item {
  flex: 1;
  text-align: center;
}
.count-divider {
  width: 1px;
  height: 36px;
  background: #e5e5ea;
  flex-shrink: 0;
  margin-bottom: 14px;
}
.count-num {
  font-size: 2rem;
  font-weight: 800;
  line-height: 1;
  letter-spacing: -1px;
}
.count-label {
  font-size: 0.65rem;
  color: #8e8e93;
  margin-top: 3px;
}
.count-item.dep .count-num   { color: var(--green); }
.count-item.arr .count-num   { color: var(--teal); }
.count-item.total .count-num { color: #1c1c1e; }

/* ── Hour bar chart ── */
.chart-wrap { position: relative; }
.hour-chart {
  display: flex;
  align-items: flex-end;
  height: 52px;
  gap: 1px;
}
.hour-col {
  flex: 1;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  gap: 0;
}
.bar-dep {
  background: var(--green);
  border-radius: 1px 1px 0 0;
  min-height: 0;
}
.bar-arr {
  background: var(--teal);
  opacity: 0.55;
  border-radius: 1px 1px 0 0;
  min-height: 0;
}
.hour-axis {
  display: flex;
  gap: 1px;
  margin-top: 3px;
}
.hour-tick {
  flex: 1;
  font-size: 0.44rem;
  color: #c7c7cc;
  text-align: center;
}
.chart-legend {
  display: flex;
  gap: 12px;
  margin-top: 6px;
  font-size: 0.68rem;
  color: #636366;
}
.leg-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  vertical-align: middle;
  margin-right: 3px;
}

/* ── States ── */
.spinner {
  display: flex;
  justify-content: center;
  padding: 60px 0;
}
.spinner::after {
  content: '';
  width: 28px;
  height: 28px;
  border: 3px solid #e5e5ea;
  border-top-color: var(--green);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.no-data {
  text-align: center;
  color: #c7c7cc;
  font-size: 0.85rem;
  padding: 40px 0;
}
.footer {
  text-align: center;
  font-size: 0.68rem;
  color: #c7c7cc;
  margin-top: 6px;
}
</style>
</head>
<body>

<div class="topbar">
  <a href="/" class="back-link">‹ 返回</a>
  <span class="topbar-title">週班表</span>
  <div class="toggle-wrap">
    <button class="toggle-btn active" id="btn-aa" onclick="setFilter(1)">AirAsia</button>
    <button class="toggle-btn"        id="btn-all" onclick="setFilter(0)">全部</button>
  </div>
</div>

<div class="main">
  <div class="summary" id="summary">載入中…</div>
  <div id="cards"><div class="spinner"></div></div>
  <div class="footer" id="footer"></div>
</div>

<script>
let _filter = 1;

function setFilter(v) {
  _filter = v;
  document.getElementById('btn-aa').classList.toggle('active', v === 1);
  document.getElementById('btn-all').classList.toggle('active', v === 0);
  load();
}

async function load() {
  document.getElementById('cards').innerHTML = '<div class="spinner"></div>';
  try {
    const r = await fetch('/api/schedule/week?airasia=' + _filter);
    if (!r.ok) throw new Error(r.status);
    render(await r.json());
  } catch(e) {
    document.getElementById('cards').innerHTML =
      '<div class="no-data">載入失敗，請確認 TDX 設定後重試</div>';
  }
}

function render(d) {
  if (!d.configured) {
    document.getElementById('cards').innerHTML =
      '<div class="no-data">TDX API 尚未設定</div>';
    return;
  }

  // Global max across all days + all hours for bar normalization
  let gMax = 0;
  for (const day of d.days) {
    for (let h = 0; h < 24; h++) {
      const v = (day.dep_hours[h] || 0) + (day.arr_hours[h] || 0);
      if (v > gMax) gMax = v;
    }
  }

  const label = d.airasia_only ? 'AirAsia 集團' : '全部航空';
  document.getElementById('summary').textContent =
    `${label} · 出發 ${d.total_dep} 個路線 · 抵達 ${d.total_arr} 個路線`;

  const CHART_H = 52;

  let html = '';
  for (const day of d.days) {
    const cls = ['day-card'];
    if (day.is_today)        cls.push('today');
    if (day.peak === 'high') cls.push('peak-high');
    else if (day.peak === 'mid') cls.push('peak-mid');

    let badges = '';
    if (day.is_today) badges += '<span class="badge badge-today">今天</span>';
    if (day.peak === 'high') badges += '<span class="badge badge-high">大流量</span>';
    else if (day.peak === 'mid') badges += '<span class="badge badge-mid">略忙</span>';

    // MM/DD display
    const dt   = new Date(day.date + 'T00:00:00');
    const mmdd = `${dt.getMonth()+1}/${dt.getDate()}`;

    // Build 24 bar columns
    let bars = '';
    let ticks = '';
    for (let h = 0; h < 24; h++) {
      const dep = day.dep_hours[h] || 0;
      const arr = day.arr_hours[h] || 0;
      const depH = gMax > 0 ? Math.round(dep / gMax * CHART_H) : 0;
      const arrH = gMax > 0 ? Math.round(arr / gMax * CHART_H) : 0;
      bars += `<div class="hour-col" title="${h}:00  出發${dep} 抵達${arr}">` +
              `<div class="bar-arr" style="height:${arrH}px"></div>` +
              `<div class="bar-dep" style="height:${depH}px"></div>` +
              `</div>`;
      ticks += `<div class="hour-tick">${[0,6,12,18].includes(h) ? h : ''}</div>`;
    }

    html += `
<div class="${cls.join(' ')}">
  <div class="day-header">
    <div class="day-info">
      <span class="day-name">週${day.weekday_zh}</span>
      <span class="day-date">${mmdd}</span>
    </div>
    <div class="badges">${badges}</div>
  </div>
  <div class="counts-row">
    <div class="count-item dep">
      <div class="count-num">${day.dep_count}</div>
      <div class="count-label">出發班次</div>
    </div>
    <div class="count-divider"></div>
    <div class="count-item arr">
      <div class="count-num">${day.arr_count}</div>
      <div class="count-label">抵達班次</div>
    </div>
    <div class="count-divider"></div>
    <div class="count-item total">
      <div class="count-num">${day.total}</div>
      <div class="count-label">合計</div>
    </div>
  </div>
  <div class="chart-wrap">
    <div class="hour-chart">${bars}</div>
    <div class="hour-axis">${ticks}</div>
    <div class="chart-legend">
      <span><span class="leg-dot" style="background:var(--green)"></span>出發</span>
      <span><span class="leg-dot" style="background:var(--teal);opacity:0.55"></span>抵達</span>
      <span style="margin-left:auto;color:#c7c7cc">懸停可見詳情</span>
    </div>
  </div>
</div>`;
  }

  document.getElementById('cards').innerHTML =
    html || '<div class="no-data">目前無班表資料</div>';
  document.getElementById('footer').textContent = '資料更新：' + d.updated_at + '（每小時快取）';
}

load();
</script>
</body>
</html>
