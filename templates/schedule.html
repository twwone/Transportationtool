<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>我的班表</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overscroll-behavior: none; }

:root {
  --bg:      #fbfbfd;
  --surface: #ffffff;
  --border:  rgba(0,0,0,0.08);
  --divider: rgba(0,0,0,0.09);
  --text:    #1d1d1f;
  --sub:     #86868b;
  --accent:  #0071e3;
  --acc2:    rgba(0,113,227,0.08);
  --radius-l: 20px;
  --radius-m: 14px;

  /* transitions.dev motion tokens: error-shake + success-check */
  --shake-distance: 6px;
  --shake-overshoot: 4px;
  --shake-dur-a: 80ms;
  --shake-dur-b: 60ms;
  --shake-ease: cubic-bezier(0.22, 1, 0.36, 1);
  --revert-hold: 900ms;
  --check-opacity-dur: 500ms;
  --check-rotate-dur: 500ms;
  --check-rotate-from: 80deg;
  --check-bob-dur: 500ms;
  --check-y-amount: 24px;
  --check-blur-dur: 500ms;
  --check-blur-from: 10px;
  --check-path-dur: 400ms;
  --check-path-delay: 80ms;
  --check-ease-bob: cubic-bezier(0.34, 1.35, 0.64, 1);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:      #000;
    --surface: #1c1c1e;
    --border:  rgba(255,255,255,0.09);
    --divider: rgba(255,255,255,0.12);
    --text:    #f5f5f7;
    --sub:     #86868b;
    --accent:  #2997ff;
    --acc2:    rgba(41,151,255,0.12);
  }
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100%;
}

/* ── Topbar ── */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: max(14px, env(safe-area-inset-top) + 10px) 20px 12px;
  background: rgba(251,251,253,0.9);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--divider);
}
@media (prefers-color-scheme: dark) {
  .topbar { background: rgba(0,0,0,0.9); }
}
.back-link {
  font-size: 0.88rem; font-weight: 600;
  color: var(--accent); text-decoration: none;
  -webkit-tap-highlight-color: transparent;
  display: inline-block;
  transition: transform 0.15s cubic-bezier(0.25,1,0.5,1), opacity 0.15s ease;
}
.back-link:active { transform: scale(0.93); opacity: 0.6; }
.topbar-title { font-size: 1rem; font-weight: 700; color: var(--text); letter-spacing: -0.02em; }

/* ── Main ── */
main {
  padding-top: calc(max(14px, env(safe-area-inset-top) + 10px) + 44px + 16px);
  padding-bottom: max(40px, env(safe-area-inset-bottom) + 24px);
  padding-left: 14px; padding-right: 14px;
}

.month-nav-row {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px;
}
.month-nav-btn {
  width: 34px; height: 34px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--surface);
  color: var(--accent); font-size: 1.2rem; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  flex-shrink: 0;
}
.month-nav-btn:active { opacity: 0.6; }
.month-nav-btn:disabled { opacity: 0.2; pointer-events: none; }
.month-title { flex: 1; text-align: center; }
.month-header {
  font-size: 1.9rem; font-weight: 700;
  letter-spacing: -0.03em; color: var(--text);
  margin-bottom: 3px;
}
.month-sub {
  font-size: 0.8rem; font-weight: 590; color: var(--sub);
  margin-bottom: 14px; letter-spacing: -0.01em;
}

/* ── Calendar ── */
.cal-dow-row {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin-bottom: 5px;
}
.cal-dow {
  text-align: center;
  font-size: 0.66rem; font-weight: 600;
  color: var(--sub); letter-spacing: 0.04em;
  padding: 2px 0;
}
.cal-dow.wknd { color: var(--accent); }

.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 5px;
}

.cal-cell {
  aspect-ratio: 1 / 1.22;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  /* 上下留多一點呼吸空間，左右盡量窄——7 欄擠在窄螢幕上，
     橫向才是真正吃緊的地方（班別代碼要塞 4 個字元）。 */
  padding: 8px 2px 8px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  position: relative;
  overflow: hidden;
  transition: opacity 0.12s;
}
.cal-cell:active { opacity: 0.65; }
.cal-cell.empty {
  background: transparent; border-color: transparent;
  pointer-events: none;
}
.cal-cell.today {
  border-color: var(--accent);
  box-shadow: 0 0 0 1.5px var(--accent);
  background: var(--acc2);
}
.cal-cell.is-off { opacity: 0.5; }
.cal-cell.modified::after {
  content: '';
  position: absolute; top: 4px; right: 4px;
  width: 5px; height: 5px; border-radius: 50%;
  background: #f59e0b;
}

.cal-day-num {
  font-size: 0.98rem; font-weight: 700;
  color: var(--text); align-self: flex-start;
  padding-left: 3px; line-height: 1;
}
.cal-day-num.wknd { color: var(--accent); }

.cal-shift {
  margin-top: auto;
  text-align: center;
  width: 100%;
  padding: 0;
}
.cal-badge {
  font-family: "SF Mono","Menlo","Courier New", monospace;
  font-size: 0.6rem; font-weight: 800;
  color: var(--accent); background: var(--acc2);
  padding: 2px 1px; border-radius: 5px;
  letter-spacing: -0.02em;
  display: block;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.cal-time {
  font-size: 0.62rem; font-weight: 600;
  color: var(--sub); margin-top: 2px;
  letter-spacing: -0.3px;
}
.cal-off-label {
  font-size: 0.74rem; font-weight: 600;
  color: var(--sub);
}
.cal-class-label {
  font-size: 0.74rem; font-weight: 700;
  color: #2563eb;
}
@media (prefers-color-scheme: dark) {
  .cal-class-label { color: #93c5fd; }
}

/* ── Edit Sheet ── */
.sheet-overlay {
  display: none;
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.45);
  -webkit-backdrop-filter: blur(3px);
  backdrop-filter: blur(3px);
}
.sheet-overlay.open { display: block; }

.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 201;
  background: var(--surface);
  border-radius: 24px 24px 0 0;
  padding: 16px 20px max(24px, env(safe-area-inset-bottom) + 16px);
  transform: translateY(100%);
  transition: transform 0.28s cubic-bezier(0.32,0.72,0,1);
  will-change: transform;
}
.sheet.open { transform: translateY(0); }

.sheet-handle {
  width: 36px; height: 4px; border-radius: 2px;
  background: var(--border); margin: 0 auto 16px;
}
.sheet-title {
  font-size: 1.15rem; font-weight: 700; letter-spacing: -0.02em;
  color: var(--text); margin-bottom: 3px;
}
.sheet-current {
  display: inline-block;
  font-size: 0.78rem; font-weight: 500; color: var(--sub);
  margin-bottom: 18px; min-height: 1.1em;
  background: var(--acc2); border-radius: 100px;
  padding: 6px 12px;
}
.sheet-current:empty { display: none; padding: 0; margin-bottom: 0; }
.sheet-current b { color: var(--accent); font-weight: 700; }

.input-label {
  font-size: 0.75rem; font-weight: 600;
  color: var(--sub); margin-bottom: 6px;
}
.sheet-input {
  width: 100%;
  font-family: "SF Mono","Menlo","Courier New", monospace;
  font-size: 1.15rem; font-weight: 700;
  color: var(--text); background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
  outline: none;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-bottom: 12px;
}
.sheet-input:focus { border-color: var(--accent); }

.quick-row {
  display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap;
}
.quick-btn {
  padding: 7px 14px; border-radius: 20px;
  font-size: 0.82rem; font-weight: 700;
  background: var(--acc2); color: var(--accent);
  border: 1px solid var(--border);
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.quick-btn:active { opacity: 0.65; }

.sheet-actions {
  display: flex; gap: 10px; align-items: stretch;
}
.btn-confirm {
  flex: 1; padding: 14px;
  background: var(--accent); color: #fff;
  border: none; border-radius: 16px;
  font-size: 1rem; font-weight: 700;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.btn-confirm:active { opacity: 0.8; }
.btn-confirm:disabled { opacity: 0.35; pointer-events: none; }
.btn-danger {
  flex: 1; padding: 14px;
  background: #dc2626; color: #fff;
  border: none; border-radius: 16px;
  font-size: 1rem; font-weight: 700;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.btn-danger:active { opacity: 0.8; }
.btn-danger:disabled { opacity: 0.35; pointer-events: none; }
.del-warning {
  font-size: 0.82rem; font-weight: 600; color: #dc2626;
  margin-bottom: 16px; line-height: 1.5;
}
.del-keyword {
  font-family: "SF Mono","Menlo","Courier New", monospace;
  font-size: 0.95rem; font-weight: 700; color: var(--text);
  background: var(--bg); border: 1px dashed var(--border);
  border-radius: 10px; padding: 8px 12px;
  margin-bottom: 10px; user-select: all;
}

/* 輸入錯誤關鍵字時的 shake 回饋（transitions.dev: error-state-shake） */
#del-input { transition: border-color 150ms ease-out; will-change: transform; }
#del-input.is-error { border-color: #dc2626 !important; transition: border-color 280ms ease-out; }
#del-input.is-shaking {
  animation: t-input-shake calc(var(--shake-dur-a) * 2 + var(--shake-dur-b) * 2) linear;
}
@keyframes t-input-shake {
  0%     { transform: translateX(0);                                animation-timing-function: var(--shake-ease); }
  28.57% { transform: translateX(var(--shake-distance));            animation-timing-function: var(--shake-ease); }
  57.14% { transform: translateX(calc(var(--shake-distance) * -1)); animation-timing-function: var(--shake-ease); }
  78.57% { transform: translateX(var(--shake-overshoot));           animation-timing-function: var(--shake-ease); }
  100%   { transform: translateX(0); }
}
@media (prefers-color-scheme: dark) {
  #del-input.is-error { border-color: #f87171 !important; }
}
@media (prefers-reduced-motion: reduce) {
  #del-input { animation: none !important; transform: none !important; }
}

/* 刪除成功打勾動畫（transitions.dev: success-check） */
.del-success {
  display: none; flex-direction: column; align-items: center; gap: 10px;
  padding: 18px 0 8px; color: #16a34a;
}
#del-sheet.deleting .del-warning,
#del-sheet.deleting .input-label,
#del-sheet.deleting .del-keyword,
#del-sheet.deleting #del-input,
#del-sheet.deleting .sheet-actions { display: none; }
#del-sheet.deleting .del-success { display: flex; }
.del-success-text { font-size: 0.95rem; font-weight: 700; color: var(--text); }
@media (prefers-color-scheme: dark) { .del-success { color: #4ade80; } }

.t-success-check {
  display: inline-block; width: 46px; height: 46px;
  transform-origin: center; opacity: 0;
  will-change: transform, opacity, filter;
}
.t-success-check svg { display: block; overflow: visible; }
.t-success-check svg path { stroke-dasharray: 24; stroke-dashoffset: 24; }
.t-success-check[data-state="in"] {
  animation:
    t-check-fade   var(--check-opacity-dur) cubic-bezier(0.22,1,0.36,1) forwards,
    t-check-rotate var(--check-rotate-dur)  cubic-bezier(0.22,1,0.36,1) forwards,
    t-check-blur   var(--check-blur-dur)    cubic-bezier(0.22,1,0.36,1) forwards,
    t-check-bob    var(--check-bob-dur)     var(--check-ease-bob) forwards;
}
.t-success-check[data-state="in"] svg path {
  animation: t-check-draw var(--check-path-dur) cubic-bezier(0.22,1,0.36,1) var(--check-path-delay) forwards;
}
@keyframes t-check-fade   { from { opacity: 0; } to { opacity: 1; } }
@keyframes t-check-rotate { from { transform: rotate(var(--check-rotate-from)); } to { transform: rotate(0deg); } }
@keyframes t-check-blur   { from { filter: blur(var(--check-blur-from)); } to { filter: blur(0); } }
@keyframes t-check-bob    { from { translate: 0 var(--check-y-amount); } to { translate: 0 0; } }
@keyframes t-check-draw   { to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) {
  .t-success-check { animation: none !important; opacity: 1; }
  .t-success-check svg path { animation: none !important; stroke-dashoffset: 0 !important; }
}

.month-delete-btn {
  display: block; margin: 6px auto 0;
  background: none; border: none;
  font-size: 0.72rem; font-weight: 600;
  color: #dc2626; opacity: 0.55;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  padding: 4px 8px;
}
.month-delete-btn:active { opacity: 0.9; }
@media (prefers-color-scheme: dark) {
  .del-warning { color: #f87171; }
  .month-delete-btn { color: #f87171; }
}
.btn-reset {
  padding: 14px 18px;
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: 16px;
  font-size: 0.88rem; font-weight: 600;
  color: var(--sub);
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  display: none;
}
.btn-reset.show { display: block; }
.btn-reset:active { opacity: 0.65; }

/* ── Anniversary dot ── */
.cal-cell.anniversary::before {
  content: '';
  position: absolute; top: 4px; left: 50%; transform: translateX(-50%);
  width: 5px; height: 5px; border-radius: 50%;
  background: #f472b6;
  z-index: 1;
}

/* ── Anniversary banner in edit sheet ── */
.anniversary-banner {
  background: rgba(244,114,182,0.12);
  border: 1px solid rgba(244,114,182,0.3);
  border-radius: 12px;
  padding: 10px 14px;
  margin-bottom: 14px;
  font-size: 0.85rem; font-weight: 700;
  color: #db2777; text-align: center;
  letter-spacing: -0.01em;
}
@media (prefers-color-scheme: dark) {
  .anniversary-banner { background: rgba(244,114,182,0.15); color: #f9a8d4; }
}

/* ── Time picker section ── */
.time-sep {
  display: flex; align-items: center; gap: 10px;
  margin: 14px 0 12px;
  font-size: 0.68rem; color: var(--sub); font-weight: 600;
  letter-spacing: 0.06em;
}
.time-sep::before, .time-sep::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}
.time-row {
  display: flex; align-items: flex-end; gap: 10px;
  margin-bottom: 8px;
}
.time-field { flex: 1; display: flex; flex-direction: column; gap: 5px; }
.time-field label {
  font-size: 0.72rem; color: var(--sub); font-weight: 600;
}
.time-input {
  width: 100%;
  font-size: 0.98rem; font-weight: 600;
  color: var(--text); background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 10px 10px;
  outline: none;
  -webkit-appearance: none;
}
.time-input:focus { border-color: var(--accent); }
.time-arrow { color: var(--sub); font-size: 1.1rem; flex-shrink: 0; padding-bottom: 10px; }
.time-hint {
  font-size: 0.8rem; font-weight: 600;
  min-height: 1.2em; margin-bottom: 6px;
  transition: color 0.15s;
}
</style>
</head>
<body>

<div class="topbar">
  <a class="back-link" href="/" onclick="return _goHomeClick(event)">← 首頁</a>
  <span class="topbar-title">我的班表</span>
  <span></span>
</div>

<main>
  <div class="month-nav-row">
    <button class="month-nav-btn" id="btn-prev-month" onclick="navMonth(-1)" aria-label="上個月">‹</button>
    <div class="month-title">
      <div class="month-header" id="month-hdr"></div>
      <div class="month-sub"   id="month-sub"></div>
      <button class="month-delete-btn" onclick="openDeleteSheet()">刪除本月班表</button>
    </div>
    <button class="month-nav-btn" id="btn-next-month" onclick="navMonth(1)" aria-label="下個月">›</button>
  </div>
  <div class="cal-dow-row">
    <span class="cal-dow wknd">日</span>
    <span class="cal-dow">一</span>
    <span class="cal-dow">二</span>
    <span class="cal-dow">三</span>
    <span class="cal-dow">四</span>
    <span class="cal-dow">五</span>
    <span class="cal-dow wknd">六</span>
  </div>
  <div class="cal-grid" id="cal-grid"></div>
</main>

<!-- Edit sheet -->
<div class="sheet-overlay" id="overlay"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title"   id="sheet-title"></div>
  <div class="sheet-current" id="sheet-current"></div>
  <div class="anniversary-banner" id="anniversary-banner" style="display:none"></div>
  <div class="input-label">班別代碼</div>
  <input class="sheet-input" id="sheet-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false">

  <div class="time-sep">或直接選時間</div>
  <div class="time-row">
    <div class="time-field">
      <label for="time-start">上班時間</label>
      <input class="time-input" type="time" id="time-start" step="1800">
    </div>
    <span class="time-arrow">→</span>
    <div class="time-field">
      <label for="time-end">下班時間</label>
      <input class="time-input" type="time" id="time-end" step="1800">
    </div>
  </div>
  <div class="time-hint" id="time-hint"></div>

  <div class="quick-row">
    <button class="quick-btn" onclick="quickSet('@')">@ 休假</button>
    <button class="quick-btn" onclick="quickSet('E')">E 上課</button>
  </div>
  <div class="sheet-actions">
    <button class="btn-reset" id="btn-reset" onclick="resetDay()">還原原始</button>
    <button class="btn-confirm" onclick="confirmEdit()">確認</button>
  </div>
</div>

<!-- Delete-month sheet -->
<div class="sheet-overlay" id="del-overlay"></div>
<div class="sheet" id="del-sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title" id="del-title"></div>
  <div class="del-warning">此操作會清除本月所有班表資料與已調整紀錄，且無法復原（僅影響這台裝置）。</div>
  <div class="input-label">請完整輸入下方文字以確認刪除</div>
  <div class="del-keyword" id="del-keyword-display"></div>
  <input class="sheet-input" id="del-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" style="text-transform:none;">
  <div class="sheet-actions">
    <button class="btn-reset show" onclick="closeDeleteSheet()">取消</button>
    <button class="btn-danger" id="del-confirm-btn" disabled onclick="confirmDeleteMonth()">刪除</button>
  </div>
  <div class="del-success" id="del-success">
    <span class="t-success-check" id="del-success-check" data-state="out" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M4 12.5l4.5 4.5L20 6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
    <div class="del-success-text">已刪除本月班表</div>
  </div>
</div>

<script>
/* ── 背景頁面捲動鎖定：面板/彈窗開著時避免拖拉穿透到底下那一層 ── */
let _scrollLockCount = 0;
let _scrollLockY = 0;
function lockBodyScroll() {
  if (_scrollLockCount++ > 0) return;
  _scrollLockY = window.scrollY;
  document.body.style.position = 'fixed';
  document.body.style.top = `-${_scrollLockY}px`;
  document.body.style.left = '0';
  document.body.style.right = '0';
  document.body.style.width = '100%';
}
function unlockBodyScroll() {
  if (_scrollLockCount <= 0) return;
  if (--_scrollLockCount > 0) return;
  document.body.style.position = '';
  document.body.style.top = '';
  document.body.style.left = '';
  document.body.style.right = '';
  document.body.style.width = '';
  window.scrollTo(0, _scrollLockY);
}

function _goHomeClick(e) {
  if (document.referrer && new URL(document.referrer).origin === location.origin) {

/* ── 已刪除的月份（僅這台裝置隱藏，不動到原始資料） ── */
const DELETED_KEY = 'sched_deleted_months';
let deletedMonths;
try { deletedMonths = new Set(JSON.parse(localStorage.getItem(DELETED_KEY) || '[]')); }
catch (e) { deletedMonths = new Set(); }

function monthKeys() {
  return Object.keys(MONTHS)
    .filter(k => !deletedMonths.has(k))
    .map(k => { const [y, m] = k.split('-').map(Number); return { y, m, key: k }; })
    .sort((a, b) => a.y - b.y || a.m - b.m);
}
function getCodes(y, m) {
  const key = `${y}-${m}`;
  if (deletedMonths.has(key)) return null;
  return MONTHS[key] || null;
}

/* ── 目前檢視的月份：預設今天所在月，若無資料則退到最後一筆 ── */
let viewYear, viewMonth;
(function initView() {
  const today = new Date(), ty = today.getFullYear(), tm = today.getMonth() + 1;
  if (getCodes(ty, tm)) { viewYear = ty; viewMonth = tm; return; }
  const keys = monthKeys();
  if (keys.length) { const last = keys[keys.length - 1]; viewYear = last.y; viewMonth = last.m; }
  else { viewYear = ty; viewMonth = tm; }
})();

/* ── 手動調整存 localStorage（每月各自一組）＋雲端同步 ──
 * 這頁不要求登入，所以用固定同步碼（非帳號系統），任何裝置打開就自動同步。 */
const SCHED_SUPA_URL = 'https://bqapzqdfgnoghtgdakdw.supabase.co';
const SCHED_SUPA_KEY = 'sb_publishable_5Gw7rYaKnI3_fzcNpLbmwA_h0CgB7Fv';
const SCHED_SYNC_KEY = 'schedule_default_v1';
const SCHED_HDR = {
  'Content-Type': 'application/json',
  'apikey': SCHED_SUPA_KEY,
  'Authorization': `Bearer ${SCHED_SUPA_KEY}`
};

function collectAllOverrides() {
  const all = {};
  for (const k of Object.keys(localStorage)) {
    if (!k.startsWith('sched_overrides_')) continue;
    try { all[k] = JSON.parse(localStorage.getItem(k)); } catch {}
  }
  return all;
}

async function schedPush() {
  try {
    await fetch(`${SCHED_SUPA_URL}/rest/v1/user_configs`, {
      method: 'POST',
      headers: { ...SCHED_HDR, 'Prefer': 'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify({
        sync_key: SCHED_SYNC_KEY,
        config: { overrides: collectAllOverrides() },
        updated_at: new Date().toISOString()
      })
    });
  } catch {}
}

async function schedPull() {
  try {
    const r = await fetch(
      `${SCHED_SUPA_URL}/rest/v1/user_configs?sync_key=eq.${SCHED_SYNC_KEY}&select=config`,
      { headers: SCHED_HDR }
    );
    if (!r.ok) return;
    const rows = await r.json();
    if (!rows.length) return;
    const remote = rows[0].config && rows[0].config.overrides;
    if (!remote) return;
    for (const [k, v] of Object.entries(remote)) {
      localStorage.setItem(k, JSON.stringify(v));
    }
  } catch {}
}

let OVERRIDE_KEY, overrides;
function loadOverrides() {
  OVERRIDE_KEY = `sched_overrides_${viewYear}_${viewMonth}`;
  overrides = JSON.parse(localStorage.getItem(OVERRIDE_KEY) || '{}');
}
function saveOverrides() {
  localStorage.setItem(OVERRIDE_KEY, JSON.stringify(overrides));
  schedPush();
}
loadOverrides();

function getCode(day) {
  const codes = getCodes(viewYear, viewMonth);
  return overrides[day] !== undefined ? overrides[day] : (codes ? codes[day - 1] : '@');
}

function navMonth(delta) {
  const keys = monthKeys();
  const idx = keys.findIndex(k => k.y === viewYear && k.m === viewMonth);
  const newIdx = idx + delta;
  if (newIdx < 0 || newIdx >= keys.length) return;
  viewYear = keys[newIdx].y;
  viewMonth = keys[newIdx].m;
  loadOverrides();
  render();
}

/* ── 查班別 ── */
function lookup(code) {
  if (!code || code === '@') return { type: 'off' };
  if (code === 'E')          return { type: 'class' };
  const norm = 'B' + code.slice(1);
  const t = T[norm];
  if (t) return { type: 'work', label: code, start: t[0], end: t[1] };
  return { type: 'unknown', label: code };
}

/* ── 紀念日計算 ── */
const COUPLE_START = new Date(2024, 9, 19); // 2024/10/19

function getAnniversaryLabel(year, month, day) {
  const labels = [];
  if (month === 2 && day === 14) labels.push('情人節');
  if (month === 10 && day === 19) {
    const yrs = year - 2024;
    if (yrs === 0) labels.push('在一起的日子');
    else if (yrs > 0) labels.push(`${yrs} 週年紀念日`);
  }
  const target = new Date(year, month - 1, day);
  const diffDays = Math.round((target - COUPLE_START) / (1000 * 60 * 60 * 24));
  if (diffDays > 0 && diffDays % 100 === 0) labels.push(`${diffDays} 天紀念日`);
  return labels.length ? labels.join(' · ') : null;
}

  document.getElementById('month-hdr').textContent = `${year}年 ${month}月`;

  const keys = monthKeys();
  const idx  = keys.findIndex(k => k.y === year && k.m === month);
  document.getElementById('btn-prev-month').disabled = idx <= 0;
  document.getElementById('btn-next-month').disabled = idx === -1 || idx >= keys.length - 1;

  let workDays = 0, classDays = 0, offDays = 0;
  for (let d = 1; d <= daysInMonth; d++) {
    const c = getCode(d);
    if (c === '@') offDays++;
    else if (c === 'E') classDays++;
    else workDays++;
  }
  document.getElementById('month-sub').textContent =
    `上班 ${workDays} 天 · 上課 ${classDays} 天 · 休假 ${offDays} 天`;

  let html = '';
  for (let i = 0; i < firstDow; i++) html += '<div class="cal-cell empty"></div>';

  const WD = ['日','一','二','三','四','五','六'];
  for (let d = 1; d <= daysInMonth; d++) {
    const dow      = new Date(year, month - 1, d).getDay();
    const isToday  = isThisMonth && today.getDate() === d;
    const isWknd   = dow === 0 || dow === 6;
    const code     = getCode(d);
    const modified = overrides[d] !== undefined;
    const s        = lookup(code);

    let shiftHtml = '';
    if (s.type === 'work') {
      shiftHtml = `<div class="cal-shift">
        <span class="cal-badge">${s.label}</span>
        <div class="cal-time">${s.start}</div>
      </div>`;
    } else if (s.type === 'class') {
      shiftHtml = `<div class="cal-shift"><span class="cal-class-label">課</span></div>`;
    } else if (s.type === 'off') {
      shiftHtml = `<div class="cal-shift"><span class="cal-off-label">休</span></div>`;
    } else {
      shiftHtml = `<div class="cal-shift"><span class="cal-badge" style="color:#dc2626;background:rgba(220,38,38,.08)">${s.label||'?'}</span></div>`;
    }

    const anniv = getAnniversaryLabel(year, month, d);
    const cls = ['cal-cell'];
    if (isToday)  cls.push('today');
    if (s.type === 'off') cls.push('is-off');
    if (modified) cls.push('modified');
    if (anniv)    cls.push('anniversary');

    html += `<div class="${cls.join(' ')}" onclick="openEdit(${d})">
      <span class="cal-day-num${isWknd ? ' wknd' : ''}">${d}</span>
      ${shiftHtml}
    </div>`;
  }

  document.getElementById('cal-grid').innerHTML = html;
}

/* ── 時間反查班別代碼 ── */
function reverseT(start, end) {
  for (const [code, times] of Object.entries(T)) {
    if (times[0] === start && times[1] === end) return code;
  }
  return null;
}

function onTimeChange() {
  const start = document.getElementById('time-start').value;
  const end   = document.getElementById('time-end').value;
  const hint  = document.getElementById('time-hint');
  if (!start || !end) { hint.textContent = ''; return; }
  const code = reverseT(start, end);
  if (code) {
    document.getElementById('sheet-input').value = code;
    hint.style.color = 'var(--accent)';
    hint.textContent = `✓ 對應代碼：${code}`;
  } else {
    document.getElementById('sheet-input').value = '';
    hint.style.color = '#dc2626';
    hint.textContent = '✗ 查無對應代碼';
  }
}

/* ── 編輯表單 ── */
let editDay = null;

function openEdit(day) {
  lockBodyScroll();
  editDay = day;
  const year = viewYear, month = viewMonth;
  const dow      = new Date(year, month - 1, day).getDay();
  const WD       = ['日','一','二','三','四','五','六'];
  const code     = getCode(day);
  const origCode = getCodes(year, month)[day - 1];
  const modified = overrides[day] !== undefined;

  document.getElementById('sheet-title').textContent = `${month}月${day}日（週${WD[dow]}）`;
  document.getElementById('sheet-current').innerHTML = modified
    ? `原始：<b>${origCode}</b>　→　已調整為 <b>${code}</b>`
    : `目前班別：<b>${code}</b>`;

  const annivLabel = getAnniversaryLabel(year, month, day);
  const banner = document.getElementById('anniversary-banner');
  if (annivLabel) {
    banner.textContent = '♡  ' + annivLabel;
    banner.style.display = '';
  } else {
    banner.style.display = 'none';
  }
  document.getElementById('sheet-input').value = code;

  // 預填時間選擇器
  const s = lookup(code);
  document.getElementById('time-start').value = (s.type === 'work') ? s.start : '';
  document.getElementById('time-end').value   = (s.type === 'work') ? s.end   : '';
  document.getElementById('time-hint').textContent = '';

  const btnReset = document.getElementById('btn-reset');
  modified ? btnReset.classList.add('show') : btnReset.classList.remove('show');

  document.getElementById('overlay').classList.add('open');
  document.getElementById('sheet').classList.add('open');
  setTimeout(() => {
    const inp = document.getElementById('sheet-input');
    inp.focus();
    inp.select();
  }, 300);
}

function closeSheet() {
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
  editDay = null;
  unlockBodyScroll();
}

function quickSet(code) {
  document.getElementById('sheet-input').value = code;
  document.getElementById('sheet-input').focus();
}

function confirmEdit() {
  if (editDay === null) return;
  const raw = document.getElementById('sheet-input').value.trim().toUpperCase();
  if (!raw) return;
  overrides[editDay] = raw;
  saveOverrides();
  closeSheet();
  render();
}

function resetDay() {
  if (editDay === null) return;
  delete overrides[editDay];
  saveOverrides();
  closeSheet();
  render();
}

/* ── 刪除本月班表（需輸入關鍵字確認，僅影響這台裝置） ── */
let deleteKeyword = '';

function openDeleteSheet() {
  lockBodyScroll();
  const year = viewYear, month = viewMonth;
  deleteKeyword = `刪除${year}年${month}月`;
  document.getElementById('del-title').textContent = `刪除 ${year}年${month}月 班表`;
  document.getElementById('del-keyword-display').textContent = deleteKeyword;
  const inp = document.getElementById('del-input');
  inp.value = '';
  inp.classList.remove('is-error', 'is-shaking');
  if (inp._revertTimer) { clearTimeout(inp._revertTimer); inp._revertTimer = null; }
  document.getElementById('del-confirm-btn').disabled = true;
  document.getElementById('del-sheet').classList.remove('deleting');
  document.getElementById('del-success-check').setAttribute('data-state', 'out');
  document.getElementById('del-overlay').classList.add('open');
  document.getElementById('del-sheet').classList.add('open');
  setTimeout(() => inp.focus(), 300);
}

function closeDeleteSheet() {
  document.getElementById('del-overlay').classList.remove('open');
  document.getElementById('del-sheet').classList.remove('open');
  unlockBodyScroll();
}

function onDeleteInput() {
  const inp = document.getElementById('del-input');
  const match = inp.value.trim() === deleteKeyword;
  document.getElementById('del-confirm-btn').disabled = !match;
  if (inp.classList.contains('is-error')) {
    if (inp._revertTimer) { clearTimeout(inp._revertTimer); inp._revertTimer = null; }
    inp.classList.remove('is-error');
  }
}

function shakeDeleteInput() {
  const inp = document.getElementById('del-input');
  inp.classList.add('is-error');
  inp.classList.remove('is-shaking');
  void inp.offsetWidth;
  inp.classList.add('is-shaking');
  const cs = getComputedStyle(document.documentElement);
  const msVar = (name, fb) => { const v = parseFloat(cs.getPropertyValue(name)); return Number.isFinite(v) ? v : fb; };
  const shakeMs = msVar('--shake-dur-a', 80) * 2 + msVar('--shake-dur-b', 60) * 2;
  setTimeout(() => inp.classList.remove('is-shaking'), shakeMs + 20);
  if (inp._revertTimer) clearTimeout(inp._revertTimer);
  inp._revertTimer = setTimeout(() => {
    inp._revertTimer = null;
    inp.classList.remove('is-error');
  }, shakeMs + msVar('--revert-hold', 900));
}

function confirmDeleteMonth() {
  if (document.getElementById('del-input').value.trim() !== deleteKeyword) {
    shakeDeleteInput();
    return;
  }
  const y = viewYear, m = viewMonth;
  const key = `${y}-${m}`;

  deletedMonths.add(key);
  localStorage.setItem(DELETED_KEY, JSON.stringify([...deletedMonths]));
  localStorage.removeItem(`sched_overrides_${y}_${m}`);
  schedPush();

  const keys = monthKeys();
  if (keys.length) {
    const next = keys.find(k => k.y > y || (k.y === y && k.m > m));
    const target = next || keys[keys.length - 1];
    viewYear = target.y; viewMonth = target.m;
  }
  loadOverrides();
  render();

  const sheet = document.getElementById('del-sheet');
  const check = document.getElementById('del-success-check');
  sheet.classList.add('deleting');
  check.setAttribute('data-state', 'out');
  void check.offsetWidth;
  check.setAttribute('data-state', 'in');
  setTimeout(() => {
    closeDeleteSheet();
    sheet.classList.remove('deleting');
  }, 900);
}

document.getElementById('overlay').addEventListener('click', closeSheet);
document.getElementById('time-start').addEventListener('change', onTimeChange);
document.getElementById('time-end').addEventListener('change', onTimeChange);
document.getElementById('sheet-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') confirmEdit();
  if (e.key === 'Escape') closeSheet();
});

document.getElementById('del-overlay').addEventListener('click', closeDeleteSheet);
document.getElementById('del-input').addEventListener('input', onDeleteInput);
document.getElementById('del-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') confirmDeleteMonth();
  if (e.key === 'Escape') closeDeleteSheet();
});

(async function initSync() {
  await schedPull();
  loadOverrides();
  render();
  // 每次打開頁面都把本機（含剛才拉回來的）資料完整推上雲端，不判斷雲端是否已有資料
  schedPush();
})();
</script>
