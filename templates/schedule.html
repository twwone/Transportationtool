<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>週班表 – 交通助理</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<link rel="apple-touch-icon" href="/static/icon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="交通助理">
<meta name="theme-color" content="#f0f4ff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<script src="/static/config.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { overscroll-behavior: none; }
:root {
  --green:  #059669;
  --green2: #10b981;
  --gl:     #d1fae5;
  --teal:   #0d9488;
}

/* ── 關鍵影格 ── */
@keyframes pageIn {
  from { opacity: 0; transform: translateY(14px) scale(0.988); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes spin { to { transform: rotate(360deg); } }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f0f4ff;
  color: #1c1c1e;
  min-height: 100vh;
  animation: pageIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
}

/* ── Top bar ── */
.topbar {
  background: rgba(240,244,255,0.88);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: none;
  box-shadow: 0 1px 0 rgba(0,0,0,0.06);
  padding: 12px 16px;
  padding-top: max(12px, env(safe-area-inset-top) + 8px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  box-sizing: border-box;
}
.back-link {
  font-size: 0.9rem;
  color: var(--green);
  text-decoration: none;
  font-weight: 600;
  transition: color 0.15s, transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.15s;
}
.back-link:active { transform: scale(0.88); opacity: 0.65; }

/* ── Toggle with sliding pill — 動態島式 ── */
.toggle-wrap {
  position: relative;
  display: flex;
  background: rgba(118, 118, 128, 0.12);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-radius: 100px;
  padding: 2px;
  gap: 0;
  box-shadow:
    0 0 0 0.5px rgba(255, 255, 255, 0.32),
    inset 0 1px 0 rgba(255, 255, 255, 0.55);
}
/* 滑動背景藥丸 */
.toggle-pill {
  position: absolute;
  top: 2px; bottom: 2px;
  background: #fff;
  border-radius: 100px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.10), 0 0 0 0.5px rgba(255,255,255,0.6);
  transition:
    left  0.3s cubic-bezier(0.25, 1, 0.5, 1),
    width 0.3s cubic-bezier(0.25, 1, 0.5, 1);
  pointer-events: none;
  will-change: left, width;
}
.toggle-btn {
  position: relative;
  z-index: 1;
  font-size: 0.72rem;
  font-weight: 600;
  padding: 4px 12px;
  border-radius: 100px;
  border: none;
  cursor: pointer;
  background: transparent;
  color: #8e8e93;
  transition: color 0.22s;
}
.toggle-btn.active {
  color: var(--green);
  background: transparent;
  box-shadow: none;
}
.toggle-btn:active { transform: scale(0.93); transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1); }
.topbar-title {
  font-weight: 700;
  font-size: 1rem;
}

/* ── Main layout ── */
.main {
  padding: 12px 16px 80px;
  /* 補 topbar 高度（fixed 後不占文件流），加上 safe-area-inset-top */
  padding-top: calc(60px + max(0px, env(safe-area-inset-top)));
  max-width: 540px;
  margin: 0 auto;
}
.summary {
  font-size: 0.78rem;
  color: #8e8e93;
  text-align: center;
  margin-bottom: 14px;
  transition: opacity 0.2s;
}

/* ── Day card ── */
.day-card {
  background: #fff;
  border-radius: 22px;
  border: 1.5px solid #e5e5ea;
  padding: 18px 16px;
  margin-bottom: 12px;
  will-change: transform;
  transition:
    transform      0.3s cubic-bezier(0.25, 1, 0.5, 1),
    box-shadow     0.3s cubic-bezier(0.25, 1, 0.5, 1),
    border-color   0.2s ease;
}
.day-card:active {
  transform: scale(0.965) !important;
  transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1) !important;
}
@media (hover: hover) {
  .day-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.07);
  }
}
/* 入場動畫 class，由 JS 注入 */
.day-card.card-anim {
  animation: cardIn 0.48s cubic-bezier(0.22, 1, 0.36, 1) both;
}
.day-card.today    { border-color: var(--green); }
.day-card.peak-high { border-color: #ef4444; }
.day-card.peak-mid  { border-color: #f59e0b; }

.day-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.day-info {
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.day-name {
  font-size: 1.15rem;
  font-weight: 700;
}
.day-date {
  font-size: 0.78rem;
  color: #8e8e93;
}
.badges { display: flex; gap: 4px; }

.badge {
  display: inline-block;
  font-size: 0.68rem;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 20px;
}
.badge-today { background: var(--gl); color: #065f46; }
.badge-high  { background: #fee2e2; color: #b91c1c; }
.badge-mid   { background: #fef3c7; color: #92400e; }

/* ── Flight counts row ── */
.counts-row {
  display: flex;
  align-items: flex-end;
  gap: 0;
  margin-bottom: 14px;
}
.count-item {
  flex: 1;
  text-align: center;
}
.count-divider {
  width: 1px;
  height: 36px;
  background: #e5e5ea;
  flex-shrink: 0;
  margin-bottom: 14px;
}
.count-num {
  font-size: 2.6rem;
  font-weight: 800;
  line-height: 1;
  letter-spacing: -2px;
}
.count-label {
  font-size: 0.65rem;
  color: #8e8e93;
  margin-top: 3px;
}
.count-item.dep .count-num   { color: var(--green); }
.count-item.arr .count-num   { color: var(--teal); }
.count-item.total .count-num { color: #1c1c1e; }

/* ── Hour bar chart ── */
.chart-wrap { position: relative; }
.hour-chart {
  display: flex;
  align-items: flex-end;
  height: 52px;
  gap: 1px;
  background-image:
    repeating-linear-gradient(90deg, rgba(142,142,147,0.2) 0px, rgba(142,142,147,0.2) 3px, transparent 3px, transparent 8px),
    repeating-linear-gradient(90deg, rgba(142,142,147,0.2) 0px, rgba(142,142,147,0.2) 3px, transparent 3px, transparent 8px),
    repeating-linear-gradient(90deg, rgba(142,142,147,0.2) 0px, rgba(142,142,147,0.2) 3px, transparent 3px, transparent 8px);
  background-size: 100% 1px, 100% 1px, 100% 1px;
  background-position: 0 25%, 0 50%, 0 75%;
  background-repeat: repeat-x, repeat-x, repeat-x;
}
.hour-col {
  flex: 1;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  gap: 1px;
  transition: opacity 0.12s;
}
.hour-col:hover { opacity: 0.75; }
.bar-dep {
  background: var(--green);
  border-radius: 100px;
  min-height: 0;
  transition: height 0.4s cubic-bezier(0.25, 1, 0.5, 1);
}
.bar-arr {
  background: var(--teal);
  opacity: 0.55;
  border-radius: 100px;
  min-height: 0;
  transition: height 0.4s cubic-bezier(0.25, 1, 0.5, 1);
}
.hour-axis {
  display: flex;
  gap: 1px;
  margin-top: 3px;
}
.hour-tick {
  flex: 1;
  font-size: 0.44rem;
  color: #c7c7cc;
  text-align: center;
}
.chart-legend {
  display: flex;
  gap: 12px;
  margin-top: 6px;
  font-size: 0.68rem;
  color: #636366;
}
.leg-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  vertical-align: middle;
  margin-right: 3px;
}

/* ── States ── */
.spinner {
  display: flex;
  justify-content: center;
  padding: 60px 0;
}
.spinner::after {
  content: '';
  width: 28px;
  height: 28px;
  border: 3px solid #e5e5ea;
  border-top-color: var(--green);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
.no-data {
  text-align: center;
  color: #c7c7cc;
  font-size: 0.85rem;
  padding: 40px 0;
}
.footer {
  text-align: center;
  font-size: 0.68rem;
  color: #c7c7cc;
  margin-top: 6px;
}

/* ── 卡片容器淡入淡出 ── */
#cards {
  transition: opacity 0.14s ease-out;
}
#cards.fading { opacity: 0; }

@media (prefers-color-scheme: dark) {
  :root {
    --green:  #30d158;
    --green2: #32d74b;
    --gl:     rgba(48,209,88,0.18);
    --teal:   #32ade6;
  }
  body { background: #000; color: #f2f2f7; }
  .topbar { background: rgba(0,0,0,0.75); box-shadow: 0 1px 0 rgba(255,255,255,0.06); border-bottom: none; }
  .topbar-title { color: #f2f2f7; }
  .back-btn { color: #30d158; }
  .airasia-toggle { background: #2c2c2e; }
  .airasia-btn { color: #48484a; }
  .airasia-btn.active { background: rgba(5,150,105,0.25); color: #30d158; }
  .day-card { background: #1c1c1e; border-color: #2c2c2e; }
  .day-card:hover { border-color: #3a3a3c; }
  .day-card.today { border-color: var(--green); }
  .day-card.peak-high { border-color: #f87171; }
  .day-card.peak-mid  { border-color: #fbbf24; }
  .day-label { color: #8e8e93; }
  .day-date  { color: #636366; }
  .badge-today { background: rgba(48,209,88,0.15);  color: var(--green); }
  .badge-high  { background: rgba(239,68,68,0.15);  color: #f87171; }
  .badge-mid   { background: rgba(245,158,11,0.15); color: #fbbf24; }
  .count-item label { color: #48484a; }
  .detail-card { background: #1c1c1e; border-color: #2c2c2e; }
  .detail-title { color: #8e8e93; }
  .hour-label { color: #48484a; }
  .hour-none  { color: #3a3a3c; }
  .chart-legend { color: #48484a; }
  .leg-dot { opacity: 0.85; }
  .setup-error { background: #1c1c1e; border-color: #2c2c2e; color: #636366; }
}
</style>
</head>
<body>

<div class="topbar">
  <a href="/" class="back-link">‹ 返回</a>
  <span class="topbar-title">週班表</span>
  <div class="toggle-wrap">
    <div class="toggle-pill" id="togglePill"></div>
    <button class="toggle-btn active" id="btn-aa"  onclick="setFilter(1)">AirAsia</button>
    <button class="toggle-btn"        id="btn-all" onclick="setFilter(0)">全部</button>
  </div>
</div>

<div class="main">
  <div class="summary" id="summary">載入中…</div>
  <div id="cards"><div class="spinner"></div></div>
  <div class="footer" id="footer"></div>
</div>

<script>
let _filter = Config.getActive().schedule.airasiaOnly ? 1 : 0;

/* ── 藥丸滑動到 active 按鈕位置 ── */
function updateTogglePill() {
  const btn  = document.querySelector('.toggle-btn.active');
  const pill = document.getElementById('togglePill');
  if (btn && pill) {
    pill.style.left  = btn.offsetLeft + 'px';
    pill.style.width = btn.offsetWidth + 'px';
  }
}

function setFilter(v) {
  _filter = v;
  Config.save({ schedule: { airasiaOnly: v === 1 } });
  document.getElementById('btn-aa').classList.toggle('active',  v === 1);
  document.getElementById('btn-all').classList.toggle('active', v === 0);
  updateTogglePill();

  /* 切換時讓卡片先淡出，再重載 */
  const cardsEl = document.getElementById('cards');
  cardsEl.classList.add('fading');
  setTimeout(() => {
    cardsEl.classList.remove('fading');
    load();
  }, 150);
}

async function load() {
  const cardsEl = document.getElementById('cards');
  cardsEl.innerHTML = '<div class="spinner"></div>';
  try {
    const r = await fetch('/api/schedule/week?airasia=' + _filter);
    if (!r.ok) throw new Error(r.status);
    render(await r.json());
  } catch(e) {
    cardsEl.innerHTML = '<div class="no-data">載入失敗，請確認 TDX 設定後重試</div>';
  }
}

function render(d) {
  if (!d.configured) {
    document.getElementById('cards').innerHTML = '<div class="no-data">TDX API 尚未設定</div>';
    return;
  }

  let gMax = 0;
  for (const day of d.days) {
    for (let h = 0; h < 24; h++) {
      const v = (day.dep_hours[h] || 0) + (day.arr_hours[h] || 0);
      if (v > gMax) gMax = v;
    }
  }

  const label = d.airasia_only ? 'AirAsia 集團' : '全部航空';
  document.getElementById('summary').textContent =
    `${label} · 出發 ${d.total_dep} 個路線 · 抵達 ${d.total_arr} 個路線`;

  const CHART_H = 52;
  let html = '';

  for (const day of d.days) {
    const cls = ['day-card'];
    if (day.is_today)        cls.push('today');
    if (day.peak === 'high') cls.push('peak-high');
    else if (day.peak === 'mid') cls.push('peak-mid');

    let badges = '';
    if (day.is_today) badges += '<span class="badge badge-today">今天</span>';
    if (day.peak === 'high') badges += '<span class="badge badge-high">大流量</span>';
    else if (day.peak === 'mid') badges += '<span class="badge badge-mid">略忙</span>';

    const dt   = new Date(day.date + 'T00:00:00');
    const mmdd = `${dt.getMonth()+1}/${dt.getDate()}`;

    let bars = '', ticks = '';
    for (let h = 0; h < 24; h++) {
      const dep  = day.dep_hours[h] || 0;
      const arr  = day.arr_hours[h] || 0;
      const depH = gMax > 0 ? Math.round(dep / gMax * CHART_H) : 0;
      const arrH = gMax > 0 ? Math.round(arr / gMax * CHART_H) : 0;
      bars  += `<div class="hour-col" title="${h}:00  出發${dep} 抵達${arr}">` +
               `<div class="bar-arr" style="height:${arrH}px"></div>` +
               `<div class="bar-dep" style="height:${depH}px"></div>` +
               `</div>`;
      ticks += `<div class="hour-tick">${[0,6,12,18].includes(h) ? h : ''}</div>`;
    }

    html += `
<div class="${cls.join(' ')}">
  <div class="day-header">
    <div class="day-info">
      <span class="day-name">週${day.weekday_zh}</span>
      <span class="day-date">${mmdd}</span>
    </div>
    <div class="badges">${badges}</div>
  </div>
  <div class="counts-row">
    <div class="count-item dep">
      <div class="count-num">${day.dep_count}</div>
      <div class="count-label">出發班次</div>
    </div>
    <div class="count-divider"></div>
    <div class="count-item arr">
      <div class="count-num">${day.arr_count}</div>
      <div class="count-label">抵達班次</div>
    </div>
    <div class="count-divider"></div>
    <div class="count-item total">
      <div class="count-num">${day.total}</div>
      <div class="count-label">合計</div>
    </div>
  </div>
  <div class="chart-wrap">
    <div class="hour-chart">${bars}</div>
    <div class="hour-axis">${ticks}</div>
    <div class="chart-legend">
      <span><span class="leg-dot" style="background:var(--green)"></span>出發</span>
      <span><span class="leg-dot" style="background:var(--teal);opacity:0.55"></span>抵達</span>
      <span style="margin-left:auto;color:#c7c7cc">懸停可見詳情</span>
    </div>
  </div>
</div>`;
  }

  const cardsEl = document.getElementById('cards');
  cardsEl.innerHTML = html || '<div class="no-data">目前無班表資料</div>';
  document.getElementById('footer').textContent = '資料更新：' + d.updated_at + '（每小時快取）';

  /* 每張卡片錯開入場 */
  cardsEl.querySelectorAll('.day-card').forEach((card, i) => {
    card.style.animationDelay = (i * 55) + 'ms';
    card.classList.add('card-anim');
  });
}

/* 根據 profile 設定初始 toggle 狀態 */
document.getElementById('btn-aa').classList.toggle('active',  _filter === 1);
document.getElementById('btn-all').classList.toggle('active', _filter === 0);
load();

/* 初始化藥丸位置（等 layout 完成） */
requestAnimationFrame(updateTogglePill);

/* ── bfcache 恢復：重播 body 入場 + 卡片動畫 ── */
window.addEventListener('pageshow', e => {
  if (!e.persisted) return;

  /* 清除任何殘留的 inline opacity / transform / transition */
  document.body.style.opacity    = '';
  document.body.style.transform  = '';
  document.body.style.transition = '';

  document.body.style.animationName = 'none';
  void document.body.offsetWidth;
  document.body.style.animationName = '';

  const cardsEl = document.getElementById('cards');
  const dayCards = cardsEl.querySelectorAll('.day-card');
  dayCards.forEach(c => { c.classList.remove('card-anim'); c.style.animationDelay = ''; });
  void cardsEl.offsetWidth;
  dayCards.forEach((c, i) => {
    c.style.animationDelay = (i * 55) + 'ms';
    c.classList.add('card-anim');
  });

  requestAnimationFrame(updateTogglePill);
});

/* ── 防縮放（iOS 雙保險） ── */
document.addEventListener('touchmove', function(e) {
  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });
let _lastTap = 0;
document.addEventListener('touchend', function(e) {
  const now = Date.now();
  if (now - _lastTap < 300) e.preventDefault();
  _lastTap = now;
}, { passive: false });
</script>
</body>
</html>
