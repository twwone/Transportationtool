<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>我的班表</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="theme-color" content="#071410" media="(prefers-color-scheme: dark)">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overscroll-behavior: none; }

:root {
  --bg:      #f0fdf4;
  --surface: #ffffff;
  --border:  rgba(5,150,105,0.10);
  --text:    #0a1f14;
  --sub:     #5a8a72;
  --accent:  #059669;
  --acc2:    rgba(5,150,105,0.08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:      #071410;
    --surface: #0d2018;
    --border:  rgba(52,211,153,0.12);
    --text:    #ddf2e8;
    --sub:     #4a7a60;
    --accent:  #34d399;
    --acc2:    rgba(52,211,153,0.09);
  }
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100%;
}

/* ── Topbar ── */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: max(14px, env(safe-area-inset-top) + 10px) 20px 12px;
  background: rgba(240,253,244,0.9);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
}
@media (prefers-color-scheme: dark) {
  .topbar { background: rgba(7,20,16,0.9); }
}
.back-link {
  font-size: 0.88rem; font-weight: 600;
  color: var(--accent); text-decoration: none;
  -webkit-tap-highlight-color: transparent;
}
.back-link:active { opacity: 0.55; }
.topbar-title { font-size: 1rem; font-weight: 700; color: var(--text); }

/* ── Main ── */
main {
  padding-top: calc(max(14px, env(safe-area-inset-top) + 10px) + 44px + 16px);
  padding-bottom: max(40px, env(safe-area-inset-bottom) + 24px);
  padding-left: 16px; padding-right: 16px;
}

.month-header {
  font-size: 1.7rem; font-weight: 700;
  letter-spacing: -0.5px; color: var(--text);
  margin-bottom: 4px;
}
.month-sub {
  font-size: 0.75rem; color: var(--sub);
  margin-bottom: 20px; letter-spacing: 0.02em;
}

/* ── Day list ── */
.day-list { display: flex; flex-direction: column; gap: 7px; }

.day-row {
  display: flex; align-items: center; gap: 0;
  padding: 13px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
}
.day-row.today {
  border-color: var(--accent);
  background: var(--acc2);
  box-shadow: 0 0 0 1.5px var(--accent);
}
.day-row.is-off { opacity: 0.65; }

/* date block */
.day-date {
  width: 48px; flex-shrink: 0;
  display: flex; flex-direction: column; align-items: center; gap: 1px;
}
.day-num {
  font-size: 1.25rem; font-weight: 700; line-height: 1; color: var(--text);
}
.day-num.wknd { color: var(--accent); }
.day-week {
  font-size: 0.62rem; color: var(--sub); letter-spacing: 0.04em;
}
.day-week.wknd { color: var(--accent); }
.today-pip {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--accent); margin-top: 2px;
}

/* divider */
.vline {
  width: 1px; height: 34px; background: var(--border);
  margin: 0 14px; flex-shrink: 0;
}

/* shift block */
.day-shift { flex: 1; min-width: 0; }

.shift-badge {
  display: inline-block;
  font-family: "SF Mono","Menlo","Courier New", monospace;
  font-size: 0.78rem; font-weight: 800; letter-spacing: 0.04em;
  padding: 2px 7px; border-radius: 6px;
  margin-bottom: 3px;
  color: var(--accent); background: var(--acc2);
}
.shift-time {
  font-size: 1.05rem; font-weight: 700; color: var(--text);
  display: flex; align-items: center; gap: 4px; letter-spacing: -0.2px;
}
.shift-dot {
  width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
}
.arrow-sep { color: var(--sub); font-size: 0.85rem; font-weight: 400; }

.shift-class {
  font-size: 0.97rem; font-weight: 700;
  color: #2563eb; display: flex; align-items: center; gap: 5px;
}
@media (prefers-color-scheme: dark) { .shift-class { color: #93c5fd; } }

.shift-off {
  font-size: 0.95rem; font-weight: 500; color: var(--sub);
}
.shift-unknown {
  font-size: 0.92rem; font-weight: 600; color: #dc2626;
}
</style>
</head>

/* ── 查班別（去頭字母 → 補 B → 查表） ── */
function lookup(code) {
  if (!code || code === '@') return { type: 'off' };
  if (code === 'E')          return { type: 'class' };
  const norm = 'B' + code.slice(1);
  const t = T[norm];
  if (t) return { type: 'work', label: code, start: t[0], end: t[1] };
  return { type: 'unknown', label: code };
}

function dotColor(start) {
  const h = parseInt(start);
  if (h < 5)  return '#7c3aed';
  if (h < 8)  return '#d97706';
  if (h < 10) return '#059669';
  if (h < 12) return '#0d9488';
  return '#ea580c';
}

/* ── 渲染 ── */
(function render() {
  const today = new Date();
  const { year, month, codes } = SCHEDULE;
  const WD = ['日','一','二','三','四','五','六'];
  const isThisMonth = today.getFullYear() === year && today.getMonth() + 1 === month;

  document.getElementById('month-hdr').textContent = `${year}年 ${month}月`;

  const workDays  = codes.filter(c => c !== '@' && c !== 'E').length;
  const classDays = codes.filter(c => c === 'E').length;
  const offDays   = codes.filter(c => c === '@').length;
  document.getElementById('month-sub').textContent =
    `上班 ${workDays} 天 · 上課 ${classDays} 天 · 休假 ${offDays} 天`;

  let html = '';
  for (let d = 1; d <= 31; d++) {
    const date = new Date(year, month - 1, d);
    if (date.getMonth() !== month - 1) break;
    const dow     = date.getDay();
    const isToday = isThisMonth && today.getDate() === d;
    const isWknd  = dow === 0 || dow === 6;
    const s       = lookup(codes[d - 1]);

    let shiftHtml = '';
    if (s.type === 'work') {
      const col = dotColor(s.start);
      shiftHtml = `<span class="shift-badge">${s.label}</span>
        <div class="shift-time">
          <span class="shift-dot" style="background:${col}"></span>
          ${s.start}<span class="arrow-sep"> → </span>${s.end}
        </div>`;
    } else if (s.type === 'class') {
      shiftHtml = `<span class="shift-class"><i class="bi bi-mortarboard-fill"></i>&nbsp;上課</span>`;
    } else if (s.type === 'off') {
      shiftHtml = `<span class="shift-off">休假</span>`;
    } else {
      shiftHtml = `<span class="shift-unknown">${s.label || '?'}</span>`;
    }

    html += `<div class="day-row${isToday ? ' today' : ''}${s.type === 'off' ? ' is-off' : ''}">
      <div class="day-date">
        <span class="day-num${isWknd ? ' wknd' : ''}">${d}</span>
        <span class="day-week${isWknd ? ' wknd' : ''}">週${WD[dow]}</span>
        ${isToday ? '<div class="today-pip"></div>' : ''}
      </div>
      <div class="vline"></div>
      <div class="day-shift">${shiftHtml}</div>
    </div>`;
  }

  document.getElementById('day-list').innerHTML = html;

  if (isThisMonth) {
    const el = document.querySelector('.today');
    if (el) setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'center' }), 80);
  }
})();
</script>
</body>
</html>
