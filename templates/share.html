<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>跨裝置剪貼簿</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<link rel="apple-touch-icon" href="/static/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="交通助理">
<meta name="theme-color" content="#f0f4ff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<script src="/static/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { overscroll-behavior: none; overflow-x: hidden; height: 100%; }

@keyframes pageIn {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes shake {
  0%,100% { transform: translateX(0); }
  20%     { transform: translateX(-8px); }
  40%     { transform: translateX(8px); }
  60%     { transform: translateX(-6px); }
  80%     { transform: translateX(6px); }
}

:root {
  --bg:      #f0f4ff;
  --surface: #ffffff;
  --border:  rgba(0,0,0,0.07);
  --text:    #0f0f1a;
  --sub:     #6b7280;
  --accent:  #3b82f6;
  --radius-l: 28px;
  --radius-m: 20px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100%;
  display: flex;
  flex-direction: column;
  animation: pageIn 0.38s cubic-bezier(0.22,1,0.36,1) both;
}

/* ── Topbar ── */
.topbar {
  width: 100%;
  background: rgba(240,244,255,0.9);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  box-shadow: 0 1px 0 rgba(0,0,0,0.06);
  padding: 12px 16px 14px;
  padding-top: max(14px, env(safe-area-inset-top) + 10px);
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  gap: 10px;
}
.back-btn {
  color: var(--accent);
  font-size: 0.95rem;
  font-weight: 600;
  text-decoration: none;
  min-width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
}
.topbar-title { font-size: 1.08rem; font-weight: 700; flex: 1; min-width: 0; }

/* 房間碼 pill（點擊可複製） */
.room-pill {
  display: none;
  align-items: center;
  gap: 6px;
  background: rgba(59,130,246,0.1);
  border: 1px solid rgba(59,130,246,0.22);
  border-radius: 100px;
  padding: 5px 12px 5px 9px;
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--accent);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  white-space: nowrap;
  flex-shrink: 0;
}
.room-pill.show { display: flex; }
.room-pill-code { font-size: 0.85rem; letter-spacing: 0.08em; font-variant-numeric: tabular-nums; }

/* ── Content ── */
.content {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 32px 20px max(40px, env(safe-area-inset-bottom) + 24px);
  max-width: 480px;
  width: 100%;
  margin: 0 auto;
}

/* ── State A: 選擇模式 ── */
#stateA {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
#stateB {
  display: none;
  flex-direction: column;
  flex: 1;
  gap: 16px;
}
#stateB.show { display: flex; }

/* 建立新房間按鈕 */
.create-btn {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 22px 20px;
  border-radius: var(--radius-l);
  background: var(--accent);
  border: none;
  cursor: pointer;
  font-family: inherit;
  -webkit-tap-highlight-color: transparent;
  text-align: left;
  box-shadow: 0 4px 20px rgba(59,130,246,0.3);
}
.create-icon { font-size: 2rem; line-height: 1; flex-shrink: 0; }
.create-title {
  font-size: 1rem;
  font-weight: 700;
  color: #fff;
  margin-bottom: 2px;
}
.create-sub { font-size: 0.76rem; color: rgba(255,255,255,0.72); }

/* 分隔線 */
.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--sub);
  font-size: 0.72rem;
  font-weight: 500;
}
.divider::before, .divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* 加入房間卡片 */
.join-card {
  width: 100%;
  border-radius: var(--radius-m);
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: 0 1px 6px rgba(0,0,0,0.05);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.join-label { font-size: 0.78rem; font-weight: 600; color: var(--sub); }
.join-input-row { display: flex; gap: 10px; }
.join-input {
  flex: 1;
  min-width: 0;
  padding: 12px 10px;
  border-radius: 14px;
  border: 1.5px solid var(--border);
  background: var(--bg);
  font-size: 1.5rem;
  font-weight: 800;
  color: var(--text);
  letter-spacing: 0.2em;
  font-variant-numeric: tabular-nums;
  outline: none;
  font-family: inherit;
  text-align: center;
  transition: border-color 0.2s;
  -webkit-appearance: none;
}
.join-input:focus { border-color: var(--accent); }
.join-input.error {
  border-color: #ef4444;
  animation: shake 0.4s cubic-bezier(0.36,0.07,0.19,0.97);
}
.join-btn {
  flex-shrink: 0;
  padding: 12px 20px;
  border-radius: 14px;
  background: var(--accent);
  color: #fff;
  font-size: 0.88rem;
  font-weight: 700;
  border: none;
  cursor: pointer;
  font-family: inherit;
  -webkit-tap-highlight-color: transparent;
}
.join-error {
  font-size: 0.76rem;
  color: #ef4444;
  display: none;
  font-weight: 500;
}
.join-error.show { display: block; }

/* ── State B: 同步畫面 ── */
.sync-textarea {
  flex: 1;
  width: 100%;
  border-radius: var(--radius-l);
  background: var(--surface);
  border: 1.5px solid var(--border);
  box-shadow: 0 1px 6px rgba(0,0,0,0.05);
  padding: 18px;
  font-size: 1rem;
  color: var(--text);
  resize: none;
  outline: none;
  font-family: inherit;
  line-height: 1.6;
  min-height: 300px;
  -webkit-appearance: none;
  transition: border-color 0.2s;
}
.sync-textarea:focus { border-color: var(--accent); }

.action-row { display: flex; gap: 10px; width: 100%; }
.action-btn {
  flex: 1;
  padding: 14px;
  border-radius: 16px;
  font-size: 0.9rem;
  font-weight: 700;
  border: none;
  cursor: pointer;
  font-family: inherit;
  -webkit-tap-highlight-color: transparent;
}
.btn-copy  { background: var(--accent); color: #fff; }
.btn-clear { background: rgba(239,68,68,0.1); color: #ef4444; border: 1px solid rgba(239,68,68,0.18); }

/* ── Dark Mode ── */
@media (prefers-color-scheme: dark) {
  :root {
    --bg:      #000;
    --surface: #1c1c1e;
    --border:  rgba(255,255,255,0.08);
    --text:    #f2f2f7;
    --sub:     #636366;
    --accent:  #60a5fa;
  }
  .topbar {
    background: rgba(0,0,0,0.88);
    box-shadow: 0 1px 0 rgba(255,255,255,0.06);
  }
  .create-btn { box-shadow: 0 4px 20px rgba(96,165,250,0.2); }
  .join-card  { box-shadow: none; }
  .join-input { background: #2c2c2e; }
  .sync-textarea { box-shadow: none; }
  .btn-clear {
    background: rgba(239,68,68,0.15);
    border-color: rgba(239,68,68,0.25);
  }
  .room-pill {
    background: rgba(96,165,250,0.12);
    border-color: rgba(96,165,250,0.25);
  }
}
</style>
</head>
<body>

<div class="topbar">
  <a href="/" class="back-btn">‹ 返回</a>
  <div class="topbar-title" id="topbarTitle">跨裝置剪貼簿</div>
  <div class="room-pill" id="roomPill" onclick="copyRoomCode()" title="點擊複製房間碼">
    <span>📋</span>
    <span class="room-pill-code" id="roomPillCode">0000</span>
  </div>
</div>

<div class="content">

  <!-- State A: 選擇建立或加入 -->
  <div id="stateA">
    <button class="create-btn" id="createBtn" onclick="doCreate()">
      <span class="create-icon">➕</span>
      <div>
        <div class="create-title">建立新房間</div>
        <div class="create-sub">產生 4 位碼，讓對方輸入加入</div>
      </div>
    </button>

    <div class="divider">或</div>

    <div class="join-card">
      <div class="join-label">加入現有房間</div>
      <div class="join-input-row">
        <input id="joinInput" class="join-input" type="tel" inputmode="numeric"
               maxlength="4" placeholder="0000"
               onkeydown="if(event.key==='Enter')joinRoom()">
        <button class="join-btn" id="joinBtn" onclick="joinRoom()">加入</button>
      </div>
      <div class="join-error" id="joinError">找不到此房間，請確認號碼</div>
    </div>
  </div>

  <!-- State B: 同步畫面 -->
  <div id="stateB">
    <!-- Debug 狀態列 -->
    <div id="dbg" style="font-size:0.72rem;color:#6b7280;background:rgba(0,0,0,0.05);border-radius:10px;padding:8px 12px;line-height:1.7;word-break:break-all;"></div>
    <textarea class="sync-textarea" id="syncTextarea"
      placeholder="在這裡輸入文字或網址，對方裝置會即時同步…"></textarea>
    <div class="action-row">
      <button class="action-btn btn-copy"  id="copyBtn"  onclick="doCopy()">📋 複製內容</button>
      <button class="action-btn btn-clear" id="clearBtn" onclick="doClear()">🗑️ 清空</button>
    </div>
  </div>

</div>

<script>
const supa = supabase.createClient(SUPA_URL, SUPA_KEY);

let currentRoom = null;
let channel     = null;
let debounceTimer;

let dbgLines = [];
function dbg(msg) {
  const t = new Date().toLocaleTimeString('zh-TW', { hour12: false });
  dbgLines.push('[' + t + '] ' + msg);
  if (dbgLines.length > 12) dbgLines.shift();
  const el = document.getElementById('dbg');
  if (el) el.textContent = dbgLines.join('\n');
}

function randCode() {
  return Math.floor(1000 + Math.random() * 9000).toString();
}

/* 建立 postgres_changes channel（無 filter，前端自行比對 room_code）*/
function connectChannel(code) {
  if (channel) supa.removeChannel(channel);
  dbg('connectChannel: ' + code);
  channel = supa.channel('share-db-' + code)
    .on('postgres_changes', {
      event:  'UPDATE',
      schema: 'public',
      table:  'share_rooms'
    }, payload => {
      dbg('收到事件 room=' + payload.new.room_code + ' text=' + (payload.new.text || '').slice(0, 20));
      if (payload.new.room_code !== currentRoom) { dbg('room 不符，略過'); return; }
      const ta = document.getElementById('syncTextarea');
      if (document.activeElement !== ta) ta.value = payload.new.text ?? '';
    });
  return new Promise(resolve => {
    const t = setTimeout(() => { dbg('subscribe 逾時'); resolve(false); }, 12000);
    channel.subscribe(status => {
      dbg('subscribe status: ' + status);
      if (status === 'SUBSCRIBED')                              { clearTimeout(t); resolve(true);  }
      if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT'){ clearTimeout(t); resolve(false); }
    });
  });
}

/* 彈簧按鈕效果 */
function addSpring(el) {
  el.addEventListener('pointerdown', () => {
    el.style.transition = 'transform 0.1s cubic-bezier(0.34,1.56,0.64,1)';
    el.style.transform  = 'scale(0.965)';
    navigator.vibrate?.([8]);
  });
  ['pointerup','pointerleave','pointercancel'].forEach(ev =>
    el.addEventListener(ev, () => {
      el.style.transition = 'transform 0.55s cubic-bezier(0.34,1.56,0.64,1)';
      el.style.transform  = 'scale(1)';
    })
  );
}
document.querySelectorAll('button').forEach(addSpring);

/* ── 建立新房間（DB + WebSocket 平行）── */
async function doCreate() {
  const btn = document.getElementById('createBtn');
  btn.disabled = true;
  btn.querySelector('.create-title').textContent = '連線中…';

  const code = randCode();

  const [subOk, { error }] = await Promise.all([
    connectChannel(code),
    supa.from('share_rooms').upsert(
      { room_code: code, text: '', updated_at: new Date().toISOString() },
      { onConflict: 'room_code' }
    )
  ]);

  btn.disabled = false;
  btn.querySelector('.create-title').textContent = '建立新房間';

  if (error || !subOk) {
    if (channel) { supa.removeChannel(channel); channel = null; }
    alert(error ? '建立失敗，請重試' : '連線失敗，請重試');
    return;
  }

  currentRoom = code;
  enterSyncMode(code);
}

/* ── 加入房間（DB 驗證 + WebSocket 平行）── */
async function joinRoom() {
  const input = document.getElementById('joinInput');
  const code  = input.value.trim();
  const errEl = document.getElementById('joinError');
  const btn   = document.getElementById('joinBtn');

  errEl.classList.remove('show');
  input.classList.remove('error');

  if (code.length !== 4) {
    input.classList.add('error');
    setTimeout(() => input.classList.remove('error'), 600);
    return;
  }

  btn.textContent = '連線中…';
  btn.disabled = true;

  const [subOk, { data }] = await Promise.all([
    connectChannel(code),
    supa.from('share_rooms').select('room_code, text').eq('room_code', code).single()
  ]);

  btn.textContent = '加入';
  btn.disabled = false;

  if (!data) {
    if (channel) { supa.removeChannel(channel); channel = null; }
    input.classList.add('error');
    errEl.classList.add('show');
    setTimeout(() => input.classList.remove('error'), 600);
    return;
  }
  if (!subOk) {
    if (channel) { supa.removeChannel(channel); channel = null; }
    alert('連線失敗，請重試');
    return;
  }

  currentRoom = code;
  document.getElementById('syncTextarea').value = data.text || '';
  enterSyncMode(code);
}

/* ── 進入同步畫面（此時 channel 已 SUBSCRIBED）── */
function enterSyncMode(code) {
  document.getElementById('stateA').style.display = 'none';
  document.getElementById('stateB').classList.add('show');
  document.getElementById('topbarTitle').textContent = '剪貼簿';
  document.getElementById('roomPillCode').textContent = code;
  document.getElementById('roomPill').classList.add('show');
  setTimeout(() => document.getElementById('syncTextarea').focus(), 100);
}

/* ── 推送文字（debounce 150ms）── */
document.getElementById('syncTextarea').addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(pushText, 150);
});

function pushText() {
  if (!currentRoom) return;
  const text = document.getElementById('syncTextarea').value;
  dbg('pushText len=' + text.length);
  /* 寫 DB → 觸發 postgres_changes UPDATE 事件 → 對方收到 */
  supa.from('share_rooms')
    .update({ text, updated_at: new Date().toISOString() })
    .eq('room_code', currentRoom)
    .then(({ error }) => {
      dbg('update ' + (error ? '失敗: ' + error.message : '成功'));
      if (!error)
        supa.from('share_rooms')
          .delete()
          .lt('updated_at', new Date(Date.now() - 43200000).toISOString());
    });
}

/* ── 複製房間碼（點 topbar pill）── */
async function copyRoomCode() {
  if (!currentRoom) return;
  try {
    await navigator.clipboard.writeText(currentRoom);
    const pill = document.getElementById('roomPill');
    const orig = pill.querySelector('.room-pill-code').textContent;
    pill.querySelector('span:first-child').textContent = '✅';
    setTimeout(() => { pill.querySelector('span:first-child').textContent = '📋'; }, 1500);
  } catch {}
}

/* ── 複製內容 ── */
async function doCopy() {
  const text = document.getElementById('syncTextarea').value;
  if (!text) return;
  try {
    await navigator.clipboard.writeText(text);
    const btn = document.getElementById('copyBtn');
    btn.textContent = '✅ 已複製';
    setTimeout(() => btn.textContent = '📋 複製內容', 1800);
  } catch {}
}

/* ── 清空 ── */
function doClear() {
  document.getElementById('syncTextarea').value = '';
  pushText();
}
</script>
</body>
</html>
