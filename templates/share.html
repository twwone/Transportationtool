<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>跨裝置剪貼簿</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<link rel="apple-touch-icon" href="/static/icon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="交通助理">
<meta name="theme-color" content="#f0f4ff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{overscroll-behavior:none;overflow-x:hidden;height:100%}

@keyframes pageIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes cardIn{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes alertIn{from{opacity:0;transform:scale(.88) translateY(16px)}to{opacity:1;transform:scale(1) translateY(0)}}

:root{
  --bg:#fbfbfd;
  --surface:#ffffff;
  --border:rgba(0,0,0,0.08);
  --divider:rgba(0,0,0,0.09);
  --text:#1d1d1f;
  --sub:#86868b;
  --accent:#0071e3;
  --danger:#ef4444;
  --radius-l:24px;
  --radius-m:18px;
  --glass-bg:rgba(255,255,255,.2);
  --glass-border:rgba(255,255,255,.4);
  --glass-shadow:0 8px 32px rgba(0,0,0,.08);
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#000;
    --surface:#1c1c1e;
    --border:rgba(255,255,255,0.09);
    --divider:rgba(255,255,255,0.12);
    --text:#f5f5f7;
    --sub:#86868b;
    --accent:#2997ff;
    --danger:#ff453a;
    --glass-bg:rgba(255,255,255,.07);
    --glass-border:rgba(255,255,255,.12);
    --glass-shadow:0 8px 32px rgba(0,0,0,.35);
  }
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100%;
  display:flex;
  flex-direction:column;
  animation:pageIn .35s cubic-bezier(.22,1,.36,1) both;
}

body::before{
  content:'';
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse 80% 50% at 20% 40%,rgba(0,0,0,.035) 0%,transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 60%,rgba(0,0,0,.025) 0%,transparent 60%);
  pointer-events:none;z-index:0;
}
@media(prefers-color-scheme:dark){
  body::before{
    background:
      radial-gradient(ellipse 80% 50% at 20% 40%,rgba(255,255,255,.05) 0%,transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 60%,rgba(255,255,255,.035) 0%,transparent 60%);
  }
}

/* ── Topbar ── */
.topbar{
  position:sticky;top:0;z-index:100;
  width:100%;
  background:rgba(251,251,253,.85);
  backdrop-filter:blur(32px) saturate(180%);
  -webkit-backdrop-filter:blur(32px) saturate(180%);
  border-bottom:.5px solid rgba(0,0,0,.06);
  padding:12px 16px 14px;
  padding-top:max(14px, env(safe-area-inset-top) + 10px);
  display:flex;align-items:center;gap:8px;
}
@media(prefers-color-scheme:dark){
  .topbar{background:rgba(0,0,0,.85);border-color:rgba(255,255,255,.06);}
}
.back-btn{
  color:var(--accent);font-size:.95rem;font-weight:600;
  text-decoration:none;min-width:44px;height:44px;
  display:flex;align-items:center;flex-shrink:0;
  -webkit-tap-highlight-color:transparent;
}
.topbar-title{font-size:1.05rem;font-weight:700;letter-spacing:-0.02em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.room-pill{
  display:none;align-items:center;gap:5px;
  padding:5px 10px;border-radius:100px;
  background:rgba(0,113,227,.1);border:1px solid rgba(0,113,227,.22);
  font-size:.72rem;font-weight:700;color:var(--accent);
  cursor:pointer;white-space:nowrap;flex-shrink:0;
  -webkit-tap-highlight-color:transparent;
}
.room-pill.show{display:flex}
.sync-dot{
  display:inline-block;width:6px;height:6px;
  border-radius:50%;background:#22c55e;flex-shrink:0;
  transition:background .4s;
}
.sync-dot.syncing{background:#f59e0b;animation:pulse .8s ease-in-out infinite}

/* ── Content ── */
.content{
  flex:1;display:flex;flex-direction:column;
  padding:24px 16px max(48px, env(safe-area-inset-bottom) + 28px);
  max-width:480px;width:100%;margin:0 auto;
  position:relative;z-index:1;
}

/* ── State A ── */
#stateA{display:flex;flex-direction:column;gap:16px}
#stateB{display:none;flex-direction:column;flex:1;gap:13px}
#stateB.show{display:flex}

.glass-card{
  border-radius:var(--radius-l);
  backdrop-filter:blur(40px) saturate(200%);
  -webkit-backdrop-filter:blur(40px) saturate(200%);
  background:var(--glass-bg);
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-shadow);
  padding:20px;
}

.create-btn{
  width:100%;display:flex;align-items:center;gap:16px;
  padding:22px 20px;border-radius:var(--radius-l);
  background:var(--accent);border:none;cursor:pointer;
  font-family:inherit;-webkit-tap-highlight-color:transparent;
  text-align:left;
  box-shadow:0 4px 24px rgba(0,113,227,.35);
}
@media(prefers-color-scheme:dark){.create-btn{box-shadow:0 4px 24px rgba(96,165,250,.25)}}
.c-icon{font-size:1.8rem;line-height:1;flex-shrink:0}
.c-title{font-size:1rem;font-weight:700;letter-spacing:-0.015em;color:#fff;margin-bottom:2px}
.c-sub{font-size:.75rem;color:rgba(255,255,255,.7)}

.divider{display:flex;align-items:center;gap:12px;color:var(--sub);font-size:.72rem;font-weight:500}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(0,0,0,.08)}
@media(prefers-color-scheme:dark){.divider::before,.divider::after{background:rgba(255,255,255,.08)}}

.join-label{font-size:.78rem;font-weight:600;color:var(--sub);margin-bottom:10px}
.join-row{display:flex;gap:10px}
.join-input{
  flex:1;min-width:0;padding:14px 10px;
  border-radius:16px;
  border:1.5px solid rgba(0,0,0,.1);
  background:rgba(255,255,255,.65);
  font-size:1.65rem;font-weight:800;color:var(--text);
  letter-spacing:.25em;font-variant-numeric:tabular-nums;
  outline:none;font-family:inherit;text-align:center;
  -webkit-appearance:none;
  transition:border-color .2s,box-shadow .2s;
}
.join-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,113,227,.12)}
.join-input.error{border-color:var(--danger);animation:shake .4s}
@media(prefers-color-scheme:dark){.join-input{background:rgba(44,44,46,.85);border-color:rgba(255,255,255,.1)}}
.join-btn{
  flex-shrink:0;padding:14px 22px;border-radius:16px;
  background:var(--accent);color:#fff;font-size:.9rem;font-weight:700;
  border:none;cursor:pointer;font-family:inherit;
  -webkit-tap-highlight-color:transparent;
  box-shadow:0 2px 12px rgba(0,113,227,.3);
}
.join-err{font-size:.75rem;color:var(--danger);display:none;font-weight:500;margin-top:6px}
.join-err.show{display:block}

/* ── State B ── */

.url-card{
  display:none;border-radius:var(--radius-m);
  backdrop-filter:blur(40px) saturate(200%);
  -webkit-backdrop-filter:blur(40px) saturate(200%);
  background:var(--glass-bg);border:1px solid var(--glass-border);
  box-shadow:var(--glass-shadow);
  padding:12px 14px;align-items:center;gap:10px;
  animation:fadeIn .25s ease;
}
.url-card.show{display:flex}
.url-icon{font-size:1.1rem;flex-shrink:0}
.url-text{flex:1;min-width:0;font-size:.78rem;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.url-open{
  flex-shrink:0;padding:7px 13px;border-radius:10px;
  background:var(--accent);color:#fff;font-size:.76rem;font-weight:700;
  border:none;cursor:pointer;font-family:inherit;
  -webkit-tap-highlight-color:transparent;
}

.img-gallery{
  display:flex;gap:8px;
  overflow-x:auto;padding:2px 0 8px;
  -ms-overflow-style:none;scrollbar-width:none;
  min-height:0;
}
.img-gallery:empty{display:none}
.img-gallery::-webkit-scrollbar{display:none}
.img-thumb{
  position:relative;flex-shrink:0;
  width:110px;height:110px;border-radius:14px;
  overflow:hidden;background:rgba(0,0,0,.06);
  animation:fadeIn .25s ease;
}
.img-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.img-thumb-del{
  position:absolute;top:5px;right:5px;
  width:22px;height:22px;border-radius:50%;
  background:rgba(0,0,0,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  color:#fff;border:none;cursor:pointer;
  font-size:.72rem;display:flex;align-items:center;justify-content:center;
  line-height:1;-webkit-tap-highlight-color:transparent;
}
.img-add{
  flex-shrink:0;width:72px;height:110px;border-radius:14px;
  border:2px dashed rgba(0,113,227,.35);
  background:rgba(0,113,227,.05);
  color:var(--accent);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;
  cursor:pointer;font-size:1.4rem;font-family:inherit;
  -webkit-tap-highlight-color:transparent;
}
.img-add-label{font-size:.6rem;font-weight:600}
@media(prefers-color-scheme:dark){
  .img-thumb{background:rgba(255,255,255,.06)}
  .img-add{border-color:rgba(96,165,250,.3);background:rgba(96,165,250,.06)}
}

.up-status{display:none;font-size:.74rem;color:var(--sub);text-align:center}
.up-status.show{display:block}
.img-thumb img{cursor:zoom-in}

/* lightbox */
.lightbox{
  position:fixed;inset:0;z-index:9999;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.85);
  backdrop-filter:blur(20px) saturate(160%);
  -webkit-backdrop-filter:blur(20px) saturate(160%);
  opacity:0;pointer-events:none;
  transition:opacity .22s ease;
}
.lightbox.open{opacity:1;pointer-events:auto}
.lightbox-img{
  max-width:min(92vw,960px);max-height:85dvh;
  border-radius:14px;object-fit:contain;
  transform:scale(.88);
  transition:transform .25s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 24px 80px rgba(0,0,0,.6);
  user-select:none;-webkit-user-drag:none;
}
.lightbox.open .lightbox-img{transform:scale(1)}
.lightbox-close{
  position:fixed;top:18px;right:18px;
  width:40px;height:40px;border-radius:50%;
  background:rgba(255,255,255,.18);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.25);
  color:#fff;font-size:1.1rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .18s;
}
.lightbox-close:hover{background:rgba(255,255,255,.3)}
.lightbox-nav{
  position:fixed;top:50%;transform:translateY(-50%);
  width:44px;height:44px;border-radius:50%;
  background:rgba(255,255,255,.18);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.25);
  color:#fff;font-size:1.2rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .18s, opacity .18s;
}
.lightbox-nav:hover{background:rgba(255,255,255,.3)}
.lightbox-nav.hidden{opacity:0;pointer-events:none}
.lightbox-prev{left:14px}
.lightbox-next{right:14px}
.lightbox-counter{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  color:rgba(255,255,255,.7);font-size:.82rem;letter-spacing:.04em;
  pointer-events:none;
}

.sync-ta{
  flex:1;width:100%;border-radius:var(--radius-m);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  background:rgba(255,255,255,.52);
  border:1.5px solid rgba(255,255,255,.6);
  box-shadow:0 4px 16px rgba(0,0,0,.06);
  padding:16px;font-size:1rem;color:var(--text);
  resize:none;outline:none;font-family:inherit;
  line-height:1.65;min-height:180px;
  -webkit-appearance:none;
  transition:border-color .2s,box-shadow .2s;
}
.sync-ta:focus{border-color:rgba(0,113,227,.4);box-shadow:0 0 0 3px rgba(0,113,227,.08)}
@media(prefers-color-scheme:dark){.sync-ta{background:rgba(28,28,30,.75);border-color:rgba(255,255,255,.1)}}

/* ── File Card ── */
.file-card{
  display:none;
  border-radius:20px;
  backdrop-filter:blur(40px) saturate(200%);
  -webkit-backdrop-filter:blur(40px) saturate(200%);
  background:var(--glass-bg);
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-shadow);
  padding:14px 16px;
  align-items:center;
  gap:14px;
  animation:cardIn .3s cubic-bezier(.22,1,.36,1) both;
}
.file-card.show{display:flex}
.file-icon-wrap{
  width:48px;height:48px;
  border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.55rem;
  flex-shrink:0;
  color:#fff;
  background:linear-gradient(135deg,#2997ff,#0071e3) !important;
  box-shadow:0 1px 2px rgba(0,0,0,.14),0 4px 10px rgba(0,0,0,.10);
}
.file-info{flex:1;min-width:0}
.file-name-text{font-size:.9rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);margin-bottom:3px}
.file-type-text{font-size:.72rem;color:var(--sub);font-weight:500}
.file-dl-btn{
  flex-shrink:0;padding:11px 18px;border-radius:100px;
  background:var(--accent);color:#fff;font-size:.82rem;font-weight:700;
  border:none;cursor:pointer;font-family:inherit;white-space:nowrap;
  box-shadow:0 3px 12px rgba(0,113,227,.32);
  -webkit-tap-highlight-color:transparent;
}
@media(prefers-color-scheme:dark){.file-dl-btn{box-shadow:0 3px 12px rgba(96,165,250,.22)}}

/* ── Action rows ── */
.act-row{display:flex;gap:10px}
.act-btn{
  flex:1;padding:14px 8px;border-radius:18px;
  font-size:.86rem;font-weight:700;border:none;
  cursor:pointer;font-family:inherit;
  -webkit-tap-highlight-color:transparent;
  white-space:nowrap;
}
.btn-copy{background:var(--accent);color:#fff;box-shadow:0 2px 12px rgba(0,113,227,.28)}
.btn-file{
  background:var(--glass-bg);
  border:1px solid var(--glass-border);
  backdrop-filter:blur(10px);
  color:var(--text);
}
.btn-clear{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.18);color:var(--danger)}
@media(prefers-color-scheme:dark){.btn-clear{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.28)}}

.destroy-btn{
  width:100%;padding:14px;border-radius:18px;
  background:transparent;
  border:1px solid rgba(239,68,68,.3);
  color:var(--danger);font-size:.82rem;font-weight:600;
  cursor:pointer;font-family:inherit;
  -webkit-tap-highlight-color:transparent;
  transition:background .2s;
}
.destroy-btn:hover{background:rgba(239,68,68,.06)}
@media(prefers-color-scheme:dark){.destroy-btn{border-color:rgba(255,69,58,.3)}}

/* ── Drop overlay ── */
.drop-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,113,227,.08);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  z-index:150;align-items:center;justify-content:center;
  pointer-events:none;animation:fadeIn .18s ease;
}
.drop-overlay.show{display:flex}
.drop-overlay::before{
  content:'';position:absolute;inset:16px;
  border:2.5px dashed var(--accent);border-radius:28px;opacity:.7;
}
.drop-msg{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  color:var(--accent);font-weight:700;font-size:1.05rem;
  text-align:center;z-index:1;
}
.drop-msg-icon{font-size:3rem;line-height:1}

/* ── iOS Alert ── */
.ios-alert{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.45);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  z-index:300;align-items:center;justify-content:center;padding:24px;
}
.ios-alert.show{display:flex}
.ios-alert-card{
  background:var(--surface);border-radius:20px;
  padding:28px 22px 20px;text-align:center;
  width:100%;max-width:300px;
  box-shadow:0 24px 80px rgba(0,0,0,.25);
  animation:alertIn .28s cubic-bezier(.22,1,.36,1) both;
}
.ios-alert-title{font-size:1.05rem;font-weight:700;letter-spacing:-0.02em;margin-bottom:8px}
.ios-alert-msg{font-size:.875rem;color:var(--sub);margin-bottom:22px;line-height:1.5}
.ios-alert-btns{display:flex;flex-direction:column;gap:8px}
.alert-btn{
  width:100%;padding:13px;border-radius:14px;
  background:rgba(0,0,0,.05);
  border:none;cursor:pointer;font-family:inherit;
  font-size:.9rem;font-weight:600;color:var(--text);
  -webkit-tap-highlight-color:transparent;
}
@media(prefers-color-scheme:dark){.alert-btn{background:rgba(255,255,255,.1)}}
.alert-btn-primary{background:var(--accent);color:#fff}
.alert-btn-danger{background:rgba(239,68,68,.12);color:var(--danger)}
@media(prefers-color-scheme:dark){.alert-btn-danger{background:rgba(255,69,58,.18)}}

/* ── Expired/Destroy overlay ── */
.expire-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  z-index:250;align-items:center;justify-content:center;padding:24px;
}
.expire-overlay.show{display:flex;animation:fadeIn .3s ease}
.expire-card{
  background:var(--surface);border-radius:28px;
  padding:36px 24px;text-align:center;
  width:100%;max-width:320px;
  box-shadow:0 24px 80px rgba(0,0,0,.22);
}
.expire-icon{font-size:3rem;margin-bottom:14px}
.expire-title{font-size:1.2rem;font-weight:700;letter-spacing:-0.02em;margin-bottom:8px}
.expire-sub{font-size:.85rem;color:var(--sub);margin-bottom:24px}
.new-btn{
  width:100%;padding:16px;border-radius:18px;
  background:var(--accent);color:#fff;
  font-size:1rem;font-weight:700;border:none;cursor:pointer;
  font-family:inherit;box-shadow:0 4px 16px rgba(0,113,227,.32);
}

.sp{
  display:inline-block;width:14px;height:14px;
  border:2px solid rgba(255,255,255,.3);border-top-color:#fff;
  border-radius:50%;animation:spin .75s linear infinite;
  vertical-align:middle;margin-right:5px;
}

/* ── History ── */
#historySection{display:none}
.history-label{font-size:.78rem;font-weight:600;color:var(--sub);margin-bottom:8px}
#historyList{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-m);overflow:hidden;
}
.history-card{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;border-radius:0;
  background:transparent;border:none;border-bottom:1px solid var(--divider);
  box-shadow:none;
  cursor:pointer;margin-bottom:0;
  animation:cardIn .3s cubic-bezier(.22,1,.36,1) both;
  -webkit-tap-highlight-color:transparent;
  transition:opacity .15s, background .15s;
}
.history-card:last-child{border-bottom:none}
.history-card:active{opacity:.65;background:rgba(0,0,0,.04)}
@media(prefers-color-scheme:dark){.history-card:active{background:rgba(255,255,255,.06)}}
.history-code-pill{
  font-size:1.15rem;font-weight:800;letter-spacing:.1em;
  font-variant-numeric:tabular-nums;
  color:var(--accent);flex-shrink:0;min-width:40px;text-align:center;
}
.history-info{flex:1;min-width:0}
.history-preview{
  font-size:.82rem;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-bottom:2px;
}
.history-time{font-size:.7rem;color:var(--sub)}
.history-del{
  flex-shrink:0;width:28px;height:28px;border-radius:50%;
  background:rgba(0,0,0,.05);
  border:none;cursor:pointer;color:var(--sub);
  font-size:.75rem;display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;
}
@media(prefers-color-scheme:dark){.history-del{background:rgba(255,255,255,.08)}}
</style>
</head>
<body>

<div class="topbar">
  <a href="/" class="back-btn">‹ 返回</a>
  <div class="topbar-title" id="topTitle">跨裝置剪貼簿</div>
  <div class="room-pill" id="roomPill" onclick="copyCode()" title="點擊複製房間碼">
    <span class="sync-dot" id="syncDot"></span>
    <span id="pillCode">----</span>
  </div>
</div>

<div class="content">

  <!-- State A -->
  <div id="stateA">

    <!-- 最近的房間 -->
    <div id="historySection">
      <div class="history-label">最近的房間</div>
      <div id="historyList"></div>
    </div>

    <button class="create-btn" id="createBtn" onclick="doCreate()">
      <span class="c-icon"><i class="bi bi-plus-lg"></i></span>
      <div>
        <div class="c-title">建立新房間</div>
        <div class="c-sub">產生 4 位碼，讓對方輸入加入</div>
      </div>
    </button>

    <div class="divider">或</div>

    <div class="glass-card">
      <div class="join-label">加入現有房間</div>
      <div class="join-row">
        <input id="joinInput" class="join-input" type="tel" inputmode="numeric"
               maxlength="4" placeholder="0000"
               oninput="this.value=this.value.replace(/\D/g,'')"
               onkeydown="if(event.key==='Enter')doJoin()">
        <button class="join-btn" id="joinBtn" onclick="doJoin()">加入</button>
      </div>
      <div class="join-err" id="joinErr">找不到此房間，請確認號碼</div>
    </div>
  </div>

  <!-- State B -->
  <div id="stateB">
    <!-- URL card -->
    <div class="url-card" id="urlCard">
      <span class="url-icon"><i class="bi bi-link-45deg"></i></span>
      <span class="url-text" id="urlText"></span>
      <button class="url-open" onclick="openUrl()"><i class="bi bi-globe2"></i> 點擊前往</button>
    </div>

    <!-- Image Gallery -->
    <div class="img-gallery" id="imgGallery"></div>

    <!-- Upload status -->
    <div class="up-status" id="upStatus"></div>

    <!-- Textarea -->
    <textarea class="sync-ta" id="ta"
      placeholder="輸入文字或網址，Ctrl+V 貼上圖片，拖曳或點「檔案」上傳…"></textarea>

    <!-- File card -->
    <div class="file-card" id="fileCard">
      <div class="file-icon-wrap" id="fileIconWrap">
        <span id="fileIconEmoji"><i class="bi bi-file-earmark-fill"></i></span>
      </div>
      <div class="file-info">
        <div class="file-name-text" id="fileNameText">filename.pdf</div>
        <div class="file-type-text" id="fileTypeText">PDF 檔案</div>
      </div>
      <button class="file-dl-btn" id="fileDlBtn" onclick="downloadFile()"><i class="bi bi-download"></i> 點擊下載</button>
    </div>

    <!-- Main actions -->
    <div class="act-row">
      <button class="act-btn btn-copy" id="copyBtn" onclick="doCopy()"><i class="bi bi-clipboard-fill"></i> 複製</button>
      <button class="act-btn btn-file" id="fileBtn" onclick="pickFile()"><i class="bi bi-paperclip"></i> 檔案</button>
      <button class="act-btn btn-clear" onclick="doClear()"><i class="bi bi-trash3-fill"></i> 清空</button>
    </div>

    <!-- Destroy room -->
    <button class="destroy-btn" onclick="doDestroy()"><i class="bi bi-x-octagon-fill"></i> 銷毀房間（雙方同步清除）</button>

    <input type="file" id="fileIn" multiple
      accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.md,.zip,.rar,.mp3,.mp4"
      style="display:none">
    <input type="file" id="imgIn" accept="image/*" multiple style="display:none">
  </div>

</div>

<!-- Drop overlay -->
<div class="drop-overlay" id="dropOverlay">
  <div class="drop-msg">
    <span class="drop-msg-icon"><i class="bi bi-paperclip"></i></span>
    <span>放開以上傳（圖片可多張，單檔 ≤ 8MB）</span>
  </div>
</div>

<!-- iOS Alert -->
<div class="ios-alert" id="iosAlert">
  <div class="ios-alert-card">
    <div class="ios-alert-title" id="alertTitle"></div>
    <div class="ios-alert-msg" id="alertMsg"></div>
    <div class="ios-alert-btns" id="alertBtns"></div>
  </div>
</div>

<!-- Expired / Destroy overlay -->
<div class="expire-overlay" id="expireOverlay">
  <div class="expire-card">
    <div class="expire-icon"><i class="bi bi-wind"></i></div>
    <div class="expire-title">房間已銷毀</div>
    <div class="expire-sub" id="expireSub">房間閒置過久或已不存在</div>
    <button class="new-btn" onclick="backToA()">建立新房間</button>
  </div>
</div>

<script>
const IK_PUBLIC_KEY     = 'public_TdqV/g8SxhEZMC6bl23MoGM3nwY=';
const MAX_DIRECT        = 8 * 1024 * 1024;
const MAX_COMPRESS_TGT  = 5 * 1024 * 1024;
const POLL_INTERVAL     = 1500;
const HISTORY_POLL_MS   = 30000;

const IMG_EXTS  = new Set(['jpg','jpeg','png','gif','webp','heic','heif','bmp']);
const FILE_EXTS = new Set(['pdf','doc','docx','xls','xlsx','ppt','pptx','txt','md','zip','rar','mp3','mp4']);

let room              = null;
let pollTid           = null;
let historyTid        = null;
let debTid            = null;
let pushing           = false;
let lastPushAt        = 0;
let lastTyped         = 0;
let lastKnownServerTs = 0;
let detectedUrl       = null;
let currentFileUrl    = null;
let currentImages     = [];

const $id = id => document.getElementById(id);

// ── Global Room History（從 server 拉，跨裝置同步）─────────────
function relTime(ts) {
  const d = Date.now() - ts * 1000;
  if (d < 60000)     return '剛剛';
  if (d < 3600000)   return Math.floor(d / 60000) + ' 分鐘前';
  return Math.floor(d / 3600000) + ' 小時前';
}

async function loadGlobalHistory() {
  try {
    const resp = await fetch('/api/share/rooms');
    if (!resp.ok) return;
    const rooms = await resp.json();
    renderHistory(rooms);
  } catch {}
}

function renderHistory(rooms) {
  const sec  = $id('historySection');
  const list = $id('historyList');
  if (!rooms || !rooms.length) { sec.style.display = 'none'; return; }
  sec.style.display = 'block';
  list.innerHTML = '';
  rooms.forEach(entry => {
    const card = document.createElement('div');
    card.className = 'history-card';
    card.innerHTML =
      '<div class="history-code-pill">' + entry.code + '</div>' +
      '<div class="history-info">' +
        '<div class="history-preview">' + (entry.preview || '空房間') + '</div>' +
        '<div class="history-time">' + relTime(entry.updated_at) + '</div>' +
      '</div>';
    card.addEventListener('click', () => enterFromHistory(entry.code));
    applySpring(card);
    list.appendChild(card);
  });
}

async function enterFromHistory(code) {
  try {
    const resp = await fetch('/api/share/room/' + code);
    if (resp.status === 404) {
      removeFromHistory(code);
      showAlert('房間已失效', '此房間已過期或不存在', [{label:'確認',style:'primary',action:null}]);
      return;
    }
    const data = await resp.json();
    room = code;
    lastKnownServerTs = data.updated_at || 0;
    renderRoom(data, true);
    enterSync(code);
  } catch {
    showAlert('連線失敗', '請稍後再試', [{label:'確認',style:'primary',action:null}]);
  }
}

// ── Spring buttons ─────────────────────────────────────────────
function applySpring(el) {
  el.addEventListener('pointerdown', () => {
    el.style.transition = 'transform .1s cubic-bezier(.34,1.56,.64,1)';
    el.style.transform  = 'scale(.965)';
    navigator.vibrate?.([8]);
  });
  ['pointerup','pointerleave','pointercancel'].forEach(ev =>
    el.addEventListener(ev, () => {
      el.style.transition = 'transform .55s cubic-bezier(.34,1.56,.64,1)';
      el.style.transform  = 'scale(1)';
    })
  );
}
document.querySelectorAll('button').forEach(applySpring);

// ── iOS Alert ──────────────────────────────────────────────────
function showAlert(title, msg, buttons) {
  $id('alertTitle').textContent = title;
  $id('alertMsg').textContent   = msg;
  const btns = $id('alertBtns');
  btns.innerHTML = '';
  buttons.forEach(b => {
    const btn = document.createElement('button');
    btn.className = 'alert-btn'
      + (b.style === 'primary' ? ' alert-btn-primary' : '')
      + (b.style === 'danger'  ? ' alert-btn-danger'  : '');
    btn.textContent = b.label;
    btn.onclick = () => { $id('iosAlert').classList.remove('show'); if (b.action) b.action(); };
    applySpring(btn);
    btns.appendChild(btn);
  });
  $id('iosAlert').classList.add('show');
}

// ── Drag & Drop ────────────────────────────────────────────────
let _dc = 0;
document.addEventListener('dragenter', () => { if (!room) return; _dc++; $id('dropOverlay').classList.add('show'); });
document.addEventListener('dragleave', () => { _dc = Math.max(0, _dc - 1); if (_dc === 0) $id('dropOverlay').classList.remove('show'); });
document.addEventListener('dragover',  e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault(); _dc = 0; $id('dropOverlay').classList.remove('show');
  if (!room) return;
  const files = Array.from(e.dataTransfer?.files || []);
  if (!files.length) return;
  if (files.length > 1) {
    const hasNonImg = files.some(f => {
      const ext = (f.name.split('.').pop() || '').toLowerCase();
      return !IMG_EXTS.has(ext) && !f.type.startsWith('image/');
    });
    if (hasNonImg) {
      showAlert('不支援此格式', '拖曳多個檔案時，請只選圖片', [{label:'確認',style:'primary',action:null}]);
      return;
    }
    uploadImages(files).catch(err =>
      showAlert('上傳失敗', err.message, [{label:'確認',style:'primary',action:null}])
    );
  } else {
    onFileInput(files[0]);
  }
});

// ── Ctrl+V paste ───────────────────────────────────────────────
document.addEventListener('paste', async e => {
  if (!room) return;
  const items = Array.from(e.clipboardData?.items || []);
  const imgItem = items.find(i => i.type.startsWith('image/'));
  if (imgItem) {
    e.preventDefault();
    const blob = imgItem.getAsFile();
    if (blob) {
      try { await uploadImages([blob]); }
      catch(err) { showAlert('上傳失敗', err.message, [{label:'確認',style:'primary',action:null}]); }
    }
  }
});

// ── Room create ────────────────────────────────────────────────
async function doCreate() {
  const btn = $id('createBtn');
  btn.disabled = true;
  btn.querySelector('.c-title').innerHTML = '<span class="sp"></span>建立中…';
  try {
    const resp = await fetch('/api/share/room', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'});
    const data = await resp.json();
    if (!data.code) throw new Error('伺服器未回傳房間碼');
    room = data.code;
    lastKnownServerTs = 0;
    enterSync(data.code);
  } catch (err) {
    showAlert('建立失敗', err.message || '請稍後再試', [{label:'確認',style:'primary',action:null}]);
  } finally {
    btn.disabled = false;
    btn.querySelector('.c-title').textContent = '建立新房間';
  }
}

// ── Room join ──────────────────────────────────────────────────
async function doJoin() {
  const inp  = $id('joinInput');
  const code = inp.value.trim();
  const err  = $id('joinErr');
  const btn  = $id('joinBtn');
  err.classList.remove('show');
  inp.classList.remove('error');
  if (code.length !== 4) {
    inp.classList.add('error');
    setTimeout(() => inp.classList.remove('error'), 600);
    return;
  }
  btn.innerHTML = '<span class="sp"></span>';
  btn.disabled = true;
  try {
    const resp = await fetch('/api/share/room/' + code);
    if (resp.status === 404) {
      inp.classList.add('error');
      err.classList.add('show');
      setTimeout(() => inp.classList.remove('error'), 600);
      return;
    }
    const data = await resp.json();
    room = code;
    lastKnownServerTs = data.updated_at || 0;
    renderRoom(data, true);
    enterSync(code);
  } catch {
    showAlert('連線失敗', '請稍後再試', [{label:'確認',style:'primary',action:null}]);
  } finally {
    btn.innerHTML = '加入';
    btn.disabled = false;
  }
}

// ── Enter sync mode ────────────────────────────────────────────
function enterSync(code) {
  $id('stateA').style.display = 'none';
  $id('stateB').classList.add('show');
  $id('topTitle').textContent = '剪貼簿';
  $id('pillCode').textContent = code;
  $id('roomPill').classList.add('show');
  clearInterval(historyTid);
  startPoll();
  setTimeout(() => $id('ta').focus(), 120);
}

// ── Polling ────────────────────────────────────────────────────
function startPoll() {
  clearInterval(pollTid);
  pollTid = setInterval(doPoll, POLL_INTERVAL);
}

async function doPoll() {
  if (!room || pushing) return;
  try {
    const resp = await fetch('/api/share/room/' + room);
    if (resp.status === 404) {
      clearInterval(pollTid);
      showExpired(false);
      return;
    }
    const data = await resp.json();
    if (data.updated_at !== lastKnownServerTs) {
      lastKnownServerTs = data.updated_at;
      if (Date.now() - lastPushAt >= 2000) renderRoom(data);
    }
  } catch {}
}

// ── Render room state ──────────────────────────────────────────
function renderRoom(data, force) {
  const type     = data.type     || 'text';
  const content  = data.content  || '';
  const fileName = data.file_name || '';
  const images   = data.images   || [];
  if (type === 'images') {
    currentImages = images;
    if (images.length > 0) showImgGallery(images);
    else hideImgGallery();
    $id('ta').value = '';
    hideFileCard();
    detectUrl('');
  } else if (type === 'image') {
    currentImages = content ? [content] : [];
    if (currentImages.length > 0) showImgGallery(currentImages);
    else hideImgGallery();
    $id('ta').value = '';
    hideFileCard();
    detectUrl('');
  } else if (type === 'file') {
    showFileCard(content, fileName);
    $id('ta').value = '';
    hideImgGallery();
    detectUrl('');
  } else {
    hideImgGallery();
    hideFileCard();
    if (force || Date.now() - lastTyped > 2000) {
      $id('ta').value = content;
      detectUrl(content);
    }
  }
}

// ── Push ───────────────────────────────────────────────────────
async function pushRoom(type, content, fileName, images) {
  if (!room) return;
  pushing = true;
  lastPushAt = Date.now();
  setSyncing(true);
  const body = {type, content: content || '', file_name: fileName || ''};
  if (images !== undefined) body.images = images;
  try {
    await fetch('/api/share/room/' + room, {
      method:  'PUT',
      headers: {'Content-Type':'application/json'},
      body:    JSON.stringify(body),
    });
  } catch {}
  finally { pushing = false; setSyncing(false); }
}

function setSyncing(v) { $id('syncDot').classList.toggle('syncing', v); }

// ── Textarea ───────────────────────────────────────────────────
$id('ta').addEventListener('input', () => {
  lastTyped = Date.now();
  const text = $id('ta').value;
  detectUrl(text);
  if ($id('fileCard').classList.contains('show')) hideFileCard();
  if (currentImages.length > 0) hideImgGallery();
  clearTimeout(debTid);
  debTid = setTimeout(() => pushRoom('text', text), 300);
});

// ── URL detection ──────────────────────────────────────────────
const URL_RE = /https?:\/\/[^\s"'<>\]]+/i;
function detectUrl(text) {
  const m = text.match(URL_RE);
  if (m) {
    detectedUrl = m[0];
    $id('urlText').textContent = detectedUrl;
    $id('urlCard').classList.add('show');
  } else {
    detectedUrl = null;
    $id('urlCard').classList.remove('show');
  }
}
function openUrl() {
  if (detectedUrl) window.open(detectedUrl, '_blank', 'noopener,noreferrer');
}

// ── Copy ───────────────────────────────────────────────────────
async function doCopy() {
  const target = currentImages.length > 0
    ? currentImages[0]
    : (currentFileUrl || $id('ta').value);
  if (!target) return;
  await navigator.clipboard.writeText(target).catch(() => {});
  const btn = $id('copyBtn');
  const orig = btn.textContent;
  btn.innerHTML = '<i class="bi bi-check-lg"></i> 已複製';
  setTimeout(() => btn.textContent = orig, 1800);
}

async function copyCode() {
  if (!room) return;
  await navigator.clipboard.writeText(room).catch(() => {});
  const el = $id('pillCode');
  const orig = el.textContent;
  el.innerHTML = '<i class="bi bi-check-lg"></i>';
  setTimeout(() => el.textContent = orig, 1500);
}

// ── Clear ──────────────────────────────────────────────────────
function doClear() {
  hideFileCard();
  hideImgGallery();
  $id('ta').value = '';
  detectUrl('');
  pushRoom('text', '');
}

// ── Destroy room ───────────────────────────────────────────────
function doDestroy() {
  showAlert('銷毀房間', '雙方裝置將同步清除，此操作無法復原', [
    {label: '取消',   style: '',       action: null},
    {label: '確認銷毀', style: 'danger', action: async () => {
      clearInterval(pollTid);
      await fetch('/api/share/room/' + room, {method:'DELETE'}).catch(() => {});
      showExpired(true);
    }},
  ]);
}

// ── Expired overlay ────────────────────────────────────────────
function showExpired(destroyed) {
  $id('expireSub').textContent = destroyed ? '雙方已同步清除' : '房間閒置過久或已不存在';
  $id('expireOverlay').classList.add('show');
  room = null;
}

function backToA() {
  $id('expireOverlay').classList.remove('show');
  $id('stateB').classList.remove('show');
  $id('stateA').style.display = '';
  $id('topTitle').textContent  = '跨裝置剪貼簿';
  $id('roomPill').classList.remove('show');
  $id('ta').value = '';
  $id('joinInput').value = '';
  hideImgGallery(); hideFileCard(); detectUrl('');
  currentFileUrl = null; currentImages = []; room = null;
  clearInterval(pollTid);
  loadGlobalHistory();
  historyTid = setInterval(loadGlobalHistory, HISTORY_POLL_MS);
}

// ── Init: 從 server 拉全域歷史，每 30 秒刷新 ─────────────────
loadGlobalHistory();
historyTid = setInterval(loadGlobalHistory, HISTORY_POLL_MS);

// ── File input ─────────────────────────────────────────────────
function pickFile() { $id('fileIn').click(); }

$id('fileIn').addEventListener('change', e => {
  const files = Array.from(e.target.files || []);
  e.target.value = '';
  if (!files.length) return;
  if (files.length > 1) {
    const hasNonImg = files.some(f => {
      const ext = (f.name.split('.').pop() || '').toLowerCase();
      return !IMG_EXTS.has(ext) && !f.type.startsWith('image/');
    });
    if (hasNonImg) {
      showAlert('不支援此格式', '選取多個檔案時，請只選圖片', [{label:'確認',style:'primary',action:null}]);
      return;
    }
    uploadImages(files).catch(err =>
      showAlert('上傳失敗', err.message, [{label:'確認',style:'primary',action:null}])
    );
  } else {
    onFileInput(files[0]);
  }
});

$id('imgIn').addEventListener('change', e => {
  const files = Array.from(e.target.files || []);
  e.target.value = '';
  if (!files.length) return;
  uploadImages(files).catch(err =>
    showAlert('上傳失敗', err.message, [{label:'確認',style:'primary',action:null}])
  );
});

function onFileInput(file) {
  if (!file) return;
  const ext   = (file.name.split('.').pop() || '').toLowerCase();
  const isImg = IMG_EXTS.has(ext) || file.type.startsWith('image/');
  if (!isImg && !FILE_EXTS.has(ext)) {
    showAlert('不支援此格式', '請選擇：圖片、PDF、Word、Excel、PPT、TXT、MD、ZIP、RAR、MP3 或 MP4', [{label:'確認',style:'primary',action:null}]);
    return;
  }
  if (!isImg && file.size > MAX_DIRECT) {
    showAlert('檔案過大', `${(file.size / 1024 / 1024).toFixed(1)} MB 超過 8 MB 上限`, [{label:'確認',style:'primary',action:null}]);
    return;
  }
  if (isImg) {
    uploadImages([file]).catch(err =>
      showAlert('上傳失敗', err.message, [{label:'確認',style:'primary',action:null}])
    );
  } else {
    uploadRawFile(file, ext).catch(err =>
      showAlert('上傳失敗', err.message, [{label:'確認',style:'primary',action:null}])
    );
  }
}

// ── Multi-image upload ─────────────────────────────────────────
async function uploadImages(newFiles) {
  $id('fileBtn').disabled = true;
  try {
    const urls = [];
    for (let i = 0; i < newFiles.length; i++) {
      const file = newFiles[i];
      const ext  = ((file.name || '').split('.').pop() || '').toLowerCase();
      const isHeic = ext === 'heic' || ext === 'heif'
                   || file.type === 'image/heic' || file.type === 'image/heif';
      const needsProcess = isHeic || file.size > MAX_DIRECT;
      setUpStatus(needsProcess
        ? `壓縮 ${i + 1} / ${newFiles.length}…`
        : `上傳 ${i + 1} / ${newFiles.length}…`);
      const blob = needsProcess
        ? await compressToTarget(file, isHeic ? MAX_COMPRESS_TGT : Math.min(file.size, MAX_COMPRESS_TGT), 0.95)
        : file;
      setUpStatus(`上傳 ${i + 1} / ${newFiles.length}…`);
      const safeName = 'share-' + Date.now() + '-' + (i + 1) + '.jpg';
      urls.push(await ikUpload(blob, safeName));
    }
    currentImages = [...currentImages, ...urls];
    showImgGallery(currentImages);
    hideFileCard();
    $id('ta').value = '';
    detectUrl('');
    await pushRoom('images', '', '', currentImages);
  } finally {
    $id('fileBtn').disabled = false;
    setUpStatus('');
  }
}

// ── Raw file upload ────────────────────────────────────────────
async function uploadRawFile(file, ext) {
  setUpStatus('上傳中…');
  $id('fileBtn').disabled = true;
  try {
    const safeName = 'share-' + Date.now() + '-' + file.name.replace(/[^\w.\-]/g, '_');
    const url = await ikUpload(file, safeName);
    showFileCard(url, file.name);
    hideImgGallery();
    $id('ta').value = '';
    detectUrl('');
    await pushRoom('file', url, file.name);
  } finally {
    $id('fileBtn').disabled = false;
    setUpStatus('');
  }
}

// ── ImageKit upload helper ─────────────────────────────────────
async function ikUpload(blob, fileName) {
  const auth = await fetch('/api/share/imagekit-auth').then(r => r.json());
  if (!auth.signature) throw new Error('取得上傳授權失敗：' + (auth.error || ''));
  const fd = new FormData();
  fd.append('file',            blob, fileName);
  fd.append('fileName',        fileName);
  fd.append('useUniqueFileName','true');
  fd.append('publicKey',       IK_PUBLIC_KEY);
  fd.append('signature',       auth.signature);
  fd.append('token',           auth.token);
  fd.append('expire',          String(auth.expire));
  const r   = await fetch('https://upload.imagekit.io/api/v1/files/upload', {method:'POST', body:fd});
  const res = await r.json();
  if (!res.url) throw new Error(res.message || '上傳失敗');
  return res.url;
}

// ── Image compress to target size ─────────────────────────────
function compressToTarget(file, targetBytes, initQ) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const MAX_DIM = 2400;
      let w = img.naturalWidth, h = img.naturalHeight;
      if (w > MAX_DIM || h > MAX_DIM) {
        if (w >= h) { h = Math.round(h * MAX_DIM / w); w = MAX_DIM; }
        else        { w = Math.round(w * MAX_DIM / h); h = MAX_DIM; }
      }
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      let q = initQ;
      const tryQ = () => {
        cv.toBlob(blob => {
          if (!blob) { reject(new Error('壓縮失敗')); return; }
          if (blob.size <= targetBytes || q <= 0.35) { resolve(blob); }
          else { q = Math.max(0.35, q - 0.08); tryQ(); }
        }, 'image/jpeg', q);
      };
      tryQ();
    };
    img.onerror = reject;
    img.src = url;
  });
}

// ── Upload status ──────────────────────────────────────────────
function setUpStatus(msg) {
  const el = $id('upStatus');
  el.textContent = msg;
  el.classList.toggle('show', !!msg);
}

// ── Image gallery ──────────────────────────────────────────────
function showImgGallery(urls) {
  const gallery = $id('imgGallery');
  gallery.innerHTML = '';
  urls.forEach((url, idx) => {
    const thumb = document.createElement('div');
    thumb.className = 'img-thumb';
    const img = document.createElement('img');
    img.src = url; img.alt = ''; img.loading = 'lazy';
    img.onclick = () => openLightbox(idx);
    const del = document.createElement('button');
    del.className = 'img-thumb-del';
    del.innerHTML = '<i class="bi bi-x-lg"></i>';
    del.onclick = () => removeImgAt(idx);
    applySpring(del);
    thumb.append(img, del);
    gallery.appendChild(thumb);
  });
  const addBtn = document.createElement('button');
  addBtn.className = 'img-add';
  addBtn.innerHTML = '<span>＋</span><span class="img-add-label">加圖片</span>';
  addBtn.onclick = () => $id('imgIn').click();
  applySpring(addBtn);
  gallery.appendChild(addBtn);
}
function hideImgGallery() {
  $id('imgGallery').innerHTML = '';
  currentImages = [];
}
async function removeImgAt(idx) {
  currentImages.splice(idx, 1);
  if (currentImages.length === 0) {
    hideImgGallery();
    await pushRoom('text', '');
  } else {
    showImgGallery(currentImages);
    await pushRoom('images', '', '', currentImages);
  }
}

// ── File card ──────────────────────────────────────────────────
function getFileIcon(name) {
  const ext = (name.split('.').pop() || '').toLowerCase();
  const m = {
    pdf:  {icon:'<i class="bi bi-file-earmark-pdf-fill"></i>', bg:'#fee2e2'},
    doc:  {icon:'<i class="bi bi-file-earmark-word-fill"></i>', bg:'#dbeafe'}, docx: {icon:'<i class="bi bi-file-earmark-word-fill"></i>', bg:'#dbeafe'},
    xls:  {icon:'<i class="bi bi-file-earmark-excel-fill"></i>', bg:'#dcfce7'}, xlsx: {icon:'<i class="bi bi-file-earmark-excel-fill"></i>', bg:'#dcfce7'},
    ppt:  {icon:'<i class="bi bi-file-earmark-ppt-fill"></i>', bg:'#ffedd5'}, pptx: {icon:'<i class="bi bi-file-earmark-ppt-fill"></i>', bg:'#ffedd5'},
    txt:  {icon:'<i class="bi bi-file-earmark-text-fill"></i>', bg:'#f3f4f6'},
    md:   {icon:'<i class="bi bi-file-earmark-code-fill"></i>', bg:'#e0f2fe'},
    zip:  {icon:'<i class="bi bi-file-earmark-zip-fill"></i>', bg:'#fef3c7'}, rar: {icon:'<i class="bi bi-file-earmark-zip-fill"></i>', bg:'#fef3c7'},
    mp3:  {icon:'<i class="bi bi-file-earmark-music-fill"></i>', bg:'#f3e8ff'},
    mp4:  {icon:'<i class="bi bi-file-earmark-play-fill"></i>', bg:'#fff7ed'},
  };
  return m[ext] || {icon:'<i class="bi bi-file-earmark-fill"></i>', bg:'#f3f4f6'};
}

function showFileCard(url, name) {
  currentFileUrl = url;
  const info = getFileIcon(name);
  $id('fileIconWrap').style.background = info.bg;
  $id('fileIconEmoji').innerHTML        = info.icon;
  $id('fileNameText').textContent       = name;
  $id('fileTypeText').textContent       = (name.split('.').pop() || 'FILE').toUpperCase() + ' 檔案';
  $id('fileCard').classList.add('show');
}

function hideFileCard() {
  $id('fileCard').classList.remove('show');
  currentFileUrl = null;
}

// ── Lightbox ───────────────────────────────────────────────────
let lbIdx = 0;
const lb     = () => $id('lightbox');
const lbImg  = () => $id('lbImg');
const lbCtr  = () => $id('lbCounter');
function openLightbox(idx) {
  if (!currentImages.length) return;
  lbIdx = idx;
  _lbRender();
  lb().classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  lb().classList.remove('open');
  document.body.style.overflow = '';
}
function _lbRender() {
  lbImg().src = currentImages[lbIdx];
  const total = currentImages.length;
  lbCtr().textContent = total > 1 ? `${lbIdx + 1} / ${total}` : '';
  $id('lbPrev').classList.toggle('hidden', total <= 1);
  $id('lbNext').classList.toggle('hidden', total <= 1);
}
document.addEventListener('DOMContentLoaded', () => {
  $id('lbClose').onclick = closeLightbox;
  $id('lbPrev').onclick  = () => { lbIdx = (lbIdx - 1 + currentImages.length) % currentImages.length; _lbRender(); };
  $id('lbNext').onclick  = () => { lbIdx = (lbIdx + 1) % currentImages.length; _lbRender(); };
  $id('lightbox').addEventListener('click', e => { if (e.target === lb()) closeLightbox(); });
});
document.addEventListener('keydown', e => {
  if (!lb().classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft')  { lbIdx = (lbIdx - 1 + currentImages.length) % currentImages.length; _lbRender(); }
  if (e.key === 'ArrowRight') { lbIdx = (lbIdx + 1) % currentImages.length; _lbRender(); }
});
// 觸控滑動切換
(function(){
  let sx = 0;
  $id('lightbox').addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, {passive:true});
  $id('lightbox').addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - sx;
    if (Math.abs(dx) < 40) return;
    if (dx < 0) { lbIdx = (lbIdx + 1) % currentImages.length; }
    else        { lbIdx = (lbIdx - 1 + currentImages.length) % currentImages.length; }
    _lbRender();
  });
})();

async function downloadFile() {
  if (!currentFileUrl) return;
  const fileName = $id('fileNameText').textContent || 'download';
  try {
    const resp = await fetch(currentFileUrl);
    const blob = await resp.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  } catch {
    window.open(currentFileUrl, '_blank', 'noopener,noreferrer');
  }
}
