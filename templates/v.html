<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>我的收藏</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overscroll-behavior: none; background: #000; }

:root {
  --bg:      #0a0a0f;
  --surface: rgba(255,255,255,0.07);
  --border:  rgba(255,255,255,0.1);
  --text:    #f0f0f5;
  --sub:     rgba(255,255,255,0.45);
  --tint:    #bf5af2;
  --danger:  #ff453a;
  --radius:  18px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
  color: var(--text);
  min-height: 100%;
  display: flex; flex-direction: column;
  padding-bottom: max(32px, env(safe-area-inset-bottom));
}

/* ── PIN 畫面 ── */
#pinScreen {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 32px;
  padding-top: env(safe-area-inset-top);
}
.pin-title { font-size: 1.1rem; font-weight: 600; color: var(--sub); letter-spacing: 0.04em; }
.pin-dots {
  display: flex; gap: 18px;
}
.pin-dot {
  width: 14px; height: 14px; border-radius: 50%;
  border: 2px solid var(--sub);
  transition: background 0.15s, border-color 0.15s;
}
.pin-dot.filled { background: var(--tint); border-color: var(--tint); }
.pin-dot.error  { background: var(--danger); border-color: var(--danger); }
.numpad {
  display: grid; grid-template-columns: repeat(3, 72px);
  grid-template-rows: repeat(4, 64px);
  gap: 12px;
}
.numpad-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 50%;
  color: var(--text); font-size: 1.4rem; font-weight: 500;
  cursor: pointer; font-family: inherit;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
  transition: opacity 0.1s;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.numpad-btn:active { opacity: 0.5; }
.numpad-btn.del { font-size: 1.1rem; color: var(--sub); }
.numpad-btn.empty { background: none; border: none; pointer-events: none; }

/* ── 主畫面 ── */
#mainScreen { flex: 1; display: none; flex-direction: column; }

.top-bar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center;
  padding: max(14px, env(safe-area-inset-top)) 16px 12px;
  background: rgba(10,10,15,0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
}
.top-title { flex: 1; text-align: center; font-size: 1rem; font-weight: 700; }
.lock-btn {
  min-width: 44px; background: none; border: none;
  color: var(--sub); font-size: 1.1rem; cursor: pointer;
  padding: 4px; -webkit-tap-highlight-color: transparent;
}
.lock-btn:active { opacity: 0.5; }
.add-btn-bar {
  min-width: 44px; text-align: right;
  background: none; border: none;
  color: var(--tint); font-size: 0.92rem; font-weight: 600;
  cursor: pointer; font-family: inherit; padding: 4px 0 4px 8px;
  -webkit-tap-highlight-color: transparent;
}
.add-btn-bar:active { opacity: 0.5; }

.grid {
  padding: 16px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 14px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  position: relative;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.15s, opacity 0.15s;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  animation: fadeUp 0.3s ease both;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px) scale(0.97); }
  to   { opacity: 1; transform: none; }
}
.card:active { transform: scale(0.96); opacity: 0.8; }
.card.delmode { border-color: var(--danger); }

.card-thumb {
  width: 100%; aspect-ratio: 16/9;
  background: #1a1a2e;
  object-fit: cover; display: block;
}
.card-thumb-placeholder {
  width: 100%; aspect-ratio: 16/9;
  background: linear-gradient(135deg, #1a1a2e, #2d1b4e);
  display: flex; align-items: center; justify-content: center;
  font-size: 2rem; color: var(--sub);
}
.card-body { padding: 10px 10px 12px; }
.card-title {
  font-size: 0.82rem; font-weight: 600; color: var(--text);
  line-height: 1.35;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.del-badge {
  position: absolute; top: 6px; right: 6px;
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--danger);
  display: none; align-items: center; justify-content: center;
  font-size: 0.85rem; color: #fff; font-weight: 700;
  z-index: 2;
}
.card.delmode .del-badge { display: flex; }

.empty-state {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 12px; color: var(--sub); padding: 48px 24px;
}
.empty-state .icon { font-size: 3rem; }
.empty-state p { font-size: 0.92rem; text-align: center; line-height: 1.5; }

/* ── 新增 Modal ── */
.modal-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: none; align-items: flex-end;
  animation: fadeIn 0.2s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal-overlay.show { display: flex; }
.modal-box {
  width: 100%; background: #1a1a28;
  border-radius: 24px 24px 0 0;
  border-top: 1px solid var(--border);
  padding: 20px 20px max(32px, env(safe-area-inset-bottom));
  animation: slideUp 0.25s ease;
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to   { transform: none; }
}
.modal-title { font-size: 1rem; font-weight: 700; text-align: center; margin-bottom: 20px; }
.modal-input {
  width: 100%; background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px; color: var(--text);
  font-size: 0.95rem; font-family: inherit;
  padding: 12px 14px; margin-bottom: 10px;
  outline: none;
}
.modal-input:focus { border-color: var(--tint); }
.modal-input::placeholder { color: var(--sub); }
.modal-actions { display: flex; gap: 10px; margin-top: 6px; }
.modal-cancel {
  flex: 1; background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; color: var(--sub);
  font-size: 0.95rem; font-weight: 600; font-family: inherit;
  padding: 14px; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.modal-cancel:active { opacity: 0.6; }
.modal-save {
  flex: 1; background: var(--tint); border: none;
  border-radius: 14px; color: #fff;
  font-size: 0.95rem; font-weight: 700; font-family: inherit;
  padding: 14px; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.modal-save:active { opacity: 0.7; }
.modal-save:disabled { opacity: 0.4; }

/* ── Toast ── */
.toast {
  position: fixed; bottom: max(80px, env(safe-area-inset-bottom) + 60px);
  left: 50%; transform: translateX(-50%) translateY(20px);
  background: rgba(30,30,40,0.95);
  border: 1px solid var(--border);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  color: var(--text); font-size: 0.88rem; font-weight: 500;
  padding: 10px 20px; border-radius: 100px;
  opacity: 0; transition: opacity 0.25s, transform 0.25s;
  pointer-events: none; white-space: nowrap; z-index: 200;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- PIN 畫面 -->
<div id="pinScreen">
  <div class="pin-title">輸入 PIN 碼</div>
  <div class="pin-dots" id="pinDots">
    <div class="pin-dot" id="d0"></div>
    <div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div>
    <div class="pin-dot" id="d3"></div>
  </div>
  <div class="numpad">
    <button class="numpad-btn" onclick="numTap('1')">1</button>
    <button class="numpad-btn" onclick="numTap('2')">2</button>
    <button class="numpad-btn" onclick="numTap('3')">3</button>
    <button class="numpad-btn" onclick="numTap('4')">4</button>
    <button class="numpad-btn" onclick="numTap('5')">5</button>
    <button class="numpad-btn" onclick="numTap('6')">6</button>
    <button class="numpad-btn" onclick="numTap('7')">7</button>
    <button class="numpad-btn" onclick="numTap('8')">8</button>
    <button class="numpad-btn" onclick="numTap('9')">9</button>
    <button class="numpad-btn empty"></button>
    <button class="numpad-btn" onclick="numTap('0')">0</button>
    <button class="numpad-btn del" onclick="numDel()">⌫</button>
  </div>
</div>

<!-- 主畫面 -->
<div id="mainScreen">
  <div class="top-bar">
    <button class="lock-btn" onclick="lock()" title="鎖定">🔒</button>
    <div class="top-title">收藏庫</div>
    <button class="add-btn-bar" onclick="openAddModal()">＋ 新增</button>
  </div>
  <div id="gridContainer"></div>
</div>

<!-- 新增 Modal -->
<div class="modal-overlay" id="addModal">
  <div class="modal-box">
    <div class="modal-title">手動新增</div>
    <input class="modal-input" id="addUrl"   placeholder="影片網址" type="url" autocomplete="off">
    <input class="modal-input" id="addTitle" placeholder="標題（可選）">
    <input class="modal-input" id="addImg"   placeholder="縮圖網址（可選）" type="url" autocomplete="off">
    <div class="modal-actions">
      <button class="modal-cancel" onclick="closeAddModal()">取消</button>
      <button class="modal-save"   onclick="submitAdd()" id="saveBtn">儲存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let _pin = '';
let _delMode = false;
let _longPressTimer = null;
const BASE = '';

// ── PIN ──────────────────────────────────────
function numTap(n) {
  if (_pin.length >= 4) return;
  _pin += n;
  updateDots();
  if (_pin.length === 4) setTimeout(submitPin, 80);
}
function numDel() {
  _pin = _pin.slice(0, -1);
  updateDots();
}
function updateDots(err) {
  for (let i = 0; i < 4; i++) {
    const d = document.getElementById('d' + i);
    d.className = 'pin-dot' + (_pin.length > i ? (err ? ' error' : ' filled') : '');
  }
}
async function submitPin() {
  const res = await apiFetch('/api/v/list', { pin: _pin });
  if (!res || res.error) {
    updateDots(true);
    setTimeout(() => { _pin = ''; updateDots(); }, 600);
    return;
  }
  sessionStorage.setItem('vpin', _pin);
  document.getElementById('pinScreen').style.display = 'none';
  const ms = document.getElementById('mainScreen');
  ms.style.display = 'flex';
  renderGrid(res.items);
}

function lock() {
  _pin = '';
  updateDots();
  sessionStorage.removeItem('vpin');
  document.getElementById('mainScreen').style.display = 'none';
  document.getElementById('pinScreen').style.display = 'flex';
}

// ── API ──────────────────────────────────────
async function apiFetch(path, body) {
  try {
    const r = await fetch(BASE + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    return await r.json();
  } catch { return null; }
}

function getPin() {
  return sessionStorage.getItem('vpin') || _pin;
}

// ── Grid ─────────────────────────────────────
function renderGrid(items) {
  const container = document.getElementById('gridContainer');
  if (!items || items.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="icon">🎬</div>
        <p>尚無收藏<br>用 Bookmarklet 或右上角＋新增</p>
      </div>`;
    return;
  }
  container.innerHTML = `<div class="grid" id="grid"></div>`;
  const grid = document.getElementById('grid');
  items.forEach((item, idx) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.id = item.id;
    card.style.animationDelay = (idx * 40) + 'ms';
    card.innerHTML = `
      ${item.img
        ? `<img class="card-thumb" src="${esc(item.img)}" referrerpolicy="no-referrer" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
        : ''}
      <div class="card-thumb-placeholder" ${item.img ? 'style="display:none"' : ''}>🎬</div>
      <div class="card-body">
        <div class="card-title">${esc(item.title)}</div>
      </div>
      <div class="del-badge" onclick="delItem(event,'${item.id}')">✕</div>`;
    card.addEventListener('click', () => {
      if (_delMode) return;
      window.open(item.url, '_blank');
    });
    card.addEventListener('touchstart', () => {
      _longPressTimer = setTimeout(() => enterDelMode(), 600);
    }, { passive: true });
    card.addEventListener('touchend', () => clearTimeout(_longPressTimer), { passive: true });
    card.addEventListener('touchmove', () => clearTimeout(_longPressTimer), { passive: true });
    card.addEventListener('contextmenu', (e) => { e.preventDefault(); enterDelMode(); });
    grid.appendChild(card);
  });
}

function enterDelMode() {
  _delMode = true;
  document.querySelectorAll('.card').forEach(c => c.classList.add('delmode'));
  document.addEventListener('click', exitDelModeOnOutside);
  showToast('長按 ✕ 刪除，點空白處取消');
}
function exitDelMode() {
  _delMode = false;
  document.querySelectorAll('.card').forEach(c => c.classList.remove('delmode'));
  document.removeEventListener('click', exitDelModeOnOutside);
}
function exitDelModeOnOutside(e) {
  if (!e.target.closest('.card')) exitDelMode();
}

async function delItem(e, id) {
  e.stopPropagation();
  const res = await apiFetch('/api/v/del', { pin: getPin(), id });
  if (!res || res.error) { showToast('刪除失敗'); return; }
  exitDelMode();
  renderGrid(res.items);
  showToast('已刪除');
}

// ── 新增 Modal ───────────────────────────────
function openAddModal() {
  document.getElementById('addUrl').value = '';
  document.getElementById('addTitle').value = '';
  document.getElementById('addImg').value = '';
  document.getElementById('addModal').classList.add('show');
  setTimeout(() => document.getElementById('addUrl').focus(), 200);
  // 讀 URL params（Bookmarklet 跳轉後帶過來）
  const p = new URLSearchParams(location.search);
  if (p.get('url')) {
    document.getElementById('addUrl').value   = p.get('url')   || '';
    document.getElementById('addTitle').value = p.get('title') || '';
    document.getElementById('addImg').value   = p.get('img')   || '';
    history.replaceState({}, '', '/v');
    submitAdd();
  }
}
function closeAddModal() {
  document.getElementById('addModal').classList.remove('show');
}

async function submitAdd() {
  const url   = document.getElementById('addUrl').value.trim();
  const title = document.getElementById('addTitle').value.trim();
  const img   = document.getElementById('addImg').value.trim();
  if (!url) { showToast('請輸入網址'); return; }
  document.getElementById('saveBtn').disabled = true;
  const res = await apiFetch('/api/v/add', { pin: getPin(), url, title, img });
  document.getElementById('saveBtn').disabled = false;
  if (!res || res.error) { showToast('儲存失敗'); return; }
  closeAddModal();
  renderGrid(res.items);
  showToast(res.dup ? '已收藏過了' : '已收藏！');
}

// ── Bookmarklet 自動處理 ──────────────────────
function checkBookmarkletParams() {
  const p = new URLSearchParams(location.search);
  if (!p.get('url')) return;
  const savedPin = sessionStorage.getItem('vpin');
  if (savedPin) {
    // 已登入，直接存
    apiFetch('/api/v/add', {
      pin:   savedPin,
      url:   p.get('url')   || '',
      title: p.get('title') || '',
      img:   p.get('img')   || '',
    }).then(res => {
      history.replaceState({}, '', '/v');
      if (res && res.ok) showToast(res.dup ? '已收藏過了' : '已收藏！');
    });
  }
  // 未登入則等輸完 PIN 後 submitPin 會觸發 openAddModal
}

// ── 工具 ─────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Init ─────────────────────────────────────
(function() {
  checkBookmarkletParams();
  const adminPin = sessionStorage.getItem('v_admin_pin');
  if (adminPin) {
    sessionStorage.removeItem('v_admin_pin');
    apiFetch('/api/v/admin-bypass', { admin_pin: adminPin }).then(res => {
      if (res && res.pin) {
        sessionStorage.setItem('vpin', res.pin);
        _pin = res.pin;
        document.getElementById('pinScreen').style.display = 'none';
        document.getElementById('mainScreen').style.display = 'flex';
        renderGrid(res.items);
      }
    });
    return;
  }
  const saved = sessionStorage.getItem('vpin');
  if (saved) {
    _pin = saved;
    submitPin();
  }
})();
</script>
</body>
</html>
