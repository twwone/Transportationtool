<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>我的收藏</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script src="/static/config.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overscroll-behavior: none; background: #000; }

:root {
  --bg:      #0a0a0f;
  --surface: rgba(255,255,255,0.07);
  --border:  rgba(255,255,255,0.1);
  --text:    #f0f0f5;
  --sub:     rgba(255,255,255,0.45);
  --tint:    #bf5af2;
  --danger:  #ff453a;
  --radius:  18px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
  color: var(--text);
  min-height: 100%;
  display: flex; flex-direction: column;
  padding-bottom: max(32px, env(safe-area-inset-bottom));
}

/* ── PIN 畫面 ── */
#pinScreen {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 32px;
  padding-top: env(safe-area-inset-top);
}
.pin-msg { min-height: 1.2em; font-size: 0.85rem; color: var(--danger); margin-top: -18px; }
.pin-title { font-size: 1.1rem; font-weight: 600; color: var(--sub); letter-spacing: 0.04em; }
.pin-dots {
  display: flex; gap: 18px;
}
.pin-dot {
  width: 14px; height: 14px; border-radius: 50%;
  border: 2px solid var(--sub);
  transition: background 0.15s, border-color 0.15s;
}
.pin-dot.filled { background: var(--tint); border-color: var(--tint); }
.pin-dot.error  { background: var(--danger); border-color: var(--danger); }
.numpad {
  display: grid; grid-template-columns: repeat(3, 72px);
  grid-template-rows: repeat(4, 64px);
  gap: 12px;
}
.numpad-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 50%;
  color: var(--text); font-size: 1.4rem; font-weight: 500;
  cursor: pointer; font-family: inherit;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
  transition: opacity 0.1s;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.numpad-btn:active { opacity: 0.5; }
.numpad-btn.del { font-size: 1.1rem; color: var(--sub); }
.numpad-btn.empty { background: none; border: none; pointer-events: none; }

/* ── 主畫面 ── */
#mainScreen { flex: 1; display: none; flex-direction: column; }

.sticky-head {
  position: sticky; top: 0; z-index: 10;
  background: rgba(10,10,15,0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
}
.top-bar {
  display: flex; align-items: center;
  padding: max(14px, env(safe-area-inset-top)) 16px 10px;
}
/* ── 搜尋列 ── */
.search-bar { padding: 0 16px 12px; }
.search-box {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 0 10px 0 12px;
  transition: border-color 0.15s;
}
.search-box:focus-within { border-color: var(--tint); }
.search-box > .bi-search { color: var(--sub); font-size: 0.9rem; }
.search-input {
  flex: 1; min-width: 0; background: none; border: none; outline: none;
  color: var(--text); font-family: inherit; font-size: 16px;
  padding: 9px 0;
}
.search-input::placeholder { color: var(--sub); }
.search-input::-webkit-search-cancel-button { display: none; }
.search-clear {
  display: none; background: none; border: none; cursor: pointer;
  color: var(--sub); font-size: 1rem; padding: 4px;
  -webkit-tap-highlight-color: transparent;
}
.search-clear.show { display: block; }
.search-count { font-size: 0.75rem; color: var(--sub); margin: 8px 2px 0; display: none; }
.search-count.show { display: block; }
.top-title { flex: 1; text-align: center; font-size: 1rem; font-weight: 700; }
.top-left { display: flex; align-items: center; gap: 2px; min-width: 80px; }
.top-right { display: flex; align-items: center; gap: 2px; min-width: 80px; justify-content: flex-end; }
.back-btn {
  display: flex; align-items: center; gap: 2px;
  background: none; border: none;
  color: var(--tint); font-size: 1rem; font-weight: 500;
  cursor: pointer; font-family: inherit; padding: 4px 6px;
  -webkit-tap-highlight-color: transparent; text-decoration: none;
}
.back-btn:active { opacity: 0.5; }
.lock-btn {
  background: none; border: none;
  color: var(--sub); font-size: 1rem; cursor: pointer;
  padding: 4px 6px; -webkit-tap-highlight-color: transparent;
}
.lock-btn:active { opacity: 0.5; }
.refresh-btn {
  background: none; border: none;
  color: var(--sub); font-size: 1rem; cursor: pointer;
  padding: 4px 6px; -webkit-tap-highlight-color: transparent;
}
.refresh-btn:active { opacity: 0.5; }
.refresh-btn.spin { animation: spinOnce 0.5s ease; }
@keyframes spinOnce { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.add-btn-bar {
  background: none; border: none;
  color: var(--tint); font-size: 0.92rem; font-weight: 600;
  cursor: pointer; font-family: inherit; padding: 4px 6px;
  -webkit-tap-highlight-color: transparent;
}
.add-btn-bar:active { opacity: 0.5; }

.grid {
  padding: 16px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 14px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  position: relative;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.15s, opacity 0.15s;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  animation: fadeUp 0.3s ease both;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px) scale(0.97); }
  to   { opacity: 1; transform: none; }
}
.card:active { transform: scale(0.96); opacity: 0.8; }
.card.delmode { border-color: var(--danger); }
.card-by {
  font-size: 0.7rem; color: var(--sub);
  margin-top: 5px; font-weight: 500;
}

.card-thumb {
  width: 100%; aspect-ratio: 16/9;
  background: #1a1a2e;
  object-fit: cover; display: block;
}
.card-thumb-placeholder {
  width: 100%; aspect-ratio: 16/9;
  background: linear-gradient(135deg, #1a1a2e, #2d1b4e);
  display: flex; align-items: center; justify-content: center;
  font-size: 2rem; color: var(--sub);
}
.card-body { padding: 10px 10px 12px; }
.card-title {
  font-size: 0.82rem; font-weight: 600; color: var(--text);
  line-height: 1.35;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-code {
  display: flex; align-items: center; gap: 6px;
  font-size: 0.95rem; font-weight: 800; letter-spacing: 0.02em;
  color: var(--text); margin-bottom: 3px;
}
.tag-unc {
  font-size: 0.62rem; font-weight: 700; letter-spacing: 0;
  color: #fff; background: var(--danger);
  padding: 1px 6px; border-radius: 6px;
}
.card-code + .card-title { font-size: 0.76rem; font-weight: 500; color: var(--sub); }
.card-host { font-size: 0.7rem; color: var(--sub); margin-top: 4px; }

.del-badge {
  position: absolute; top: 6px; right: 6px;
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--danger);
  display: none; align-items: center; justify-content: center;
  font-size: 0.85rem; color: #fff; font-weight: 700;
  z-index: 2;
}
.card.delmode .del-badge { display: flex; }

.empty-state {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 12px; color: var(--sub); padding: 48px 24px;
}
.empty-state .icon { font-size: 3rem; }
.empty-state p { font-size: 0.92rem; text-align: center; line-height: 1.5; }

/* ── 新增 Modal ── */
.modal-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: none; align-items: flex-end;
  animation: fadeIn 0.2s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal-overlay.show { display: flex; }
.modal-box {
  width: 100%; background: #1a1a28;
  border-radius: 24px 24px 0 0;
  border-top: 1px solid var(--border);
  padding: 20px 20px max(32px, env(safe-area-inset-bottom));
  animation: slideUp 0.25s ease;
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to   { transform: none; }
}
.modal-title { font-size: 1rem; font-weight: 700; text-align: center; margin-bottom: 20px; }
.modal-input {
  width: 100%; background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px; color: var(--text);
  font-size: 0.95rem; font-family: inherit;
  padding: 12px 14px; margin-bottom: 10px;
  outline: none;
}
.modal-input:focus { border-color: var(--tint); }
.modal-input::placeholder { color: var(--sub); }
.modal-label { font-size: 0.78rem; color: var(--sub); margin: 4px 2px 6px; }
.modal-hint  { font-size: 0.75rem; color: var(--sub); margin: -2px 2px 12px; line-height: 1.45; }
.modal-actions { display: flex; gap: 10px; margin-top: 6px; }
.modal-cancel {
  flex: 1; background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; color: var(--sub);
  font-size: 0.95rem; font-weight: 600; font-family: inherit;
  padding: 14px; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.modal-cancel:active { opacity: 0.6; }
.modal-save {
  flex: 1; background: var(--tint); border: none;
  border-radius: 14px; color: #fff;
  font-size: 0.95rem; font-weight: 700; font-family: inherit;
  padding: 14px; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.modal-save:active { opacity: 0.7; }
.modal-save:disabled { opacity: 0.4; }

/* ── 電腦版：內容置中限寬，彈窗改置中卡片 ── */
@media (min-width: 768px) {
  .grid { max-width: 920px; margin: 0 auto; padding: 24px 16px;
          grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 18px; }
  .top-bar, .search-bar { padding-left: max(16px, calc((100% - 920px) / 2 + 16px));
             padding-right: max(16px, calc((100% - 920px) / 2 + 16px)); }
  .modal-overlay { align-items: center; justify-content: center; }
  .modal-box { max-width: 440px; border-radius: 24px; border: 1px solid var(--border);
               padding: 24px; animation: popIn 0.2s ease; }
  @keyframes popIn { from { transform: scale(0.95); opacity: 0; } to { transform: none; opacity: 1; } }
  .card:hover { border-color: rgba(191,90,242,0.5); }
}

/* ── Toast ── */
.toast {
  position: fixed; bottom: max(80px, env(safe-area-inset-bottom) + 60px);
  left: 50%; transform: translateX(-50%) translateY(20px);
  background: rgba(30,30,40,0.95);
  border: 1px solid var(--border);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  color: var(--text); font-size: 0.88rem; font-weight: 500;
  padding: 10px 20px; border-radius: 100px;
  opacity: 0; transition: opacity 0.25s, transform 0.25s;
  pointer-events: none; white-space: nowrap; z-index: 200;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- PIN 畫面 -->
<div id="pinScreen">
  <div class="pin-title">輸入 PIN 碼</div>
  <div class="pin-msg" id="pinMsg"></div>
  <div class="pin-dots" id="pinDots">
    <div class="pin-dot" id="d0"></div>
    <div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div>
    <div class="pin-dot" id="d3"></div>
  </div>
  <div class="numpad">
    <button class="numpad-btn" onclick="numTap('1')">1</button>
    <button class="numpad-btn" onclick="numTap('2')">2</button>
    <button class="numpad-btn" onclick="numTap('3')">3</button>
    <button class="numpad-btn" onclick="numTap('4')">4</button>
    <button class="numpad-btn" onclick="numTap('5')">5</button>
    <button class="numpad-btn" onclick="numTap('6')">6</button>
    <button class="numpad-btn" onclick="numTap('7')">7</button>
    <button class="numpad-btn" onclick="numTap('8')">8</button>
    <button class="numpad-btn" onclick="numTap('9')">9</button>
    <button class="numpad-btn empty"></button>
    <button class="numpad-btn" onclick="numTap('0')">0</button>
    <button class="numpad-btn del" onclick="numDel()"><i class="bi bi-backspace-fill"></i></button>
  </div>
</div>

<!-- 主畫面 -->
<div id="mainScreen">
  <div class="sticky-head">
  <div class="top-bar">
    <div class="top-left">
      <a class="back-btn" href="/">‹ 返回</a>
      <button class="lock-btn" onclick="lock()" title="鎖定"><i class="bi bi-lock-fill"></i></button>
    </div>
    <div class="top-title" onclick="openSettings()" style="cursor:pointer">收藏庫 <i class="bi bi-gear" style="font-size:0.8rem;color:var(--sub)"></i></div>
    <div class="top-right">
      <button class="refresh-btn" id="refreshBtn" onclick="refreshGrid()" title="重新整理">↺</button>
      <button class="add-btn-bar" id="addBtnBar" onclick="openAddModal()">＋ 新增</button>
      <button class="add-btn-bar" id="editBtn" onclick="toggleDelMode()">編輯</button>
    </div>
  </div>
  <div class="search-bar">
    <div class="search-box">
      <i class="bi bi-search"></i>
      <input class="search-input" id="searchInput" type="search" placeholder="搜尋番號、標題、網站" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
      <button class="search-clear" id="searchClear" onclick="clearSearch()" title="清除"><i class="bi bi-x-circle-fill"></i></button>
    </div>
    <div class="search-count" id="searchCount"></div>
  </div>
  </div>
  <div id="gridContainer"></div>
</div>

<!-- 新增 Modal -->
<div class="modal-overlay" id="addModal">
  <div class="modal-box">
    <div class="modal-title">手動新增</div>
    <input class="modal-input" id="addUrl"   placeholder="影片網址" type="url" autocomplete="off">
    <div class="modal-hint">missav 網址會自動帶出番號與封面，其他網站會嘗試抓網頁的標題和預覽圖</div>
    <input class="modal-input" id="addTitle" placeholder="標題（可選）">
    <input class="modal-input" id="addImg"   placeholder="縮圖網址（可選）" type="url" autocomplete="off">
    <div class="modal-actions">
      <button class="modal-cancel" onclick="closeAddModal()">取消</button>
      <button class="modal-save"   onclick="submitAdd()" id="saveBtn">儲存</button>
    </div>
  </div>
</div>


<!-- 設定 Modal -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal-box">
    <div class="modal-title">設定</div>
    <div class="modal-label">你的名字</div>
    <input class="modal-input" id="nameInput" placeholder="輸入你的名字" maxlength="12" autocomplete="off">
    <div class="modal-label">missav 網域</div>
    <input class="modal-input" id="domainInput" placeholder="missav.ws" autocomplete="off" autocapitalize="off">
    <div class="modal-hint">網站換網域時改這裡，所有收藏會一起換成新網域</div>
    <div class="modal-actions">
      <button class="modal-cancel" onclick="closeSettings()">取消</button>
      <button class="modal-save" onclick="saveSettings()" id="settingsSave">儲存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ── 背景頁面捲動鎖定：Modal 開著時，拖拉只作用在最上層那個 Modal，
   不會穿透帶動底下的頁面／上一層面板一起動。計數器處理疊面板的巢狀情況。 */
let _scrollLockCount = 0;
let _scrollLockY = 0;
function lockBodyScroll() {
  if (_scrollLockCount++ > 0) return;
  _scrollLockY = window.scrollY;
  document.body.style.position = 'fixed';
  document.body.style.top = `-${_scrollLockY}px`;
  document.body.style.left = '0';
  document.body.style.right = '0';
  document.body.style.width = '100%';
}
function unlockBodyScroll() {
  if (_scrollLockCount <= 0) return;
  if (--_scrollLockCount > 0) return;
  document.body.style.position = '';
  document.body.style.top = '';
  document.body.style.left = '';
  document.body.style.right = '';
  document.body.style.width = '';
  window.scrollTo(0, _scrollLockY);
}

let _pin = '';
let _delMode = false;
let _longPressTimer = null;
let _domain = 'missav.ws';
let _items = [];
let _query = '';
const PIN_KEY = 'vpin';   // 記在這台裝置，按鎖頭才清掉

// ── PIN ──────────────────────────────────────
function numTap(n) {
  if (_pin.length >= 4) return;
  _pin += n;
  updateDots();
  if (_pin.length === 4) setTimeout(submitPin, 80);
}
function numDel() {
  _pin = _pin.slice(0, -1);
  updateDots();
}
function updateDots(err) {
  for (let i = 0; i < 4; i++) {
    const d = document.getElementById('d' + i);
    d.className = 'pin-dot' + (_pin.length > i ? (err ? ' error' : ' filled') : '');
  }
}
async function submitPin() {
  const res = await apiFetch('/api/v/list', { pin: _pin });
  if (!res || res.error) {
    localStorage.removeItem(PIN_KEY);
    document.getElementById('pinMsg').textContent =
      res?.error === 'locked' ? res.message : (res ? '' : '連線失敗，請再試一次');
    updateDots(true);
    setTimeout(() => { _pin = ''; updateDots(); }, 600);
    return;
  }
  document.getElementById('pinMsg').textContent = '';
  localStorage.setItem(PIN_KEY, _pin);
  document.getElementById('pinScreen').style.display = 'none';
  document.getElementById('mainScreen').style.display = 'flex';
  applyList(res);
  handleBookmarklet();
}

function lock() {
  _pin = '';
  updateDots();
  localStorage.removeItem(PIN_KEY);
  document.getElementById('searchInput').value = '';   // 上鎖時清掉搜尋字，下次解鎖不留痕跡
  _query = '';
  document.getElementById('mainScreen').style.display = 'none';
  document.getElementById('pinScreen').style.display = 'flex';
}

// ── Bookmarklet：網址帶 ?url= 進來，解鎖後自動收藏（只送一次）──
function handleBookmarklet() {
  const p = new URLSearchParams(location.search);
  const url = p.get('url');
  if (!url) return;
  history.replaceState({}, '', '/v');   // 先清參數，避免重新整理又送一次
  ensureUsername(async () => {
    const res = await apiFetch('/api/v/add', {
      pin: _pin, url,
      title: p.get('title') || '',
      img:   p.get('img')   || '',
      by:    getUsername() || '匿名',
    });
    if (!res || res.error) { showToast('收藏失敗'); return; }
    applyList(res);
    showToast(res.dup ? '已收藏過了' : '已收藏！');
  });
}

// ── API ──────────────────────────────────────
async function apiFetch(path, body) {
  try {
    const r = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    return await r.json();
  } catch { return null; }
}

function applyList(res) {
  if (res.domain) _domain = res.domain;
  _items = res.items || [];
  renderGrid();
}

// ── 搜尋：前端即時篩選，空白分隔多個關鍵字要全部符合 ──
// 比對時去掉大小寫、空白與連字號，SSIS123、ssis-123 都找得到 SSIS-123
function normSearch(s) {
  return String(s || '').toLowerCase().replace(/[\s\-_]+/g, '');
}
function itemHaystack(item) {
  return normSearch([item.code, item.title, item.uncensored ? '無碼' : '',
    hostOf(item.url), item.mpath, item.by].join(' '));
}
function filterItems() {
  const words = _query.trim().split(/\s+/).map(normSearch).filter(Boolean);
  if (!words.length) return _items;
  return _items.filter(item => {
    const hay = itemHaystack(item);
    return words.every(w => hay.includes(w));
  });
}
function onSearchInput() {
  _query = document.getElementById('searchInput').value;
  renderGrid(true);
}
function clearSearch() {
  const input = document.getElementById('searchInput');
  input.value = '';
  _query = '';
  renderGrid(true);
  input.focus();
}

async function refreshGrid() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spin');
  const res = await apiFetch('/api/v/list', { pin: _pin });
  btn.classList.remove('spin');
  if (res && res.items) applyList(res);
}

// missav 收藏用目前設定的網域組網址；其他網站照原網址
function itemUrl(item) {
  return item.mpath ? `https://${_domain}/${item.mpath}` : item.url;
}
function hostOf(url) {
  try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return ''; }
}

// ── Grid ─────────────────────────────────────
function renderGrid(fromSearch) {
  const container = document.getElementById('gridContainer');
  const searching = _query.trim() !== '';
  const items = filterItems();
  document.getElementById('searchClear').classList.toggle('show', _query !== '');
  const countEl = document.getElementById('searchCount');
  countEl.classList.toggle('show', searching && _items.length > 0);
  countEl.textContent = `找到 ${items.length} 部（共 ${_items.length} 部）`;
  if (_items.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="icon"><i class="bi bi-film"></i></div>
        <p>尚無收藏<br>用 Bookmarklet 或右上角＋新增</p>
      </div>`;
    return;
  }
  if (items.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="icon"><i class="bi bi-search"></i></div>
        <p>沒有符合「${esc(_query.trim())}」的收藏</p>
      </div>`;
    return;
  }
  container.innerHTML = `<div class="grid" id="grid"></div>`;
  const grid = document.getElementById('grid');
  items.forEach((item, idx) => {
    const card = document.createElement('div');
    card.className = 'card' + (_delMode ? ' delmode' : '');
    card.dataset.id = item.id;
    // 打字搜尋時不跑逐張進場動畫，避免卡片閃爍延遲
    if (fromSearch) card.style.animation = 'none';
    else card.style.animationDelay = Math.min(idx, 20) * 40 + 'ms';
    const head = item.code
      ? `<div class="card-code">${esc(item.code)}${item.uncensored ? '<span class="tag-unc">無碼</span>' : ''}</div>`
      : '';
    const title = item.title || (item.code ? '' : hostOf(item.url) || item.url);
    card.innerHTML = `
      ${item.img
        ? `<img class="card-thumb" src="${esc(item.img)}" referrerpolicy="no-referrer" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
        : ''}
      <div class="card-thumb-placeholder" ${item.img ? 'style="display:none"' : ''}><i class="bi bi-film"></i></div>
      <div class="card-body">
        ${head}
        ${title ? `<div class="card-title">${esc(title)}</div>` : ''}
        ${!item.code && item.title ? `<div class="card-host">${esc(hostOf(item.url))}</div>` : ''}
        ${item.by ? `<div class="card-by">由 ${esc(item.by)} 加入</div>` : ''}
      </div>
      <div class="del-badge"><i class="bi bi-x-lg"></i></div>`;
    card.querySelector('.del-badge').addEventListener('click', e => delItem(e, item.id));
    card.addEventListener('click', () => {
      if (_delMode) return;
      window.open(itemUrl(item), '_blank');
    });
    card.addEventListener('touchstart', () => {
      _longPressTimer = setTimeout(() => enterDelMode(), 600);
    }, { passive: true });
    card.addEventListener('touchend', () => clearTimeout(_longPressTimer), { passive: true });
    card.addEventListener('touchmove', () => clearTimeout(_longPressTimer), { passive: true });
    card.addEventListener('contextmenu', (e) => { e.preventDefault(); enterDelMode(); });
    grid.appendChild(card);
  });
}

function toggleDelMode() {
  if (_delMode) exitDelMode(); else enterDelMode();
}
function enterDelMode() {
  _delMode = true;
  document.querySelectorAll('.card').forEach(c => c.classList.add('delmode'));
  document.getElementById('editBtn').textContent = '完成';
  document.getElementById('editBtn').style.color = 'var(--danger)';
  document.getElementById('addBtnBar').style.display = 'none';
  document.addEventListener('click', exitDelModeOnOutside);
}
function exitDelMode() {
  _delMode = false;
  document.querySelectorAll('.card').forEach(c => c.classList.remove('delmode'));
  document.getElementById('editBtn').textContent = '編輯';
  document.getElementById('editBtn').style.color = '';
  document.getElementById('addBtnBar').style.display = '';
  document.removeEventListener('click', exitDelModeOnOutside);
}
function exitDelModeOnOutside(e) {
  if (!e.target.closest('.card') && !e.target.closest('#editBtn')) exitDelMode();
}

async function delItem(e, id) {
  e.stopPropagation();
  const res = await apiFetch('/api/v/del', { pin: _pin, id });
  if (!res || res.error) { showToast('刪除失敗'); return; }
  exitDelMode();
  applyList(res);
  showToast('已刪除');
}

// ── 新增 Modal ───────────────────────────────
function openAddModal() {
  lockBodyScroll();
  document.getElementById('addUrl').value = '';
  document.getElementById('addTitle').value = '';
  document.getElementById('addImg').value = '';
  document.getElementById('addModal').classList.add('show');
  setTimeout(() => document.getElementById('addUrl').focus(), 200);
}
function closeAddModal() {
  document.getElementById('addModal').classList.remove('show');
  unlockBodyScroll();
}

async function submitAdd() {
  const url   = document.getElementById('addUrl').value.trim();
  const title = document.getElementById('addTitle').value.trim();
  const img   = document.getElementById('addImg').value.trim();
  if (!url) { showToast('請輸入網址'); return; }
  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = '處理中…';
  const res = await apiFetch('/api/v/add', { pin: _pin, url, title, img, by: getUsername() });
  btn.disabled = false; btn.textContent = '儲存';
  if (!res || res.error) { showToast('儲存失敗'); return; }
  closeAddModal();
  applyList(res);
  showToast(res.dup ? '已收藏過了' : '已收藏！');
}

// ── 名字 ─────────────────────────────────────
function getUsername() {
  const saved = localStorage.getItem('v_username');
  if (saved) return saved;
  try {
    const profileName = Config.getProfile().name;
    if (profileName) { localStorage.setItem('v_username', profileName); return profileName; }
    const sess = JSON.parse(localStorage.getItem('userSession') || 'null');
    if (sess?.name) { localStorage.setItem('v_username', sess.name); return sess.name; }
  } catch {}
  return '';
}

let _pendingNameCb = null;
function ensureUsername(cb) {
  if (getUsername()) return cb();
  _pendingNameCb = cb;
  openSettings();
}

// ── 設定 Modal（名字＋missav 網域）────────────
function openSettings() {
  lockBodyScroll();
  document.getElementById('nameInput').value = getUsername();
  document.getElementById('domainInput').value = _domain;
  document.getElementById('settingsModal').classList.add('show');
  setTimeout(() => document.getElementById('nameInput').focus(), 200);
}
function closeSettings() {
  document.getElementById('settingsModal').classList.remove('show');
  unlockBodyScroll();
  // 略過名字也照樣收藏，記成匿名
  if (_pendingNameCb) { const cb = _pendingNameCb; _pendingNameCb = null; cb(); }
}
async function saveSettings() {
  const n = document.getElementById('nameInput').value.trim();
  const d = document.getElementById('domainInput').value.trim();
  if (n) localStorage.setItem('v_username', n);
  if (d && d !== _domain) {
    const btn = document.getElementById('settingsSave');
    btn.disabled = true;
    const res = await apiFetch('/api/v/domain', { pin: _pin, domain: d });
    btn.disabled = false;
    if (!res || res.error) { showToast(res?.message || '網域儲存失敗'); return; }
    _domain = res.domain;
  }
  closeSettings();
  showToast('已儲存');
}

// ── 工具 ─────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

document.getElementById('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') saveSettings(); });
document.getElementById('addUrl').addEventListener('keydown', e => { if (e.key === 'Enter') submitAdd(); });
document.getElementById('searchInput').addEventListener('input', onSearchInput);
document.getElementById('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (_query) clearSearch(); else e.target.blur(); }
  if (e.key === 'Enter') e.target.blur();   // 手機收起鍵盤
});
// 電腦版：按 / 或 Cmd/Ctrl+K 直接跳到搜尋框（輸入框或彈窗開著時不攔）
document.addEventListener('keydown', e => {
  if (document.getElementById('mainScreen').style.display !== 'flex') return;
  if (document.querySelector('.modal-overlay.show')) return;
  const inField = /^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName);
  if ((e.key === '/' && !inField) || (e.key.toLowerCase() === 'k' && (e.metaKey || e.ctrlKey))) {
    e.preventDefault();
    document.getElementById('searchInput').focus();
  }
});

// ── Init：這台裝置解鎖過就直接進 ──────────────
(function() {
  sessionStorage.removeItem('v_admin_pin');   // 舊版免密碼入口的殘留
  const saved = localStorage.getItem(PIN_KEY) || sessionStorage.getItem('vpin');
  sessionStorage.removeItem('vpin');
  if (saved) {
    _pin = saved;
    submitPin();
  }
})();
</script>
</body>
