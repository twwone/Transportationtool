<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>交通助理</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<link rel="apple-touch-icon" href="/static/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="交通助理">
<meta name="theme-color" content="#f2f2f7">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f2f2f7;
  color: #1c1c1e;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 20px 48px;
}
.header {
  text-align: center;
  margin-bottom: 36px;
}
.header h1 {
  font-size: 1.8rem;
  font-weight: 700;
  color: #1c1c1e;
  letter-spacing: -0.3px;
}
.header p {
  font-size: 0.82rem;
  color: #8e8e93;
  margin-top: 6px;
}
.grid {
  display: grid;
  gap: 16px;
  width: 100%;
  max-width: 460px;
}
.card {
  display: block;
  text-decoration: none;
  background: #ffffff;
  border: 1px solid #e5e5ea;
  border-radius: 20px;
  padding: 26px 22px;
  transition: transform 0.15s, border-color 0.15s, background 0.15s, box-shadow 0.15s;
  cursor: pointer;
  position: relative;
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 20px;
  opacity: 0;
  transition: opacity 0.15s;
}
.card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
.card:active { transform: scale(0.98); }

/* 高鐵卡片 */
.card-thsr { border-color: #ffe0b0; }
.card-thsr::before { background: radial-gradient(ellipse at 80% 20%, #ff950012, transparent 60%); }
.card-thsr:hover { border-color: #ff9500; background: #fffaf4; }
.card-thsr:hover::before { opacity: 1; }

/* 捷運卡片 */
.card-mrt { border-color: #ddd6fe; }
.card-mrt::before { background: radial-gradient(ellipse at 80% 20%, #7c3aed12, transparent 60%); }
.card-mrt:hover { border-color: #7c3aed; background: #faf8ff; }
.card-mrt:hover::before { opacity: 1; }

.card-inner {
  display: flex;
  align-items: center;
  gap: 18px;
  position: relative;
  z-index: 1;
}
.icon-wrap {
  width: 60px;
  height: 60px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 1.8rem;
}
.card-thsr .icon-wrap { background: #fff3e0; }
.card-mrt  .icon-wrap { background: #ede9fe; }

.card-text { flex: 1; }
.card-title {
  font-size: 1.1rem;
  font-weight: 700;
  color: #1c1c1e;
  margin-bottom: 4px;
}
.card-desc {
  font-size: 0.78rem;
  color: #8e8e93;
  line-height: 1.5;
}
.card-thsr .card-title { color: #c97000; }
.card-mrt  .card-title { color: #7c3aed; }

.arrow {
  font-size: 1.1rem;
  color: #c7c7cc;
  transition: color 0.15s, transform 0.15s;
}
.card:hover .arrow { transform: translateX(4px); }
.card-thsr:hover .arrow { color: #ff9500; }
.card-mrt:hover  .arrow { color: #7c3aed; }

/* Widget 卡片 */
.card-widget { border-color: #d1d9ff; }
.card-widget::before { background: radial-gradient(ellipse at 80% 20%, #6366f112, transparent 60%); }
.card-widget:hover { border-color: #6366f1; background: #f8f8ff; }
.card-widget:hover::before { opacity: 1; }
.card-widget .icon-wrap { background: #eef2ff; }
.card-widget .card-title { color: #4f46e5; }
.card-widget:hover .arrow { color: #6366f1; }

.footer {
  margin-top: 40px;
  font-size: 0.7rem;
  color: #c7c7cc;
  text-align: center;
}
</style>
</head>
<body>

<div class="header">
  <h1>🚉 交通助理</h1>
  <p>選擇你需要的交通工具</p>
</div>

<div class="grid">
  <a href="/thsr" class="card card-thsr">
    <div class="card-inner">
      <div class="icon-wrap">🚄</div>
      <div class="card-text">
        <div class="card-title">高鐵刷票</div>
        <div class="card-desc">自動偵測放票，找到座位立即 Telegram 通知</div>
      </div>
      <div class="arrow">›</div>
    </div>
  </a>

  <a href="/mrt" class="card card-mrt">
    <div class="card-inner">
      <div class="icon-wrap">🚇</div>
      <div class="card-text">
        <div class="card-title">桃園機場捷運</div>
        <div class="card-desc">即時到站倒數，直達車 / 普通車分開顯示</div>
      </div>
      <div class="arrow">›</div>
    </div>
  </a>

</div>

<div class="footer">Transportation Assistant</div>

<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
</script>
</body>
</html>
