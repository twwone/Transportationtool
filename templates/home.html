<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>交通助理</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<link rel="apple-touch-icon" href="/static/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="交通助理">
<meta name="theme-color" content="#f2f2f7">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

/* ── 關鍵影格 ── */
@keyframes pageIn {
  from { opacity: 0; transform: translateY(18px) scale(0.986); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes headerIn {
  from { opacity: 0; transform: translateY(-10px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes cardSlideUp {
  from { opacity: 0; transform: translateY(24px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes pageOut {
  to { opacity: 0; transform: scale(0.96) translateY(-10px); }
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f2f2f7;
  color: #1c1c1e;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 20px 48px;
}
.header {
  text-align: center;
  margin-bottom: 36px;
  animation: headerIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.05s both;
}
.header h1 {
  font-size: 1.8rem;
  font-weight: 700;
  color: #1c1c1e;
  letter-spacing: -0.3px;
}
.header p {
  font-size: 0.82rem;
  color: #8e8e93;
  margin-top: 6px;
}
.grid {
  display: grid;
  gap: 16px;
  width: 100%;
  max-width: 460px;
}
.card {
  display: block;
  text-decoration: none;
  background: rgba(255, 255, 255, 0.75);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 24px;
  padding: 26px 22px;
  box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 20px 40px -4px rgba(0, 0, 0, 0.05);
  transition:
    transform    0.3s cubic-bezier(0.25, 1, 0.5, 1),
    background   0.2s ease,
    box-shadow   0.3s cubic-bezier(0.25, 1, 0.5, 1);
  cursor: pointer;
  position: relative;
  overflow: hidden;
  will-change: transform;
  opacity: 0;
}
/* hover 色光暈 */
.card::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 24px;
  opacity: 0;
  transition: opacity 0.22s;
}
/* iOS 2026 光學折射邊框 — 漸層由上亮到下暗模擬頂光折射 */
.card::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 24px;
  padding: 1px;
  background: linear-gradient(
    155deg,
    rgba(255, 255, 255, 0.68) 0%,
    rgba(255, 255, 255, 0.08) 55%,
    rgba(255, 255, 255, 0.22) 100%
  );
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: destination-out;
  mask-composite: exclude;
  pointer-events: none;
}
@media (hover: hover) {
  .card:hover {
    transform: translateY(-5px) scale(1.012);
    box-shadow: 0 8px 20px -2px rgba(0, 0, 0, 0.06), 0 32px 56px -8px rgba(0, 0, 0, 0.12);
  }
  .card:hover::before { opacity: 1; }
  .card:hover .arrow  { transform: translateX(5px); }
}
.card:active {
  transform: scale(0.965) !important;
  transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1) !important;
}

/* 高鐵卡片 */
.card-thsr::before { background: radial-gradient(ellipse at 80% 20%, #ff950015, transparent 60%); }
.card-thsr:hover { background: #fffaf4; }

/* 捷運卡片 */
.card-mrt::before { background: radial-gradient(ellipse at 80% 20%, #7c3aed15, transparent 60%); }
.card-mrt:hover { background: #faf8ff; }

.card-inner {
  display: flex;
  align-items: center;
  gap: 18px;
  position: relative;
  z-index: 1;
}
.icon-wrap {
  width: 60px;
  height: 60px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 1.8rem;
  transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
}
@media (hover: hover) {
  .card:hover .icon-wrap { transform: scale(1.06) rotate(-3deg); }
}
.card-thsr .icon-wrap { background: #fff3e0; }
.card-mrt  .icon-wrap { background: #ede9fe; }

.card-text { flex: 1; }
.card-title {
  font-size: 1.1rem;
  font-weight: 700;
  color: #1c1c1e;
  margin-bottom: 4px;
}
.card-desc {
  font-size: 0.78rem;
  color: #8e8e93;
  line-height: 1.5;
}
.card-thsr .card-title { color: #c97000; }
.card-mrt  .card-title { color: #7c3aed; }

.arrow {
  font-size: 1.1rem;
  color: #c7c7cc;
  transition: color 0.2s, transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
}
.card-thsr:hover .arrow { color: #ff9500; }
.card-mrt:hover  .arrow { color: #7c3aed; }

/* Widget 卡片 */
.card-widget::before { background: radial-gradient(ellipse at 80% 20%, #6366f115, transparent 60%); }
.card-widget:hover { background: #f8f8ff; }
.card-widget .icon-wrap { background: #eef2ff; }
.card-widget .card-title { color: #4f46e5; }
.card-widget:hover .arrow { color: #6366f1; }

/* 航空看板卡片 */
.card-tias::before { background: radial-gradient(ellipse at 80% 20%, #1a56db12, transparent 60%); }
.card-tias:hover { background: #eff6ff; }
.card-tias .icon-wrap { background: #dbeafe; }
.card-tias .card-title { color: #1e40af; }
.card-tias:hover .arrow { color: #1a56db; }

/* 週班表卡片 */
.card-schedule::before { background: radial-gradient(ellipse at 80% 20%, #05966915, transparent 60%); }
.card-schedule:hover { background: #f0fdf4; }
.card-schedule .icon-wrap { background: #dcfce7; }
.card-schedule .card-title { color: #047857; }
.card-schedule:hover .arrow { color: #059669; }

/* 機場設施卡片 */
.card-amenities::before { background: radial-gradient(ellipse at 80% 20%, #0891b215, transparent 60%); }
.card-amenities:hover { background: #ecfeff; }
.card-amenities .icon-wrap { background: #cffafe; }
.card-amenities .card-title { color: #0e7490; }
.card-amenities:hover .arrow { color: #0891b2; }

.footer {
  margin-top: 40px;
  font-size: 0.7rem;
  color: #c7c7cc;
  text-align: center;
  animation: headerIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.5s both;
}
</style>
</head>
<body>

<div class="header">
  <h1>🚉 交通助理</h1>
  <p>選擇你需要的交通工具</p>
</div>

<div class="grid">
  <a href="/thsr" class="card card-thsr">
    <div class="card-inner">
      <div class="icon-wrap">🚄</div>
      <div class="card-text">
        <div class="card-title">高鐵刷票</div>
        <div class="card-desc">自動偵測放票，找到座位立即 Telegram 通知</div>
      </div>
      <div class="arrow">›</div>
    </div>
  </a>

  <a href="/mrt" class="card card-mrt">
    <div class="card-inner">
      <div class="icon-wrap">🚇</div>
      <div class="card-text">
        <div class="card-title">桃園機場捷運</div>
        <div class="card-desc">即時到站倒數，直達車 / 普通車分開顯示</div>
      </div>
      <div class="arrow">›</div>
    </div>
  </a>

  <a href="/tias" class="card card-tias">
    <div class="card-inner">
      <div class="icon-wrap">✈️</div>
      <div class="card-text">
        <div class="card-title">航空資訊看板</div>
        <div class="card-desc">AirAsia 入離港即時動態・登機門・地勤時程倒數</div>
      </div>
      <div class="arrow">›</div>
    </div>
  </a>

  <a href="/schedule" class="card card-schedule">
    <div class="card-inner">
      <div class="icon-wrap">🗓</div>
      <div class="card-text">
        <div class="card-title">週班表</div>
        <div class="card-desc">未來 7 天定期航班分布・尖峰日預測・時段分析</div>
      </div>
      <div class="arrow">›</div>
    </div>
  </a>

  <a href="/amenities" class="card card-amenities">
    <div class="card-inner">
      <div class="icon-wrap">🗺️</div>
      <div class="card-text">
        <div class="card-title">機場設施指南</div>
        <div class="card-desc">育嬰室・換匯・退稅・行李・醫療・ATM・快速定位 TPE 全設施</div>
      </div>
      <div class="arrow">›</div>
    </div>
  </a>

</div>

<div class="footer">Transportation Assistant</div>

<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');

/* ── 防縮放（iOS 雙保險） ── */
document.addEventListener('touchmove', function(e) {
  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });
let _lastTap = 0;
document.addEventListener('touchend', function(e) {
  const now = Date.now();
  if (now - _lastTap < 300) e.preventDefault();
  _lastTap = now;
}, { passive: false });

/* ── 卡片錯開入場 ── */
document.querySelectorAll('.grid .card').forEach((card, i) => {
  card.style.animation =
    `cardSlideUp 0.58s cubic-bezier(0.22, 1, 0.36, 1) ${100 + i * 72}ms both`;
});

/* ── 點擊卡片：先讓整格動畫退場，再跳頁 ── */
document.querySelectorAll('a.card').forEach(a => {
  a.addEventListener('click', function (e) {
    e.preventDefault();
    const href = this.href;
    const grid   = document.querySelector('.grid');
    const header = document.querySelector('.header');
    const footer = document.querySelector('.footer');
    const easing = 'cubic-bezier(0.4, 0, 1, 1)';
    const dur    = '0.2s';

    [grid, header, footer].forEach(el => {
      el.style.transition = `opacity ${dur} ${easing}, transform ${dur} ${easing}`;
    });
    grid.style.opacity   = '0';
    grid.style.transform = 'scale(0.95) translateY(-10px)';
    header.style.opacity = '0';
    header.style.transform = 'translateY(-8px)';
    footer.style.opacity = '0';

    setTimeout(() => { location.href = href; }, 210);
  });
});

/* ── bfcache 恢復：重播所有入場動畫 ── */
window.addEventListener('pageshow', e => {
  if (!e.persisted) return;

  const header = document.querySelector('.header');
  const footer = document.querySelector('.footer');
  const grid   = document.querySelector('.grid');
  const cards  = document.querySelectorAll('.grid .card');

  /* 清除出場動畫殘留的 inline style，否則 grid / header / footer 仍是 opacity:0 */
  [grid, header, footer].forEach(el => {
    el.style.opacity    = '';
    el.style.transform  = '';
    el.style.transition = '';
  });

  /* 停掉已完成的動畫（設為 none 再觸發重播） */
  header.style.animationName = 'none';
  footer.style.animationName = 'none';
  cards.forEach(c => { c.style.animationName = 'none'; });

  void document.body.offsetWidth; /* 單次 reflow */

  /* 恢復 header / footer CSS 定義的動畫 */
  header.style.animationName = '';
  footer.style.animationName = '';

  /* 重播卡片錯排 */
  cards.forEach((card, i) => {
    card.style.animation =
      `cardSlideUp 0.55s cubic-bezier(0.22, 1, 0.36, 1) ${100 + i * 72}ms both`;
  });
});
</script>
</body>
</html>
