<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>交通助理</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<link rel="apple-touch-icon" href="/static/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="交通助理">
<meta name="theme-color" content="#f2f2f7">
<script src="/static/config.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { overscroll-behavior: none; }

/* ── 關鍵影格 ── */
@keyframes pageIn {
  from { opacity: 0; transform: translateY(18px) scale(0.986); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes headerIn {
  from { opacity: 0; transform: translateY(-10px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes cardSlideUp {
  from { opacity: 0; transform: translateY(24px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes pageOut {
  to { opacity: 0; transform: scale(0.96) translateY(-10px); }
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f2f2f7;
  color: #1c1c1e;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: max(24px, env(safe-area-inset-top) + 12px) 20px max(48px, env(safe-area-inset-bottom) + 16px);
}
.header {
  text-align: center;
  margin-bottom: 36px;
  animation: headerIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.05s both;
}
.header h1 {
  font-size: 1.8rem;
  font-weight: 700;
  color: #1c1c1e;
  letter-spacing: -0.3px;
}
.header p {
  font-size: 0.82rem;
  color: #8e8e93;
  margin-top: 6px;
}
.grid {
  display: grid;
  gap: 16px;
  width: 100%;
  max-width: 460px;
}
.card {
  display: block;
  text-decoration: none;
  background: rgba(255, 255, 255, 0.75);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 24px;
  padding: 26px 22px;
  box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 20px 40px -4px rgba(0, 0, 0, 0.05);
  transition:
    transform    0.3s cubic-bezier(0.25, 1, 0.5, 1),
    background   0.2s ease,
    box-shadow   0.3s cubic-bezier(0.25, 1, 0.5, 1);
  cursor: pointer;
  position: relative;
  overflow: hidden;
  will-change: transform;
  opacity: 0;
}
/* hover 色光暈 */
.card::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 24px;
  opacity: 0;
  transition: opacity 0.22s;
}
/* iOS 2026 光學折射邊框 — 漸層由上亮到下暗模擬頂光折射 */
.card::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 24px;
  padding: 1px;
  background: linear-gradient(
    155deg,
    rgba(255, 255, 255, 0.68) 0%,
    rgba(255, 255, 255, 0.08) 55%,
    rgba(255, 255, 255, 0.22) 100%
  );
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: destination-out;
  mask-composite: exclude;
  pointer-events: none;
}
@media (hover: hover) {
  .card:hover {
    transform: translateY(-5px) scale(1.012);
    box-shadow: 0 8px 20px -2px rgba(0, 0, 0, 0.06), 0 32px 56px -8px rgba(0, 0, 0, 0.12);
  }
  .card:hover::before { opacity: 1; }
  .card:hover .arrow  { transform: translateX(5px); }
}
.card:active {
  transform: scale(0.965) !important;
  transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1) !important;
}

/* 高鐵卡片 */
.card-thsr::before { background: radial-gradient(ellipse at 80% 20%, #ff950015, transparent 60%); }
.card-thsr:hover { background: #fffaf4; }

/* 捷運卡片 */
.card-mrt::before { background: radial-gradient(ellipse at 80% 20%, #7c3aed15, transparent 60%); }
.card-mrt:hover { background: #faf8ff; }

.card-inner {
  display: flex;
  align-items: center;
  gap: 18px;
  position: relative;
  z-index: 1;
}
.icon-wrap {
  width: 60px;
  height: 60px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 1.8rem;
  transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
}
@media (hover: hover) {
  .card:hover .icon-wrap { transform: scale(1.06) rotate(-3deg); }
}
.card-thsr .icon-wrap { background: #fff3e0; }
.card-mrt  .icon-wrap { background: #ede9fe; }

.card-text { flex: 1; }
.card-title {
  font-size: 1.1rem;
  font-weight: 700;
  color: #1c1c1e;
  margin-bottom: 4px;
}
.card-desc {
  font-size: 0.78rem;
  color: #8e8e93;
  line-height: 1.5;
}
.card-thsr .card-title { color: #c97000; }
.card-mrt  .card-title { color: #7c3aed; }

.arrow {
  font-size: 1.1rem;
  color: #c7c7cc;
  transition: color 0.2s, transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
}
.card-thsr:hover .arrow { color: #ff9500; }
.card-mrt:hover  .arrow { color: #7c3aed; }

/* Widget 卡片 */
.card-widget::before { background: radial-gradient(ellipse at 80% 20%, #6366f115, transparent 60%); }
.card-widget:hover { background: #f8f8ff; }
.card-widget .icon-wrap { background: #eef2ff; }
.card-widget .card-title { color: #4f46e5; }
.card-widget:hover .arrow { color: #6366f1; }

/* 航空看板卡片 */
.card-tias::before { background: radial-gradient(ellipse at 80% 20%, #1a56db12, transparent 60%); }
.card-tias:hover { background: #eff6ff; }
.card-tias .icon-wrap { background: #dbeafe; }
.card-tias .card-title { color: #1e40af; }
.card-tias:hover .arrow { color: #1a56db; }

/* 週班表卡片 */
.card-schedule::before { background: radial-gradient(ellipse at 80% 20%, #05966915, transparent 60%); }
.card-schedule:hover { background: #f0fdf4; }
.card-schedule .icon-wrap { background: #dcfce7; }
.card-schedule .card-title { color: #047857; }
.card-schedule:hover .arrow { color: #059669; }

/* 機場設施卡片 */
.card-amenities::before { background: radial-gradient(ellipse at 80% 20%, #0891b215, transparent 60%); }
.card-amenities:hover { background: #ecfeff; }
.card-amenities .icon-wrap { background: #cffafe; }
.card-amenities .card-title { color: #0e7490; }
.card-amenities:hover .arrow { color: #0891b2; }

.footer {
  margin-top: 40px;
  font-size: 0.7rem;
  color: #c7c7cc;
  text-align: center;
  animation: headerIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.5s both;
}

/* ── 用戶設定檔 chip ── */
.profile-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-top: 12px;
  padding: 5px 13px 5px 9px;
  background: rgba(255, 255, 255, 0.62);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-radius: 100px;
  border: 1px solid rgba(255, 255, 255, 0.5);
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
  font-size: 0.76rem;
  color: #3a3a3c;
  font-weight: 600;
  cursor: pointer;
  background-color: rgba(255,255,255,0.62);
  font-family: inherit;
  transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1);
  -webkit-tap-highlight-color: transparent;
}
.profile-chip:active { transform: scale(0.93); }
.pc-chevron { font-size: 0.62rem; color: #8e8e93; }

/* ── 底部 Sheet ── */
.sheet-overlay {
  position: fixed; inset: 0;
  background: transparent;
  z-index: 199;
  pointer-events: none;
  transition: background 0.3s ease;
}
.sheet-overlay.open { background: rgba(0,0,0,0.22); pointer-events: auto; }
.profile-sheet {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: rgba(242, 242, 247, 0.96);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-radius: 24px 24px 0 0;
  padding-bottom: max(24px, env(safe-area-inset-bottom));
  z-index: 200;
  transform: translateY(100%);
  transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
  max-height: 72vh;
  overflow-y: auto;
  box-shadow: 0 -4px 24px rgba(0,0,0,0.08);
}
.profile-sheet.open { transform: translateY(0); }
.sh-handle { width: 36px; height: 4px; background: rgba(60,60,67,0.25); border-radius: 100px; margin: 12px auto 0; }
.sh-label  { font-size: 0.72rem; font-weight: 600; color: #8e8e93; text-transform: uppercase; letter-spacing: .05em; padding: 16px 20px 6px; }
.sh-section { background: rgba(255,255,255,0.82); border-radius: 16px; margin: 0 16px 12px; overflow: hidden; }
.sh-row {
  display: flex; align-items: center; gap: 10px;
  padding: 13px 16px;
  border-bottom: 1px solid rgba(60,60,67,0.08);
  cursor: pointer;
  transition: background 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.sh-row:last-child { border-bottom: none; }
.sh-row:active { background: rgba(0,0,0,0.04); }
.sh-check { width: 20px; font-size: 0.88rem; color: #059669; }
.sh-name  { flex: 1; font-size: 0.92rem; color: #1c1c1e; }
.sh-row.active .sh-name { font-weight: 700; }
.sh-del { font-size: 0.72rem; color: #ff3b30; background: none; border: none; padding: 4px 8px; border-radius: 8px; cursor: pointer; font-weight: 600; font-family: inherit; }
.sh-add { display: flex; align-items: center; gap: 8px; padding: 10px 16px; }
.sh-add input {
  flex: 1; padding: 8px 12px; border-radius: 10px;
  border: 1px solid rgba(60,60,67,0.2);
  background: rgba(255,255,255,0.9);
  font-size: 0.88rem; color: #1c1c1e; outline: none; font-family: inherit;
}
.sh-add input:focus { border-color: #059669; }
.sh-add button {
  padding: 8px 16px; border-radius: 10px;
  background: #059669; color: #fff;
  font-size: 0.82rem; font-weight: 700; border: none; cursor: pointer; font-family: inherit;
  transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1);
}
.sh-add button:active { transform: scale(0.93); }
.sh-bkup { display: flex; gap: 8px; padding: 10px 16px; }
.sh-bkup button {
  flex: 1; padding: 9px; border-radius: 10px; font-size: 0.78rem;
  font-weight: 600; border: none; cursor: pointer; font-family: inherit;
  background: rgba(60,60,67,0.1); color: #1c1c1e;
  transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1);
}
.sh-bkup button:active { transform: scale(0.94); }
.sh-import-wrap { padding: 0 16px 10px; display: none; }
.sh-import-wrap textarea {
  width: 100%; padding: 8px 10px; border-radius: 10px;
  border: 1px solid rgba(60,60,67,0.2); background: rgba(255,255,255,0.9);
  font-size: 0.72rem; color: #1c1c1e; resize: none; height: 56px;
  font-family: monospace; outline: none; display: block;
}
.sh-import-wrap button {
  margin-top: 6px; width: 100%; padding: 8px; border-radius: 10px;
  background: #059669; color: #fff; font-size: 0.82rem; font-weight: 700;
  border: none; cursor: pointer; font-family: inherit;
}
</style>
</head>
<body>

<div class="header">
  <h1>🚉 交通助理</h1>
  <p>選擇你需要的交通工具</p>
  <button class="profile-chip" onclick="openSheet()">
    <span>👤</span>
    <span id="profileLabel">—</span>
    <span class="pc-chevron">▾</span>
  </button>
</div>

<div class="grid">
  <a href="/thsr" class="card card-thsr">
    <div class="card-inner">
      <div class="icon-wrap">🚄</div>
      <div class="card-text">
        <div class="card-title">高鐵刷票</div>
        <div class="card-desc">自動偵測放票，找到座位立即 Telegram 通知</div>
      </div>
      <div class="arrow">›</div>
    </div>
  </a>

  <a href="/mrt" class="card card-mrt">
    <div class="card-inner">
      <div class="icon-wrap">🚇</div>
      <div class="card-text">
        <div class="card-title">桃園機場捷運</div>
        <div class="card-desc">即時到站倒數，直達車 / 普通車分開顯示</div>
      </div>
      <div class="arrow">›</div>
    </div>
  </a>

  <a href="/tias" class="card card-tias">
    <div class="card-inner">
      <div class="icon-wrap">✈️</div>
      <div class="card-text">
        <div class="card-title">航空資訊看板</div>
        <div class="card-desc">AirAsia 入離港即時動態・登機門・地勤時程倒數</div>
      </div>
      <div class="arrow">›</div>
    </div>
  </a>

  <a href="/schedule" class="card card-schedule">
    <div class="card-inner">
      <div class="icon-wrap">🗓</div>
      <div class="card-text">
        <div class="card-title">週班表</div>
        <div class="card-desc">未來 7 天定期航班分布・尖峰日預測・時段分析</div>
      </div>
      <div class="arrow">›</div>
    </div>
  </a>

  <a href="/amenities" class="card card-amenities">
    <div class="card-inner">
      <div class="icon-wrap">🗺️</div>
      <div class="card-text">
        <div class="card-title">機場設施指南</div>
        <div class="card-desc">育嬰室・換匯・退稅・行李・醫療・ATM・快速定位 TPE 全設施</div>
      </div>
      <div class="arrow">›</div>
    </div>
  </a>

</div>

<div class="footer">Transportation Assistant</div>

<!-- 用戶設定檔 底部 Sheet -->
<div class="sheet-overlay" id="sheetOverlay" onclick="closeSheet()"></div>
<div class="profile-sheet" id="profileSheet">
  <div class="sh-handle"></div>
  <div class="sh-label">使用者</div>
  <div class="sh-section" id="profileList"></div>
  <div class="sh-section">
    <div class="sh-add">
      <input id="newName" type="text" placeholder="新用戶名稱" maxlength="16"
             onkeydown="if(event.key==='Enter')addProfile()">
      <button onclick="addProfile()">新增</button>
    </div>
  </div>
  <div class="sh-label">設定備份</div>
  <div class="sh-section">
    <div class="sh-bkup">
      <button onclick="exportCfg()">📋 複製備份碼</button>
      <button onclick="toggleImport()">📥 貼上還原</button>
    </div>
    <div class="sh-import-wrap" id="importWrap">
      <textarea id="importInput" placeholder="貼上備份碼…"></textarea>
      <button onclick="doImport()">確認還原</button>
    </div>
  </div>
</div>

<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');

/* ── 防縮放（iOS 雙保險） ── */
document.addEventListener('touchmove', function(e) {
  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });
let _lastTap = 0;
document.addEventListener('touchend', function(e) {
  const now = Date.now();
  if (now - _lastTap < 300) e.preventDefault();
  _lastTap = now;
}, { passive: false });

/* ── 卡片錯開入場 ── */
document.querySelectorAll('.grid .card').forEach((card, i) => {
  card.style.animation =
    `cardSlideUp 0.58s cubic-bezier(0.22, 1, 0.36, 1) ${100 + i * 72}ms both`;
});

/* ── 點擊卡片：先讓整格動畫退場，再跳頁 ── */
document.querySelectorAll('a.card').forEach(a => {
  a.addEventListener('click', function (e) {
    e.preventDefault();
    const href = this.href;
    const grid   = document.querySelector('.grid');
    const header = document.querySelector('.header');
    const footer = document.querySelector('.footer');
    const easing = 'cubic-bezier(0.4, 0, 1, 1)';
    const dur    = '0.2s';

    [grid, header, footer].forEach(el => {
      el.style.transition = `opacity ${dur} ${easing}, transform ${dur} ${easing}`;
    });
    grid.style.opacity   = '0';
    grid.style.transform = 'scale(0.95) translateY(-10px)';
    header.style.opacity = '0';
    header.style.transform = 'translateY(-8px)';
    footer.style.opacity = '0';

    setTimeout(() => { location.href = href; }, 210);
  });
});

/* ── bfcache 恢復：重播所有入場動畫 ── */
window.addEventListener('pageshow', e => {
  if (!e.persisted) return;

  const header = document.querySelector('.header');
  const footer = document.querySelector('.footer');
  const grid   = document.querySelector('.grid');
  const cards  = document.querySelectorAll('.grid .card');

  /* 清除出場動畫殘留的 inline style，否則 grid / header / footer 仍是 opacity:0 */
  [grid, header, footer].forEach(el => {
    el.style.opacity    = '';
    el.style.transform  = '';
    el.style.transition = '';
  });

  /* 停掉已完成的動畫（設為 none 再觸發重播） */
  header.style.animationName = 'none';
  footer.style.animationName = 'none';
  cards.forEach(c => { c.style.animationName = 'none'; });

  void document.body.offsetWidth; /* 單次 reflow */

  /* 恢復 header / footer CSS 定義的動畫 */
  header.style.animationName = '';
  footer.style.animationName = '';

  /* 重播卡片錯排 */
  cards.forEach((card, i) => {
    card.style.animation =
      `cardSlideUp 0.55s cubic-bezier(0.22, 1, 0.36, 1) ${100 + i * 72}ms both`;
  });
  _renderProfiles();
});

/* ── 用戶設定檔 管理 ── */
function _renderProfiles() {
  const { profiles, active } = Config.getAll();
  const pArr = Object.values(profiles);
  document.getElementById('profileLabel').textContent = (profiles[active] || pArr[0]).name;
  document.getElementById('profileList').innerHTML = pArr.map(p => `
    <div class="sh-row${p.id === active ? ' active' : ''}" onclick="selectProfile('${p.id}')">
      <span class="sh-check">${p.id === active ? '✓' : ''}</span>
      <span class="sh-name">${p.name.replace(/</g,'&lt;')}</span>
      ${pArr.length > 1
        ? `<button class="sh-del" onclick="event.stopPropagation();delProfile('${p.id}')">刪除</button>`
        : ''}
    </div>
  `).join('');
}

function openSheet()  {
  _renderProfiles();
  document.getElementById('profileSheet').classList.add('open');
  document.getElementById('sheetOverlay').classList.add('open');
}
function closeSheet() {
  document.getElementById('profileSheet').classList.remove('open');
  document.getElementById('sheetOverlay').classList.remove('open');
}
function selectProfile(id) { Config.setActive(id); _renderProfiles(); closeSheet(); }
function delProfile(id)     { if (Config.del(id)) _renderProfiles(); }
function addProfile() {
  const n = document.getElementById('newName').value.trim();
  if (!n) { document.getElementById('newName').focus(); return; }
  Config.create(n);
  document.getElementById('newName').value = '';
  _renderProfiles();
}
function exportCfg() {
  const b64 = Config.exportB64();
  (navigator.clipboard?.writeText(b64) || Promise.reject())
    .then(() => alert('備份碼已複製！換裝置時貼上還原即可'))
    .catch(() => {
      const ta = document.getElementById('importInput');
      ta.value = b64;
      document.getElementById('importWrap').style.display = 'block';
      ta.select();
    });
}
function toggleImport() {
  const w = document.getElementById('importWrap');
  w.style.display = w.style.display === 'block' ? 'none' : 'block';
}
function doImport() {
  const b64 = document.getElementById('importInput').value.trim();
  if (Config.importB64(b64)) {
    _renderProfiles();
    document.getElementById('importWrap').style.display = 'none';
    document.getElementById('importInput').value = '';
    alert('設定已還原！');
  } else {
    alert('備份碼格式錯誤，請確認是否完整');
  }
}

_renderProfiles();
</script>
</body>
</html>
