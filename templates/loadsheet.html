<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>貨艙裝載計算 · Load & Trim</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<link rel="apple-touch-icon" href="/static/icon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="交通助理">
<meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { overscroll-behavior: none; }

@keyframes pageIn {
  from { opacity: 0; transform: translateY(14px) scale(0.988); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(16px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

:root {
  --bg:      #fbfbfd;
  --card:    #ffffff;
  --border:  rgba(0,0,0,0.08);
  --divider: rgba(0,0,0,0.09);
  --text:    #1d1d1f;
  --sub:     #86868b;
  --accent:  #0071e3;
  --fill:    #1d1d1f;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
  -webkit-tap-highlight-color: transparent;
}
body { animation: pageIn 0.38s cubic-bezier(0.22,1,0.36,1) both; }

/* ── 頂部 header ── */
.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(251,251,253,0.86);
  backdrop-filter: saturate(1.6) blur(22px);
  -webkit-backdrop-filter: saturate(1.6) blur(22px);
  padding: env(safe-area-inset-top, 0px) 16px 0;
  border-bottom: 1px solid var(--divider);
}
.header-row { display: flex; align-items: center; gap: 10px; padding: 14px 0 10px; }
.back-btn {
  display: flex; align-items: center; gap: 3px;
  background: none; border: none; color: var(--accent);
  font-size: 1rem; font-weight: 500; cursor: pointer;
  padding: 4px 8px 4px 2px; border-radius: 8px;
  transition: background 0.15s, transform 0.15s cubic-bezier(0.25,1,0.5,1), opacity 0.15s ease;
  flex-shrink: 0; text-decoration: none;
}
.back-btn:active { transform: scale(0.93); opacity: 0.6; background: rgba(0,113,227,0.1); }
.back-arrow { font-size: 1.2rem; line-height: 1; }
.header-title { flex: 1; text-align: center; }
.header-title-zh { font-size: 1rem; font-weight: 700; color: var(--text); line-height: 1.2; letter-spacing: -0.02em; }
.header-title-en { font-size: 0.68rem; color: var(--sub); font-weight: 590; letter-spacing: 0.02em; }
.header-spacer { width: 56px; flex-shrink: 0; }

/* ── 內容 ── */
.content { max-width: 480px; margin: 0 auto; padding: 20px 16px max(40px, env(safe-area-inset-bottom) + 24px); }

/* ── 機型切換 ── */
.segmented {
  display: flex; gap: 4px; background: rgba(118,118,128,0.12);
  border-radius: 14px; padding: 4px; margin-bottom: 20px;
  animation: cardIn 0.45s cubic-bezier(0.22,1,0.36,1) both;
}
.seg-btn {
  flex: 1; padding: 10px 0; border: none; border-radius: 10px;
  background: transparent; color: var(--sub);
  font-size: 0.92rem; font-weight: 700; font-family: inherit;
  cursor: pointer; transition: background 0.2s, color 0.2s, transform 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.seg-btn.active { background: #fff; color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
.seg-btn:active { transform: scale(0.96); }

/* ── 飛機側視圖 ── */
.plane-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 22px; padding: 18px 12px 14px;
  margin-bottom: 22px;
  animation: cardIn 0.45s cubic-bezier(0.22,1,0.36,1) 0.05s both;
}
.plane-wrap { position: relative; width: 100%; }
.plane-svg { width: 100%; height: auto; display: block; }
.fwd-tag {
  position: absolute; right: 4px; top: 6px;
  display: flex; align-items: center; gap: 4px;
  font-size: 0.66rem; font-weight: 700; color: var(--sub);
  letter-spacing: 0.06em; text-transform: uppercase;
}
.ac-name {
  text-align: center; font-size: 0.78rem; color: var(--sub);
  font-weight: 600; margin-top: 6px; letter-spacing: -0.01em;
}

/* ── 貨艙區 ── */
.hold-section-title {
  font-size: 0.72rem; font-weight: 700; color: var(--sub);
  text-transform: uppercase; letter-spacing: 0.06em;
  margin: 4px 0 10px 2px;
}
.hold-row {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
}
.hold-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 18px; padding: 14px 8px 12px; text-align: center;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: transform 0.15s cubic-bezier(0.25,1,0.5,1), background 0.15s;
  animation: cardIn 0.45s cubic-bezier(0.22,1,0.36,1) both;
}
.hold-card:active { transform: scale(0.965); background: rgba(0,0,0,0.02); }
.hold-card.filled { border-color: rgba(0,113,227,0.35); background: rgba(0,113,227,0.05); }
.hold-icon {
  width: 36px; height: 36px; margin: 0 auto 8px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg,#2997ff,#0071e3); color: #fff;
  font-size: 1rem;
}
.hold-name { font-size: 0.86rem; font-weight: 700; color: var(--text); }
.hold-door { font-size: 0.6rem; color: var(--sub); margin-top: 2px; min-height: 12px; }
.hold-max  { font-size: 0.66rem; color: var(--sub); margin-top: 6px; }
.hold-val  { font-size: 0.78rem; font-weight: 700; color: var(--accent); margin-top: 4px; min-height: 16px; }
.hold-val.empty { color: var(--sub); font-weight: 500; }

/* ── 輸入面板：全螢幕、上緣錨定、display 開關（不用 transform，避免 iOS 鍵盤怪異行為）── */
.input-sheet {
  position: fixed; inset: 0; z-index: 300;
  display: none; flex-direction: column;
  background: var(--bg);
}
.input-sheet.open { display: flex; }
.input-sheet-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: max(16px, env(safe-area-inset-top) + 8px) 16px 12px;
  border-bottom: 1px solid var(--divider);
  background: rgba(251,251,253,0.9);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  flex-shrink: 0;
}
.input-sheet-title { font-size: 1rem; font-weight: 800; color: var(--text); }
.sheet-btn {
  background: none; border: none; font-size: 0.95rem; font-weight: 600;
  cursor: pointer; font-family: inherit; padding: 6px 4px;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.15s cubic-bezier(0.25,1,0.5,1), opacity 0.15s;
}
.sheet-btn:active { transform: scale(0.93); opacity: 0.6; }
.sheet-btn.cancel  { color: var(--sub); }
.sheet-btn.save    { color: var(--accent); font-weight: 700; }
.input-sheet-body { flex: 1; min-height: 0; overflow-y: auto; padding: 24px 20px; }
.field-group { margin-bottom: 22px; }
.field-group label {
  display: block; font-size: 0.76rem; font-weight: 700; color: var(--sub);
  text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px;
}
.field-group input {
  width: 100%; padding: 16px 16px; font-size: 1.4rem; font-weight: 700;
  border: 1.5px solid var(--border); border-radius: 16px;
  background: var(--card); color: var(--text); outline: none;
  font-family: inherit; -webkit-appearance: none;
}
.field-group input:focus { border-color: var(--accent); }
.max-hint {
  font-size: 0.82rem; color: var(--sub); background: rgba(0,0,0,0.03);
  border-radius: 12px; padding: 12px 14px; line-height: 1.5;
}
.max-hint b { color: var(--text); }
.clear-btn {
  display: block; width: 100%; margin-top: 28px; padding: 14px;
  border-radius: 14px; background: rgba(255,59,48,0.08); border: none;
  color: #ff3b30; font-size: 0.9rem; font-weight: 700; font-family: inherit;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: transform 0.15s cubic-bezier(0.25,1,0.5,1);
}
.clear-btn:active { transform: scale(0.97); }

/* ── Dark Mode ── */
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000; --card: #1c1c1e;
    --border: rgba(255,255,255,0.09); --divider: rgba(255,255,255,0.12);
    --text: #f5f5f7; --sub: #86868b; --fill: #f5f5f7;
  }
  .header { background: rgba(0,0,0,0.75); }
  .segmented { background: rgba(255,255,255,0.1); }
  .seg-btn.active { background: #2c2c2e; color: #f5f5f7; }
  .hold-card.filled { background: rgba(41,151,255,0.1); }
  .input-sheet-header { background: rgba(0,0,0,0.8); }
  .field-group input { background: #2c2c2e; }
  .max-hint { background: rgba(255,255,255,0.06); }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-row">
    <a class="back-btn" href="/"><span class="back-arrow">‹</span>返回</a>
    <div class="header-title">
      <div class="header-title-zh"><i class="bi bi-boxes"></i> 貨艙裝載計算</div>
      <div class="header-title-en">LOAD &amp; TRIM SHEET</div>
    </div>
    <div class="header-spacer"></div>
  </div>
</div>

<div class="content">

  <!-- 機型切換 -->
  <div class="segmented" id="acSwitch">
    <button class="seg-btn active" data-ac="A320">A320</button>
    <button class="seg-btn" data-ac="A321">A321</button>
  </div>

  <!-- 飛機側視圖 -->
  <div class="plane-card">
    <div class="plane-wrap">
      <span class="fwd-tag">FWD <i class="bi bi-arrow-right"></i></span>
      <svg id="planeSvg" class="plane-svg" viewBox="0 0 1000 240" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div class="ac-name" id="acName">Airbus A320</div>
  </div>

  <!-- 貨艙區 -->
  <div class="hold-section-title">Departure Loading · 貨艙選擇</div>
  <div class="hold-row" id="holdRow"></div>

</div>

<!-- 輸入面板 -->
<div class="input-sheet" id="inputSheet">
  <div class="input-sheet-header">
    <button class="sheet-btn cancel" onclick="closeInputSheet()">取消</button>
    <div class="input-sheet-title" id="sheetTitle">HOLD 1</div>
    <button class="sheet-btn save" onclick="saveInputSheet()">儲存</button>
  </div>
  <div class="input-sheet-body">
    <div class="field-group">
      <label>件數 PCS</label>
      <input type="number" inputmode="numeric" pattern="[0-9]*" id="pcsInput" placeholder="0">
    </div>
    <div class="field-group">
      <label>總重量 KG</label>
      <input type="number" inputmode="decimal" id="wgtInput" placeholder="0">
    </div>
    <div class="max-hint" id="maxHint"></div>
    <button class="clear-btn" onclick="clearInputSheet()"><i class="bi bi-trash3"></i> 清空這個貨艙</button>
  </div>
</div>

<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
let _lastTap = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - _lastTap < 300) e.preventDefault();
  _lastTap = now;
}, { passive: false });

/* ════════════════════════════════════════
   機型資料（貨艙沿用 Philippines AirAsia A320
   Loading Instruction and Break-up Form 印刷固定值；
   A321 上限尚未取得正式表單，先留待確認）
   ════════════════════════════════════════ */
const AIRCRAFT = {
  A320: {
    name: 'Airbus A320',
    fuselage: { noseTip: 930, noseStart: 760, tailStart: 130, tailTip: 40 },
    wing: { x1: 430, x2: 560 },
    holds: [
      { id: 'HOLD5', label: 'HOLD 5', door: '',            max: null, maxNote: 'MAX 1497 KGS (180Y) / 500 KGS (186Y)', cx: 90  },
      { id: 'HOLD4', label: 'HOLD 4', door: 'AFT DOOR SIDE', max: 2110, maxNote: 'MAX 2110 KGS', cx: 230 },
      { id: 'HOLD3', label: 'HOLD 3', door: '',              max: 2426, maxNote: 'MAX 2426 KGS', cx: 350 },
      { id: 'HOLD1', label: 'HOLD 1', door: 'FWD DOOR SIDE', max: 3402, maxNote: 'MAX 3402 KGS', cx: 800 },
    ]
  },
  A321: {
    name: 'Airbus A321',
    fuselage: { noseTip: 970, noseStart: 800, tailStart: 100, tailTip: 30 },
    wing: { x1: 470, x2: 600 },
    holds: [
      { id: 'HOLD5', label: 'HOLD 5', door: '',              max: null, maxNote: '上限待確認（A321 表單尚未提供）', cx: 70  },
      { id: 'HOLD4', label: 'HOLD 4', door: 'AFT DOOR SIDE', max: null, maxNote: '上限待確認（A321 表單尚未提供）', cx: 210 },
      { id: 'HOLD3', label: 'HOLD 3', door: '',              max: null, maxNote: '上限待確認（A321 表單尚未提供）', cx: 350 },
      { id: 'HOLD1', label: 'HOLD 1', door: 'FWD DOOR SIDE', max: null, maxNote: '上限待確認（A321 表單尚未提供）', cx: 850 },
    ]
  }
};

const STORE_KEY = 'loadsheet_state_v1';
let curAc = 'A320';
let curHoldId = null;

function loadState() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
  catch { return {}; }
}
function saveState(state) { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }

/* ── 飛機側視圖繪製 ── */
function drawPlane(ac) {
  const cfg = AIRCRAFT[ac].fuselage;
  const wing = AIRCRAFT[ac].wing;
  const svg = document.getElementById('planeSvg');
  const midY = 110;
  const half = 34;

  const fillMain = getComputedStyle(document.documentElement).getPropertyValue('--fill').trim() || '#1d1d1f';

  svg.innerHTML = `
    <!-- 機身 -->
    <path d="M ${cfg.tailTip} ${midY}
             Q ${cfg.tailStart - 40} ${midY - half} ${cfg.tailStart} ${midY - half}
             L ${cfg.noseStart} ${midY - half}
             Q ${cfg.noseTip} ${midY - half} ${cfg.noseTip} ${midY}
             Q ${cfg.noseTip} ${midY + half} ${cfg.noseStart} ${midY + half}
             L ${cfg.tailStart} ${midY + half}
             Q ${cfg.tailStart - 40} ${midY + half} ${cfg.tailTip} ${midY}
             Z"
          fill="${fillMain}" opacity="0.92"/>
    <!-- 駕駛艙窗 -->
    <path d="M ${cfg.noseStart - 6} ${midY - half + 6} L ${cfg.noseTip - 26} ${midY - 6} L ${cfg.noseStart - 6} ${midY - 6} Z"
          fill="#7dd3fc" opacity="0.85"/>
    <!-- 客艙窗列 -->
    ${Array.from({length: Math.floor((cfg.noseStart - cfg.tailStart - 20) / 26)}, (_, i) => {
      const x = cfg.tailStart + 20 + i * 26;
      return `<circle cx="${x}" cy="${midY - half + 13}" r="4" fill="#7dd3fc" opacity="0.75"/>`;
    }).join('')}
    <!-- 垂直尾翼 -->
    <path d="M ${cfg.tailStart + 6} ${midY - half + 4}
             L ${cfg.tailStart + 46} ${midY - half - 46}
             L ${cfg.tailStart + 70} ${midY - half - 46}
             L ${cfg.tailStart + 58} ${midY - half + 4} Z"
          fill="${fillMain}" opacity="0.92"/>
    <!-- 主翼 -->
    <path d="M ${wing.x1} ${midY + half - 6}
             L ${(wing.x1+wing.x2)/2 - 30} ${midY + half + 62}
             L ${(wing.x1+wing.x2)/2 + 46} ${midY + half + 62}
             L ${wing.x2} ${midY + half - 6} Z"
          fill="${fillMain}" opacity="0.8"/>
    <!-- 引擎 -->
    <rect x="${(wing.x1+wing.x2)/2 - 24}" y="${midY + half + 14}" width="48" height="26" rx="12"
          fill="${fillMain}" opacity="0.92"/>
  `;
}

/* ── 貨艙卡片渲染 ── */
function renderHolds() {
  const state = loadState();
  const acState = state[curAc] || {};
  const row = document.getElementById('holdRow');
  row.innerHTML = '';
  AIRCRAFT[curAc].holds.forEach((h, i) => {
    const entry = acState[h.id];
    const filled = entry && (entry.pcs || entry.wgt);
    const card = document.createElement('div');
    card.className = 'hold-card' + (filled ? ' filled' : '');
    card.style.animation = `cardIn 0.4s cubic-bezier(0.22,1,0.36,1) ${i * 60}ms both`;
    card.innerHTML = `
      <div class="hold-icon"><i class="bi bi-box-seam-fill"></i></div>
      <div class="hold-name">${h.label}</div>
      <div class="hold-door">${h.door || '&nbsp;'}</div>
      <div class="hold-max">${h.max ? 'MAX ' + h.max + ' KG' : '上限待確認'}</div>
      <div class="hold-val ${filled ? '' : 'empty'}">${filled ? (entry.pcs || 0) + ' PCS / ' + (entry.wgt || 0) + ' KG' : '尚未輸入'}</div>
    `;
    card.addEventListener('click', () => openInputSheet(h.id));
    row.appendChild(card);
  });
}

/* ── 輸入面板 ── */
function openInputSheet(holdId) {
  curHoldId = holdId;
  const h = AIRCRAFT[curAc].holds.find(x => x.id === holdId);
  const state = loadState();
  const entry = (state[curAc] || {})[holdId] || {};
  document.getElementById('sheetTitle').textContent = `${AIRCRAFT[curAc].name} · ${h.label}`;
  document.getElementById('pcsInput').value = entry.pcs || '';
  document.getElementById('wgtInput').value = entry.wgt || '';
  document.getElementById('maxHint').innerHTML = `<b>${h.label}</b>${h.door ? ' · ' + h.door : ''}<br>${h.maxNote}`;
  document.getElementById('inputSheet').classList.add('open');
}
function closeInputSheet() {
  document.getElementById('inputSheet').classList.remove('open');
  curHoldId = null;
}
function saveInputSheet() {
  if (!curHoldId) return;
  const state = loadState();
  state[curAc] = state[curAc] || {};
  const pcs = parseFloat(document.getElementById('pcsInput').value) || 0;
  const wgt = parseFloat(document.getElementById('wgtInput').value) || 0;
  state[curAc][curHoldId] = { pcs, wgt };
  saveState(state);
  closeInputSheet();
  renderHolds();
}
function clearInputSheet() {
  if (!curHoldId) return;
  const state = loadState();
  if (state[curAc]) delete state[curAc][curHoldId];
  saveState(state);
  closeInputSheet();
  renderHolds();
}

/* ── 機型切換 ── */
document.getElementById('acSwitch').addEventListener('click', e => {
  const btn = e.target.closest('.seg-btn');
  if (!btn) return;
  document.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  curAc = btn.dataset.ac;
  document.getElementById('acName').textContent = AIRCRAFT[curAc].name;
  drawPlane(curAc);
  renderHolds();
});

/* ── 初始化 ── */
drawPlane(curAc);
renderHolds();
</script>
</body>
</html>
