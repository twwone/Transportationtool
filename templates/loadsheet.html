<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>貨艙裝載計算 · Load & Trim</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<link rel="apple-touch-icon" href="/static/icon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="交通助理">
<meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { overscroll-behavior: none; }

@keyframes pageIn {
  from { opacity: 0; transform: translateY(14px) scale(0.988); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(16px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes fadeSlideUp {
  from { opacity: 0; transform: translateY(18px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

:root {
  --bg:      #fbfbfd;
  --card:    #ffffff;
  --border:  rgba(0,0,0,0.08);
  --divider: rgba(0,0,0,0.09);
  --text:    #1d1d1f;
  --sub:     #86868b;
  --accent:  #0071e3;
  --line:    #1d1d1f;
  --chip-bg: rgba(118,118,128,0.12);
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
  -webkit-tap-highlight-color: transparent;
}
body { animation: pageIn 0.38s cubic-bezier(0.22,1,0.36,1) both; }

/* ── 頂部 header ── */
.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(251,251,253,0.86);
  backdrop-filter: saturate(1.6) blur(22px);
  -webkit-backdrop-filter: saturate(1.6) blur(22px);
  padding: env(safe-area-inset-top, 0px) 16px 0;
  border-bottom: 1px solid var(--divider);
}
.header-row { display: flex; align-items: center; gap: 10px; padding: 14px 0 10px; }
.back-btn {
  display: flex; align-items: center; gap: 3px;
  background: none; border: none; color: var(--accent);
  font-size: 1rem; font-weight: 500; cursor: pointer;
  padding: 4px 8px 4px 2px; border-radius: 8px;
  transition: background 0.15s, transform 0.15s cubic-bezier(0.25,1,0.5,1), opacity 0.15s ease;
  flex-shrink: 0; text-decoration: none;
}
.back-btn:active { transform: scale(0.93); opacity: 0.6; background: rgba(0,113,227,0.1); }
.back-arrow { font-size: 1.2rem; line-height: 1; }
.header-title { flex: 1; text-align: center; }
.header-title-zh { font-size: 1rem; font-weight: 700; color: var(--text); line-height: 1.2; letter-spacing: -0.02em; }
.header-title-en { font-size: 0.68rem; color: var(--sub); font-weight: 590; letter-spacing: 0.02em; }
.header-spacer { width: 56px; flex-shrink: 0; }

/* ── 內容 ── */
.content { max-width: 480px; margin: 0 auto; padding: 20px 16px max(40px, env(safe-area-inset-bottom) + 24px); }

/* ── 機型切換 ── */
.segmented {
  display: flex; gap: 4px; background: var(--chip-bg);
  border-radius: 14px; padding: 4px; margin-bottom: 20px;
  animation: cardIn 0.45s cubic-bezier(0.22,1,0.36,1) both;
}
.seg-btn {
  flex: 1; padding: 10px 0; border: none; border-radius: 10px;
  background: transparent; color: var(--sub);
  font-size: 0.92rem; font-weight: 700; font-family: inherit;
  cursor: pointer; transition: background 0.2s, color 0.2s, transform 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.seg-btn.active { background: #fff; color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
.seg-btn:active { transform: scale(0.96); }

/* ── 行李總計 ── */
.total-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 22px; padding: 18px 16px; margin-bottom: 16px;
  animation: cardIn 0.45s cubic-bezier(0.22,1,0.36,1) 0.02s both;
}
.total-card-title {
  font-size: 0.92rem; font-weight: 800; margin-bottom: 14px;
  display: flex; align-items: center; gap: 8px;
}
.total-card-title .bi { color: var(--accent); }
.total-row { display: flex; gap: 10px; }
.total-field { flex: 1; }
.total-field label {
  display: block; font-size: 0.68rem; font-weight: 700; color: var(--sub);
  text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px;
}
.total-field input {
  width: 100%; padding: 12px; font-size: 1.1rem; font-weight: 700;
  border: 1.5px solid var(--border); border-radius: 12px;
  background: var(--bg); color: var(--text); outline: none;
  font-family: inherit; -webkit-appearance: none;
}
.total-field input:focus { border-color: var(--accent); }
.avg-hint {
  margin-top: 12px; font-size: 0.8rem; color: var(--sub);
  background: rgba(0,113,227,0.06); border-radius: 12px; padding: 10px 12px;
  line-height: 1.5;
}
.avg-hint b { color: var(--accent); font-weight: 800; }

/* ── 飛機側視圖（外框線稿）── */
.plane-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 22px; padding: 34px 8px 14px;
  margin-bottom: 22px;
  animation: cardIn 0.45s cubic-bezier(0.22,1,0.36,1) 0.05s both;
}
.plane-wrap { position: relative; width: 100%; }
.plane-svg { width: 100%; height: auto; display: block; }
@media (prefers-color-scheme: dark) {
  .plane-svg { filter: invert(1); }
}
.leader-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.fwd-tag {
  position: absolute; left: 2px; top: -22px;
  display: flex; align-items: center; gap: 4px;
  font-size: 0.64rem; font-weight: 700; color: var(--sub);
  letter-spacing: 0.06em; text-transform: uppercase;
}
.ac-name {
  text-align: center; font-size: 0.78rem; color: var(--sub);
  font-weight: 600; margin-top: 10px; letter-spacing: -0.01em;
}
.img-credit {
  text-align: center; font-size: 0.6rem; color: var(--sub);
  opacity: 0.6; margin-top: 8px; letter-spacing: 0.01em;
}

/* ── 貨艙定位 pin（疊加在飛機圖上）── */
.hold-pin {
  position: absolute;
  transform: translate(-50%, -50%);
  width: 30px; height: 30px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.74rem; font-weight: 800; color: #fff;
  background: linear-gradient(135deg,#2997ff,#0071e3);
  box-shadow: 0 2px 6px rgba(0,113,227,0.35), 0 0 0 3px var(--card);
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: transform 0.15s cubic-bezier(0.25,1,0.5,1);
  z-index: 2;
}
.hold-pin.nodoor { background: linear-gradient(135deg,#98a2ad,#6e7680); }
.hold-pin.filled { box-shadow: 0 2px 8px rgba(52,199,89,0.45), 0 0 0 3px var(--card); background: linear-gradient(135deg,#34d399,#059669); }
.hold-pin:active { transform: translate(-50%, -50%) scale(0.88); }

/* ── 圖例 ── */
.legend { display: flex; gap: 16px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.7rem; color: var(--sub); font-weight: 600; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; background: linear-gradient(135deg,#2997ff,#0071e3); flex-shrink: 0; }
.legend-dot.nodoor { background: linear-gradient(135deg,#98a2ad,#6e7680); }

/* ── 貨艙區（下方清單，僅顯示狀態，點擊同步開彈窗）── */
.hold-section-title {
  font-size: 0.72rem; font-weight: 700; color: var(--sub);
  text-transform: uppercase; letter-spacing: 0.06em;
  margin: 4px 0 10px 2px;
}
.hold-row {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
}
.hold-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 18px; padding: 12px 6px 10px; text-align: center;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: transform 0.15s cubic-bezier(0.25,1,0.5,1), background 0.15s;
  animation: cardIn 0.45s cubic-bezier(0.22,1,0.36,1) both;
}
.hold-card:active { transform: scale(0.965); background: rgba(0,0,0,0.02); }
.hold-card.filled { border-color: rgba(52,199,89,0.4); background: rgba(52,199,89,0.06); }
.hold-name { font-size: 0.84rem; font-weight: 700; color: var(--text); }
.hold-door { font-size: 0.58rem; color: var(--sub); margin-top: 2px; min-height: 12px; }
.hold-max  { font-size: 0.64rem; color: var(--sub); margin-top: 5px; }
.hold-val  { font-size: 0.76rem; font-weight: 700; color: #059669; margin-top: 4px; min-height: 16px; }
.hold-val.empty { color: var(--sub); font-weight: 500; }

/* ── 彈窗（置中 modal，非跳頁／非底部全螢幕）── */
.modal-overlay {
  position: fixed; inset: 0; z-index: 300;
  background: rgba(0,0,0,0.42);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  display: none; align-items: center; justify-content: center;
  padding: 20px;
}
.modal-overlay.open { display: flex; animation: fadeSlideUp 0.3s cubic-bezier(0.22,1,0.36,1) both; }
.modal-card {
  background: var(--card); border-radius: 24px;
  padding: 22px 20px 20px; width: 100%; max-width: 340px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.25);
}
.modal-title { font-size: 1.05rem; font-weight: 800; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.modal-title .bi { color: var(--accent); }
.field-group { margin-bottom: 16px; }
.field-group label {
  display: block; font-size: 0.72rem; font-weight: 700; color: var(--sub);
  text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px;
}
.field-group input {
  width: 100%; padding: 13px 14px; font-size: 1.2rem; font-weight: 700;
  border: 1.5px solid var(--border); border-radius: 14px;
  background: var(--bg); color: var(--text); outline: none;
  font-family: inherit; -webkit-appearance: none;
}
.field-group input:focus { border-color: var(--accent); }
.max-hint {
  font-size: 0.78rem; color: var(--sub); background: rgba(0,0,0,0.03);
  border-radius: 12px; padding: 10px 12px; line-height: 1.5; margin-bottom: 16px;
}
.max-hint b { color: var(--text); }
.modal-actions { display: flex; gap: 8px; margin-top: 4px; }
.modal-btn {
  flex: 1; padding: 13px; border-radius: 14px; border: none;
  font-size: 0.9rem; font-weight: 700; font-family: inherit; cursor: pointer;
  transition: transform 0.15s cubic-bezier(0.25,1,0.5,1);
  -webkit-tap-highlight-color: transparent;
}
.modal-btn:active { transform: scale(0.96); }
.modal-btn.cancel { background: var(--chip-bg); color: var(--sub); }
.modal-btn.confirm { background: linear-gradient(135deg,#2997ff,#0071e3); color: #fff; }
.clear-btn {
  display: block; width: 100%; margin-top: 10px; padding: 12px;
  border-radius: 14px; background: rgba(255,59,48,0.08); border: none;
  color: #ff3b30; font-size: 0.84rem; font-weight: 700; font-family: inherit;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: transform 0.15s cubic-bezier(0.25,1,0.5,1);
}
.clear-btn:active { transform: scale(0.97); }

/* ── Dark Mode ── */
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000; --card: #1c1c1e;
    --border: rgba(255,255,255,0.09); --divider: rgba(255,255,255,0.12);
    --text: #f5f5f7; --sub: #86868b; --line: #f5f5f7;
    --chip-bg: rgba(255,255,255,0.1);
  }
  .header { background: rgba(0,0,0,0.75); }
  .seg-btn.active { background: #2c2c2e; color: #f5f5f7; }
  .hold-card.filled { background: rgba(52,199,89,0.1); }
  .field-group input { background: #2c2c2e; }
  .max-hint { background: rgba(255,255,255,0.06); }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-row">
    <a class="back-btn" href="/"><span class="back-arrow">‹</span>返回</a>
    <div class="header-title">
      <div class="header-title-zh"><i class="bi bi-boxes"></i> 貨艙裝載計算</div>
      <div class="header-title-en">LOAD &amp; TRIM SHEET</div>
    </div>
    <div class="header-spacer"></div>
  </div>
</div>

<div class="content">

  <!-- 機型切換 -->
  <div class="segmented" id="acSwitch">
    <button class="seg-btn active" data-ac="A320">A320</button>
    <button class="seg-btn" data-ac="A321">A321</button>
  </div>

  <!-- 行李總計 -->
  <div class="total-card">
    <div class="total-card-title"><i class="bi bi-luggage-fill"></i> 行李總計</div>
    <div class="total-row">
      <div class="total-field">
        <label>總件數 PCS</label>
        <input type="number" inputmode="numeric" pattern="[0-9]*" id="totalPcsInput" placeholder="0">
      </div>
      <div class="total-field">
        <label>總重量 KG</label>
        <input type="number" inputmode="decimal" id="totalWgtInput" placeholder="0">
      </div>
    </div>
    <div class="avg-hint" id="avgHint"></div>
  </div>

  <!-- 飛機側視圖 + 貨艙定位 -->
  <div class="plane-card">
    <div class="plane-wrap" id="planeWrap">
      <span class="fwd-tag"><i class="bi bi-arrow-left"></i> FWD</span>
      <img id="planeImg" class="plane-svg" src="" alt="">
      <svg id="leaderSvg" class="leader-svg" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"></svg>
      <!-- pin 由 JS 動態疊加 -->
    </div>
    <div class="ac-name" id="acName">Airbus A320</div>
    <div class="legend">
      <div class="legend-item"><span class="legend-dot"></span>有艙門（FWD / AFT DOOR）</div>
      <div class="legend-item"><span class="legend-dot nodoor"></span>無獨立艙門</div>
    </div>
    <div class="img-credit">側視圖：Wikimedia Commons（Julien.scavini，CC BY-SA 3.0）</div>
  </div>

  <!-- 貨艙狀態列 -->
  <div class="hold-section-title">Departure Loading · 貨艙狀態</div>
  <div class="hold-row" id="holdRow"></div>

</div>

<!-- 彈窗：貨艙輸入 -->
<div class="modal-overlay" id="holdModalOverlay" onclick="handleOverlayClick(event)">
  <div class="modal-card">
    <div class="modal-title"><i class="bi bi-box-seam-fill"></i> <span id="modalTitle">HOLD 1</span></div>
    <div class="field-group">
      <label>件數 PCS</label>
      <input type="number" inputmode="numeric" pattern="[0-9]*" id="pcsInput" placeholder="0">
    </div>
    <div class="max-hint" id="maxHint"></div>
    <div class="modal-actions">
      <button class="modal-btn cancel" onclick="closeHoldModal()">取消</button>
      <button class="modal-btn confirm" onclick="saveHoldModal()">儲存</button>
    </div>
    <button class="clear-btn" onclick="clearHoldModal()"><i class="bi bi-trash3"></i> 清空這個貨艙</button>
  </div>
</div>

<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
let _lastTap = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - _lastTap < 300) e.preventDefault();
  _lastTap = now;
}, { passive: false });

/* ════════════════════════════════════════
   機型資料
   側視圖採用 Wikimedia Commons「Airbus A32X family」線稿
   （Julien.scavini 繪製，CC BY-SA 3.0，已裁切出 A320 / A321 單機列）。
   圖中機頭朝左，cx/cy 為艙門在原圖中的實際像素座標，
   pin 直接對齊圖上畫好的艙門方框。
   HOLD1 / HOLD4 為真實艙門（AirAsia A320 Loading Instruction and
   Break-up Form 印刷固定值）；HOLD3 / HOLD5 共用艙門或為散裝艙，
   無獨立艙門，畫面上以灰色標示區分。
   A321 貨艙上限尚未取得正式表單，先留待確認。
   ════════════════════════════════════════ */
const AIRCRAFT = {
  A320: {
    name: 'Airbus A320',
    img: '/static/aircraft/a320-side.png',
    imgW: 792, imgH: 264,
    holds: [
      { id: 'HOLD1', label: 'HOLD 1', door: true,  doorLabel: 'FWD DOOR SIDE', max: 3402, maxNote: 'MAX 3402 KGS',                           cx: 202, cy: 197 },
      { id: 'HOLD3', label: 'HOLD 3', door: false, doorLabel: '',              max: 2426, maxNote: 'MAX 2426 KGS',                           cx: 420, cy: 197 },
      { id: 'HOLD4', label: 'HOLD 4', door: true,  doorLabel: 'AFT DOOR SIDE', max: 2110, maxNote: 'MAX 2110 KGS',                            cx: 485, cy: 197 },
      { id: 'HOLD5', label: 'HOLD 5', door: false, doorLabel: '',              max: null, maxNote: 'MAX 1497 KGS (180Y) / 500 KGS (186Y)',    cx: 650, cy: 190 },
    ]
  },
  A321: {
    name: 'Airbus A321',
    img: '/static/aircraft/a321-side.png',
    imgW: 935, imgH: 263,
    holds: [
      { id: 'HOLD1', label: 'HOLD 1', door: true,  doorLabel: 'FWD DOOR SIDE', max: null, maxNote: '上限待確認（A321 表單尚未提供）', cx: 200, cy: 197 },
      { id: 'HOLD3', label: 'HOLD 3', door: false, doorLabel: '',              max: null, maxNote: '上限待確認（A321 表單尚未提供）', cx: 640, cy: 197 },
      { id: 'HOLD4', label: 'HOLD 4', door: true,  doorLabel: 'AFT DOOR SIDE', max: null, maxNote: '上限待確認（A321 表單尚未提供）', cx: 725, cy: 197 },
      { id: 'HOLD5', label: 'HOLD 5', door: false, doorLabel: '',              max: null, maxNote: '上限待確認（A321 表單尚未提供）', cx: 790, cy: 190 },
    ]
  }
};

const PIN_Y = 40; /* pin 疊加在機身上方的固定像素高度（原圖座標系） */
const STORE_KEY = 'loadsheet_state_v2';
let curAc = 'A320';
let curHoldId = null;

function loadState() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
  catch { return {}; }
}
function saveState(state) { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }

/* ── 資料模型
   state[ac] = { total: {pcs, wgt}, holds: { HOLD1: {pcs}, ... } }
   每艙只存件數，重量一律用「總重 ÷ 總件數（四捨五入到小數點第1位）」
   即時反推計算，總量一改，所有貨艙重量自動跟著重算，不會有舊資料殘留。
   ── */
function round1(n) { return Math.round(n * 10) / 10; }

function getAcState(ac) {
  const s = loadState()[ac] || {};
  return { total: s.total || { pcs: 0, wgt: 0 }, holds: s.holds || {} };
}
function updateAcState(ac, fn) {
  const state = loadState();
  if (!state[ac]) state[ac] = { total: { pcs: 0, wgt: 0 }, holds: {} };
  if (!state[ac].total) state[ac].total = { pcs: 0, wgt: 0 };
  if (!state[ac].holds) state[ac].holds = {};
  fn(state[ac]);
  saveState(state);
}

/* 每件平均重量：總重 ÷ 總件數，四捨五入到小數點第 1 位 */
function avgWeight(ac) {
  const t = getAcState(ac).total;
  if (!t.pcs) return null;
  return round1(t.wgt / t.pcs);
}
function holdPcs(ac, holdId) {
  return getAcState(ac).holds[holdId]?.pcs || 0;
}
/* 該艙重量：件數 × 每件平均重量 */
function holdWeight(ac, holdId) {
  const avg = avgWeight(ac);
  const pcs = holdPcs(ac, holdId);
  if (avg == null || !pcs) return 0;
  return round1(pcs * avg);
}
/* 排除某一艙之後，其餘已填貨艙的件數／重量加總 */
function sumOtherHolds(ac, excludeId) {
  let pcs = 0, wgt = 0;
  AIRCRAFT[ac].holds.forEach(h => {
    if (h.id === excludeId) return;
    const p = holdPcs(ac, h.id);
    if (p) { pcs += p; wgt += holdWeight(ac, h.id); }
  });
  return { pcs, wgt: round1(wgt) };
}
/* 剩餘可分配 = 總計 - 其餘所有已填貨艙（不含目前正在看的這一艙）*/
function remaining(ac, excludeId) {
  const t = getAcState(ac).total;
  const other = sumOtherHolds(ac, excludeId);
  return { pcs: t.pcs - other.pcs, wgt: round1(t.wgt - other.wgt) };
}

/* ── 飛機側視圖：套用真實側視線稿圖，疊加艙位定位虛線 ── */
function drawPlane(ac) {
  const a = AIRCRAFT[ac];
  const img = document.getElementById('planeImg');
  img.src = a.img;
  img.alt = a.name + ' 側視圖';

  const svg = document.getElementById('leaderSvg');
  svg.setAttribute('viewBox', `0 0 ${a.imgW} ${a.imgH}`);
  svg.innerHTML = a.holds.map(h => `
    <line x1="${h.cx}" y1="${PIN_Y}" x2="${h.cx}" y2="${h.cy - 14}"
          stroke="#0071e3" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.55"/>
  `).join('');
}

/* ── 行李總計卡片 ── */
function renderTotalCard() {
  const t = getAcState(curAc).total;
  document.getElementById('totalPcsInput').value = t.pcs || '';
  document.getElementById('totalWgtInput').value = t.wgt || '';
  const avg = avgWeight(curAc);
  document.getElementById('avgHint').innerHTML = avg != null
    ? `每件平均重量：<b>${avg} KG</b>／件（${t.wgt} ÷ ${t.pcs} 件，四捨五入到小數點第 1 位）`
    : '請先輸入總件數與總重量，才能自動算出每件平均重量';
}

/* ── Pin 疊加渲染 ── */
function renderPins() {
  const wrap = document.getElementById('planeWrap');
  wrap.querySelectorAll('.hold-pin').forEach(el => el.remove());
  const a = AIRCRAFT[curAc];

  a.holds.forEach(h => {
    const filled = holdPcs(curAc, h.id) > 0;

    const pin = document.createElement('div');
    pin.className = 'hold-pin' + (h.door ? '' : ' nodoor') + (filled ? ' filled' : '');
    pin.style.left = (h.cx / a.imgW) * 100 + '%';
    pin.style.top  = (PIN_Y / a.imgH) * 100 + '%';
    pin.textContent = h.label.replace('HOLD ', '');
    pin.title = h.label + (h.doorLabel ? ' · ' + h.doorLabel : '');
    pin.addEventListener('click', () => openHoldModal(h.id));
    wrap.appendChild(pin);
  });
}

/* ── 貨艙狀態卡片 ── */
function renderHolds() {
  const row = document.getElementById('holdRow');
  row.innerHTML = '';
  AIRCRAFT[curAc].holds.forEach((h, i) => {
    const pcs = holdPcs(curAc, h.id);
    const filled = pcs > 0;
    const wgt = filled ? holdWeight(curAc, h.id) : 0;
    const card = document.createElement('div');
    card.className = 'hold-card' + (filled ? ' filled' : '');
    card.style.animation = `cardIn 0.4s cubic-bezier(0.22,1,0.36,1) ${i * 60}ms both`;
    card.innerHTML = `
      <div class="hold-name">${h.label}</div>
      <div class="hold-door">${h.doorLabel || (h.door ? '' : '無獨立艙門')}</div>
      <div class="hold-max">${h.max ? 'MAX ' + h.max + ' KG' : '上限待確認'}</div>
      <div class="hold-val ${filled ? '' : 'empty'}">${filled ? pcs + ' PCS / ' + wgt + ' KG' : '尚未輸入'}</div>
    `;
    card.addEventListener('click', () => openHoldModal(h.id));
    row.appendChild(card);
  });
}

/* ── 彈窗控制 ── */
function openHoldModal(holdId) {
  curHoldId = holdId;
  document.getElementById('modalTitle').textContent = `${AIRCRAFT[curAc].name} · ${AIRCRAFT[curAc].holds.find(x => x.id === holdId).label}`;
  document.getElementById('pcsInput').value = holdPcs(curAc, holdId) || '';
  refreshModalCalc();
  document.getElementById('holdModalOverlay').classList.add('open');
  setTimeout(() => document.getElementById('pcsInput').focus(), 50);
}
function closeHoldModal() {
  document.getElementById('holdModalOverlay').classList.remove('open');
  curHoldId = null;
}
function handleOverlayClick(e) {
  if (e.target.id === 'holdModalOverlay') closeHoldModal();
}

/* 彈窗內即時計算：件數輸入時同步更新該艙重量與剩餘可分配 */
function refreshModalCalc() {
  if (!curHoldId) return;
  const h = AIRCRAFT[curAc].holds.find(x => x.id === curHoldId);
  const pcs = parseFloat(document.getElementById('pcsInput').value) || 0;
  const avg = avgWeight(curAc);
  const rem = remaining(curAc, curHoldId);

  const calcLine = avg != null
    ? `此艙重量：<b>${round1(pcs * avg)} KG</b>（${pcs} 件 × ${avg} KG/件）`
    : `尚未輸入整台飛機總件數／總重量，無法自動算出重量`;
  const remLine = `剩餘可分配：<b>${rem.pcs} 件 / ${rem.wgt} KG</b>`;

  document.getElementById('maxHint').innerHTML =
    `<b>${h.label}</b>${h.doorLabel ? ' · ' + h.doorLabel : ' · 無獨立艙門'}<br>${calcLine}<br>${remLine}<br>${h.maxNote}`;
}
document.getElementById('pcsInput').addEventListener('input', refreshModalCalc);

function saveHoldModal() {
  if (!curHoldId) return;
  const pcs = parseFloat(document.getElementById('pcsInput').value) || 0;
  updateAcState(curAc, s => { s.holds[curHoldId] = { pcs }; });
  closeHoldModal();
  renderHolds();
  renderPins();
}
function clearHoldModal() {
  if (!curHoldId) return;
  updateAcState(curAc, s => { delete s.holds[curHoldId]; });
  closeHoldModal();
  renderHolds();
  renderPins();
}

/* ── 行李總計輸入 ── */
function onTotalInput() {
  updateAcState(curAc, s => {
    s.total.pcs = parseFloat(document.getElementById('totalPcsInput').value) || 0;
    s.total.wgt = parseFloat(document.getElementById('totalWgtInput').value) || 0;
  });
  renderTotalCard();
  renderHolds();
  renderPins();
  if (document.getElementById('holdModalOverlay').classList.contains('open')) refreshModalCalc();
}
document.getElementById('totalPcsInput').addEventListener('input', onTotalInput);
document.getElementById('totalWgtInput').addEventListener('input', onTotalInput);

/* ── 機型切換 ── */
document.getElementById('acSwitch').addEventListener('click', e => {
  const btn = e.target.closest('.seg-btn');
  if (!btn) return;
  document.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  curAc = btn.dataset.ac;
  document.getElementById('acName').textContent = AIRCRAFT[curAc].name;
  drawPlane(curAc);
  renderTotalCard();
  renderPins();
  renderHolds();
});

/* ── 初始化 ── */
drawPlane(curAc);
renderTotalCard();
renderPins();
renderHolds();
</script>
</body>
</html>
