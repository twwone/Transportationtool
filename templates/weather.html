<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>天氣防禦面板</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<link rel="apple-touch-icon" href="/static/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c1220" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#eef2ff" media="(prefers-color-scheme: light)">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overscroll-behavior:none;overflow-x:hidden}

@keyframes pageIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
@keyframes breatheRed{
  0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0),0 8px 32px rgba(239,68,68,.22)}
  50%{box-shadow:0 0 0 8px rgba(239,68,68,.18),0 8px 32px rgba(239,68,68,.55)}
}
@keyframes breatheRedDark{
  0%,100%{box-shadow:0 0 0 0 rgba(255,69,58,0),0 8px 32px rgba(255,69,58,.3)}
  50%{box-shadow:0 0 0 10px rgba(255,69,58,.22),0 8px 32px rgba(255,69,58,.65)}
}

:root{
  --bg:#eef2ff;
  --surface:rgba(255,255,255,.82);
  --text:#0f0f1a;
  --sub:#6b7280;
  --accent:#3b82f6;
  --danger:#ef4444;
  --radius-l:22px;
  --radius-m:16px;
  --glass-bg:rgba(255,255,255,.22);
  --glass-border:rgba(255,255,255,.45);
  --glass-shadow:0 8px 32px rgba(0,0,0,.08);
  --alert-border:rgba(239,68,68,.7);
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#0c1220;
    --surface:rgba(20,24,38,.96);
    --text:#f2f2f7;
    --sub:#8e8e93;
    --accent:#60a5fa;
    --danger:#ff453a;
    --glass-bg:rgba(255,255,255,.07);
    --glass-border:rgba(255,255,255,.12);
    --glass-shadow:0 8px 32px rgba(0,0,0,.4);
    --alert-border:rgba(255,69,58,.75);
  }
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
  background:var(--bg);color:var(--text);
  display:flex;flex-direction:column;min-height:100%;
  animation:pageIn .35s cubic-bezier(.22,1,.36,1) both;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 70% 50% at 15% 30%,rgba(99,102,241,.14) 0%,transparent 65%),
    radial-gradient(ellipse 55% 45% at 85% 65%,rgba(14,165,233,.1) 0%,transparent 65%);
}

/* ── Topbar ── */
.topbar{
  position:sticky;top:0;z-index:100;
  background:rgba(238,242,255,.88);
  backdrop-filter:blur(32px) saturate(180%);
  -webkit-backdrop-filter:blur(32px) saturate(180%);
  border-bottom:.5px solid rgba(0,0,0,.06);
  padding:12px 16px 14px;
  padding-top:max(14px,env(safe-area-inset-top) + 10px);
  display:flex;align-items:center;gap:8px;
}
@media(prefers-color-scheme:dark){.topbar{background:rgba(12,18,32,.88);border-color:rgba(255,255,255,.06)}}
.back-btn{
  color:var(--accent);font-size:.95rem;font-weight:600;
  text-decoration:none;min-width:44px;height:44px;
  display:flex;align-items:center;flex-shrink:0;
  -webkit-tap-highlight-color:transparent;
}
.topbar-title{font-size:1.05rem;font-weight:700;flex:1}
.refresh-btn{
  width:38px;height:38px;border-radius:50%;
  background:transparent;border:none;cursor:pointer;
  font-size:1.1rem;display:flex;align-items:center;justify-content:center;
  color:var(--accent);-webkit-tap-highlight-color:transparent;
  transition:background .2s;
}
.refresh-btn:hover{background:rgba(59,130,246,.1)}
.refresh-btn.spinning{animation:spin .7s linear infinite}

/* ── Content ── */
.content{
  flex:1;
  padding:20px 20px max(80px, env(safe-area-inset-bottom) + 56px);
  max-width:480px;width:100%;margin:0 auto;
  position:relative;z-index:1;
  display:flex;flex-direction:column;gap:24px;
}
#weatherArea{display:flex;flex-direction:column;gap:20px}

/* ── METAR banner ── */
#metarBanner{padding:10px 20px}

/* ── METAR card ── */
.metar-card{
  padding:12px 0 10px;
  color:#e2e8f0;
}
.metar-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:8px;padding:0 2px;
}
.metar-icao{font-size:.8rem;font-weight:800;letter-spacing:.1em;color:#93c5fd}
.metar-station{font-size:.74rem;color:rgba(226,232,240,.55);margin-left:6px}
.metar-time{font-size:.68rem;color:rgba(226,232,240,.45)}
.metar-chips{
  display:flex;flex-wrap:nowrap;overflow-x:auto;gap:0;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
  align-items:stretch;
}
.metar-chips::-webkit-scrollbar{display:none}
.metar-chip{
  display:inline-flex;align-items:center;
  padding:3px 12px;
  font-size:.76rem;font-weight:600;color:#c7d9f0;
  white-space:nowrap;flex-shrink:0;
  border-right:1px solid rgba(255,255,255,.15);
}
.metar-chip:first-child{padding-left:2px}
.metar-chip:last-child{border-right:none}
.metar-raw{
  font-size:.62rem;font-family:"SF Mono","Menlo",monospace;
  color:rgba(226,232,240,.35);word-break:break-all;line-height:1.5;
  display:none;padding:8px 2px 0;
}
.metar-raw.show{display:block}
.metar-toggle{
  font-size:.66rem;color:#60a5fa;background:none;border:none;
  cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent;
}

/* ── Location search ── */
.loc-bar{display:flex;align-items:center;gap:10px;position:relative}
.loc-search-wrap{flex:1;position:relative}
.loc-search-input{
  width:100%;padding:11px 14px;border-radius:14px;
  background:var(--glass-bg);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--glass-border);
  color:var(--text);font-family:inherit;font-size:.88rem;font-weight:600;
  outline:none;box-shadow:var(--glass-shadow);
}
.loc-search-input::placeholder{color:var(--sub);font-weight:400}
.loc-search-results{
  position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:200;
  background:var(--surface);border:1px solid var(--glass-border);
  border-radius:14px;overflow:hidden;
  box-shadow:0 12px 40px rgba(0,0,0,.18);
  display:none;max-height:260px;overflow-y:auto;
}
.loc-search-results.show{display:block}
.loc-result-item{
  padding:11px 16px;font-size:.86rem;cursor:pointer;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:.5px solid var(--glass-border);
  -webkit-tap-highlight-color:transparent;
}
.loc-result-item:last-child{border-bottom:none}
.loc-result-item:hover,.loc-result-item:active{background:rgba(59,130,246,.08)}
.loc-result-name{font-weight:600;color:var(--text)}
.loc-result-county{font-size:.74rem;color:var(--sub)}
.loc-result-star{font-size:.9rem;color:var(--accent);opacity:.6;cursor:pointer;padding:2px 0 2px 8px}
.loc-result-star.saved{opacity:1}
.loc-gps-btn{
  flex-shrink:0;width:44px;height:44px;border-radius:14px;
  background:var(--glass-bg);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--glass-border);
  color:var(--accent);
  cursor:pointer;font-size:1.1rem;
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--glass-shadow);
  -webkit-tap-highlight-color:transparent;
}

/* ── Favorites ── */
.fav-section{display:none;flex-direction:column;gap:8px}
.fav-section.show{display:flex}
.fav-label{font-size:.7rem;font-weight:700;color:var(--sub);letter-spacing:.06em;text-transform:uppercase;padding:0 2px}
.fav-chips{display:flex;flex-wrap:wrap;gap:8px}
.fav-chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 12px;border-radius:20px;
  background:var(--glass-bg);border:1px solid var(--glass-border);
  font-size:.8rem;font-weight:600;color:var(--text);
  cursor:pointer;box-shadow:var(--glass-shadow);
  -webkit-tap-highlight-color:transparent;
  transition:background .15s;
}
.fav-chip:hover{background:rgba(59,130,246,.1)}
.fav-chip-x{
  font-size:.75rem;color:var(--sub);background:none;border:none;
  padding:0;cursor:pointer;line-height:1;-webkit-tap-highlight-color:transparent;
}

/* ── Geo pill ── */
.geo-pill{
  display:none;align-items:center;gap:5px;
  padding:4px 12px;border-radius:100px;
  background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.22);
  font-size:.7rem;font-weight:600;color:#16a34a;
  margin:0 auto;width:fit-content;
}
.geo-pill.show{display:flex}
@media(prefers-color-scheme:dark){.geo-pill{color:#4ade80;background:rgba(34,197,94,.12);border-color:rgba(74,222,128,.25)}}
.geo-dot{width:5px;height:5px;border-radius:50%;background:currentColor}

/* ── Skeleton ── */
.skeleton{
  border-radius:var(--radius-l);height:200px;
  background:linear-gradient(90deg,var(--glass-bg) 25%,rgba(255,255,255,.08) 50%,var(--glass-bg) 75%);
  background-size:800px 100%;animation:shimmer 1.4s infinite;
}
@media(prefers-color-scheme:dark){
  .skeleton{background:linear-gradient(90deg,rgba(255,255,255,.05) 25%,rgba(255,255,255,.1) 50%,rgba(255,255,255,.05) 75%);background-size:800px 100%}
}

/* ── Error card ── */
.err-card{
  border-radius:var(--radius-l);padding:32px 20px;text-align:center;
  background:var(--glass-bg);backdrop-filter:blur(40px);border:1px solid var(--glass-border);
  animation:cardIn .3s ease both;
}
.err-icon{font-size:2.2rem;margin-bottom:12px}
.err-text{font-size:.9rem;color:var(--sub);line-height:1.6}

/* ── Alert banner ── */
.alert-banner{
  border-radius:var(--radius-m);padding:12px 16px;
  display:none;align-items:flex-start;gap:10px;
  background:rgba(239,68,68,.1);
  border:1px solid rgba(239,68,68,.35);
  animation:cardIn .3s ease both;
}
.alert-banner.show{display:flex}
@media(prefers-color-scheme:dark){.alert-banner{background:rgba(255,69,58,.14);border-color:rgba(255,69,58,.4)}}
.alert-icon{font-size:1.1rem;flex-shrink:0;margin-top:1px}
.alert-content{flex:1;min-width:0}
.alert-title{font-size:.8rem;font-weight:700;color:var(--danger);margin-bottom:4px}
.alert-list{font-size:.78rem;color:var(--danger);line-height:1.7;list-style:none;padding:0}

/* ── Main weather card ── */
.main-card{
  border-radius:var(--radius-l);padding:28px 24px 26px;
  backdrop-filter:blur(40px) saturate(200%);
  -webkit-backdrop-filter:blur(40px) saturate(200%);
  background:var(--glass-bg);
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-shadow);
  animation:cardIn .3s cubic-bezier(.22,1,.36,1) both;
  transition:border-color .4s,box-shadow .6s;
}
.main-card.alert-active{
  border-color:var(--alert-border);
  animation:cardIn .3s cubic-bezier(.22,1,.36,1) both,
            breatheRed 2.4s cubic-bezier(.45,.05,.55,.95) infinite 0.3s;
}
@media(prefers-color-scheme:dark){
  .main-card.alert-active{
    animation:cardIn .3s cubic-bezier(.22,1,.36,1) both,
              breatheRedDark 2.4s cubic-bezier(.45,.05,.55,.95) infinite 0.3s;
  }
}
.main-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:24px}
.main-loc{font-size:.78rem;font-weight:600;color:var(--sub);margin-bottom:6px}
.main-wx{font-size:1.08rem;font-weight:700;color:var(--text)}
.main-emoji{font-size:3.6rem;line-height:1;flex-shrink:0}
.main-temps{display:flex;align-items:flex-end;gap:10px;margin-bottom:22px}
.main-temp{font-size:3.2rem;font-weight:800;letter-spacing:-1.5px;line-height:1}
.main-feels{font-size:.84rem;color:var(--sub);padding-bottom:6px}
.stats-row{
  display:flex;gap:0;border-radius:14px;overflow:hidden;
  border:1px solid var(--glass-border);
}
.stat{
  flex:1;padding:16px 10px;text-align:center;
  background:rgba(255,255,255,.12);
  border-right:1px solid var(--glass-border);
}
.stat:last-child{border-right:none}
@media(prefers-color-scheme:dark){.stat{background:rgba(255,255,255,.05)}}
.stat-icon{font-size:1rem;margin-bottom:4px}
.stat-val{font-size:.9rem;font-weight:700;color:var(--text)}
.stat-lbl{font-size:.66rem;color:var(--sub);margin-top:3px}
.main-desc{
  margin-top:16px;padding:14px 16px;border-radius:14px;
  background:rgba(255,255,255,.12);font-size:.78rem;color:var(--sub);
  line-height:1.7;display:none;overflow:hidden;
}
.main-desc.show{display:block}
@media(prefers-color-scheme:dark){.main-desc{background:rgba(255,255,255,.05)}}
.desc-toggle{
  display:none;align-items:center;gap:4px;
  margin-top:18px;font-size:.75rem;font-weight:600;
  color:var(--accent);background:none;border:none;
  cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent;
  width:100%;justify-content:flex-end;
}
.desc-toggle.show{display:flex}

/* ── Section group ── */
.section-group{display:flex;flex-direction:column;gap:12px}
.section-title{
  font-size:.75rem;font-weight:700;color:var(--sub);
  letter-spacing:.07em;text-transform:uppercase;
  padding:4px 4px 0;
}

/* ── Hourly scroll ── */
.hourly-wrap{
  border-radius:var(--radius-l);
  backdrop-filter:blur(40px) saturate(200%);
  -webkit-backdrop-filter:blur(40px) saturate(200%);
  background:var(--glass-bg);
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-shadow);
  overflow:hidden;
  animation:cardIn .3s cubic-bezier(.22,1,.36,1) both;
}
.hourly-scroll{
  display:flex;overflow-x:auto;
  padding:18px 20px 22px;gap:12px;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.hourly-scroll::-webkit-scrollbar{display:none}
.hour-chip{
  flex-shrink:0;display:flex;flex-direction:column;
  align-items:center;gap:8px;
  padding:16px 14px;border-radius:18px;min-width:72px;
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.18);
  transition:background .2s;
}
@media(prefers-color-scheme:dark){
  .hour-chip{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.1)}
}
.hour-chip.now{
  background:rgba(59,130,246,.2);
  border-color:rgba(59,130,246,.45);
}
@media(prefers-color-scheme:dark){
  .hour-chip.now{background:rgba(96,165,250,.18);border-color:rgba(96,165,250,.4)}
}
.hour-time{font-size:.7rem;font-weight:700;color:var(--sub)}
.hour-emoji{font-size:1.65rem;line-height:1}
.hour-temp{font-size:.9rem;font-weight:700;color:var(--text)}
.hour-pop{font-size:.68rem;color:#38bdf8;font-weight:600;min-height:.9em}

/* ── 7-day list ── */
.day-list{
  border-radius:var(--radius-l);
  backdrop-filter:blur(40px) saturate(200%);
  -webkit-backdrop-filter:blur(40px) saturate(200%);
  background:var(--glass-bg);
  border:1px solid var(--glass-border);
  box-shadow:var(--glass-shadow);
  overflow:hidden;
  animation:cardIn .3s cubic-bezier(.22,1,.36,1) both;
}
.day-row{
  display:flex;align-items:center;
  padding:20px 24px;gap:16px;
  border-bottom:.5px solid var(--glass-border);
}
.day-row:last-child{border-bottom:none}
.day-name{
  font-size:.86rem;font-weight:700;color:var(--text);
  width:40px;flex-shrink:0;
}
.day-emoji{font-size:1.6rem;flex-shrink:0}
.day-wx{
  flex:1;font-size:.78rem;color:var(--sub);
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.day-pop{
  font-size:.75rem;color:#38bdf8;font-weight:600;
  flex-shrink:0;width:44px;text-align:right;
}
.day-temps{
  font-size:.86rem;font-weight:700;flex-shrink:0;
  text-align:right;white-space:nowrap;
}
.day-hi{color:var(--text)}
.day-lo{color:var(--sub);font-weight:500}

/* ── Update time ── */
.update-row{
  text-align:center;font-size:.72rem;color:var(--sub);
  padding-bottom:4px;
}

/* ── Mobile overrides ── */
@media(max-width:480px){
  .main-card{padding:20px 16px 18px}
  .main-top{margin-bottom:16px}
  .main-temps{margin-bottom:16px}
  .main-temp{font-size:2.6rem}
  .main-emoji{font-size:2.8rem}
  .stat{padding:11px 6px}
  .stat-val{font-size:.82rem}
  .hourly-scroll{padding:14px 14px 16px;gap:10px}
  .hour-chip{padding:12px 10px;min-width:62px}
  .day-row{padding:14px 16px}
  .section-group{gap:8px}
  .alert-banner{padding:10px 12px}
  .fav-chip{padding:6px 10px;font-size:.76rem}
}
</style>
</head>
<body>

<div class="topbar">
  <a href="/" class="back-btn">‹ 返回</a>
  <div class="topbar-title">☁️ 天氣防禦面板</div>
  <button class="refresh-btn" id="refreshBtn" onclick="loadWeather()" title="重新整理">↻</button>
</div>

<div id="metarBanner" style="background:rgba(14,30,60,.6);backdrop-filter:blur(32px);border-bottom:1px solid rgba(96,165,250,.18);display:none">
  <div style="max-width:480px;margin:0 auto">
    <div class="metar-card" id="metarCard" style="margin:0;border:none;background:transparent;box-shadow:none;padding:0"></div>
  </div>
</div>

<div class="content">

  <div class="loc-bar">
    <div class="loc-search-wrap">
      <input class="loc-search-input" id="locSearch" type="text"
             placeholder="🔍 搜尋地區，例如：大安區、花蓮市…" autocomplete="off"
             oninput="onSearchInput()" onfocus="onSearchFocus()" />
      <div class="loc-search-results" id="searchResults"></div>
    </div>
    <button class="loc-gps-btn" id="gpsBtn" onclick="requestGPS()" title="GPS 定位">📡</button>
  </div>

  <div class="fav-section" id="favSection">
    <div class="fav-label">⭐ 常用地區</div>
    <div class="fav-chips" id="favChips"></div>
  </div>

  <div class="geo-pill" id="geoPill">
    <span class="geo-dot"></span>
    <span id="geoText">GPS 已定位</span>
  </div>

  <div id="weatherArea"></div>

</div>

<script>
const DISTRICTS = {{ districts | tojson }};
// each entry: {l, n, c, lat, lon}  (label, name, county, lat, lon)

let currentLat = null, currentLon = null;
let currentName = null, currentCounty = null;
let isGPS = false;

// ── Favorites ──────────────────────────────────────────
const FAV_KEY = 'wx_favorites_v2';
function getFavs() {
  try { return JSON.parse(localStorage.getItem(FAV_KEY) || '[]'); } catch { return []; }
}
function saveFavs(arr) { localStorage.setItem(FAV_KEY, JSON.stringify(arr)); }
function isFav(label) { return getFavs().some(f => f.l === label); }
function toggleFav(d) {
  let favs = getFavs();
  const idx = favs.findIndex(f => f.l === d.l);
  if (idx >= 0) favs.splice(idx, 1); else favs.unshift(d);
  saveFavs(favs);
  renderFavs();
  renderResults(lastQuery);
}
function renderFavs() {
  const sec   = document.getElementById('favSection');
  const chips = document.getElementById('favChips');
  const favs  = getFavs();
  if (!favs.length || currentLat !== null) { sec.classList.remove('show'); return; }
  sec.classList.add('show');
  chips.innerHTML = favs.map(f => `
    <div class="fav-chip" onclick="selectDistrict(${f.lat},${f.lon},'${esc(f.n)}','${esc(f.c)}','${esc(f.l)}')">
      ${esc(f.l)}
      <button class="fav-chip-x" onclick="event.stopPropagation();removeFav('${esc(f.l)}')">×</button>
    </div>`).join('');
}
function removeFav(label) {
  saveFavs(getFavs().filter(f => f.l !== label));
  renderFavs();
  renderResults(lastQuery);
}
function esc(s) { return s.replace(/'/g,"&#39;"); }

// ── Search ──────────────────────────────────────────────
let lastQuery = '';
function onSearchInput() {
  const q = document.getElementById('locSearch').value.trim();
  lastQuery = q;
  if (!q) { hideResults(); renderFavs(); return; }
  document.getElementById('favSection').classList.remove('show');
  const hits = DISTRICTS.filter(d =>
    d.l.includes(q) || d.n.includes(q) || d.c.includes(q)
  ).slice(0, 12);
  renderResults(q, hits);
}
function onSearchFocus() {
  const q = document.getElementById('locSearch').value.trim();
  if (!q) { renderFavs(); return; }
  onSearchInput();
}
function renderResults(q, hits) {
  const el = document.getElementById('searchResults');
  if (!hits || !hits.length) { el.classList.remove('show'); el.innerHTML = ''; return; }
  el.innerHTML = hits.map(d => `
    <div class="loc-result-item"
         onclick="selectDistrict(${d.lat},${d.lon},'${esc(d.n)}','${esc(d.c)}','${esc(d.l)}')">
      <div><span class="loc-result-name">${d.l}</span></div>
      <div style="display:flex;align-items:center;gap:4px">
        <span class="loc-result-county">${d.c}</span>
        <span class="loc-result-star${isFav(d.l)?' saved':''}"
              onclick="event.stopPropagation();toggleFav(${JSON.stringify(d).replace(/"/g,'&quot;')})"
              title="${isFav(d.l)?'移除常用':'加入常用'}">${isFav(d.l)?'★':'☆'}</span>
      </div>
    </div>`).join('');
  el.classList.add('show');
}
function hideResults() {
  const el = document.getElementById('searchResults');
  el.classList.remove('show'); el.innerHTML = '';
}
document.addEventListener('click', e => {
  if (!document.getElementById('locSearch').contains(e.target) &&
      !document.getElementById('searchResults').contains(e.target)) {
    hideResults();
  }
});

function selectDistrict(lat, lon, name, county, label) {
  currentLat = lat; currentLon = lon;
  currentName = name; currentCounty = county;
  isGPS = false;
  document.getElementById('locSearch').value = label;
  document.getElementById('geoPill').classList.remove('show');
  hideResults();
  document.getElementById('favSection').classList.remove('show');
  loadWeather();
}

// ── METAR ───────────────────────────────────────────────
async function loadMetar() {
  try {
    const r = await fetch('/api/metar');
    const d = await r.json();
    if (!d.ok && !d.raw) return;
    renderMetar(d);
  } catch {}
}
function dirLabel(deg) {
  if (deg === 'VRB') return '風向不定';
  const dirs = ['北','北北東','東北','東北東','東','東南東','東南','南南東',
                '南','南南西','西南','西南西','西','西北西','西北','北北西'];
  return dirs[Math.round(deg / 22.5) % 16];
}
function renderMetar(d) {
  const banner = document.getElementById('metarBanner');
  const card   = document.getElementById('metarCard');
  let chips = '';
  if (d.wind_ms !== undefined) {
    const dir = d.wind_dir !== undefined ? dirLabel(d.wind_dir) : '';
    const gust = d.gust_ms ? ` 陣風${d.gust_ms}` : '';
    chips += `<span class="metar-chip">${dir} ${d.wind_kt}kt (${d.wind_ms}m/s${gust})</span>`;
  }
  if (d.vis_str) chips += `<span class="metar-chip">${d.vis_str}</span>`;
  if (d.temp !== undefined) chips += `<span class="metar-chip">${d.temp}°/${d.dew}°</span>`;
  if (d.qnh)  chips += `<span class="metar-chip">Q${d.qnh}</span>`;
  if (d.sky)  chips += `<span class="metar-chip">${d.sky}</span>`;
  if (d.wx)   chips += `<span class="metar-chip">${d.wx}</span>`;
  if (d.trend) chips += `<span class="metar-chip" style="color:#86efac">${d.trend}</span>`;
  const stale = d.stale ? ' (快取)' : '';
  card.innerHTML = `
    <div class="metar-header">
      <div>
        <span class="metar-icao">RCTP</span>
        <span class="metar-station">桃園機場 METAR${stale}</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        ${d.time_utc ? `<span class="metar-time">${d.time_utc}</span>` : ''}
        <button class="metar-toggle" onclick="toggleRaw()">原始報文</button>
      </div>
    </div>
    <div class="metar-chips">${chips || '<span class="metar-chip">資料解析中…</span>'}</div>
    <div class="metar-raw" id="metarRaw">${d.raw || ''}</div>`;
  banner.style.display = 'block';
}
function toggleRaw() {
  document.getElementById('metarRaw')?.classList.toggle('show');
}

function dayLabel(dateStr) {
  if (!dateStr) return '—';
  try {
    const d = new Date(dateStr + 'T12:00:00+08:00');
    // 用 Asia/Taipei 取得「今天」日期字串，避免 UTC 偏移造成 +0.5 天誤差
    const todayStr = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Taipei' });
    const todayMidnight = new Date(todayStr + 'T00:00:00+08:00');
    const diff = Math.floor((d - todayMidnight) / 86400000);
    if (diff === 0) return '今天';
    if (diff === 1) return '明天';
    if (diff === 2) return '後天';
    return '週' + ['日','一','二','三','四','五','六'][d.getDay()];
  } catch { return dateStr.slice(5) || '—'; }
}

function hourLabel(ts) {
  if (!ts) return '—';
  try {
    const m = ts.match(/T(\d{2}:\d{2})/);
    return m ? m[1] : ts.slice(11, 16);
  } catch { return '—'; }
}

document.querySelectorAll('button').forEach(el => {
  el.addEventListener('pointerdown', () => {
    el.style.transition = 'transform .1s cubic-bezier(.34,1.56,.64,1)';
    el.style.transform  = 'scale(.965)';
  });
  ['pointerup','pointerleave','pointercancel'].forEach(ev =>
    el.addEventListener(ev, () => {
      el.style.transition = 'transform .5s cubic-bezier(.34,1.56,.64,1)';
      el.style.transform  = 'scale(1)';
    })
  );
});

function requestGPS() {
  const btn = document.getElementById('gpsBtn');
  btn.textContent = '⏳'; btn.disabled = true;
  if (!navigator.geolocation) {
    btn.textContent = '📡'; btn.disabled = false;
    fallbackToDefault(); return;
  }
  navigator.geolocation.getCurrentPosition(
    pos => {
      btn.textContent = '📡'; btn.disabled = false;
      isGPS = true;
      currentLat = pos.coords.latitude;
      currentLon = pos.coords.longitude;
      currentName = null; currentCounty = null;
      document.getElementById('locSearch').value = '';
      hideResults();
      document.getElementById('favSection').classList.remove('show');
      showGeoPill(`GPS ${currentLat.toFixed(3)}, ${currentLon.toFixed(3)}`);
      loadWeather();
    },
    () => { btn.textContent = '📡'; btn.disabled = false; isGPS = false; fallbackToDefault(); },
    { enableHighAccuracy: true, timeout: 8000 }
  );
}

function showGeoPill(msg) {
  document.getElementById('geoText').textContent = msg;
  document.getElementById('geoPill').classList.add('show');
}

function fallbackToDefault() {
  currentLat = 25.0780; currentLon = 121.2320;
  currentName = '大園區'; currentCounty = '桃園市';
  isGPS = false;
  showGeoPill('預設：桃園機場');
  loadWeather();
}

async function loadWeather() {
  if (currentLat === null) return;
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  document.getElementById('weatherArea').innerHTML = '<div class="skeleton"></div>';
  try {
    let url = `/api/weather?lat=${currentLat}&lon=${currentLon}`;
    if (currentName && currentCounty)
      url += `&name=${encodeURIComponent(currentName)}&county=${encodeURIComponent(currentCounty)}`;
    const resp = await fetch(url);
    const data = await resp.json();
    if (data.error && !data.current?.wx) {
      showError('⚠️', data.error || '資料取得失敗');
    } else {
      renderWeather(data);
    }
  } catch(e) {
    showError('🔌', '網路連線失敗，請稍後再試');
  } finally {
    btn.classList.remove('spinning');
  }
}

function showError(icon, msg) {
  document.getElementById('weatherArea').innerHTML = `
    <div class="err-card">
      <div class="err-icon">${icon}</div>
      <div class="err-text">${msg}</div>
    </div>`;
}

function renderWeather(d) {
  const c      = d.current  || {};
  const fc     = d.forecast || [];
  const hourly = d.hourly   || [];
  const alts   = d.alerts   || [];
  const hasAlert = d.has_alert || c.alert || false;

  // ── 特報 banner ──
  let bannerHtml = '';
  if (hasAlert) {
    const items = alts.length
      ? alts.map(a => `<li>⚡ ${a}</li>`).join('')
      : '<li>⚡ 極端天氣特報生效中</li>';
    bannerHtml = `
      <div class="alert-banner show">
        <span class="alert-icon">🚨</span>
        <div class="alert-content">
          <div class="alert-title">極端天氣警報</div>
          <ul class="alert-list">${items}</ul>
        </div>
      </div>`;
  }

  // ── 主卡 ──
  const alertClass = hasAlert ? ' alert-active' : '';
  const descHtml = c.desc ? `
    <button class="desc-toggle show" id="descToggle" onclick="toggleDesc()">詳細說明 ›</button>
    <div class="main-desc" id="mainDesc">${c.desc}</div>` : '';
  const mainCard = `
    <div class="main-card${alertClass}">
      <div class="main-top">
        <div>
          <div class="main-loc">📍 ${d.display || d.location || ''}</div>
          <div class="main-wx">${c.wx || '—'}</div>
        </div>
        <div class="main-emoji">${c.emoji || '🌡️'}</div>
      </div>
      <div class="main-temps">
        <div class="main-temp">${c.temp !== undefined ? c.temp : '—'}°</div>
        <div class="main-feels">體感 ${c.feels !== undefined ? c.feels : '—'}°</div>
      </div>
      <div class="stats-row">
        <div class="stat">
          <div class="stat-icon">🌧️</div>
          <div class="stat-val">${c.pop12h !== undefined && c.pop12h !== '—' ? c.pop12h + '%' : '—'}</div>
          <div class="stat-lbl">12h 降雨</div>
        </div>
        <div class="stat">
          <div class="stat-icon">💨</div>
          <div class="stat-val">${c.wind && c.wind !== '—' ? c.wind + ' m/s' : '—'}</div>
          <div class="stat-lbl">風速</div>
        </div>
        <div class="stat">
          <div class="stat-icon">💧</div>
          <div class="stat-val">${c.humidity && c.humidity !== '—' ? c.humidity + '%' : '—'}</div>
          <div class="stat-lbl">相對濕度</div>
        </div>
      </div>
      ${descHtml}
    </div>`;

  // ── 逐時預報 ──
  let hourlyHtml = '';
  if (hourly.length) {
    const chips = hourly.map((h, i) => `
      <div class="hour-chip${i === 0 ? ' now' : ''}">
        <div class="hour-time">${hourLabel(h.time)}</div>
        <div class="hour-emoji">${h.emoji || '🌡️'}</div>
        <div class="hour-temp">${h.temp}°</div>
        <div class="hour-pop">${h.pop ? '🌧 ' + h.pop + '%' : ''}</div>
      </div>`).join('');
    hourlyHtml = `
      <div class="section-group">
        <div class="section-title">逐時預報（3小時）</div>
        <div class="hourly-wrap">
          <div class="hourly-scroll">${chips}</div>
        </div>
      </div>`;
  }

  // ── 7 天預報 ──
  let fcHtml = '';
  if (fc.length) {
    const rows = fc.map(f => `
      <div class="day-row">
        <div class="day-name">${dayLabel(f.date)}</div>
        <div class="day-emoji">${f.emoji || '🌡️'}</div>
        <div class="day-wx">${f.wx || '—'}</div>
        <div class="day-pop">${f.pop ? '🌧 ' + f.pop + '%' : ''}</div>
        <div class="day-temps">
          <span class="day-hi">${f.hi || '—'}°</span>
          <span class="day-lo"> / ${f.lo || '—'}°</span>
        </div>
      </div>`).join('');
    fcHtml = `
      <div class="section-group">
        <div class="section-title">7 天預報</div>
        <div class="day-list">${rows}</div>
      </div>`;
  }

  // ── 更新時間 ──
  const updRow = c.updated
    ? `<div class="update-row">資料更新：${c.updated}</div>` : '';

  document.getElementById('weatherArea').innerHTML =
    bannerHtml + mainCard + hourlyHtml + fcHtml + updRow;
}

function toggleDesc() {
  const desc = document.getElementById('mainDesc');
  const btn  = document.getElementById('descToggle');
  if (!desc || !btn) return;
  const open = desc.classList.toggle('show');
  btn.textContent = open ? '收起 ‹' : '詳細說明 ›';
}

window.addEventListener('load', () => {
  renderFavs();
  loadMetar();
  setInterval(loadMetar, 30 * 60 * 1000);
  if (navigator.geolocation) requestGPS();
  else fallbackToDefault();
});
</script>
</body>
</html>
