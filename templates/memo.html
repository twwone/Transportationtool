<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>備忘錄</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f0f4ff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overscroll-behavior: none; }

:root {
  --bg:      #f0f4ff;
  --surface: #ffffff;
  --border:  rgba(0,0,0,0.07);
  --text:    #0f0f1a;
  --sub:     #6b7280;
  --accent:  #e11d48;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:      #000;
    --surface: #1c1c1e;
    --border:  rgba(255,255,255,0.07);
    --text:    #f2f2f7;
    --sub:     #636366;
  }
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  height: 100dvh;
}

/* ── Header ── */
.header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: max(16px, env(safe-area-inset-top) + 6px) 16px 12px;
  background: var(--bg);
}
.back-btn {
  font-size: 1.7rem;
  background: none;
  border: none;
  color: var(--text);
  cursor: pointer;
  padding: 0 4px 0 0;
  line-height: 1;
  -webkit-tap-highlight-color: transparent;
  font-family: inherit;
}
.header-title { font-size: 1.3rem; font-weight: 800; letter-spacing: -0.3px; }

/* ── Tabs ── */
.tabs {
  display: flex;
  gap: 8px;
  padding: 0 16px 14px;
}
.tab {
  flex: 1;
  padding: 9px 4px;
  border-radius: 100px;
  border: 1px solid var(--border);
  font-size: 0.82rem;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  background: var(--surface);
  color: var(--sub);
  transition: background 0.18s, color 0.18s, transform 0.15s;
  -webkit-tap-highlight-color: transparent;
  text-align: center;
}
.tab.active { background: var(--accent); color: #fff; border-color: transparent; }
.tab:active { transform: scale(0.93); }

/* ── List ── */
.list-wrap {
  flex: 1;
  overflow-y: auto;
  padding: 4px 16px 140px;
  -webkit-overflow-scrolling: touch;
}
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 64px 20px;
  gap: 10px;
  color: var(--sub);
}
.empty-emoji { font-size: 3rem; }
.empty-text  { font-size: 0.88rem; }

@keyframes itemIn {
  from { opacity: 0; transform: translateY(8px) scale(0.97); }
  to   { opacity: 1; transform: none; }
}
.item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  background: var(--surface);
  border-radius: 16px;
  padding: 13px 14px;
  margin-bottom: 8px;
  border: 1px solid var(--border);
  animation: itemIn 0.28s cubic-bezier(0.22,1,0.36,1) both;
}
.item.done { opacity: 0.42; }
.item.done .item-text { text-decoration: line-through; }

.checkbox {
  width: 24px; height: 24px;
  flex-shrink: 0;
  border-radius: 50%;
  border: 2px solid var(--border);
  background: none;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.78rem;
  transition: background 0.15s, border-color 0.15s;
  -webkit-tap-highlight-color: transparent;
  margin-top: 0px;
}
.checkbox.checked { background: var(--accent); border-color: var(--accent); color: #fff; }

.item-body { flex: 1; min-width: 0; }
.item-text {
  font-size: 0.92rem;
  font-weight: 500;
  line-height: 1.45;
  word-break: break-word;
}
.item-note {
  font-size: 0.76rem;
  color: var(--sub);
  margin-top: 4px;
  line-height: 1.4;
  word-break: break-word;
}

.del-btn {
  background: none;
  border: none;
  color: var(--sub);
  font-size: 0.95rem;
  cursor: pointer;
  padding: 3px 4px;
  border-radius: 6px;
  -webkit-tap-highlight-color: transparent;
  flex-shrink: 0;
  opacity: 0.35;
  transition: opacity 0.15s, color 0.15s;
  line-height: 1;
}
.del-btn:active { opacity: 1; color: #ef4444; }

/* ── Add bar ── */
.add-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  padding: 10px 16px max(20px, env(safe-area-inset-bottom));
  background: var(--bg);
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
  align-items: flex-end;
}
.add-fields { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.add-input {
  width: 100%;
  padding: 11px 14px;
  border-radius: 13px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  font-size: 0.92rem;
  color: var(--text);
  outline: none;
  font-family: inherit;
  transition: border-color 0.15s;
  -webkit-appearance: none;
}
.add-input:focus { border-color: var(--accent); }
.add-input::placeholder { color: var(--sub); }
.add-note { font-size: 0.82rem; padding: 8px 14px; }

.add-btn {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--accent);
  border: none;
  color: #fff;
  font-size: 1.5rem;
  line-height: 1;
  cursor: pointer;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.18s, opacity 0.18s;
}
.add-btn:active { transform: scale(0.88); }
.add-btn:disabled { opacity: 0.35; }
</style>
</head>
<body>

<div class="header">
  <button class="back-btn" onclick="history.back()">‹</button>
  <span style="font-size:1.2rem">📝</span>
  <div class="header-title">備忘錄</div>
</div>

<div class="tabs">
  <button class="tab active" id="tab-todos" onclick="switchTab('todos')">📋 待辦</button>
  <button class="tab"        id="tab-likes" onclick="switchTab('likes')">💛 她喜歡</button>
  <button class="tab"        id="tab-dates" onclick="switchTab('dates')">🗺️ 約會</button>
</div>

<div class="list-wrap" id="listWrap"></div>

<div class="add-bar">
  <div class="add-fields">
    <input class="add-input" id="addText" placeholder="新增…" autocomplete="off"
           onkeydown="if(event.key==='Enter')addItem()">
    <input class="add-input add-note" id="addNote" placeholder="備註（選填）" autocomplete="off"
           style="display:none" onkeydown="if(event.key==='Enter')addItem()">
  </div>
  <button class="add-btn" id="addBtn" onclick="addItem()">+</button>
</div>

<script>
let _data = { todos: [], likes: [], dates: [] };
let _tab  = 'todos';
let _saveTimer = null;

const _CFG = {
  todos: { placeholder: '要做的事…',       empty: '還沒有待辦事項', emptyEmoji: '✅' },
  likes: { placeholder: '她喜歡的東西…',   empty: '還沒有記錄',     emptyEmoji: '💛' },
  dates: { placeholder: '想去的地方或活動…', empty: '還沒有約會清單', emptyEmoji: '🗺️' },
};

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function load() {
  try {
    const r = await fetch('/api/memo');
    _data = await r.json();
  } catch {}
  render();
}

function scheduleSave() {
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(async () => {
    try {
      await fetch('/api/memo', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(_data),
      });
    } catch {}
  }, 400);
}

function switchTab(tab) {
  _tab = tab;
  ['todos','likes','dates'].forEach(t => {
    document.getElementById('tab-' + t).classList.toggle('active', t === tab);
  });
  document.getElementById('addNote').style.display = tab === 'likes' ? '' : 'none';
  document.getElementById('addText').placeholder = _CFG[tab].placeholder;
  render();
}

function render() {
  const wrap  = document.getElementById('listWrap');
  const items = _data[_tab] || [];
  if (!items.length) {
    const cfg = _CFG[_tab];
    wrap.innerHTML = `<div class="empty-state">
      <div class="empty-emoji">${cfg.emptyEmoji}</div>
      <div class="empty-text">${cfg.empty}</div>
    </div>`;
    return;
  }
  wrap.innerHTML = items.map(item => {
    const cbHtml = _tab === 'todos'
      ? `<button class="checkbox ${item.done ? 'checked' : ''}" onclick="toggleDone('${item.id}')">${item.done ? '✓' : ''}</button>`
      : '';
    const noteHtml = item.note
      ? `<div class="item-note">${esc(item.note)}</div>`
      : '';
    return `<div class="item ${_tab==='todos'&&item.done?'done':''}" id="item-${item.id}">
      ${cbHtml}
      <div class="item-body">
        <div class="item-text">${esc(item.text)}</div>
        ${noteHtml}
      </div>
      <button class="del-btn" onclick="delItem('${item.id}')">✕</button>
    </div>`;
  }).join('');
}

function toggleDone(id) {
  const item = _data.todos.find(x => x.id === id);
  if (!item) return;
  item.done = !item.done;
  render();
  scheduleSave();
}

function delItem(id) {
  const el = document.getElementById('item-' + id);
  if (el) {
    el.style.transition = 'opacity 0.18s, transform 0.18s';
    el.style.opacity = '0';
    el.style.transform = 'translateX(14px) scale(0.96)';
  }
  setTimeout(() => {
    _data[_tab] = (_data[_tab] || []).filter(x => x.id !== id);
    render();
    scheduleSave();
  }, 180);
}

function addItem() {
  const textEl = document.getElementById('addText');
  const noteEl = document.getElementById('addNote');
  const text = textEl.value.trim();
  if (!text) { textEl.focus(); return; }

  const item = { id: uid(), text, created_at: Date.now() };
  if (_tab === 'todos') item.done = false;
  if (_tab === 'likes' && noteEl.value.trim()) item.note = noteEl.value.trim();

  if (!Array.isArray(_data[_tab])) _data[_tab] = [];
  _data[_tab].unshift(item);

  textEl.value = '';
  noteEl.value = '';
  render();
  scheduleSave();
  textEl.focus();
}

load();
</script>
</body>
</html>
