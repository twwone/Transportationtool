<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>備忘錄</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overscroll-behavior: none; }

:root {
  --bg:       #fbfbfd;
  --surface:  #ffffff;
  --border:   rgba(0, 0, 0, 0.08);
  --rule:     rgba(0, 0, 0, 0.09);
  --text:     #1d1d1f;
  --sub:      #86868b;
  --accent:   #0071e3;
  --accent-2: rgba(0, 113, 227, 0.08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:       #000;
    --surface:  #1c1c1e;
    --border:   rgba(255, 255, 255, 0.09);
    --rule:     rgba(255, 255, 255, 0.12);
    --text:     #f5f5f7;
    --sub:      #86868b;
    --accent:   #2997ff;
    --accent-2: rgba(41, 151, 255, 0.08);
  }
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  height: 100dvh;
}

/* ── Header ── */
.header {
  padding: max(20px, env(safe-area-inset-top) + 8px) 24px 0;
}
.back-btn {
  background: none;
  border: none;
  font-size: 0.78rem;
  font-family: inherit;
  color: var(--sub);
  cursor: pointer;
  padding: 0;
  letter-spacing: 0.06em;
  -webkit-tap-highlight-color: transparent;
  transition: color 0.15s;
}
.back-btn:active { color: var(--accent); }
.header-title {
  font-size: 2rem;
  font-weight: 700;
  letter-spacing: -0.03em;
  color: var(--text);
  margin-top: 10px;
  line-height: 1.15;
}
.header-rule { height: 1px; background: var(--border); margin-top: 16px; }

/* ── Tabs ── */
.tabs {
  display: flex;
  padding: 0 24px;
  border-bottom: 1px solid var(--rule);
}
.tab {
  flex: 1;
  padding: 14px 0 12px;
  border: none;
  background: none;
  font-family: inherit;
  font-size: 0.82rem;
  font-weight: 500;
  letter-spacing: 0.04em;
  color: var(--sub);
  cursor: pointer;
  position: relative;
  text-align: center;
  -webkit-tap-highlight-color: transparent;
  transition: color 0.2s;
}
.tab::after {
  content: '';
  position: absolute;
  bottom: -1px; left: 20%; right: 20%;
  height: 1.5px;
  background: var(--accent);
  transform: scaleX(0);
  transition: transform 0.25s cubic-bezier(0.25,1,0.5,1);
}
.tab.active { color: var(--accent); }
.tab.active::after { transform: scaleX(1); }

/* ── List ── */
.list-wrap {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0 130px;
  -webkit-overflow-scrolling: touch;
}
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 72px 24px 40px;
  gap: 8px;
  color: var(--sub);
}
.empty-label {
  font-size: 0.95rem;
  font-weight: 590;
  letter-spacing: -0.01em;
}

@keyframes itemIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: none; }
}
.item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px 24px;
  border-bottom: 1px solid var(--rule);
  animation: itemIn 0.25s ease both;
}
.item:first-child { border-top: 1px solid var(--rule); }
.item.done { opacity: 0.4; }
.item.done .item-text { text-decoration: line-through; text-decoration-color: var(--sub); }

.checkbox {
  width: 18px; height: 18px;
  flex-shrink: 0;
  border: 1.5px solid var(--sub);
  background: none;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.68rem;
  font-weight: 700;
  color: var(--accent);
  transition: border-color 0.15s, background 0.15s;
  -webkit-tap-highlight-color: transparent;
  margin-top: 2px;
  border-radius: 2px;
}
.checkbox.checked { border-color: var(--accent); background: var(--accent-2); }

/* 點擊整個 item-body 進入詳情 */
.item-body {
  flex: 1;
  min-width: 0;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.item-body:active { opacity: 0.6; }
.item-text {
  font-size: 0.92rem;
  line-height: 1.55;
  word-break: break-word;
  font-weight: 400;
  color: var(--text);
}
.item-note {
  font-size: 0.76rem;
  color: var(--sub);
  margin-top: 4px;
  line-height: 1.5;
  word-break: break-word;

}
/* 有備註的條目顯示小標記 */
.item-note-hint {
  display: inline-block;
  font-size: 0.66rem;
  color: var(--accent);
  margin-top: 3px;
  letter-spacing: 0.04em;
  opacity: 0.7;
}

.del-btn {
  background: none;
  border: none;
  color: var(--sub);
  font-size: 0.72rem;
  cursor: pointer;
  padding: 4px;
  -webkit-tap-highlight-color: transparent;
  flex-shrink: 0;
  opacity: 0.3;
  transition: opacity 0.15s, color 0.15s;
  letter-spacing: 0.02em;
  margin-top: 2px;
}
.del-btn:active { opacity: 1; color: #c0392b; }

/* ── Add bar ── */
.add-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  padding: 12px 24px max(22px, env(safe-area-inset-bottom));
  background: var(--bg);
  border-top: 1px solid var(--border);
  display: flex;
  gap: 10px;
  align-items: flex-end;
}
.add-fields { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.add-input {
  width: 100%;
  padding: 10px 0;
  border: none;
  border-bottom: 1.5px solid var(--border);
  background: transparent;
  font-size: 0.92rem;
  color: var(--text);
  outline: none;
  font-family: inherit;
  transition: border-color 0.2s;
  -webkit-appearance: none;
  border-radius: 0;
}
.add-input:focus { border-bottom-color: var(--accent); }
.add-input::placeholder { color: var(--sub); }
.add-note { font-size: 0.8rem; }
.add-btn {
  padding: 8px 18px;
  border-radius: 2px;
  background: var(--accent);
  border: none;
  color: #fff;
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  font-family: inherit;
  cursor: pointer;
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
  transition: opacity 0.18s, transform 0.15s;
  align-self: flex-end;
  margin-bottom: 2px;
}
.add-btn:active { transform: scale(0.94); }
.add-btn:disabled { opacity: 0.3; }

/* ── Detail Sheet ── */
.sheet-overlay {
  position: fixed; inset: 0;
  background: transparent;
  z-index: 100;
  pointer-events: none;
  transition: background 0.3s ease;
}
.sheet-overlay.open {
  background: rgba(0, 0, 0, 0.28);
  pointer-events: auto;
}

.detail-sheet {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--surface);
  border-top: 1px solid var(--border);
  border-radius: 20px 20px 0 0;
  padding-bottom: max(28px, env(safe-area-inset-bottom));
  z-index: 101;
  transform: translateY(100%);
  transition: transform 0.38s cubic-bezier(0.25,1,0.5,1);
  max-height: 80vh;
  overflow-y: auto;
}
.detail-sheet.open { transform: translateY(0); }

.sh-handle {
  width: 32px; height: 3px;
  background: var(--border);
  border-radius: 100px;
  margin: 12px auto 0;
}
.sh-title {
  font-size: 0.75rem;
  font-weight: 590;
  color: var(--sub);
  padding: 16px 24px 4px;
  letter-spacing: 0.04em;
}
.sh-field {
  padding: 0 24px 16px;
}
.sh-label {
  display: inline-flex;
  align-items: center;
  font-size: 0.64rem;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  background: var(--accent-2);
  padding: 4px 10px;
  border-radius: 100px;
  margin-bottom: 10px;
}
.sh-textarea {
  width: 100%;
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-m, 14px);
  background: var(--bg);
  font-size: 0.95rem;
  color: var(--text);
  font-family: inherit;
  outline: none;
  resize: none;
  line-height: 1.8;
  -webkit-appearance: none;
  transition: border-color 0.2s, background 0.2s;
  display: block;
  overflow: hidden;
}
.sh-textarea:focus { border-color: var(--accent); }
.sh-textarea::placeholder { color: var(--sub); }
.sh-note-area { font-size: 0.85rem; min-height: 36px; }

.sh-divider { height: 1px; background: var(--rule); margin: 0 24px 16px; }

.sh-actions {
  display: flex;
  gap: 10px;
  padding: 4px 24px 0;
}
.sh-cancel {
  flex: 1;
  padding: 11px;
  border: 1.5px solid var(--border);
  background: transparent;
  border-radius: 2px;
  font-size: 0.82rem;
  font-family: inherit;
  color: var(--sub);
  cursor: pointer;
  letter-spacing: 0.04em;
  -webkit-tap-highlight-color: transparent;
  transition: color 0.15s;
}
.sh-cancel:active { color: var(--text); }
.sh-save {
  flex: 2;
  padding: 11px;
  background: var(--accent);
  border: none;
  border-radius: 2px;
  font-size: 0.82rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  font-family: inherit;
  color: #fff;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: opacity 0.15s, transform 0.15s;
}
.sh-save:active { transform: scale(0.97); }
</style>
</head>
<body>

<div class="header">
  <button class="back-btn" onclick="history.back()">← 返回</button>
  <div class="header-title">備忘錄</div>
  <div class="header-rule"></div>
</div>

<div class="tabs">
  <button class="tab active" id="tab-todos" onclick="switchTab('todos')">待辦</button>
  <button class="tab"        id="tab-likes" onclick="switchTab('likes')">她的喜好</button>
  <button class="tab"        id="tab-dates" onclick="switchTab('dates')">約會計畫</button>
</div>

<div class="list-wrap" id="listWrap"></div>

<div class="add-bar">
  <div class="add-fields">
    <input class="add-input" id="addText" placeholder="寫下來…" autocomplete="off"
           onkeydown="if(event.key==='Enter')addItem()">
    <input class="add-input add-note" id="addNote" placeholder="備註" autocomplete="off"
           style="display:none" onkeydown="if(event.key==='Enter')addItem()">
  </div>
  <button class="add-btn" onclick="addItem()">記下</button>
</div>

<!-- Detail Sheet -->
<div class="sheet-overlay" id="sheetOverlay" onclick="closeDetail()"></div>
<div class="detail-sheet" id="detailSheet">
  <div class="sh-handle"></div>
  <div class="sh-title" id="shTitle">編輯</div>

  <div class="sh-field">
    <div class="sh-label">內容</div>
    <textarea class="sh-textarea" id="detailText" rows="2"
              placeholder="寫下來…"
              oninput="autoResize(this)"></textarea>
  </div>

  <div class="sh-divider"></div>

  <div class="sh-field">
    <div class="sh-label">備註</div>
    <textarea class="sh-textarea sh-note-area" id="detailNote" rows="2"
              placeholder="補充說明、細節…"
              oninput="autoResize(this)"></textarea>
  </div>

  <div class="sh-actions">
    <button class="sh-cancel" onclick="closeDetail()">取消</button>
    <button class="sh-save"   onclick="saveDetail()">儲存</button>
  </div>
</div>

<script>
let _data = { todos: [], likes: [], dates: [] };
let _tab  = 'todos';
let _saveTimer = null;
let _editingId = null;

const _CFG = {
  todos: { placeholder: '今天要做的事…',     empty: '一切從空白開始',     shTitle: '編輯待辦' },
  likes: { placeholder: '她喜歡的東西…',     empty: '慢慢記，慢慢了解她', shTitle: '編輯喜好' },
  dates: { placeholder: '想去的地方或活動…', empty: '還沒有計畫',         shTitle: '編輯計畫' },
};

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}

async function load() {
  try {
    const r = await fetch('/api/memo');
    _data = await r.json();
  } catch {}
  render();
}

function scheduleSave() {
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(async () => {
    try {
      await fetch('/api/memo', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(_data),
      });
    } catch {}
  }, 400);
}

function switchTab(tab) {
  _tab = tab;
  ['todos','likes','dates'].forEach(t => {
    document.getElementById('tab-' + t).classList.toggle('active', t === tab);
  });
  document.getElementById('addNote').style.display = tab === 'likes' ? '' : 'none';
  document.getElementById('addText').placeholder = _CFG[tab].placeholder;
  render();
}

function render() {
  const wrap  = document.getElementById('listWrap');
  const items = _data[_tab] || [];
  if (!items.length) {
    wrap.innerHTML = `<div class="empty-state">
      <div class="empty-label">${_CFG[_tab].empty}</div>
    </div>`;
    return;
  }
  wrap.innerHTML = items.map(item => {
    const cbHtml = _tab === 'todos'
      ? `<button class="checkbox ${item.done ? 'checked' : ''}" onclick="toggleDone('${item.id}')">${item.done ? '<i class="bi bi-check-lg"></i>' : ''}</button>`
      : '';
    const noteHtml = item.note
      ? `<div class="item-note">${esc(item.note)}</div>`
      : `<div class="item-note-hint">點擊新增備註</div>`;
    return `<div class="item ${_tab==='todos'&&item.done?'done':''}" id="item-${item.id}">
      ${cbHtml}
      <div class="item-body" onclick="openDetail('${item.id}')">
        <div class="item-text">${esc(item.text)}</div>
        ${noteHtml}
      </div>
      <button class="del-btn" onclick="delItem('${item.id}')">移除</button>
    </div>`;
  }).join('');
}

/* ── Detail Sheet ── */
function openDetail(id) {
  const item = (_data[_tab] || []).find(x => x.id === id);
  if (!item) return;
  _editingId = id;

  document.getElementById('shTitle').textContent  = _CFG[_tab].shTitle;
  const textEl = document.getElementById('detailText');
  const noteEl = document.getElementById('detailNote');
  textEl.value = item.text || '';
  noteEl.value = item.note || '';
  setTimeout(() => { autoResize(textEl); autoResize(noteEl); }, 10);

  document.getElementById('sheetOverlay').classList.add('open');
  document.getElementById('detailSheet').classList.add('open');
  setTimeout(() => textEl.focus(), 350);
}

function closeDetail() {
  _editingId = null;
  document.getElementById('sheetOverlay').classList.remove('open');
  document.getElementById('detailSheet').classList.remove('open');
}

function saveDetail() {
  if (!_editingId) return;
  const item = (_data[_tab] || []).find(x => x.id === _editingId);
  if (!item) return;
  const text = document.getElementById('detailText').value.trim();
  if (!text) return;
  item.text = text;
  const note = document.getElementById('detailNote').value.trim();
  if (note) item.note = note;
  else delete item.note;
  render();
  scheduleSave();
  closeDetail();
}

/* ── 其他操作 ── */
function toggleDone(id) {
  const item = (_data.todos || []).find(x => x.id === id);
  if (!item) return;
  item.done = !item.done;
  render();
  scheduleSave();
}

function delItem(id) {
  const el = document.getElementById('item-' + id);
  if (el) {
    el.style.transition = 'opacity 0.18s, transform 0.18s';
    el.style.opacity = '0';
    el.style.transform = 'translateX(12px)';
  }
  setTimeout(() => {
    _data[_tab] = (_data[_tab] || []).filter(x => x.id !== id);
    render();
    scheduleSave();
  }, 180);
}

function addItem() {
  const textEl = document.getElementById('addText');
  const noteEl = document.getElementById('addNote');
  const text = textEl.value.trim();
  if (!text) { textEl.focus(); return; }

  const item = { id: uid(), text, created_at: Date.now() };
  if (_tab === 'todos') item.done = false;
  if (_tab === 'likes' && noteEl.value.trim()) item.note = noteEl.value.trim();

  if (!Array.isArray(_data[_tab])) _data[_tab] = [];
  _data[_tab].unshift(item);

  textEl.value = '';
  noteEl.value = '';
  render();
  scheduleSave();
  textEl.focus();
}

load();
</script>
</body>
</html>
