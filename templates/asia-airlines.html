<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>亞洲航空航班資訊</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<link rel="apple-touch-icon" href="/static/icon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="交通助理">
<meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { overscroll-behavior: none; }

:root {
  --bg:            #fbfbfd;
  --surface:       #ffffff;
  --surface-soft:  rgba(0,0,0,0.045);
  --border:        rgba(0,0,0,0.08);
  --divider:       rgba(0,0,0,0.09);
  --text:          #1d1d1f;
  --sub:           #86868b;
  --accent:        #e0261f;
  --accent-soft:   rgba(224,38,31,0.09);
  --radius-l:      20px;
  --radius-m:      14px;
}

@keyframes pageIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
@keyframes cardIn { from { opacity:0; transform:translateY(16px) scale(0.98); } to { opacity:1; transform:translateY(0) scale(1); } }
@keyframes spin { to { transform:rotate(360deg); } }

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 48px;
  animation: pageIn 0.4s cubic-bezier(0.22,1,0.36,1) both;
}

.topbar {
  background: rgba(251,251,253,0.88);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: 0 1px 0 var(--divider);
  padding: 10px 16px;
  padding-top: max(10px, env(safe-area-inset-top) + 6px);
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; gap: 10px;
}
.back-btn { color: var(--accent); font-size: 0.85rem; text-decoration: none; transition: opacity 0.15s, transform 0.15s; }
.back-btn:active { transform: scale(0.93); opacity: 0.6; }
.topbar-title { font-size: 1rem; font-weight: 700; letter-spacing: -0.01em; flex: 1; }
.refresh-btn {
  background: var(--accent-soft); border: none; color: var(--accent);
  font-size: 0.82rem; font-weight: 600; cursor: pointer; padding: 7px 13px;
  border-radius: 20px; transition: background 0.15s, transform 0.18s cubic-bezier(0.22,1,0.36,1);
  -webkit-tap-highlight-color: transparent; white-space: nowrap;
}
.refresh-btn:active { transform: scale(0.9); }
.spin { animation: spin 0.7s linear infinite; display: inline-block; }

.meta-bar { display:flex; justify-content:space-between; align-items:center; padding:6px 16px; font-size:0.7rem; color:var(--sub); }

.day-nav { display:flex; align-items:center; justify-content:space-between; padding:2px 12px 6px; gap:6px; }
.day-btn {
  background:none; border:none; color:var(--accent); font-size:0.75rem; font-weight:600;
  padding:5px 8px; border-radius:10px; cursor:pointer; -webkit-tap-highlight-color:transparent;
  transition:opacity 0.15s, transform 0.15s;
}
.day-btn:active { transform:scale(0.93); opacity:0.6; }
.day-label { font-size:0.72rem; color:var(--sub); font-weight:600; }

.list { padding: 8px 12px 0; }
.card-anim { animation: cardIn 0.42s cubic-bezier(0.22,1,0.36,1) both; }

.card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 22px;
  padding: 16px;
  margin-bottom: 10px;
  box-shadow: 0 1px 6px rgba(0,0,0,0.05);
  transition: border-color 0.2s, box-shadow 0.25s cubic-bezier(0.22,1,0.36,1), transform 0.2s;
}
.card:active { transform: scale(0.988); transition-duration: 0.08s; }
.card-pinned { border-color: var(--accent); box-shadow: 0 1px 6px rgba(0,0,0,0.05), inset 3px 0 0 0 var(--accent); }
.card-done { opacity: 0.55; }

.card-meta { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
.badge-airline { background: var(--accent-soft); color: var(--accent); font-size:0.7rem; font-weight:700; letter-spacing:0.4px; padding:3px 9px; border-radius:6px; }
.badge-status { font-size:0.7rem; font-weight:700; padding:3px 9px; border-radius:20px; }
.st-done  { background:#d1fae5; color:#065f46; }
.st-doing { background:#dbeafe; color:#1e40af; }
.st-wait  { background:#f3f4f6; color:#6b7280; }
.pin-btn {
  margin-left: auto; background: none; border: none; cursor: pointer;
  font-size: 1.1rem; color: var(--sub); padding: 2px 4px;
  -webkit-tap-highlight-color: transparent; transition: color 0.15s, transform 0.18s cubic-bezier(0.22,1,0.36,1);
}
.pin-btn.pinned { color: var(--accent); }
.pin-btn:active { transform: scale(0.85); }

.card-hero { display:flex; align-items:center; justify-content:space-between; margin-bottom:11px; gap:8px; }
.hero-flt { font-size:1.25rem; font-weight:800; letter-spacing:-0.01em; }
.hero-gate { text-align:right; }
.hero-gate-label { font-size:0.65rem; color:var(--sub); }
.hero-gate-val { font-size:1.1rem; font-weight:700; }
.gate-changed { display:flex; align-items:center; gap:4px; }
.gate-prev { font-size:0.9rem; font-weight:700; color:var(--sub); text-decoration:line-through; }
.gate-changed i { font-size:0.75rem; color:#f97316; }
.gate-new { font-size:1.25rem; font-weight:800; color:#f97316; }
.badge-gate-chg {
  display:inline-flex; align-items:center; gap:4px;
  font-size:0.68rem; font-weight:700; color:#c2410c;
  background:rgba(249,115,22,0.14); padding:3px 9px; border-radius:20px;
}

.route-row {
  display:flex; align-items:center; gap:6px; margin-bottom:11px;
  font-size:0.78rem; font-weight:600; color:var(--sub); flex-wrap:wrap;
}
.route-row i { font-size:0.7rem; color:var(--accent); }

.time-row { display:flex; gap:8px; margin-bottom: 10px; }
.time-block { flex:1; background:var(--surface-soft); border-radius:12px; padding:8px 10px; text-align:center; }
.time-label { font-size:0.62rem; color:var(--sub); font-weight:600; letter-spacing:0.4px; margin-bottom:2px; }
.time-val { font-size:0.95rem; font-weight:700; }

.meta-grid { display:flex; flex-wrap:wrap; gap:6px; font-size:0.72rem; color:var(--sub); }
.meta-grid span { background:var(--surface-soft); padding:3px 8px; border-radius:6px; }
.card-rmk { margin-top:8px; font-size:0.75rem; color:#9a3412; background:#fff7ed; padding:6px 10px; border-radius:10px; }

.detail-link {
  margin-top:10px; display:flex; align-items:center; gap:4px;
  font-size:0.75rem; font-weight:600; color:var(--accent);
  background:none; border:none; padding:0; cursor:pointer; -webkit-tap-highlight-color:transparent;
}

.detail-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:200;
  opacity:0; pointer-events:none; transition:opacity 0.22s ease;
}
.detail-overlay.show { opacity:1; pointer-events:auto; }
.detail-sheet {
  position:fixed; left:0; right:0; bottom:0; max-height:82vh;
  background:var(--surface); color:var(--text); border-radius:22px 22px 0 0;
  padding:14px 16px max(16px, env(safe-area-inset-bottom));
  transform:translateY(100%); transition:transform 0.3s cubic-bezier(0.22,1,0.36,1);
  overflow-y:auto; z-index:201;
}
.detail-overlay.show .detail-sheet { transform:translateY(0); }
.detail-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.detail-title { font-size:1rem; font-weight:800; color:var(--text); }
.detail-close {
  background:var(--surface-soft); border:none; color:var(--sub);
  width:30px; height:30px; border-radius:50%; font-size:0.9rem; cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.detail-body { display:flex; flex-direction:column; gap:12px; }

.props-list { display:flex; flex-direction:column; background:var(--surface-soft); border-radius:14px; padding:2px 12px; }
.prop-row { display:flex; align-items:center; justify-content:space-between; gap:14px; padding:10px 0; border-bottom:1px solid var(--divider); }
.prop-row:last-child { border-bottom:none; }
.prop-row.is-rmk { flex-direction:column; align-items:flex-start; gap:3px; }
.prop-label { display:flex; align-items:center; gap:7px; font-size:0.76rem; color:var(--sub); font-weight:600; flex-shrink:0; }
.prop-label i { width:14px; text-align:center; }
.prop-val { font-size:0.85rem; font-weight:700; color:var(--text); text-align:right; }
.prop-row.is-rmk .prop-val { text-align:left; font-weight:600; white-space:pre-wrap; }
.prop-val.is-empty { color:var(--sub); font-weight:500; }
.prop-row.is-active .prop-label,
.prop-row.is-active .prop-val { color:var(--accent); }
.detail-img { width:100%; border-radius:14px; display:block; background:var(--surface-soft); cursor:zoom-in; }
.detail-file {
  display:flex; align-items:center; gap:8px; padding:12px; border-radius:14px;
  background:var(--surface-soft); color:var(--text); text-decoration:none; font-size:0.85rem; font-weight:600;
}
.detail-text { font-size:0.85rem; line-height:1.6; padding:10px 12px; background:var(--surface-soft); border-radius:12px; color:var(--text); }
.detail-loading, .detail-empty { text-align:center; color:var(--sub); font-size:0.8rem; padding:30px 0; }

/* 迷你播放器顯示時，把清單底部空間讓出來，最後一項才不會被浮動播放器擋住點不到 */
html.has-miniplayer .detail-body { padding-bottom: 92px; }

.ai-summary {
  border:1.5px solid var(--accent-soft); background:var(--accent-soft);
  border-radius:16px; padding:12px 14px;
}
.ai-summary-loading { display:flex; align-items:center; gap:8px; font-size:0.8rem; color:var(--sub); }
.ai-summary-head {
  width:100%; display:flex; align-items:center; gap:6px; font-size:0.78rem; font-weight:700;
  color:var(--accent); background:none; border:none; padding:0; margin:0;
  cursor:pointer; -webkit-tap-highlight-color:transparent;
}
.ai-summary-dot { width:7px; height:7px; border-radius:50%; background:#f97316; }
.ai-summary-chevron { margin-left:auto; font-size:0.7rem; transition:transform 0.2s cubic-bezier(0.22,1,0.36,1); }
.ai-summary-chevron.rotated { transform:rotate(180deg); }
.ai-summary-content { margin-top:10px; }
.ai-summary-alert {
  display:flex; align-items:flex-start; gap:6px; font-size:0.82rem; font-weight:600; line-height:1.6;
  color:#c2410c; background:rgba(249,115,22,0.14); border-radius:10px; padding:8px 10px; margin-bottom:8px;
}
.ai-summary-alert i { margin-top:2px; flex-shrink:0; }
.ai-summary-positions-head {
  display:flex; align-items:center; gap:5px; font-size:0.75rem; font-weight:700;
  color:var(--accent); margin-bottom:4px;
}
.ai-summary-positions {
  margin:0 0 8px; padding-left:18px; font-size:0.82rem; font-weight:600; line-height:1.7; color:var(--text);
}
.ai-summary-positions li { margin-bottom:2px; }
.ai-summary-points { margin:0; padding-left:18px; font-size:0.82rem; line-height:1.7; color:var(--text); }
.ai-summary-points li { margin-bottom:2px; }

.lightbox-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:300;
  display:flex; align-items:center; justify-content:center;
  opacity:0; pointer-events:none; transition:opacity 0.22s ease;
  overflow:hidden; touch-action:none;
}
.lightbox-overlay.show { opacity:1; pointer-events:auto; }
.lightbox-overlay img {
  max-width:94vw; max-height:88vh; border-radius:8px; object-fit:contain;
  touch-action:none; -webkit-user-select:none; user-select:none;
  will-change:transform; transform-origin:center center;
}
.lightbox-overlay img.zooming { transition:none; }
.lightbox-overlay img:not(.zooming) { transition:transform 0.2s cubic-bezier(0.22,1,0.36,1); }
.lightbox-close {
  position:absolute; top:max(16px, env(safe-area-inset-top)); right:16px;
  background:rgba(255,255,255,0.15); border:none; color:#fff;
  width:36px; height:36px; border-radius:50%; font-size:1rem; cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

.empty-hint, .err-hint { text-align:center; padding:48px 20px 0; color:var(--sub); font-size:0.82rem; line-height:1.8; }
.empty-hint .hint-icon, .err-hint .hint-icon { font-size:2.2rem; display:block; margin-bottom:10px; }

.sync-note { padding: 10px 16px 0; font-size: 0.68rem; color: var(--sub); text-align: center; }
.sync-note a { color: var(--accent); }

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000; --surface:#1c1c1e; --surface-soft: rgba(255,255,255,0.06);
    --border: rgba(255,255,255,0.12); --divider: rgba(255,255,255,0.12);
    --text:#f5f5f7; --sub:#98989d; --accent:#ff453a; --accent-soft: rgba(255,69,58,0.16);
  }
  .topbar { background: rgba(0,0,0,0.82); }
  .st-done  { background: rgba(52,199,89,0.18); color:#34d399; }
  .st-doing { background: rgba(10,132,255,0.18); color:#60a5fa; }
  .st-wait  { background: rgba(255,255,255,0.08); color:#98989d; }
  .card-rmk { background: rgba(255,159,10,0.14); color:#ffb454; }
  .gate-new, .gate-changed i { color:#ffb454; }
  .badge-gate-chg { background: rgba(255,159,10,0.18); color:#ffb454; }
  .ai-summary-alert { background: rgba(255,159,10,0.16); color:#ffb454; }
}

.announce-btn {
  background:var(--accent-soft); border:none; color:var(--accent);
  width:34px; height:34px; border-radius:50%; font-size:1rem; cursor:pointer;
  display:flex; align-items:center; justify-content:center; flex-shrink:0; position:relative;
  -webkit-tap-highlight-color:transparent; transition:transform 0.18s cubic-bezier(0.22,1,0.36,1);
}
.announce-btn:active { transform:scale(0.88); }
.announce-btn.is-live::after {
  content:''; position:absolute; top:1px; right:1px; width:8px; height:8px;
  border-radius:50%; background:#34c759; border:1.5px solid var(--bg);
}

.announce-breadcrumb { display:flex; align-items:center; gap:8px; font-size:0.78rem; color:var(--sub); font-weight:600; margin-bottom:12px; }
.announce-back {
  background:none; border:none; color:var(--accent); font-size:0.8rem; font-weight:700; padding:0;
  cursor:pointer; display:flex; align-items:center; gap:1px; -webkit-tap-highlight-color:transparent;
}

.announce-list { display:flex; flex-direction:column; gap:8px; }
.announce-row {
  display:flex; align-items:center; gap:12px; padding:13px 14px; background:var(--surface-soft);
  border-radius:14px; cursor:pointer; -webkit-tap-highlight-color:transparent; border:none; width:100%;
  text-align:left; font-family:inherit; transition:background 0.15s, transform 0.15s;
}
.announce-row:active { transform:scale(0.98); }
.announce-row.is-playing { background:var(--accent-soft); }
.announce-icon-sq {
  width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center;
  font-size:1.05rem; flex-shrink:0; background:var(--surface); color:var(--sub);
}
.announce-row.is-playing .announce-icon-sq { color:var(--accent); }
.announce-row-title { font-size:0.88rem; font-weight:700; color:var(--text); flex:1; }
.announce-row.is-playing .announce-row-title { color:var(--accent); }
.announce-row-chevron { color:var(--sub); font-size:0.9rem; flex-shrink:0; }
.announce-row.is-playing .announce-row-chevron { color:var(--accent); }

.miniplayer {
  position:fixed; left:12px; right:12px; bottom:max(12px, env(safe-area-inset-bottom) + 8px);
  background:var(--surface); border:1.5px solid var(--border); border-radius:18px;
  box-shadow:0 6px 22px rgba(0,0,0,0.16); padding:10px 12px 10px 10px;
  display:flex; align-items:center; gap:10px; z-index:250;
  transform:translateY(140%); transition:transform 0.3s cubic-bezier(0.22,1,0.36,1);
}
.miniplayer.show { transform:translateY(0); }
.miniplayer-play {
  background:var(--accent); color:#fff; border:none; width:38px; height:38px; border-radius:50%;
  font-size:1.05rem; display:flex; align-items:center; justify-content:center; cursor:pointer;
  flex-shrink:0; -webkit-tap-highlight-color:transparent;
}
.miniplayer-info { flex:1; min-width:0; }
.miniplayer-label { font-size:0.65rem; color:var(--sub); font-weight:700; letter-spacing:0.3px; }
.miniplayer-title { font-size:0.85rem; font-weight:700; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.miniplayer-close {
  background:none; border:none; color:var(--sub); font-size:1rem; padding:6px; cursor:pointer;
  flex-shrink:0; -webkit-tap-highlight-color:transparent;
}

/* 拖拉進度條：用原生 range input 拿現成的手勢/觸控/鍵盤支援，
   軌道視覺上做細，但整個 input 保留較高的高度當作大範圍拖拉熱區。 */
.miniplayer-seek {
  -webkit-appearance:none; appearance:none; width:100%; height:24px; margin:3px 0 -2px;
  background:transparent; cursor:pointer; touch-action:none; display:block; padding:0;
}
.miniplayer-seek::-webkit-slider-runnable-track { height:4px; border-radius:2px; background:transparent; }
.miniplayer-seek::-webkit-slider-thumb {
  -webkit-appearance:none; width:16px; height:16px; border-radius:50%; margin-top:-6px;
  background:var(--accent); border:2px solid var(--surface); box-shadow:0 1px 4px rgba(0,0,0,0.35);
}
.miniplayer-seek::-moz-range-track { height:4px; border-radius:2px; background:var(--surface-soft); }
.miniplayer-seek::-moz-range-progress { height:4px; border-radius:2px; background:var(--accent); }
.miniplayer-seek::-moz-range-thumb {
  width:16px; height:16px; border-radius:50%; background:var(--accent);
  border:2px solid var(--surface); box-shadow:0 1px 4px rgba(0,0,0,0.35);
}
.miniplayer-seek:active::-webkit-slider-thumb { transform:scale(1.2); }
.miniplayer-seek:active::-moz-range-thumb { transform:scale(1.2); }
.miniplayer-times { display:flex; justify-content:space-between; font-size:0.62rem; color:var(--sub); font-weight:600; margin-top:-3px; }
</style>
</head>
<body>

<div class="topbar">
  <a href="/" class="back-btn"><i class="bi bi-chevron-left"></i> 返回</a>
  <div class="topbar-title">亞洲航空航班資訊</div>
  <button class="announce-btn" id="announceBtn" onclick="openAnnounce()" title="廣播詞"><i class="bi bi-megaphone-fill"></i></button>
  <button class="refresh-btn" id="refreshBtn" onclick="loadFlights(true)">↻ 更新</button>
</div>
<div class="meta-bar">
  <span>FD / AK / Z2 / D7</span>
  <span id="updatedAt"></span>
</div>
<div class="day-nav">
  <button class="day-btn" onclick="shiftDay(-1)"><i class="bi bi-chevron-left"></i> 前一天</button>
  <span class="day-label" id="dayLabel"></span>
  <button class="day-btn" id="todayBtn" onclick="goToday()" style="visibility:hidden">回到今天 <i class="bi bi-chevron-right"></i></button>
</div>

<div class="list" id="list"></div>

<div class="sync-note" id="syncNote"></div>

<div class="detail-overlay" id="detailOverlay" onclick="if(event.target===this) closeDetail()">
  <div class="detail-sheet">
    <div class="detail-head">
      <div class="detail-title" id="detailTitle"></div>
      <button class="detail-close" onclick="closeDetail()"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="detail-body" id="detailBody"></div>
  </div>
</div>

<div class="lightbox-overlay" id="lightboxOverlay" onclick="if(event.target===this) closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()"><i class="bi bi-x-lg"></i></button>
  <img id="lightboxImg" src="" alt="">
</div>

<div class="detail-overlay" id="announceOverlay" onclick="if(event.target===this) closeAnnounce()">
  <div class="detail-sheet" style="max-height:88vh">
    <div class="detail-head">
      <div class="detail-title"><i class="bi bi-megaphone-fill"></i> 廣播詞</div>
      <button class="detail-close" onclick="closeAnnounce()"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="announce-breadcrumb" id="announceBreadcrumb"></div>
    <div class="detail-body" id="announceBody"></div>
  </div>
</div>

<div class="miniplayer" id="miniPlayer">
  <button class="miniplayer-play" onclick="toggleMiniPlayer()"><i class="bi bi-pause-fill" id="miniPlayerIcon"></i></button>
  <div class="miniplayer-info">
    <div class="miniplayer-label" id="miniPlayerLabel"></div>
    <div class="miniplayer-title" id="miniPlayerTitle"></div>
    <input type="range" class="miniplayer-seek" id="miniPlayerSeek" min="0" max="1000" value="0" step="1">
    <div class="miniplayer-times"><span id="miniPlayerCurTime">0:00</span><span id="miniPlayerDurTime">0:00</span></div>
  </div>
  <button class="miniplayer-close" onclick="stopMiniPlayer()"><i class="bi bi-x-lg"></i></button>
</div>

<audio id="bcAudio" preload="none" playsinline style="display:none"></audio>

<script>
const STATUS_MAP = {
  'Done':         { cls: 'st-done',  label: '已完成' },
  'In progress':  { cls: 'st-doing', label: '進行中' },
  'Not started':  { cls: 'st-wait',  label: '未開始' },
};

function getSyncId() {
  let id = localStorage.getItem('asiaairSyncId');
  if (!id) {
    id = (typeof crypto !== 'undefined' && crypto.randomUUID)
      ? crypto.randomUUID()
      : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
          const r = Math.random() * 16 | 0;
          return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
        });
    localStorage.setItem('asiaairSyncId', id);
  }
  return id;
}

let _flights   = [];
let _pinned    = new Set();
let _loadTimer = null;
let _viewDate  = null;   // null = 今天（由伺服器判斷），否則是 YYYY-MM-DD
let _isToday   = true;
let _prevGates   = {};   // flight -> 上一次刷新的登機門
let _gateChanges = {};   // flight -> { from, to }，只在偵測到變更那次刷新有效

function _fmtDayLabel(dateStr, isToday) {
  if (!dateStr) return '';
  const [y, m, d] = dateStr.split('-');
  return isToday ? `今天 ${m}/${d}` : `${m}/${d}`;
}

function shiftDay(delta) {
  const base = _viewDate ? new Date(`${_viewDate}T00:00:00`) : new Date();
  base.setDate(base.getDate() + delta);
  const y = base.getFullYear();
  const m = String(base.getMonth() + 1).padStart(2, '0');
  const d = String(base.getDate()).padStart(2, '0');
  loadFlights(false, `${y}-${m}-${d}`);
}

function goToday() { loadFlights(false, null); }

async function loadPins() {
  try {
    const res = await fetch(`/api/asia-airlines/pins/${getSyncId()}`);
    const data = await res.json();
    _pinned = new Set(data.flights || []);
  } catch { _pinned = new Set(); }
}

async function savePins() {
  try {
    await fetch('/api/asia-airlines/pins', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sync_id: getSyncId(), flights: [..._pinned] }),
    });
  } catch {}
}

function togglePin(flightNo) {
  if (_pinned.has(flightNo)) _pinned.delete(flightNo);
  else _pinned.add(flightNo);
  savePins();
  render();
}

function fmtTime(t) { return t && t.trim() ? t : '—'; }

function renderCard(f) {
  const isPinned = _isToday && _pinned.has(f.flight);
  const status = STATUS_MAP[f.status] || { cls: 'st-wait', label: f.status || '—' };
  const isDone = f.status === 'Done';
  const rmk = (f.rmk || '').trim();
  const showRmk = rmk && rmk.toUpperCase() !== 'NIL';

  const tags = [];
  if (f.acft_reg) tags.push(`<span>${f.acft_reg}</span>`);
  if (f.date) tags.push(`<span>${f.date}</span>`);
  if (f.cgo && f.cgo.toUpperCase() === 'YES') tags.push('<span>貨運</span>');
  if (f.spcl && f.spcl.toUpperCase() === 'YES') tags.push('<span>特殊需求</span>');

  const pinHtml = _isToday
    ? `<button class="pin-btn ${isPinned ? 'pinned' : ''}" onclick="togglePin('${f.flight}')">
        <i class="bi ${isPinned ? 'bi-pin-fill' : 'bi-pin'}"></i>
      </button>`
    : '';

  const gateChg = _gateChanges[f.flight];
  const gateHtml = gateChg
    ? `<div class="hero-gate-val gate-changed"><span class="gate-prev">${gateChg.from}</span><i class="bi bi-arrow-right"></i><span class="gate-new">${gateChg.to}</span></div>`
    : `<div class="hero-gate-val">${f.gate || '—'}</div>`;

  return `<div class="card card-anim ${isPinned ? 'card-pinned' : ''} ${isDone ? 'card-done' : ''}">
    <div class="card-meta">
      <span class="badge-airline">${(f.flight || '').slice(0,2)}</span>
      <span class="badge-status ${status.cls}">${status.label}</span>
      ${gateChg ? '<span class="badge-gate-chg"><i class="bi bi-exclamation-triangle-fill"></i> 登機門異動</span>' : ''}
      ${pinHtml}
    </div>
    <div class="card-hero">
      <div class="hero-flt">${f.flight || '—'}</div>
      <div class="hero-gate">
        <div class="hero-gate-label">GATE</div>
        ${gateHtml}
      </div>
    </div>
    ${(f.origin || f.destination) ? `<div class="route-row">
        <span>${f.origin || '—'}</span>
        <i class="bi bi-airplane"></i>
        <span>TPE</span>
        <i class="bi bi-airplane"></i>
        <span>${f.destination || '—'}</span>
      </div>` : ''}
    <div class="time-row">
      <div class="time-block"><div class="time-label">STD</div><div class="time-val">${fmtTime(f.std)}</div></div>
      <div class="time-block"><div class="time-label">ETA</div><div class="time-val">${fmtTime(f.eta)}</div></div>
      <div class="time-block"><div class="time-label">STA</div><div class="time-val">${fmtTime(f.sta)}</div></div>
    </div>
    <div class="meta-grid">${tags.join('')}</div>
    ${showRmk ? `<div class="card-rmk">${rmk}</div>` : ''}
    <button class="detail-link" onclick="openDetail('${f.flight}','${f.notion_id}')">
      <i class="bi bi-clipboard2-check"></i> 需求與詳情 <i class="bi bi-chevron-right"></i>
    </button>
  </div>`;
}

// 屬性原封不動照 Notion 抄出來，不翻譯也不改寫文字，只有空值統一顯示 "Empty"
// （跟你在 Notion 卡片頁面看到的一樣），視覺上用 accent 色標出非 NIL/NO 的實際值方便掃視。
const PROP_ROWS = [
  { key: 'status',   label: 'Status',   icon: 'bi-record-circle' },
  { key: 'date',     label: 'DATE',     icon: 'bi-calendar3' },
  { key: 'acft_reg', label: 'ACFT REG', icon: 'bi-airplane' },
  { key: 'sta',      label: 'STA',      icon: 'bi-arrow-down-left' },
  { key: 'gate',     label: 'GATE',     icon: 'bi-door-open' },
  { key: 'eta',      label: 'ETA',      icon: 'bi-clock-history' },
  { key: 'std',      label: 'STD',      icon: 'bi-arrow-up-right' },
  { key: 'spcl',     label: 'SPCL',     icon: 'bi-person-wheelchair' },
  { key: 'gse',      label: 'GSE',      icon: 'bi-tools' },
  { key: 'cgo',      label: 'CGO',      icon: 'bi-box-seam' },
  { key: 'rmk',      label: 'RMK',      icon: 'bi-info-circle' },
  { key: 'als',      label: 'ALS',      icon: 'bi-person-walking' },
];
const PROP_ACTIVE_KEYS = new Set(['spcl', 'gse', 'cgo', 'als']);

function fmtProp(v) {
  const t = (v || '').trim();
  return t || 'Empty';
}

function isActiveProp(key, v) {
  if (!PROP_ACTIVE_KEYS.has(key)) return false;
  const up = (v || '').trim().toUpperCase();
  return up && up !== 'NIL' && up !== 'NO';
}

function renderNeeds(f) {
  const rows = PROP_ROWS.map(({ key, label, icon }) => {
    const raw     = f[key];
    const display = fmtProp(raw);
    const active  = isActiveProp(key, raw);
    const isRmk   = key === 'rmk';
    return `<div class="prop-row ${active ? 'is-active' : ''} ${isRmk ? 'is-rmk' : ''}">
      <span class="prop-label"><i class="bi ${icon}"></i> ${label}</span>
      <span class="prop-val ${display === 'Empty' ? 'is-empty' : ''}">${display}</span>
    </div>`;
  }).join('') + `<div class="prop-row">
      <span class="prop-label"><i class="bi bi-arrow-up-right-square"></i> To Do List</span>
      <span class="prop-val is-empty">Empty</span>
    </div>`;
  return `<div class="props-list">${rows}</div>`;
}

async function openDetail(flightNo, notionId) {
  const overlay = document.getElementById('detailOverlay');
  const body    = document.getElementById('detailBody');
  document.getElementById('detailTitle').textContent = flightNo;

  const f = _flights.find(x => x.notion_id === notionId) || {};
  const needsHtml = renderNeeds(f);

  if (!f.has_detail) {
    body.innerHTML = needsHtml;
    overlay.classList.add('show');
    return;
  }

  body.innerHTML = needsHtml + `<div class="detail-loading"><span class="spin">↻</span> 載入附件中…</div>`;
  overlay.classList.add('show');

  let itemsHtml = '';
  try {
    const res  = await fetch(`/api/asia-airlines/detail/${notionId}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '載入失敗');
    const items = data.items || [];
    if (!items.length) {
      body.innerHTML = needsHtml + `<div class="detail-empty">沒有附加內容</div>`;
      return;
    }
    itemsHtml = items.map(it => {
      if (it.type === 'image') return `<img class="detail-img" src="${it.url}" alt="${it.title || ''}" loading="lazy" onclick="openLightbox(this.src)">`;
      if (it.type === 'file')  return `<a class="detail-file" href="${it.url}" target="_blank" rel="noopener"><i class="bi bi-file-earmark-arrow-down"></i> ${it.title}</a>`;
      return `<div class="detail-text">${it.text}</div>`;
    }).join('');
    body.innerHTML = needsHtml + `<div class="ai-summary" id="aiSummary">
      <button class="ai-summary-head" onclick="toggleAiSummary()">
        <i class="bi bi-stars"></i> AI 重點摘要
        <span class="ai-summary-dot" id="aiSummaryDot" style="display:none"></span>
        <i class="bi bi-chevron-down ai-summary-chevron" id="aiSummaryChevron"></i>
      </button>
      <div class="ai-summary-content" id="aiSummaryContent" style="display:none">
        <div class="ai-summary-loading"><span class="spin">↻</span> AI 讀取附件重點中…</div>
      </div>
    </div>` + itemsHtml;
  } catch (e) {
    body.innerHTML = needsHtml + `<div class="detail-empty"><i class="bi bi-wifi-off"></i><br>${e.message}</div>`;
    return;
  }

  // AI 摘要非同步載入，失敗就悄悄隱藏，不擋原始附件內容
  try {
    const res  = await fetch(`/api/asia-airlines/summary/${notionId}`);
    const data = await res.json();
    const box  = document.getElementById('aiSummary');
    if (!box) return;
    if (!res.ok) { box.remove(); return; }
    const alertHtml = data.alert
      ? `<div class="ai-summary-alert"><i class="bi bi-exclamation-triangle-fill"></i> ${data.alert}</div>` : '';
    const positionsHtml = (data.positions || []).length
      ? `<div class="ai-summary-positions-head"><i class="bi bi-geo-alt-fill"></i> 貨艙位置</div>
         <ul class="ai-summary-positions">${data.positions.map(p => `<li>${p}</li>`).join('')}</ul>` : '';
    const pointsHtml = (data.points || []).length
      ? `<ul class="ai-summary-points">${data.points.map(p => `<li>${p}</li>`).join('')}</ul>` : '';
    if (!alertHtml && !positionsHtml && !pointsHtml) { box.remove(); return; }
    const content = document.getElementById('aiSummaryContent');
    if (content) content.innerHTML = `${alertHtml}${positionsHtml}${pointsHtml}`;
    // 有需要特別注意的事項時，收起狀態也顯示一個小紅點提醒
    const dot = document.getElementById('aiSummaryDot');
    if (dot && data.alert) dot.style.display = 'inline-block';
  } catch (e) {
    const box = document.getElementById('aiSummary');
    if (box) box.remove();
  }
}

function toggleAiSummary() {
  const content  = document.getElementById('aiSummaryContent');
  const chevron  = document.getElementById('aiSummaryChevron');
  if (!content) return;
  const isOpen = content.style.display !== 'none';
  content.style.display = isOpen ? 'none' : 'block';
  if (chevron) chevron.classList.toggle('rotated', !isOpen);
}

function closeDetail() {
  document.getElementById('detailOverlay').classList.remove('show');
}

function openLightbox(url) {
  const img = document.getElementById('lightboxImg');
  img.src = url;
  _zResetTransform(img);
  document.getElementById('lightboxOverlay').classList.add('show');
}

function closeLightbox() {
  document.getElementById('lightboxOverlay').classList.remove('show');
}

/* ── 兩指縮放 / 拖曳（lightbox 放大檢視）── */
let _zScale = 1, _zTx = 0, _zTy = 0;
let _zPinchStartDist = 0, _zPinchStartScale = 1;
let _zPanStart = null, _zPanStartT = null;
const _Z_MIN = 1, _Z_MAX = 4;

function _zApplyTransform(img) {
  img.style.transform = `translate(${_zTx}px, ${_zTy}px) scale(${_zScale})`;
}

function _zResetTransform(img) {
  _zScale = 1; _zTx = 0; _zTy = 0;
  img.classList.remove('zooming');
  img.style.transform = '';
}

function _zClampPan(img) {
  // 放大後限制拖曳範圍，避免圖片整個被拖出畫面外
  const r = img.getBoundingClientRect();
  const overX = Math.max(0, (r.width  * _zScale - r.width)  / 2);
  const overY = Math.max(0, (r.height * _zScale - r.height) / 2);
  _zTx = Math.min(overX, Math.max(-overX, _zTx));
  _zTy = Math.min(overY, Math.max(-overY, _zTy));
}

function _zDist(t0, t1) {
  return Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
}

(function initLightboxGestures() {
  const img = document.getElementById('lightboxImg');

  img.addEventListener('touchstart', e => {
    img.classList.add('zooming');
    if (e.touches.length === 2) {
      _zPinchStartDist  = _zDist(e.touches[0], e.touches[1]);
      _zPinchStartScale = _zScale;
      _zPanStart = null;
    } else if (e.touches.length === 1 && _zScale > 1) {
      _zPanStart  = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      _zPanStartT = { x: _zTx, y: _zTy };
    }
  }, { passive: true });

  img.addEventListener('touchmove', e => {
    if (e.touches.length === 2 && _zPinchStartDist) {
      e.preventDefault();
      const dist = _zDist(e.touches[0], e.touches[1]);
      _zScale = Math.min(_Z_MAX, Math.max(_Z_MIN, _zPinchStartScale * (dist / _zPinchStartDist)));
      _zClampPan(img);
      _zApplyTransform(img);
    } else if (e.touches.length === 1 && _zPanStart) {
      e.preventDefault();
      _zTx = _zPanStartT.x + (e.touches[0].clientX - _zPanStart.x);
      _zTy = _zPanStartT.y + (e.touches[0].clientY - _zPanStart.y);
      _zClampPan(img);
      _zApplyTransform(img);
    }
  }, { passive: false });

  img.addEventListener('touchend', e => {
    if (e.touches.length === 0) {
      img.classList.remove('zooming');
      _zPanStart = null;
      if (_zScale <= 1.02) { _zScale = 1; _zTx = 0; _zTy = 0; }
      _zApplyTransform(img);
    }
  });

  // 桌機：滑鼠滾輪 / 觸控板雙指縮放
  img.addEventListener('wheel', e => {
    e.preventDefault();
    _zScale = Math.min(_Z_MAX, Math.max(_Z_MIN, _zScale - e.deltaY * 0.01));
    if (_zScale <= 1.02) { _zScale = 1; _zTx = 0; _zTy = 0; }
    _zClampPan(img);
    img.classList.add('zooming');
    _zApplyTransform(img);
  }, { passive: false });

  // 雙擊 / 雙點快速切換 1x ↔ 2.5x
  img.addEventListener('dblclick', () => {
    _zScale = _zScale > 1 ? 1 : 2.5;
    _zTx = 0; _zTy = 0;
    img.classList.remove('zooming');
    _zApplyTransform(img);
  });
})();

function render() {
  const listEl = document.getElementById('list');
  if (!_flights.length) {
    const hint = _isToday ? '目前沒有亞洲航空集團的航班資料' : '這天沒有亞洲航空集團的航班資料';
    listEl.innerHTML = `<div class="empty-hint"><i class="bi bi-airplane hint-icon"></i>${hint}</div>`;
    return;
  }
  const sorted = [..._flights].sort((a, b) => {
    if (_isToday) {
      const ap = _pinned.has(a.flight) ? 0 : 1;
      const bp = _pinned.has(b.flight) ? 0 : 1;
      if (ap !== bp) return ap - bp;
    }
    return (a.date + a.std).localeCompare(b.date + b.std);
  });
  listEl.innerHTML = sorted.map(renderCard).join('');
}

async function loadFlights(manual, dateStr) {
  const btn = document.getElementById('refreshBtn');
  if (manual) btn.innerHTML = '<span class="spin">↻</span>';
  const queryDate = dateStr !== undefined ? dateStr : _viewDate;
  try {
    const url = queryDate ? `/api/asia-airlines/flights?date=${queryDate}` : '/api/asia-airlines/flights';
    const res = await fetch(url);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '載入失敗');
    _flights  = data.flights || [];
    _isToday  = data.is_today !== false;
    _viewDate = _isToday ? null : data.date;

    // 登機門異動追蹤：只在看「今天」時比對，跟上次刷新的登機門不同就標記出來
    _gateChanges = {};
    if (_isToday) {
      const newGates = {};
      _flights.forEach(f => { if (f.gate) newGates[f.flight] = f.gate; });
      if (Object.keys(_prevGates).length) {
        Object.keys(newGates).forEach(flt => {
          const prev = _prevGates[flt];
          if (prev && prev !== newGates[flt]) _gateChanges[flt] = { from: prev, to: newGates[flt] };
        });
      }
      _prevGates = newGates;
    } else {
      _prevGates = {};
    }

    document.getElementById('updatedAt').textContent = data.updated_at ? `更新於 ${data.updated_at}` : '';
    document.getElementById('dayLabel').textContent = _fmtDayLabel(data.date, _isToday);
    document.getElementById('todayBtn').style.visibility = _isToday ? 'hidden' : 'visible';

    // 只在看「今天」時才需要每 30 秒自動刷新，看歷史資料沒有必要一直打 API
    if (_isToday && !_loadTimer) _loadTimer = setInterval(() => loadFlights(false), 30000);
    if (!_isToday && _loadTimer) { clearInterval(_loadTimer); _loadTimer = null; }

    render();
  } catch (e) {
    document.getElementById('list').innerHTML =
      `<div class="err-hint"><i class="bi bi-wifi-off hint-icon"></i>${e.message}</div>`;
  } finally {
    if (manual) btn.innerHTML = '↻ 更新';
  }
}

/* ── 廣播詞：Notion 錄音檔瀏覽 + 背景播放（Media Session）── */
let _bcStack         = [];   // [{id: null|string, title}]　瀏覽路徑，null id = 根目錄
let _bcCurrentFolders = [];  // 目前這層若是資料夾清單
let _bcCurrentTracks  = [];  // 目前這層若是廣播詞清單
let _bcNowPlaying     = null;

const bcAudio = document.getElementById('bcAudio');

async function openAnnounce() {
  document.getElementById('announceOverlay').classList.add('show');
  if (!_bcStack.length) _bcStack = [{ id: null, title: '廣播詞' }];
  await bcRender();
}

function closeAnnounce() {
  document.getElementById('announceOverlay').classList.remove('show');
}

function bcOpenIndex(i) {
  const it = _bcCurrentFolders[i];
  if (!it) return;
  _bcStack.push({ id: it.id, title: it.title });
  bcRender();
}

function bcBack() {
  if (_bcStack.length <= 1) return;
  _bcStack.pop();
  bcRender();
}

async function bcRender() {
  const body  = document.getElementById('announceBody');
  const crumb = document.getElementById('announceBreadcrumb');
  const cur   = _bcStack[_bcStack.length - 1];

  crumb.innerHTML = _bcStack.length > 1
    ? `<button class="announce-back" onclick="bcBack()"><i class="bi bi-chevron-left"></i> 上一層</button><span>${_bcStack.map(s => s.title).join(' / ')}</span>`
    : `<span>選擇機隊代碼</span>`;

  body.innerHTML = `<div class="detail-loading"><span class="spin">↻</span> 載入中…</div>`;

  try {
    const url  = cur.id ? `/api/asia-airlines/announcements/${cur.id}` : '/api/asia-airlines/announcements';
    const res  = await fetch(url);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '載入失敗');

    if (data.type === 'folder') {
      _bcCurrentFolders = data.items || [];
      _bcCurrentTracks  = [];
      if (!_bcCurrentFolders.length) { body.innerHTML = `<div class="detail-empty">這裡還沒有內容</div>`; return; }
      body.innerHTML = `<div class="announce-list">${_bcCurrentFolders.map((it, i) => `
        <button class="announce-row" onclick="bcOpenIndex(${i})">
          <span class="announce-icon-sq">${it.icon || '📁'}</span>
          <span class="announce-row-title">${it.title}</span>
          <i class="bi bi-chevron-right announce-row-chevron"></i>
        </button>`).join('')}</div>`;
    } else {
      _bcCurrentFolders = [];
      _bcCurrentTracks  = data.items || [];
      if (!_bcCurrentTracks.length) { body.innerHTML = `<div class="detail-empty">這裡還沒有廣播詞錄音</div>`; return; }
      body.innerHTML = `<div class="announce-list">${_bcCurrentTracks.map((it, i) => `
        <button class="announce-row" id="bcRow${i}" onclick="bcPlay(${i})">
          <span class="announce-icon-sq"><i class="bi bi-mic-fill"></i></span>
          <span class="announce-row-title">${it.label}</span>
          <i class="bi bi-play-circle-fill announce-row-chevron"></i>
        </button>`).join('')}</div>`;
      // 回到同一層時，把目前正在播放的那筆重新標成播放中
      if (_bcNowPlaying) {
        const idx = _bcCurrentTracks.findIndex(t => t.url === _bcNowPlaying.url);
        if (idx >= 0) bcHighlightPlaying(idx);
      }
    }
  } catch (e) {
    body.innerHTML = `<div class="detail-empty"><i class="bi bi-wifi-off"></i><br>${e.message}</div>`;
  }
}

function bcHighlightPlaying(i) {
  document.querySelectorAll('.announce-row').forEach(el => el.classList.remove('is-playing'));
  const row = document.getElementById(`bcRow${i}`);
  if (row) row.classList.add('is-playing');
}

function bcPlay(i) {
  const it = _bcCurrentTracks[i];
  if (!it) return;
  _bcNowPlaying = it;
  bcAudio.src = it.url;
  bcAudio.play().catch(() => {});
  bcHighlightPlaying(i);

  document.getElementById('miniPlayerLabel').textContent = it.label;
  document.getElementById('miniPlayerTitle').textContent = it.title;
  document.getElementById('miniPlayer').classList.add('show');
  document.getElementById('announceBtn').classList.add('is-live');
  document.documentElement.classList.add('has-miniplayer');
  bcSeekEl.value = 0;
  bcSeekFill(0);
  document.getElementById('miniPlayerCurTime').textContent = '0:00';
  document.getElementById('miniPlayerDurTime').textContent = '0:00';

  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title:  it.title,
      artist: it.label,
      album:  '亞洲航空廣播詞',
    });
    navigator.mediaSession.setActionHandler('play',  () => bcAudio.play().catch(() => {}));
    navigator.mediaSession.setActionHandler('pause', () => bcAudio.pause());
    navigator.mediaSession.setActionHandler('stop',  () => stopMiniPlayer());
  }
}

function toggleMiniPlayer() {
  if (bcAudio.paused) bcAudio.play().catch(() => {});
  else bcAudio.pause();
}

function stopMiniPlayer() {
  bcAudio.pause();
  bcAudio.removeAttribute('src');
  bcAudio.load();
  document.getElementById('miniPlayer').classList.remove('show');
  document.getElementById('announceBtn').classList.remove('is-live');
  document.documentElement.classList.remove('has-miniplayer');
  document.querySelectorAll('.announce-row').forEach(el => el.classList.remove('is-playing'));
  bcSeekEl.value = 0;
  bcSeekFill(0);
  _bcNowPlaying = null;
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'none';
}

bcAudio.addEventListener('play', () => {
  document.getElementById('miniPlayerIcon').className = 'bi bi-pause-fill';
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
});
bcAudio.addEventListener('pause', () => {
  document.getElementById('miniPlayerIcon').className = 'bi bi-play-fill';
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
});
bcAudio.addEventListener('ended', () => {
  document.getElementById('miniPlayerIcon').className = 'bi bi-play-fill';
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
});

/* ── 拖拉進度條 ── */
let _bcSeeking = false;
const bcSeekEl = document.getElementById('miniPlayerSeek');

function bcFmtTime(s) {
  if (!isFinite(s) || s < 0) return '0:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60).toString().padStart(2, '0');
  return `${m}:${sec}`;
}

function bcSeekFill(pct) {
  bcSeekEl.style.background = `linear-gradient(to right, var(--accent) ${pct}%, var(--surface-soft) ${pct}%)`;
}

function bcBeginSeek() { _bcSeeking = true; }
['pointerdown', 'touchstart', 'mousedown'].forEach(ev => bcSeekEl.addEventListener(ev, bcBeginSeek));

bcSeekEl.addEventListener('input', () => {
  _bcSeeking = true;
  const pct = Number(bcSeekEl.value) / 10;  // 0–1000 對應 0–100%
  bcSeekFill(pct);
  if (bcAudio.duration) {
    bcAudio.currentTime = (pct / 100) * bcAudio.duration;
    document.getElementById('miniPlayerCurTime').textContent = bcFmtTime(bcAudio.currentTime);
  }
});
['change', 'pointerup', 'touchend', 'mouseup'].forEach(ev => bcSeekEl.addEventListener(ev, () => { _bcSeeking = false; }));

bcAudio.addEventListener('loadedmetadata', () => {
  document.getElementById('miniPlayerDurTime').textContent = bcFmtTime(bcAudio.duration);
});
bcAudio.addEventListener('timeupdate', () => {
  if (_bcSeeking || !bcAudio.duration) return;
  const pct = (bcAudio.currentTime / bcAudio.duration) * 100;
  bcSeekEl.value = pct * 10;
  bcSeekFill(pct);
  document.getElementById('miniPlayerCurTime').textContent = bcFmtTime(bcAudio.currentTime);
  document.getElementById('miniPlayerDurTime').textContent = bcFmtTime(bcAudio.duration);
});

(async function init() {
  // body 有進場動畫殘留的 transform，會讓內部的 position:fixed 元素定位錯亂，
  // 把詳情面板／放大圖片面板搬到 <html> 底下脫離這個 containing block
  document.documentElement.appendChild(document.getElementById('detailOverlay'));
  document.documentElement.appendChild(document.getElementById('lightboxOverlay'));
  document.documentElement.appendChild(document.getElementById('announceOverlay'));
  document.documentElement.appendChild(document.getElementById('miniPlayer'));

  await loadPins();
  await loadFlights(false, null);

  const syncEl = document.getElementById('syncNote');
  syncEl.textContent = `裝置同步碼：${getSyncId().slice(0, 8)}…（釘選狀態依此碼跨裝置同步，每日自動清空）`;
})();
</script>
