<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>機場捷運</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" type="image/svg+xml" href="/static/icon.svg">
<link rel="apple-touch-icon" href="/static/icon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="交通助理">
<script src="/static/config.js"></script>
<meta name="theme-color" content="#f0f4ff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { overscroll-behavior: none; }

@keyframes pageIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f0f4ff;
  color: #1c1c1e;
  min-height: 100vh;
  padding-bottom: 48px;
  animation: pageIn 0.38s cubic-bezier(0.22, 1, 0.36, 1) both;
}

/* ── Topbar ── */
.topbar {
  background: rgba(240,244,255,0.9);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  box-shadow: 0 1px 0 rgba(0,0,0,0.06);
  padding: 12px 16px 16px;
  padding-top: max(14px, env(safe-area-inset-top) + 10px);
  position: sticky;
  top: 0;
  z-index: 100;
}
.topbar-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}
.back-btn {
  color: #7c3aed;
  font-size: 0.95rem;
  font-weight: 600;
  text-decoration: none;
  min-width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  -webkit-tap-highlight-color: transparent;
}
.topbar-title {
  font-size: 1.08rem;
  font-weight: 700;
  flex: 1;
}
.topbar-title .bi { color: #7c3aed; }
.topbar-right {
  display: flex;
  align-items: center;
  gap: 8px;
}
.update-time {
  font-size: 0.65rem;
  color: #aeaeb2;
}
.icon-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: rgba(124,58,237,0.1);
  border: none;
  color: #7c3aed;
  font-size: 1.1rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.15s, transform 0.15s;
}
.icon-btn:active { transform: scale(0.85); }

/* ── Direction Toggle ── */
.dir-wrap {
  position: relative;
  display: flex;
  background: rgba(118,118,128,0.12);
  border-radius: 100px;
  padding: 3px;
}
.dir-pill {
  position: absolute;
  top: 3px; bottom: 3px;
  background: #fff;
  border-radius: 100px;
  box-shadow: 0 1px 6px rgba(0,0,0,0.14);
  transition: left 0.28s cubic-bezier(0.25,1,0.5,1), width 0.28s cubic-bezier(0.25,1,0.5,1);
  pointer-events: none;
  will-change: left, width;
}
.dir-btn {
  flex: 1;
  padding: 12px 16px;
  border-radius: 100px;
  border: none;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  color: #8e8e93;
  background: transparent;
  position: relative; z-index: 1;
  transition: color 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.dir-btn.active { color: #7c3aed; }

/* ── Starred shortcut ── */
.starred-bar {
  padding-top: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.starred-bar:empty { display: none; }
.s-label { font-size: 0.7rem; color: #aeaeb2; }
.s-chip {
  font-size: 0.82rem;
  font-weight: 600;
  padding: 6px 18px;
  border-radius: 20px;
  background: #ede9fe;
  color: #7c3aed;
  border: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.15s, transform 0.15s;
}
.s-chip:active { transform: scale(0.95); background: #ddd6fe; }

/* ── Content ── */
.content {
  padding: 14px 14px 0;
  max-width: 600px;
  margin: 0 auto;
}

/* ── Station card ── */
.station-card {
  background: #fff;
  border: 1.5px solid #e5e5ea;
  border-radius: 22px;
  padding: 16px 18px 18px;
  margin-bottom: 10px;
  position: relative;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.18s cubic-bezier(0.22,1,0.36,1);
}
.station-card:active { transform: scale(0.982); }
.station-card.card-anim {
  animation: cardIn 0.42s cubic-bezier(0.22,1,0.36,1) both;
}
.station-card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 5px;
  border-radius: 0;
}
.station-card.urgency-urgent::before { background: #dc2626; }
.station-card.urgency-soon::before   { background: #ea580c; }
.station-card.urgency-normal::before { background: #16a34a; }
.station-card.urgency-none::before   { background: transparent; }

.station-card.home-highlight {
  border-color: #c4b5fd;
  background: linear-gradient(140deg, #faf8ff 0%, #f3f0ff 100%);
  box-shadow: 0 2px 14px rgba(124,58,237,0.1);
}

.station-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.station-name {
  font-size: 1.18rem;
  font-weight: 700;
  padding-left: 11px;
  color: #1c1c1e;
}
.star-btn {
  width: 44px; height: 44px;
  display: flex; align-items: center; justify-content: center;
  background: none; border: none;
  cursor: pointer;
  font-size: 1.35rem;
  color: #d1d1d6;
  -webkit-tap-highlight-color: transparent;
  transition: color 0.15s, transform 0.18s;
  flex-shrink: 0;
}
.star-btn:active { transform: scale(0.75); }
.star-btn.starred { color: #f59e0b; }

/* ── Train pills ── */
.trains-row {
  display: flex;
  gap: 10px;
  padding-left: 11px;
}
.train-pill {
  flex: 1;
  background: #f6f6f8;
  border: 1.5px solid #ebebed;
  border-radius: 16px;
  padding: 14px 10px 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.pill-type {
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.7px;
  text-transform: uppercase;
}
.pill-type.express { color: #a0318e; }
.pill-type.local   { color: #3d40a5; }

.pill-countdown {
  font-size: 3rem;
  font-weight: 800;
  letter-spacing: -3px;
  line-height: 1;
}
.pill-unit {
  font-size: 0.75rem;
  font-weight: 500;
  letter-spacing: 0;
  margin-left: 1px;
  vertical-align: super;
}
.cnt-urgent { color: #dc2626; }
.cnt-soon   { color: #ea580c; }
.cnt-normal { color: #16a34a; }
.cnt-none   { color: #c7c7cc; font-size: 2rem; letter-spacing: 0; }

/* ── Loading / Error ── */
.loading { text-align: center; padding: 64px 20px; font-size: 0.85rem; color: #aeaeb2; }
.setup-banner {
  background: #fff; border: 1px solid #e5e5ea; border-radius: 20px;
  padding: 24px 20px; font-size: 0.84rem; color: #6c6c70; line-height: 1.7;
}
.setup-banner strong { color: #7c3aed; display: block; margin-bottom: 8px; font-size: 0.95rem; }

/* ── Mode Toggle ── */
.mode-wrap {
  position: relative;
  display: flex;
  background: rgba(118,118,128,0.12);
  border-radius: 100px;
  padding: 3px;
  margin-top: 10px;
}
.mode-pill {
  position: absolute;
  top: 3px; bottom: 3px;
  background: #fff;
  border-radius: 100px;
  box-shadow: 0 1px 6px rgba(0,0,0,0.14);
  transition: left 0.28s cubic-bezier(0.25,1,0.5,1), width 0.28s cubic-bezier(0.25,1,0.5,1);
  pointer-events: none;
}
.mode-btn {
  flex: 1;
  padding: 10px 16px;
  border-radius: 100px;
  border: none;
  font-size: 0.87rem;
  font-weight: 600;
  cursor: pointer;
  color: #8e8e93;
  background: transparent;
  position: relative; z-index: 1;
  transition: color 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.mode-btn.active { color: #7c3aed; }

/* ── Station Picker ── */
.station-picker {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding: 10px 14px 0;
  max-width: 600px;
  margin: 0 auto;
  display: flex;
  gap: 8px;
}
.station-picker::-webkit-scrollbar { display: none; }
.st-chip {
  flex-shrink: 0;
  font-size: 0.8rem;
  font-weight: 600;
  padding: 7px 14px;
  border-radius: 20px;
  background: rgba(118,118,128,0.1);
  color: #48484a;
  border: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.15s, color 0.15s, transform 0.15s;
  white-space: nowrap;
}
.st-chip:active { transform: scale(0.94); }
.st-chip.active { background: #7c3aed; color: #fff; }

/* ── Timetable ── */
.tt-header {
  padding: 12px 14px 4px;
  max-width: 600px;
  margin: 0 auto;
}
.tt-station-title {
  font-size: 1.1rem;
  font-weight: 700;
  color: #1c1c1e;
}
.tt-subtitle {
  font-size: 0.7rem;
  color: #aeaeb2;
  margin-top: 2px;
}
.tt-list {
  padding: 4px 14px 8px;
  max-width: 600px;
  margin: 0 auto;
}
.tt-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 0;
  border-bottom: 1px solid rgba(0,0,0,0.05);
}
.tt-row:last-child { border-bottom: none; }
.tt-row.past { opacity: 0.3; }
.tt-type {
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.4px;
  padding: 3px 8px;
  border-radius: 7px;
  min-width: 36px;
  text-align: center;
  flex-shrink: 0;
}
.tt-type.express { background: rgba(160,49,142,0.1); color: #a0318e; }
.tt-type.local   { background: rgba(61,64,165,0.1);  color: #3d40a5; }
.tt-time {
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: -0.5px;
  color: #1c1c1e;
  flex: 1;
  font-variant-numeric: tabular-nums;
}
.tt-time.soon { color: #ea580c; }
.tt-time.now  { color: #dc2626; }
.tt-countdown {
  font-size: 0.78rem;
  color: #aeaeb2;
  font-weight: 500;
  min-width: 54px;
  text-align: right;
  flex-shrink: 0;
}
.tt-countdown.soon { color: #ea580c; }
.tt-countdown.now  { color: #dc2626; }
.tt-empty {
  text-align: center;
  padding: 40px 20px;
  font-size: 0.85rem;
  color: #aeaeb2;
}
.tt-show-all {
  display: block;
  width: calc(100% - 28px);
  max-width: 572px;
  margin: 4px auto 16px;
  padding: 12px;
  background: rgba(118,118,128,0.1);
  border: none;
  border-radius: 14px;
  font-size: 0.84rem;
  color: #7c3aed;
  font-weight: 600;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

/* ── Dark Mode ── */
@media (prefers-color-scheme: dark) {
  .mode-wrap { background: rgba(118,118,128,0.18); }
  .mode-pill { background: #2c2c2e; box-shadow: 0 1px 5px rgba(0,0,0,0.5); }
  .mode-btn { color: #48484a; }
  .mode-btn.active { color: #bf5af2; }
  .st-chip { background: rgba(118,118,128,0.18); color: #8e8e93; }
  .st-chip.active { background: #bf5af2; color: #fff; }
  .tt-station-title { color: #f2f2f7; }
  .tt-row { border-bottom-color: rgba(255,255,255,0.06); }
  .tt-time { color: #f2f2f7; }
  .tt-type.express { background: rgba(192,132,252,0.15); color: #c084fc; }
  .tt-type.local   { background: rgba(129,140,248,0.15); color: #818cf8; }
  .tt-time.soon { color: #fb923c; }
  .tt-time.now  { color: #f87171; }
  .tt-countdown.soon { color: #fb923c; }
  .tt-countdown.now  { color: #f87171; }
  .tt-show-all { background: rgba(118,118,128,0.18); color: #bf5af2; }
}

/* ── Dark Mode (original) ── */
@media (prefers-color-scheme: dark) {
  body { background: #000; color: #f2f2f7; }
  .topbar { background: rgba(0,0,0,0.78); box-shadow: 0 1px 0 rgba(255,255,255,0.06); }
  .topbar-title { color: #f2f2f7; }
  .back-btn { color: #bf5af2; }
  .update-time { color: #48484a; }
  .icon-btn { background: rgba(191,90,242,0.15); color: #bf5af2; }
  .icon-btn:active { background: rgba(191,90,242,0.25); }

  .dir-wrap { background: rgba(118,118,128,0.18); }
  .dir-pill { background: #2c2c2e; box-shadow: 0 1px 5px rgba(0,0,0,0.5); }
  .dir-btn { color: #48484a; }
  .dir-btn.active { color: #bf5af2; }

  .s-chip { background: rgba(124,58,237,0.2); color: #bf5af2; }
  .s-chip:active { background: rgba(124,58,237,0.3); }

  .station-card { background: #1c1c1e; border-color: #2c2c2e; }
  .station-card.home-highlight {
    border-color: rgba(124,58,237,0.5);
    background: linear-gradient(140deg, rgba(124,58,237,0.12) 0%, rgba(124,58,237,0.06) 100%);
    box-shadow: none;
  }
  .station-name { color: #f2f2f7; }
  .star-btn { color: #3a3a3c; }
  .star-btn.starred { color: #f59e0b; }
  .train-pill { background: #2c2c2e; border-color: #3a3a3c; }
  .pill-type.express { color: #c084fc; }
  .pill-type.local   { color: #818cf8; }
  .cnt-urgent { color: #f87171; }
  .cnt-soon   { color: #fb923c; }
  .cnt-normal { color: #4ade80; }
  .cnt-none   { color: #3a3a3c; }
  .setup-banner { background: #1c1c1e; border-color: #2c2c2e; color: #8e8e93; }
  .setup-banner strong { color: #bf5af2; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-row">
    <a href="/" class="back-btn">‹ 返回</a>
    <span class="topbar-title"><i class="bi bi-train-front"></i> 機場捷運</span>
    <div class="topbar-right">
      <span class="update-time" id="lastUpdate">—</span>
      <button class="icon-btn" onclick="fetchNow()" title="立即更新">↻</button>
    </div>
  </div>
  <div class="dir-wrap" id="dirWrap">
    <div class="dir-pill" id="dirPill"></div>
    <button class="dir-btn active" id="btnDir0" onclick="setDir(0)">← 往台北</button>
    <button class="dir-btn"        id="btnDir1" onclick="setDir(1)">往機場 →</button>
  </div>
  <div class="mode-wrap" id="modeWrap">
    <div class="mode-pill" id="modePill"></div>
    <button class="mode-btn active" id="btnMode0" onclick="setMode('live')">即時</button>
    <button class="mode-btn"        id="btnMode1" onclick="setMode('timetable')">時刻表</button>
  </div>
  <div class="starred-bar" id="homeBar"></div>
</div>

<div class="content" id="content">
  <div class="loading">載入中…</div>
</div>
<div id="tt-wrap" style="display:none"></div>

<script>
const STATIONS = {{ stations | tojson }};
const HAS_TDX  = {{ has_tdx | tojson }};

let direction    = 0;
let liveData     = [];
let starredId    = Config.getActive().mrt.starred || "";
let refreshTick  = 30;
let refreshTimer = null;
let ttTimer      = null; // 時刻表每分鐘自動重繪 timer
let _demoStart   = 0;

function generateDemoData() {
  _demoStart = Date.now();
  const rows = [];
  STATIONS.forEach((st, si) => {
    [0, 1].forEach(dir => {
      [1, 2].forEach(type => {
        const base1 = ((si * 7 + type * 3 + dir * 11) % 18) + 2;
        const base2 = base1 + (type === 1 ? 18 : 15);
        [base1, base2].forEach(mins => {
          rows.push({ StationID: st.id, Direction: dir, TrainType: type, _baseMins: mins, StationSequence: si + 1 });
        });
      });
    });
  });
  return rows;
}

function demoMins(t) {
  const elapsed = (Date.now() - _demoStart) / 60000;
  return Math.max(0, Math.round(t._baseMins - elapsed));
}

let _demoTick = null;
function startDemoTick() {
  if (_demoTick) return;
  if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
  _demoTick = setInterval(() => {
    renderStations();
    refreshTick--;
    if (refreshTick <= 0) {
      liveData = generateDemoData();
      refreshTick = 30;
      document.getElementById("lastUpdate").textContent =
        new Date().toLocaleTimeString("zh-TW", {hour:"2-digit", minute:"2-digit"});
    }
  }, 1000);
}

(async function init() {
  const sk = Config.getActive().syncKey;
  if (sk) {
    try {
      await Config.pull(sk);
      starredId = Config.getActive().mrt.starred || "";
    } catch {}
  }
  updateDirPill();
  _updateModePill();
  renderHomeBar();
  if (HAS_TDX) {
    fetchNow();
    startRefreshTimer();
  } else {
    liveData = generateDemoData();
    document.getElementById("lastUpdate").textContent = "Demo";
    renderStations();
    startDemoTick();
  }
})();

function updateDirPill() {
  const btn  = document.getElementById('btnDir' + direction);
  const pill = document.getElementById('dirPill');
  if (!btn || !pill) return;
  pill.style.left  = btn.offsetLeft + 'px';
  pill.style.width = btn.offsetWidth + 'px';
}

function setDir(d) {
  direction = d;
  document.getElementById("btnDir0").classList.toggle("active", d === 0);
  document.getElementById("btnDir1").classList.toggle("active", d === 1);
  updateDirPill();
  if (mode === 'live') renderStations();
  else renderTimetable();
}

function renderHomeBar() {
  const bar = document.getElementById("homeBar");
  if (!starredId) { bar.innerHTML = ''; return; }
  const st = STATIONS.find(s => s.id === starredId);
  if (!st) { bar.innerHTML = ''; return; }
  bar.innerHTML = `<span class="s-label"><i class="bi bi-star-fill"></i></span>
    <button class="s-chip" onclick="scrollToStation('${starredId}')">${st.name}</button>`;
}

function scrollToStation(id) {
  const el = document.getElementById("card-" + id);
  if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
}

async function fetchNow() {
  refreshTick = 30;
  try {
    const resp = await fetch("/api/mrt/liveboard");
    const json = await resp.json();
    if (!json.configured) { renderNoTDX(); return; }
    if (json.error)       { renderError(json.error); return; }
    liveData = json.data || [];
    document.getElementById("lastUpdate").textContent =
      new Date().toLocaleTimeString("zh-TW", {hour:"2-digit", minute:"2-digit"});
    renderStations();
  } catch(e) { renderError(String(e)); }
}

function startRefreshTimer() {
  if (refreshTimer) clearInterval(refreshTimer);
  if (_demoTick) { clearInterval(_demoTick); _demoTick = null; }
  refreshTimer = setInterval(() => {
    refreshTick--;
    if (refreshTick <= 0) fetchNow();
  }, 1000);
}

function renderStations() {
  const content = document.getElementById("content");
  const orderedStations = starredId
    ? [...STATIONS.filter(s => s.id === starredId), ...STATIONS.filter(s => s.id !== starredId)]
    : STATIONS;

  let html = '';
  for (const st of orderedStations) {
    const isHome  = st.id === starredId;
    const trains  = getTrainsForStation(st.id, direction);
    const express = trains.filter(t => t.TrainType === 1)[0];
    const local   = trains.filter(t => t.TrainType === 2)[0];
    const first   = express || local;
    const urgency = first
      ? (first._mins < 3 ? 'urgent' : first._mins <= 8 ? 'soon' : 'normal')
      : 'none';

    html += `<div class="station-card urgency-${urgency}${isHome ? ' home-highlight' : ''}" id="card-${st.id}">
      <div class="station-header">
        <span class="station-name">${st.name}</span>
        <button class="star-btn${isHome ? ' starred' : ''}" onclick="toggleStar('${st.id}')">
          ${isHome ? '★' : '☆'}
        </button>
      </div>
      <div class="trains-row">
        ${renderPill(express, "express", "直達")}
        ${renderPill(local,   "local",   "普通")}
      </div>
    </div>`;
  }
  content.innerHTML = html;
}

function renderPill(train, typeClass, label) {
  if (!train) return `<div class="train-pill">
    <span class="pill-type ${typeClass}">${label}</span>
    <span class="pill-countdown cnt-none">—</span>
  </div>`;
  const mins = train._mins;
  const cls  = mins < 3 ? "cnt-urgent" : mins <= 8 ? "cnt-soon" : "cnt-normal";
  return `<div class="train-pill">
    <span class="pill-type ${typeClass}">${label}</span>
    <span class="pill-countdown ${cls}">${mins}<small class="pill-unit">分</small></span>
  </div>`;
}

const EXPRESS_STOPS = new Set(["A1", "A12", "A13", "A17", "A18"]);

function getTrainsForStation(stationId, dir) {
  return liveData
    .filter(t => {
      if (t._baseMins !== undefined) return t.StationID === stationId && t.Direction === dir;
      const toTaipei = t.DestinationStationID === "A1";
      return t.StationID === stationId && (dir === 0 ? toTaipei : !toTaipei);
    })
    .map(t => {
      const mins = t._baseMins !== undefined
        ? demoMins(t)
        : (typeof t.EstimateTime === "number" ? t.EstimateTime : 999);
      let trainType;
      if (t._baseMins !== undefined) {
        trainType = t.TrainType;
      } else if (dir === 1) {
        trainType = t.DestinationStationID === "A13" ? 1 : 2;
      } else {
        trainType = EXPRESS_STOPS.has(stationId) ? undefined : 2;
      }
      return { ...t, _mins: mins, TrainType: trainType };
    })
    .filter(t => t._mins >= 0 && t._mins < 999)
    .sort((a, b) => a._mins - b._mins)
    .map((t, i) => ({ ...t, TrainType: t.TrainType ?? (i === 0 ? 1 : 2) }));
}

function toggleStar(id) {
  starredId = starredId === id ? "" : id;
  Config.save({ mrt: { starred: starredId } });
  const sk = Config.getActive().syncKey;
  if (sk) Config.push().catch(() => {});
  renderHomeBar();
  renderStations();
}

function renderNoTDX() {
  liveData = generateDemoData();
  document.getElementById("lastUpdate").textContent = "Demo";
  renderStations();
  startDemoTick();
}

function renderError(msg) {
  document.getElementById("content").innerHTML =
    `<div class="setup-banner"><strong><i class="bi bi-exclamation-triangle-fill"></i> 資料載入失敗</strong>${msg}</div>`;
}

// ── Timetable ────────────────────────────────
let mode      = 'live';
let ttStation = starredId || STATIONS[0].id;
let ttData    = null;   // null = demo mode
let ttShowAll = false;
let ttFetched = false;

const _TT_OFF = {
  A1:0, A2:5, A3:8, A4:11, A5:14, A6:17, A7:20,
  A8:23, A9:26, A10:29, A11:32, A12:35, A13:38,
  "A14a":41, A15:44, A16:47, A17:50, A18:53, A19:56, A20:59, A21:62
};
const _TT_MAX = 62;
const _EXP_OFF     = { A1:0,  A12:35, A13:38, A17:50, A18:53 }; // 往機場 from A1
const _EXP_OFF_REV = { A18:0, A17:3,  A13:15, A12:18, A1:53  }; // 往台北 from A18

function setMode(m) {
  mode = m;
  document.getElementById('btnMode0').classList.toggle('active', m === 'live');
  document.getElementById('btnMode1').classList.toggle('active', m === 'timetable');
  _updateModePill();
  document.getElementById('content').style.display   = m === 'live' ? '' : 'none';
  document.getElementById('tt-wrap').style.display   = m === 'timetable' ? '' : 'none';
  if (m === 'live') {
    if (ttTimer) { clearInterval(ttTimer); ttTimer = null; }
  }
  if (m === 'timetable') {
    if (HAS_TDX && !ttFetched) fetchTimetable();
    else renderTimetable();
  }
}

function _updateModePill() {
  const idx  = mode === 'live' ? 0 : 1;
  const btn  = document.getElementById('btnMode' + idx);
  const pill = document.getElementById('modePill');
  if (!btn || !pill) return;
  pill.style.left  = btn.offsetLeft + 'px';
  pill.style.width = btn.offsetWidth + 'px';
}

async function fetchTimetable() {
  ttFetched = true;
  document.getElementById('tt-wrap').innerHTML = '<div class="loading">載入時刻表…</div>';
  try {
    const r = await fetch('/api/mrt/timetable');
    const j = await r.json();
    if (j.configured && Array.isArray(j.data) && j.data.length > 0) ttData = j.data;
  } catch(e) {}
  renderTimetable();
}

function _genDemo(stId, dir) {
  const off = _TT_OFF[stId];
  if (off === undefined) return [];
  const list = [];
  // 普通車：每 12 分鐘，06:00–23:00 從終點站出發
  for (let t = 360; t <= 1380; t += 12) {
    const arr = dir === 1 ? t + off : t + (_TT_MAX - off);
    if (arr >= 360 && arr <= 1440) list.push({ type: 2, mins: arr });
  }
  // 直達車：只停 A1/A12/A13/A17/A18，每 18 分鐘，06:10 出發
  if (_EXP_OFF[stId] !== undefined) {
    for (let t = 370; t <= 1366; t += 18) {
      const arr = dir === 1
        ? t + _EXP_OFF[stId]
        : t + (_EXP_OFF_REV[stId] || 0);
      if (arr >= 360 && arr <= 1440) list.push({ type: 1, mins: arr });
    }
  }
  list.sort((a, b) => a.mins - b.mins || a.type - b.type);
  return list;
}

function _minsToHHMM(m) {
  return `${String(Math.floor(m/60)%24).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
}

function _parseTDXTrains(stationId, dir) {
  if (!ttData) return [];
  return ttData
    .filter(t => t.StationID === stationId && t.Direction === dir)
    .map(t => {
      // TDX 可能用不同欄位名稱
      const raw = t.DepartureTime || t.ArrivalTime ||
                  t.ScheduledDepartureTime || t.ScheduledArrivalTime ||
                  t.ScheduleArrivalTime || t.ScheduleDepartureTime || '';
      const ts = String(raw).slice(0, 5);
      if (!ts || !ts.includes(':')) return null;
      const [hh, mm] = ts.split(':').map(Number);
      if (isNaN(hh) || isNaN(mm)) return null;
      const type = (t.TrainType === 1 || t.TrainTypeName?.Zh_tw?.includes('直達')) ? 1 : 2;
      return { type, mins: hh * 60 + mm, ts };
    })
    .filter(Boolean)
    .sort((a, b) => a.mins - b.mins);
}

function renderTimetable() {
  const st      = STATIONS.find(s => s.id === ttStation) || STATIONS[0];
  const nowMins = new Date().getHours() * 60 + new Date().getMinutes();

  let trains;
  let dataSrc = 'Demo';

  if (ttData) {
    const tdxTrains = _parseTDXTrains(ttStation, direction)
      .filter(t => t.mins >= 300); // 排除 00:00–05:00 的異常資料
    if (tdxTrains.length >= 5) {  // 至少要有 5 班才算可信的完整時刻表
      trains  = tdxTrains;
      dataSrc = 'TDX';
    } else {
      trains = _genDemo(ttStation, direction).map(t => ({ ...t, ts: _minsToHHMM(t.mins) }));
    }
  } else {
    trains = _genDemo(ttStation, direction).map(t => ({ ...t, ts: _minsToHHMM(t.mins) }));
  }

  // de-dupe
  const seen = new Set();
  trains = trains.filter(t => {
    const k = `${t.type}-${t.mins}`;
    return seen.has(k) ? false : (seen.add(k), true);
  });

  const upIdx = trains.findIndex(t => t.mins >= nowMins - 1);
  const displayed = (!ttShowAll && upIdx > 1) ? trains.slice(upIdx - 1) : trains;

  // ── Station picker ──
  const picker = `<div class="station-picker" id="stPicker">${
    STATIONS.map(s =>
      `<button class="st-chip${s.id===ttStation?' active':''}" onclick="pickStation('${s.id}')">${s.name}</button>`
    ).join('')
  }</div>`;

  // ── Header ──
  const dirLabel = direction === 0 ? '往台北' : '往機場/環北';
  const header   = `<div class="tt-header">
    <div class="tt-station-title">${st.name}</div>
    <div class="tt-subtitle">${dirLabel} · ${dataSrc} · 今日班次</div>
  </div>`;

  // ── Rows ──
  let rows = '<div class="tt-list">';
  if (displayed.length === 0) {
    rows += '<div class="tt-empty">此站無班次資料</div>';
  } else {
    for (const t of displayed) {
      const diff    = t.mins - nowMins;
      const isPast  = diff < -1;
      const isNow   = !isPast && diff <= 3;
      const isSoon  = !isPast && !isNow && diff <= 15;
      const tcls    = isPast ? '' : isNow ? 'now' : isSoon ? 'soon' : '';
      const cntTxt  = isPast ? '' : diff <= 0 ? '即將到站' : `${diff} 分後`;
      const cntCls  = isNow ? 'now' : isSoon ? 'soon' : '';
      const typeLbl = t.type === 1 ? '直達' : '普通';
      const typeCls = t.type === 1 ? 'express' : 'local';
      rows += `<div class="tt-row${isPast?' past':''}">
        <span class="tt-type ${typeCls}">${typeLbl}</span>
        <span class="tt-time ${tcls}">${t.ts}</span>
        <span class="tt-countdown ${cntCls}">${cntTxt}</span>
      </div>`;
    }
  }
  rows += '</div>';

  const showAllBtn = (!ttShowAll && upIdx > 1)
    ? `<button class="tt-show-all" onclick="ttShowAll=true;renderTimetable()">顯示今日全部班次（共 ${trains.length} 班）</button>`
    : '';

  document.getElementById('tt-wrap').innerHTML = picker + header + rows + showAllBtn;

  const chip = document.querySelector('#stPicker .active');
  if (chip) chip.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });

  // 每分鐘重繪，確保 nowMins 隨真實時間前進
  if (ttTimer) clearInterval(ttTimer);
  ttTimer = setInterval(() => { if (mode === 'timetable') renderTimetable(); }, 60000);
}

function pickStation(id) {
  ttStation = id;
  ttShowAll = false;
  renderTimetable();
}

document.addEventListener("touchmove", e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
let _lastTap = 0;
document.addEventListener("touchend", e => {
  const now = Date.now();
  if (now - _lastTap < 300) e.preventDefault();
  _lastTap = now;
}, { passive: false });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
</script>
