<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="trainGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff9f1c"/>
      <stop offset="100%" stop-color="#e05500"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#0d0d18"/>
    </linearGradient>
    <linearGradient id="stripeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b83e00"/>
      <stop offset="100%" stop-color="#8b2d00"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>

  <!-- Speed lines (left, motion effect) -->
  <rect x="42" y="206" width="92" height="15" rx="7.5" fill="#ff9f1c" opacity="0.58"/>
  <rect x="42" y="236" width="68" height="11" rx="5.5" fill="#ff9f1c" opacity="0.40"/>
  <rect x="42" y="262" width="80" height="11" rx="5.5" fill="#ff9f1c" opacity="0.50"/>
  <rect x="42" y="288" width="56" height="9"  rx="4.5" fill="#ff9f1c" opacity="0.32"/>

  <!-- Train body — streamlined bullet profile -->
  <path d="M 150 178
           H 366
           Q 472 178 472 256
           Q 472 334 366 334
           H 150
           Q 126 334 126 310
           V 202
           Q 126 178 150 178 Z"
        fill="url(#trainGrad)"/>

  <!-- Nose specular / gloss -->
  <ellipse cx="442" cy="222" rx="16" ry="46"
           fill="white" opacity="0.11"
           transform="rotate(-12 442 222)"/>

  <!-- Window strip -->
  <rect x="150" y="207" width="258" height="66" rx="14"
        fill="#0d0d18" opacity="0.72"/>

  <!-- Four windows -->
  <rect x="165" y="220" width="52" height="40" rx="9" fill="#12263e" opacity="0.95"/>
  <rect x="232" y="220" width="52" height="40" rx="9" fill="#12263e" opacity="0.95"/>
  <rect x="299" y="220" width="52" height="40" rx="9" fill="#12263e" opacity="0.95"/>
  <rect x="366" y="220" width="36" height="40" rx="9" fill="#12263e" opacity="0.95"/>

  <!-- Window sky reflections -->
  <rect x="170" y="225" width="18" height="11" rx="4" fill="#5babd4" opacity="0.42"/>
  <rect x="237" y="225" width="18" height="11" rx="4" fill="#5babd4" opacity="0.42"/>
  <rect x="304" y="225" width="18" height="11" rx="4" fill="#5babd4" opacity="0.42"/>

  <!-- Bottom accent stripe -->
  <path d="M 126 308
           H 472
           Q 472 334 366 334
           H 150
           Q 126 334 126 308 Z"
        fill="url(#stripeGrad)" opacity="0.55"/>

  <!-- Wheels -->
  <circle cx="196" cy="334" r="23" fill="#202032"/>
  <circle cx="196" cy="334" r="14" fill="#2c2c42"/>
  <circle cx="196" cy="334" r="5"  fill="#44445e"/>

  <circle cx="340" cy="334" r="23" fill="#202032"/>
  <circle cx="340" cy="334" r="14" fill="#2c2c42"/>
  <circle cx="340" cy="334" r="5"  fill="#44445e"/>

  <!-- Rails -->
  <rect x="42" y="354" width="432" height="12" rx="6" fill="#242436"/>
  <rect x="42" y="376" width="432" height="12" rx="6" fill="#242436"/>

  <!-- Rail ties (sleepers) -->
  <rect x="80"  y="350" width="14" height="42" rx="3" fill="#1c1c2c"/>
  <rect x="132" y="350" width="14" height="42" rx="3" fill="#1c1c2c"/>
  <rect x="184" y="350" width="14" height="42" rx="3" fill="#1c1c2c"/>
  <rect x="236" y="350" width="14" height="42" rx="3" fill="#1c1c2c"/>
  <rect x="288" y="350" width="14" height="42" rx="3" fill="#1c1c2c"/>
  <rect x="340" y="350" width="14" height="42" rx="3" fill="#1c1c2c"/>
  <rect x="392" y="350" width="14" height="42" rx="3" fill="#1c1c2c"/>
  <rect x="432" y="350" width="14" height="42" rx="3" fill="#1c1c2c"/>
</svg>
